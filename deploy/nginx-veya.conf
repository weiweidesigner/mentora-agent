# Include inside the existing HTTPS server block.
location = /veya { return 302 /veya/; }
location /veya/ {
    auth_basic "Veya";
    auth_basic_user_file /etc/nginx/veya.htpasswd;
    client_max_body_size 30m;
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Authorization "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1200s;
    proxy_send_timeout 1200s;
    proxy_redirect / /veya/;
    sub_filter_once off;
    sub_filter_types application/javascript text/javascript text/css application/json text/event-stream;
    sub_filter "\"/api/" "\"/veya/api/";
    sub_filter "'/api/" "'/veya/api/";
    sub_filter "`/api/" "`/veya/api/";
    sub_filter "\"/static/" "\"/veya/static/";
    sub_filter "'/static/" "'/veya/static/";
    sub_filter "`/static/" "`/veya/static/";
    sub_filter "\"/generated/" "\"/veya/generated/";
    sub_filter "'/generated/" "'/veya/generated/";
    sub_filter "`/generated/" "`/veya/generated/";
    sub_filter "\"/share-artifact/" "\"/veya/share-artifact/";
    sub_filter "'/share-artifact/" "'/veya/share-artifact/";
    sub_filter "`/share-artifact/" "`/veya/share-artifact/";
    sub_filter "\"/share/" "\"/veya/share/";
    sub_filter "'/share/" "'/veya/share/";
    sub_filter "`/share/" "`/veya/share/";
}
