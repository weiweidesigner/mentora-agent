# Include inside the existing HTTPS server block.
location = /mentora { return 302 /mentora/$is_args$args; }
location /mentora/ {
    client_max_body_size 30m;
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Authorization "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1200s;
    proxy_send_timeout 1200s;
    proxy_redirect / /mentora/;
    sub_filter_once off;
    sub_filter_types application/javascript text/javascript text/css application/json text/event-stream;
    sub_filter "\"/api/" "\"/mentora/api/";
    sub_filter "'/api/" "'/mentora/api/";
    sub_filter "`/api/" "`/mentora/api/";
    sub_filter "\"/static/" "\"/mentora/static/";
    sub_filter "'/static/" "'/mentora/static/";
    sub_filter "`/static/" "`/mentora/static/";
    sub_filter "\"/generated/" "\"/mentora/generated/";
    sub_filter "'/generated/" "'/mentora/generated/";
    sub_filter "`/generated/" "`/mentora/generated/";
    sub_filter "\"/share-artifact/" "\"/mentora/share-artifact/";
    sub_filter "'/share-artifact/" "'/mentora/share-artifact/";
    sub_filter "`/share-artifact/" "`/mentora/share-artifact/";
    sub_filter "\"/share/" "\"/mentora/share/";
    sub_filter "'/share/" "'/mentora/share/";
    sub_filter "`/share/" "`/mentora/share/";
}
