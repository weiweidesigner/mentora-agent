<script>
document.getElementById("mm").textContent = "# 未来数周美股关键催化剂图谱\n\n## 宏观：通胀与利率路径是定价核心\n- 9月CPI 10/14 08:30 ET 发布（BLS），是10/28 FOMC前最关键的单一数据\n- 9月PPI 10/15、进出口价格 10/16；Q3 GDP初值与9月PCE 10/29（BEA）\n- 利率背景：Fed 9/16 加息25bp至 3.75%–4.00%，并称通胀仍高\n- 长端压力：10年期美债收益率10/5一度达 5.31%，为2002年以来高位（二级来源）\n- 市场定价偏向\"更高更久\"：Kalshi 9/30快照显示10月维持81%、加息25bp 18%、降息不足1%\n- 就业：10月非农 11/6 发布，9月报告已于 10/2 公布\n\n## 政策：FOMC、财政截止与中期选举\n- FOMC 10/27–28（决议10/28）；12/8–9 会议含经济预测摘要与点阵\n- 财政：现行CR把联邦资金延至 12/11，跛脚鸭会期还要处理NDAA及多项授权到期\n- FY2026赤字约 2.0 万亿美元（CBO估算，CRFB 10/8引述），国债供给与期限溢价是估值压力源\n- 中期选举 11/3：众议院435席全改选、参议院35席，结果改变财政/税收/监管可行集\n- 关税：最高法院 2026-02-20 裁定IEEPA不授权征税，2/24停收；CBP退款系统第三阶段10/6上线，逐票处理不等于自动退款\n- 加密监管：Treasury GENIUS Act第3条NPRM评论截止 10/19，OCC最终稳定币规则预计11月前\n\n## 财报：Q3季从银行打响，AI面临更高门槛\n- 10/13 集中开局：摩根大通、高盛、花旗、富国同日发布\n- 10/15 台积电3Q26电话会：Q3月度营收合计约NT$1.494万亿、同比约+50.9%\n- 10/20 奈飞；10/21 特斯拉与Meta（Meta Q3收入指引$61–64B，2026 capex $130–145B）\n- 10/28 微软FY27Q1（收入指引$89.85–90.95B，Azure约+45%）与Alphabet\n- 10/29 亚马逊（Q3净销售指引$197–202B，2026现金capex约$220B）\n- 11/02 苹果FY26Q4；11/17 英伟达FY27Q3（日历Q3与财季错位）\n- 端内头条聚焦\"可能重置市场的11份财报\"（AInvest，2026-10-13）\n\n## 行业主题：AI资本开支仍是主轴\n- 算力：NVIDIA FY26Q3收入570.06亿美元、数据中心512亿；上一财季指引与Rubin放量节奏是焦点\n- 半导体/存储：AMD 9/21 市值破1万亿美元；美光称2026年HBM售罄、HBM4已投产\n- 电力与核能：AWS-Talen 1.92GW PPA、Microsoft-Three Mile Island 837MW、Meta×Oklo 1.2GW等长约落地\n- 医药：口服GLP-1商业化提速，Lilly orforglipron美国2026年4月获批、中国上市窗口2026下半年–2027初\n- 能源：EIA 10/6 STEO 将4Q26 Brent预测上调至105美元/桶，2026年均价预测96美元\n- 加密/稳定币：SEC 8/18 提出Regulation Crypto Assets，GENIUS Act进入细则落地期\n- 机器人/自动驾驶：特斯拉robotaxi扩城与Optimus量产推进，监管许可仍是闸门\n\n## 风险与验证点：分歧集中在三处\n- 通胀粘性：若CPI/PCE超预期，12月\"再加息\"尾部风险上升，久期与成长股估值承压\n- 市场广度不足：近3个月小盘ETF与长债ETF明显弱于纳指/标普，指数上涨由少数AI权重贡献\n- 油价与电力成本：高油价同时抬升通胀预期并挤压非能源行业利润率\n- 财报证伪点：hyperscaler下修capex或自由现金流恶化，将同时打击算力链与整体风险偏好\n- 财政与政策不确定性：12/11资金截止与11/3选举结果可能重定价财政、关税与监管路径";
const container = document.getElementById("container");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const exitFullscreenBtn = document.getElementById("exitFullscreenBtn");

let mindMapInteracted = false;
function applyMindMapTransform(svg, group, tx, ty, scale){
  group.setAttribute("transform", `translate(${tx},${ty}) scale(${scale})`);
  // D3's next held drag must start from the same transform as the visible group.
  if (svg.__zoom) svg.__zoom = new svg.__zoom.constructor(scale, tx, ty);
}
function zoomMindMap(factor, clientX, clientY){
  const svg=document.querySelector("svg.markmap"), group=svg?.querySelector("g");
  if(!svg||!group)return;
  const matrix=group.transform.baseVal.consolidate()?.matrix;
  if(!matrix)return;
  const rect=svg.getBoundingClientRect(),point=svg.createSVGPoint();point.x=clientX==null?rect.left+rect.width/2:clientX;point.y=clientY==null?rect.top+rect.height/2:clientY;const local=point.matrixTransform(svg.getScreenCTM().inverse()),cx=local.x,cy=local.y;
  const scale=Math.max(.1,Math.min(8,matrix.a*factor)),ratio=scale/matrix.a;
  mindMapInteracted=true;
  applyMindMapTransform(svg,group,cx-(cx-matrix.e)*ratio,cy-(cy-matrix.f)*ratio,scale);
}
document.querySelectorAll("[data-map-zoom]").forEach(button=>button.addEventListener("click",()=>{
  if(button.dataset.mapZoom==="fit"){mindMapInteracted=false;refitMindMap();}
  else zoomMindMap(button.dataset.mapZoom==="in"?1.25:.8);
}));
container.addEventListener("wheel",event=>{
  if(!event.target.closest?.("svg.markmap"))return;
  event.stopImmediatePropagation();
  if(event.ctrlKey||event.metaKey){event.preventDefault();zoomMindMap(Math.exp(-event.deltaY*.01),event.clientX,event.clientY);}
},{capture:true,passive:false});
let heldTouch=null,holdTimer=null;
const releaseHeldTouch=()=>{clearTimeout(holdTimer);heldTouch=null;};
container.addEventListener('touchstart',event=>{
  if(event.touches.length!==1){releaseHeldTouch();return;}
  if(!event.target.closest?.('svg.markmap'))return;
  const t=event.touches[0];heldTouch={x:t.clientX,y:t.clientY,active:document.body.classList.contains('is-fullscreen')};
  holdTimer=setTimeout(()=>{if(heldTouch)heldTouch.active=true;},300);
  // A quick single-finger swipe scrolls the page; held drag moves the map.
  event.stopImmediatePropagation();
},{capture:true,passive:true});
container.addEventListener('touchmove',event=>{
  if(event.touches.length!==1||!heldTouch)return;
  const t=event.touches[0],dx=t.clientX-heldTouch.x,dy=t.clientY-heldTouch.y;
  event.stopImmediatePropagation();
  if(!heldTouch.active){if(Math.hypot(dx,dy)>8)releaseHeldTouch();return;}
  const svg=document.querySelector('svg.markmap'),group=svg?.querySelector('g'),matrix=group?.transform.baseVal.consolidate()?.matrix;
  if(!matrix)return;
  event.preventDefault();mindMapInteracted=true;
  const rect=svg.getBoundingClientRect(),box=svg.viewBox.baseVal;
  applyMindMapTransform(svg,group,matrix.e+dx*(box.width?box.width/rect.width:1),matrix.f+dy*(box.height?box.height/rect.height:1),matrix.a);
  heldTouch.x=t.clientX;heldTouch.y=t.clientY;
},{capture:true,passive:false});
container.addEventListener('touchend',releaseHeldTouch);
container.addEventListener('touchcancel',()=>{releaseHeldTouch();pinchDistance=0;});

let pinchDistance=0;
container.addEventListener("touchstart",event=>{
  if(event.touches.length!==2)return;
  pinchDistance=Math.hypot(event.touches[0].clientX-event.touches[1].clientX,event.touches[0].clientY-event.touches[1].clientY);
  event.preventDefault();event.stopImmediatePropagation();
},{capture:true,passive:false});
container.addEventListener("touchmove",event=>{
  if(event.touches.length!==2||!pinchDistance)return;
  const a=event.touches[0],b=event.touches[1],distance=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  event.preventDefault();event.stopImmediatePropagation();zoomMindMap(distance/pinchDistance,(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2);pinchDistance=distance;
},{capture:true,passive:false});
container.addEventListener("touchend",()=>{pinchDistance=0;});

function forceMindMapTextStyle(){
  const styles = getComputedStyle(document.body);
  const textColor = styles.getPropertyValue("--mm-text").trim() || "#111827";
  const nodeBg = styles.getPropertyValue("--mm-node-bg").trim() || "#ffffff";
  document.querySelectorAll("svg.markmap text").forEach(el=>{el.style.fill=textColor;el.style.opacity="1";el.style.fontWeight="600";});
  document.querySelectorAll("svg.markmap .markmap-foreign, svg.markmap .markmap-foreign *").forEach(el=>{el.style.color=textColor;el.style.opacity="1";});
  document.querySelectorAll("svg.markmap .node circle").forEach(el=>{el.style.fill=nodeBg;});
}
setTimeout(forceMindMapTextStyle,500);setTimeout(forceMindMapTextStyle,1200);setTimeout(forceMindMapTextStyle,2200);
function sendMindMapHeight(){
  if (document.body.classList.contains("is-fullscreen")) return;
  const height = Math.ceil(container ? container.getBoundingClientRect().height : document.body.scrollHeight || 320);
  try { parent.postMessage({type:"analysis-planner-chart-height", height}, "*"); } catch (e) {}
}
function refitMindMap(){
  updateFullscreenLayout();
  forceMindMapTextStyle();
  const svg = document.querySelector("svg.markmap");
  if (svg && svg.__markmap && typeof svg.__markmap.fit === "function") {
    try { svg.__markmap.fit(); } catch (e) {}
  }
  if (document.body.classList.contains("is-fullscreen")) {
    requestAnimationFrame(fillMindMapFullscreen);
    setTimeout(fillMindMapFullscreen, 80);
  } else {
    requestAnimationFrame(fitMindMapBelowTitle);
    setTimeout(fitMindMapBelowTitle, 80);
  }
  sendMindMapHeight();
}
function fitMindMapBelowTitle(){
  const svg = document.querySelector("svg.markmap");
  const group = svg ? svg.querySelector("g") : null;
  if (!svg || !group || !container) return;
  const width = Math.max(1, container.clientWidth || svg.clientWidth || window.innerWidth);
  const height = Math.max(1, container.clientHeight || svg.clientHeight || 320);
  let box;
  try { box = group.getBBox(); } catch (e) { return; }
  if (!box || box.width <= 0 || box.height <= 0) return;
  const padX = 0;
  const padTop = 0;
  const padBottom = 0;
  const usableW = Math.max(1, width - padX * 2);
  const usableH = Math.max(1, height - padTop - padBottom);
  const scale = Math.max(0.1, Math.min(usableW / box.width, usableH / box.height));
  const tx = padX + (usableW - box.width * scale) / 2 - box.x * scale;
  const renderedH = box.height * scale;
  const centeredY = padTop + Math.max(0, usableH - renderedH) / 2;
  const maxY = Math.max(padTop, height - padBottom - renderedH);
  const ty = Math.min(maxY, centeredY) - box.y * scale;
  applyMindMapTransform(svg, group, tx, ty, scale);
}
function fillMindMapFullscreen(){
  const svg = document.querySelector("svg.markmap");
  const group = svg ? svg.querySelector("g") : null;
  if (!svg || !group || !container) return;
  const width = Math.max(1, container.clientWidth || svg.clientWidth || window.innerWidth);
  const height = Math.max(1, container.clientHeight || svg.clientHeight || window.innerHeight);
  let box;
  try { box = group.getBBox(); } catch (e) { return; }
  if (!box || box.width <= 0 || box.height <= 0) return;
  const padX = 0;
  const padTop = 0;
  const padBottom = 0;
  const usableW = Math.max(1, width - padX * 2);
  const usableH = Math.max(1, height - padTop - padBottom);
  const scale = Math.max(0.1, Math.min(usableW / box.width, usableH / box.height));
  const tx = padX + (usableW - box.width * scale) / 2 - box.x * scale;
  const ty = padTop + (usableH - box.height * scale) / 2 - box.y * scale;
  applyMindMapTransform(svg, group, tx, ty, scale);
}
function updateFullscreenLayout(){
  const active = document.body.classList.contains("is-fullscreen");
  const needsForcedLandscape = active && window.innerHeight > window.innerWidth;
  document.body.classList.toggle("is-forced-landscape", needsForcedLandscape);
}
function lockLandscape(){
  try {
    const orientation = screen.orientation;
    if (orientation && typeof orientation.lock === "function") {
      orientation.lock("landscape").catch(()=>{});
    }
  } catch (e) {}
}
function unlockOrientation(){
  try {
    const orientation = screen.orientation;
    if (orientation && typeof orientation.unlock === "function") orientation.unlock();
  } catch (e) {}
}
async function enterFullscreen(){
  document.body.classList.add("is-fullscreen");
  updateFullscreenLayout();
  const fullscreenTarget = document.documentElement || document.body;
  try {
    if (fullscreenTarget.requestFullscreen) await fullscreenTarget.requestFullscreen();
    else if (fullscreenTarget.webkitRequestFullscreen) fullscreenTarget.webkitRequestFullscreen();
  } catch (e) {}
  lockLandscape();
  setTimeout(refitMindMap,80);
  setTimeout(refitMindMap,320);
}
function exitFullscreen(){
  document.body.classList.remove("is-fullscreen");
  document.body.classList.remove("is-forced-landscape");
  unlockOrientation();
  try {
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
  } catch (e) {}
  setTimeout(refitMindMap,80);
  setTimeout(refitMindMap,320);
  setTimeout(refitMindMap,720);
}
fullscreenBtn.addEventListener("click", enterFullscreen);
exitFullscreenBtn.addEventListener("click", exitFullscreen);
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement) {
    document.body.classList.remove("is-fullscreen");
    document.body.classList.remove("is-forced-landscape");
    unlockOrientation();
    refitMindMap();
    setTimeout(refitMindMap,260);
    setTimeout(refitMindMap,720);
  }
});
document.addEventListener("webkitfullscreenchange", () => {
  if (!document.webkitFullscreenElement) {
    document.body.classList.remove("is-fullscreen");
    document.body.classList.remove("is-forced-landscape");
    unlockOrientation();
    refitMindMap();
    setTimeout(refitMindMap,260);
    setTimeout(refitMindMap,720);
  }
});
window.addEventListener("load", refitMindMap);
window.addEventListener("resize", refitMindMap);
window.addEventListener("orientationchange", () => { setTimeout(refitMindMap,120); setTimeout(refitMindMap,420); });
[300,900,1800].forEach(delay=>setTimeout(()=>{if(!mindMapInteracted)refitMindMap();},delay));
if ("ResizeObserver" in window) {
  try { new ResizeObserver(refitMindMap).observe(container); } catch (e) {}
}
</script>

      style.textContent=`.generic-local-tooltip-portal{position:fixed;z-index:2147483647;box-sizing:border-box;pointer-events:none;box-shadow:none;background:var(--local-tip-bg)}.generic-local-tooltip-portal[hidden]{display:none}.generic-local-tooltip-portal[data-arrow="bottom"]::after{content:"";position:absolute;left:var(--local-tip-arrow-x,50%);bottom:-7px;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-top:7px solid var(--local-tip-bg)}.generic-local-tooltip-portal[data-arrow="side"]::after{content:"";position:absolute;top:50%;width:10px;height:10px;background:var(--local-tip-bg);transform:translateY(-50%) rotate(45deg)}.generic-local-tooltip-portal[data-side="right"]::after{left:-5px}.generic-local-tooltip-portal[data-side="left"]::after{right:-5px}`;

    const style=getComputedStyle(tip);localPortal.replaceChildren(...Array.from(tip.childNodes,copyTooltipNode));

    for(const property of ['color','padding','font-size','font-family','line-height','border-radius','border','box-shadow'])localPortal.style.setProperty(property,style.getPropertyValue(property));
    localPortal.style.width=Math.min(tip.offsetWidth,ctx.win.innerWidth-16)+'px';localPortal.hidden=false;
    localPortal.dataset.arrow=tip.matches('.waterfall-tooltip')?'bottom':tip.matches('.pie-tooltip')?'side':'none';
    localSource=tip;tip.style.setProperty('visibility','hidden','important');
    return {portal:localPortal,host:ctx.win,left:ctx.left+rect.left,top:ctx.top+rect.top,width:localPortal.offsetWidth,height:localPortal.offsetHeight};
  };

  const clear = event => {
    hideLocalPortal();

    const hadTooltip=Boolean(active||nativeHovered);
    emit(active,'mouseleave',event);active=null;nativeHovered=false;placement=null;

  };
  const dismiss = () => {gesture=null;clear({clientX:0,clientY:0});};
  const followTooltip = event => {
    if(!active)return;
    if(!placement){
      const ctx=active.matches('.hover-zone,.hit-area')&&typeof parentTooltipContext==='function'?parentTooltipContext():null;
      if(ctx){
        const tip=ctx.element||(typeof parentTooltipElement==='function'?parentTooltipElement(ctx):null);
        if(tip)placement={tip,offset:ctx.offsetLeft||0,width:tip.offsetWidth,viewport:ctx.win.innerWidth};
      }else{
        const tip=document.querySelector('.pie-tooltip,.ring-tooltip,.treemap-tooltip,.waterfall-tooltip');
        const parent=tip?.offsetParent;
        if(tip&&parent){
          const rect=parent.getBoundingClientRect();
          placement={tip,offset:-rect.left,top:rect.top,width:tip.offsetWidth,height:tip.offsetHeight,viewport:parent.clientWidth,parentHeight:parent.clientHeight,local:true,outer:showLocalPortal(tip,rect)};
        }
      }
      if(!placement)return;
    }
    const {tip,offset,width,viewport}=placement,anchor=offset+event.clientX;
    let left=anchor-width/2;
    if(placement.local&&!active.matches('.hit-area')){
      const y=event.clientY-placement.top;
      if(active.matches('.treemap-cell')){
        left=anchor+14;tip.style.top=Math.max(8,Math.min(placement.parentHeight-placement.height-8,y+14))+'px';
      }else{
        const side=anchor<viewport/2?'right':'left';tip.dataset.side=side;
        left=side==='right'?anchor+14:anchor-width-14;
        tip.style.top=Math.max(1,Math.min(placement.parentHeight-placement.height-1,y-placement.height/2))+'px';
      }
    }
    left=Math.max(8,Math.min(Math.max(8,viewport-width-8),left));
    tip.style.left=left+'px';tip.style.setProperty('--arrow-left',Math.max(14,Math.min(width-14,anchor-left))+'px');
    if(placement.outer){
      const {portal,host,left:originX,top:originY,width:w,height:h}=placement.outer;
      let px=originX+anchor-w/2,py=originY+parseFloat(tip.style.top||'0');
      if(!active.matches('.hit-area')){
        if(active.matches('.treemap-cell')){px=originX+anchor+14;py=event.clientY+14;}
        else{const side=anchor<viewport/2?'right':'left';portal.dataset.side=side;px=side==='right'?originX+anchor+14:originX+anchor-w-14;py=event.clientY-h/2;}
      }
      px=Math.max(8,Math.min(host.innerWidth-w-8,px));py=Math.max(8,Math.min(host.innerHeight-h-8,py));
      portal.style.left=px+'px';portal.style.top=py+'px';portal.style.setProperty('--local-tip-arrow-x',Math.max(14,Math.min(w-14,originX+anchor-px))+'px');
    }
  };
  const direction = (state,x,y) => {
    if(state.direction==='pending'){
      const dx=Math.abs(x-state.x),dy=Math.abs(y-state.y);

    }
    return state.direction;
  };
  const selectCanvas = event => {
    const dom=event.target?.closest?.('#chart')||event.target?.closest?.('canvas')?.parentElement?.closest('#chart');
    const instance=dom&&window.echarts?.getInstanceByDom(dom);
    if(!instance)return false;
    const now=performance.now();
    if(!canvasState||canvasState.instance!==instance){
      clear(event);
      canvasState={instance,dom,updated:-Infinity,selected:null};
    }
    const state=canvasState;
    if(now-state.updated>160){state.option=instance.getOption();state.rect=dom.getBoundingClientRect();state.updated=now;}
    const option=state.option,tooltipOption=option.tooltip?.[0];
    // Respect components which intentionally have no tooltip (dynamic line).
    if(tooltipOption?.show===false){canvasState=null;return false;}
    const x=(event.clientX-state.rect.left)*instance.getWidth()/state.rect.width;
    const y=(event.clientY-state.rect.top)*instance.getHeight()/state.rect.height;
    if(!instance.containPixel({gridIndex:0},[x,y]))return false;
    let nearest=null,distance=Infinity;
    (option.series||[]).forEach((series,seriesIndex)=>{
      if(!Array.isArray(series.data))return;
      if(series.type==='bar'){
        const category=instance.convertFromPixel({seriesIndex},[x,y]);
        const categoryAxis=option.yAxis?.[0]?.type==='category'?1:0;
        const index=Math.round(Array.isArray(category)?category[categoryAxis]:category);
        if(index>=0&&index<series.data.length)nearest={seriesIndex,dataIndex:index};
      }else if(series.type==='scatter'||series.type==='line'){
        series.data.forEach((item,dataIndex)=>{
          const value=item?.value??item,point=instance.convertToPixel({seriesIndex},Array.isArray(value)?value.slice(0,2):[dataIndex,value]);

      }
    });
    if(!nearest)return false;
    const key=nearest.seriesIndex+':'+nearest.dataIndex;
    if(state.selected!==key){instance.dispatchAction({type:'downplay'});instance.dispatchAction({type:'highlight',...nearest});state.selected=key;}
    if(state.contentKey!==key||state.contentAt!==state.updated){
      instance.dispatchAction({type:'showTip',...nearest,position:[x,y]});state.contentKey=key;state.contentAt=state.updated;
    }

    if(tip){
      if(!state.outer||state.content!==tip.innerHTML){state.outer=showLocalPortal(tip,state.rect);state.content=tip.innerHTML;}
      tip.style.setProperty('visibility','hidden','important');
      if(state.outer){
        const {portal,host,left:originX,top:originY,width:w,height:h}=state.outer;
        portal.style.left=Math.max(8,Math.min(host.innerWidth-w-8,originX+x-w/2))+'px';
        portal.style.top=Math.max(8,Math.min(host.innerHeight-h-8,originY+y-h-14))+'px';
      }
    }
    return true;
  };

  const select = event => {
    if(selectCanvas(event))return;
    const target=document.elementFromPoint(event.clientX,event.clientY)?.closest(hits)||event.target?.closest(hits)||null;
    if(target!==active){clear(event);active=target;emit(active,'mouseenter',event);}

    followTooltip(event);
  };
  document.addEventListener('pointerdown',event=>{
    if(event.pointerType==='touch')clear(event);
    if(event.pointerType!=='touch'||event.target.closest?.('.markmap,.range-shell,button,input'))return;

    if(!touchOrigin||event.touches.length!==1)return;

  for(const type of ['touchend','touchcancel'])document.addEventListener(type,()=>{touchOrigin=null;},{passive:true});
  for(const type of ['mouseover','mouseenter','mousemove'])document.addEventListener(type,event=>{
    if(event.sourceCapabilities?.firesTouchEvents){event.stopImmediatePropagation();return;}
    if(event.target.closest?.(hits))nativeHovered=true;
  },{capture:true,passive:true});
  document.addEventListener('click',event=>{
    if(canvasState&&event.sourceCapabilities?.firesTouchEvents&&event.target.closest?.('#chart'))event.stopImmediatePropagation();
  },{capture:true,passive:true});
  let host=window;
  try {
    while(host){
      for(const type of ['scroll','resize','pagehide','veya:chat-navigate'])host.addEventListener(type,dismiss,{capture:true,passive:true});
      if(host!==window)host.document.addEventListener('pointerdown',dismiss,{capture:true,passive:true});
      const doc=host.document;doc.addEventListener('visibilitychange',()=>{if(doc.hidden)dismiss();},{passive:true});
      if(host===host.parent)break;host=host.parent;
    }
  } catch (_) {}
})();
</script>
