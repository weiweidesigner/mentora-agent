            <h2 class="wsc-block-title">${esc(t('consensusRating', 'Consensus Rating'))}</h2>
            <div class="wsc-rating">${esc(ratingText(rs.label))}</div>
            <div class="wsc-sub">${esc(scoreSummary)}</div>
            <div class="gauge is-rating">
              <div class="gauge-track"><span class="gauge-dot" style="left:${ratingPct}%"></span></div>
              <div class="gauge-labels"><span>${esc(ratingText('Strong Sell'))}</span><span>${esc(ratingText('Sell'))}</span><span>${esc(ratingText('Hold'))}</span><span>${esc(ratingText('Buy'))}</span><span>${esc(ratingText('Strong Buy'))}</span></div>
            </div>
          </section>
          <section>
            <h2 class="wsc-block-title">${esc(t('priceTarget', 'Price Target'))}</h2>
            <div class="target-value">${money(avg)}</div>
            <div class="target-upside">${money(payload.upside?.amount)} (${percent(payload.upside?.percent)}) ${esc(t('upsideFrom', 'upside from'))} ${money(last)}</div>
            <div class="gauge is-price-range">
              <div class="gauge-track is-price">
                <span class="gauge-fill" style="left:${fillStart}%;width:${fillWidth}%"></span>
                <span class="gauge-dot" style="left:${currentPct}%"></span>
                <span class="gauge-dot is-hollow" style="left:${avgPct}%"></span>
              </div>
              <div class="gauge-labels"><span>${esc(t('low', 'Low'))} ${money(low, 0)}</span><span>${esc(t('high', 'High'))} ${money(high, 0)}</span></div>
            </div>
          </section>
          <div class="divider"></div>
          <section>
            <h2 class="wsc-block-title">${esc(t('analystsBreakdown', 'Analysts Breakdown'))}</h2>
            <div class="breakdown-wrap">
              ${donut(breakdown)}
              <div class="legend">
                ${order.map(k => {
                  const item = breakdown.find(x => x.key === k) || {};
                  return `<div class="legend-row"><span class="legend-swatch" style="background:${colors[k]}"></span><span>${esc(ratingText(item.label || labelByKey[k], labelByKey[k]))}</span><span class="legend-count">${Number(item.count || 0)}</span></div>`;
                }).join('')}
              </div>
            </div>
          </section>
          <section>
            <h2 class="wsc-block-title">${esc(t('industryRank', 'Industry Rank'))}</h2>
            ${rank ? `<div class="rank-main">
              <div class="rank-copy">
                <div><span class="rank-symbol">${esc(payload.code)}</span> <span class="rank-muted">${esc(t('ranks', 'ranks'))}</span></div>
                <div><span class="rank-big">${esc(rank.rank)}<span class="rank-suffix">${payload.language === 'en' ? ordinal(rank.rank) : ''}</span></span><span class="rank-muted">${esc(fmtTemplate(t('ofCompaniesIn', 'of {count} in'), { count: rank.companiesCovered }))}</span></div>
                <div class="rank-industry">${esc(rank.name)}</div>
                <div class="rank-avg">${esc(t('industryAvg', 'Industry avg'))} <strong>${num(rank.averageScore)}</strong></div>
              </div>
              <div class="leader-list">
                ${leaders.map(x => `<div class="leader ${x.self ? 'is-self' : ''}"><span class="leader-rank">${esc(x.rank)}</span><span class="leader-code">${esc(x.code)}</span><span class="leader-score">${num(x.score)}</span></div>`).join('')}
              </div>
            </div>` : `<p class="rank-muted">${esc(t('noRank', 'No industry rank data.'))}</p>`}
          </section>
        </div>
      </div>
    </section>`;
}
render();

</script>
</body>
</html>
