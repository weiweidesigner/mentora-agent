<!doctype html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行情标签 · 苹果紧凑行情标签</title>
<style>html,body{margin:0;font:13px/1.5 system-ui,sans-serif;background:transparent;color:var(--fg)}html{--fg:#d1d4dc;--muted:#9598a1;--border:#363a45;--surface:#0f0f0f;color-scheme:dark}html[data-theme=light]{--fg:#131722;--muted:#6a6d78;--border:#e0e3eb;--surface:#fff;color-scheme:light}main{box-sizing:border-box;width:100%;overflow:hidden;border:1px solid var(--border);border-radius:12px;background:var(--surface)}header{padding:12px 16px;border-bottom:1px solid var(--border)}h1{font-size:15px;line-height:1.5;margin:0;font-weight:600}.stage{height:560px;position:relative}#mount,.tradingview-widget-container{height:100%;width:100%}#mount iframe{color-scheme:normal;background:var(--surface)}.tradingview-widget-container__widget{height:calc(100% - 28px);width:100%}.tradingview-widget-copyright{height:28px;text-align:center;font-size:12px}a{color:inherit}footer{padding:8px 16px;color:var(--muted);font-size:11px}#state{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:16px;background:var(--surface);z-index:1}#state[hidden]{display:none}button{cursor:pointer;border:1px solid var(--border);border-radius:6px;padding:6px 12px;background:var(--surface);color:var(--fg);margin:10px auto 0}#state a{margin-top:8px}html[data-widget-canvas],html[data-widget-canvas] body{height:100%;overflow:hidden}html[data-widget-canvas] main{height:100%;display:flex;flex-direction:column}html[data-widget-canvas] .stage{flex:1;min-height:0}html[data-widget-canvas] header,html[data-widget-canvas] footer{flex:none}</style><style data-tv-host-footer>main>footer,.tradingview-widget-copyright{display:none!important}.tradingview-widget-container__widget,.tradingview-widget-container>iframe{height:100%!important}</style></head>
<body><main><header><h1>行情标签 · 苹果紧凑行情标签</h1></header><div class="stage"><div id="mount"></div><div id="state" role="status">正在加载 TradingView…</div></div><footer>数据由 TradingView 提供，部分市场可能延迟。</footer></main>
<script id="tv-config" type="application/json">{"widget": "ticker-tag", "config": {"symbol": "NASDAQ:AAPL", "size": "large", "theme": "dark", "locale": "zh_CN", "width": "100%", "height": "100%"}, "script": "https://widgets.tradingview-widget.com/w/en/tv-ticker-tag.js", "format": "web-component", "tag": "tv-ticker-tag", "module": true}</script>
<script>
if(new URLSearchParams(location.search).get('canvas')==='1')document.documentElement.dataset.widgetCanvas='true';
const spec=JSON.parse(document.getElementById('tv-config').textContent), mount=document.getElementById('mount'), state=document.getElementById('state');let timer, generation=0, renderedTheme;
function setTheme(theme){if(!['dark','light'].includes(theme)||document.documentElement.dataset.theme===theme)return;document.documentElement.dataset.theme=theme;}
function load(){renderedTheme=document.documentElement.dataset.theme;const current=++generation;clearTimeout(timer);state.hidden=false;state.textContent="正在加载 TradingView…";mount.replaceChildren();
const cfg={...spec.config}, theme=document.documentElement.dataset.theme;cfg['colorTheme' in cfg?'colorTheme':'theme']=theme;
if('backgroundColor' in cfg)cfg.backgroundColor=theme==='dark'?'#0f0f0f':'#ffffff';if('gridColor' in cfg)cfg.gridColor=theme==='dark'?'rgba(242,242,242,0.06)':'rgba(46,46,46,0.06)';
const wrapper=document.createElement('div');wrapper.className='tradingview-widget-container';
const target=document.createElement('div');target.className='tradingview-widget-container__widget';wrapper.append(target);
const credit=document.createElement('div');credit.className='tradingview-widget-copyright';const link=document.createElement('a');link.href='https://www.tradingview.com/';link.target='_blank';link.rel='noopener noreferrer';link.textContent='Track all markets on TradingView';credit.append(link);wrapper.append(credit);mount.append(wrapper);
if(spec.format==='web-component'){
const element=document.createElement(spec.tag);element.style.cssText='display:block;width:100%;height:100%';element.style.colorScheme=theme;
for(const [key,value] of Object.entries(cfg)){if(['width','height','locale','colorTheme'].includes(key))continue;const name=key.replace(/[A-Z]/g,c=>'-'+c.toLowerCase());if(typeof value==='boolean'){if(value)element.setAttribute(name,'');}else element.setAttribute(name,Array.isArray(value)?(key==='currencies'||key==='countries'||key==='focusedCountries'||key==='metrics'?value.join(','):JSON.stringify(value)):String(value));}
element.setAttribute('theme',theme);target.replaceWith(element);
const script=document.createElement('script');script.src=spec.script.replace('/w/en/','/w/'+cfg.locale+'/');if(spec.module)script.type='module';script.async=true;script.textContent=JSON.stringify(cfg);
script.onerror=()=>fail(current);script.onload=()=>customElements.whenDefined(spec.tag).then(()=>{if(current!==generation)return;clearTimeout(timer);state.hidden=true;});wrapper.append(script);timer=setTimeout(()=>fail(current),20000);return;
}
const script=document.createElement('script');script.src=spec.script;script.async=true;script.textContent=JSON.stringify(cfg);script.onerror=()=>fail(current);wrapper.append(script);
timer=setTimeout(()=>fail(current),20000);
}
function fail(current){if(current!==generation)return;state.hidden=false;state.textContent="组件加载较慢或不可用，请重试或在 TradingView 查看。";const button=document.createElement('button');button.textContent="重试";button.onclick=load;state.append(button);const link=document.createElement('a');link.href='https://www.tradingview.com/chart/?symbol='+encodeURIComponent(spec.config.symbol||'NASDAQ:AAPL');link.target='_blank';link.rel='noopener noreferrer';link.textContent='TradingView ↗';state.append(link);}
new MutationObserver(()=>{const frame=mount.querySelector('iframe');if(frame){frame.title='TradingView '+spec.widget;frame.addEventListener('load',()=>{clearTimeout(timer);state.hidden=true;},{once:true});}}).observe(mount,{childList:true,subtree:true});
addEventListener('message',event=>{if(event.source!==parent||event.origin!==location.origin)return;const d=event.data||{};if(d.theme)setTheme(d.theme);});
new MutationObserver(()=>{if(document.documentElement.dataset.theme!==renderedTheme)load();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
try{const t=new URLSearchParams(location.search).get('theme')||parent.document.documentElement.dataset.theme;if(['dark','light'].includes(t))document.documentElement.dataset.theme=t;}catch{}
new ResizeObserver(()=>parent.postMessage({type:'analysis-planner-chart-height',height:Math.ceil(document.body.scrollHeight)},location.origin)).observe(document.body);
load();
</script></body></html>
