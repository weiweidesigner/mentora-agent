  document.addEventListener('touchmove',event=>{
    if(!touchOrigin||event.touches.length!==1)return;
    const t=event.touches[0],mode=direction(touchOrigin,t.clientX,t.clientY);
    if(mode==='vertical')event.stopImmediatePropagation();
    else if(mode==='horizontal'){select({clientX:t.clientX,clientY:t.clientY,target:event.target});if(canvasState)event.stopImmediatePropagation();}
  },{capture:true,passive:true});
  for(const type of ['touchend','touchcancel'])document.addEventListener(type,()=>{touchOrigin=null;},{passive:true});
  for(const type of ['mouseover','mouseenter','mousemove'])document.addEventListener(type,event=>{
    if(event.sourceCapabilities?.firesTouchEvents){event.stopImmediatePropagation();return;}
    if(event.target.closest?.(hits))nativeHovered=true;
  },{capture:true,passive:true});
  document.addEventListener('click',event=>{
    if(canvasState&&event.sourceCapabilities?.firesTouchEvents&&event.target.closest?.('#chart'))event.stopImmediatePropagation();
  },{capture:true,passive:true});
  let host=window;
  try {
    while(host){
      for(const type of ['scroll','resize','pagehide','veya:chat-navigate'])host.addEventListener(type,dismiss,{capture:true,passive:true});
      if(host!==window)host.document.addEventListener('pointerdown',dismiss,{capture:true,passive:true});
      const doc=host.document;doc.addEventListener('visibilitychange',()=>{if(doc.hidden)dismiss();},{passive:true});
      if(host===host.parent)break;host=host.parent;
    }
  } catch (_) {}
})();
</script>
