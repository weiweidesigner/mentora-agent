const chips = document.getElementById('chips');
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function signedPercent(item) {
  if (item.displayChange) return item.displayChange;
  const value = Number(item.changePercent);
  if (!Number.isFinite(value)) return '--';
  const digits = Math.abs(value) < 0.1 ? 3 : 2;
  return `${value.toFixed(digits).replace(/\.0+$|(?<=\.\d*[1-9])0+$/g, '')}%`;
}
function avatarHtml(item) {
  if (item.iconUrl) return `<span class="avatar"><img src="${escapeHtml(item.iconUrl)}" alt="" /></span>`;
  return `<span class="avatar">${escapeHtml(item.initial || String(item.name || '').slice(0, 1).toUpperCase())}</span>`;
}
chips.innerHTML = (payload.items || []).map(item => {
  const value = Number(item.changePercent);
  const trend = Number.isFinite(value) ? (value > 0 ? 'up' : value < 0 ? 'down' : 'flat') : 'flat';
  return `<span class="chip">
    ${avatarHtml(item)}
    <span class="label" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</span>
    <span class="change ${trend}">${escapeHtml(signedPercent(item))}</span>
  </span>`;
}).join('');
