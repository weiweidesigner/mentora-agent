<!doctype html>
<html lang="zh-CN" data-theme="light">
<head><script src="/static/cases/theme.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>相关板块</title>
<style>
:root{color-scheme:light;--business-text-111:#111;--business-bg-fff:#fff;--business-bg-f2f3f5:#f2f3f5;--business-text-8c8f96:#8c8f96;--business-text-1f2329:#1f2329;--business-text-777d87:#777d87;--business-border-e3e4e8:#e3e4e8;}
:root[data-theme="dark"]{color-scheme:dark;--business-text-111:#e8edf5;--business-bg-fff:#202b3a;--business-bg-f2f3f5:#202b3a;--business-text-8c8f96:#a8b3c4;--business-text-1f2329:#e8edf5;--business-text-777d87:#a8b3c4;--business-border-e3e4e8:#293646;}

* { box-sizing:border-box; }
body {
  margin:0;
  background:transparent;
  color:var(--business-text-111);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
.wrap {
  width:100%;
  min-height:100%;
  padding:0;
}
.title {
  margin:0 0 16px;
  font-size:16px;
  line-height:1.25;
  font-weight:700;
  letter-spacing:0;
}
.chips {
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px 8px;
  max-width:2040px;
}
.chip {
  display:inline-flex;
  align-items:center;
  min-height:36px;
  max-width:100%;
  padding:4px 10px 4px 5px;
  border:1px solid var(--business-border-e3e4e8);
  border-radius:18px;
  background:var(--business-bg-fff);
  box-shadow:0 1px 1px rgba(16,24,40,.04);
  white-space:nowrap;
}
.avatar {
  width:28px;
  height:28px;
  flex:0 0 28px;
  display:grid;
  place-items:center;
  margin-right:7px;
  border-radius:50%;
  overflow:hidden;
  background:var(--business-bg-f2f3f5);
  color:var(--business-text-8c8f96);
  font-size:13px;
  line-height:1;
  font-weight:500;
}
.avatar img {
  width:100%;
  height:100%;
  object-fit:cover;
}
.label {
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  color:var(--business-text-1f2329);
  font-size:14px;
  line-height:1.2;
  font-weight:500;
}
.change {
  margin-left:6px;
  font-size:14px;
  line-height:1.2;
  font-weight:700;
}
.change.up { color:#00a665; }
.change.down { color:#ff3b2f; }
.change.flat { color:var(--business-text-777d87); }
@media (max-width: 720px) {
  .wrap { padding:0; }
  .title { font-size:16px; margin-bottom:14px; }
  .chips { gap:8px 8px; }
  .chip { min-height:34px; padding:4px 9px 4px 5px; border-radius:17px; }
  .avatar { width:26px; height:26px; flex-basis:26px; margin-right:6px; font-size:12px; }
  .label, .change { font-size:13px; }
}
</style>
<script data-business-theme-runtime>
    (() => {
      const requested = new URLSearchParams(location.search).get('theme');
      if (requested === 'dark' || requested === 'light') document.documentElement.dataset.theme = requested;
    })();
    </script></head>
<body>
<main class="wrap">
  <h1 class="title">相关板块</h1>
  <div class="chips" id="chips"></div>
</main>
<script>
const payload = {"type": "related-section", "name": "相关板块", "code": "AAPL", "market": "185", "exchange": "NASDAQ", "items": [{"name": "TV Broadcasting", "changePercent": -0.089, "displayChange": "-0.089%", "initial": "T", "iconUrl": ""}, {"name": "MLB Concept", "changePercent": -0.14, "displayChange": "-0.14%", "initial": "M", "iconUrl": ""}, {"name": "Chip Stocks", "changePercent": -0.27, "displayChange": "-0.27%", "initial": "C", "iconUrl": ""}, {"name": "Streaming", "changePercent": -0.31, "displayChange": "-0.31%", "initial": "S", "iconUrl": ""}, {"name": "5G", "changePercent": -0.39, "displayChange": "-0.39%", "initial": "5G", "iconUrl": ""}, {"name": "Virtual Reality", "changePercent": -0.42, "displayChange": "-0.42%", "initial": "V", "iconUrl": ""}, {"name": "US Tech", "changePercent": -0.49, "displayChange": "-0.49%", "initial": "US", "iconUrl": ""}, {"name": "Autonomous Vehicles", "changePercent": -0.51, "displayChange": "-0.51%", "initial": "AV", "iconUrl": ""}, {"name": "Nancy Pelosi Portfolio", "changePercent": -0.55, "displayChange": "-0.55%", "initial": "N", "iconUrl": ""}, {"name": "Artificial Intelligence", "changePercent": -0.58, "displayChange": "-0.58%", "initial": "AI", "iconUrl": ""}, {"name": "Metaverse", "changePercent": -0.58, "displayChange": "-0.58%", "initial": "M", "iconUrl": ""}, {"name": "Wearable Technology", "changePercent": -0.62, "displayChange": "-0.62%", "initial": "WT", "iconUrl": ""}, {"name": "Smart Home", "changePercent": -0.63, "displayChange": "-0.63%", "initial": "S", "iconUrl": ""}, {"name": "AI terminals", "changePercent": -0.66, "displayChange": "-0.66%", "initial": "AI", "iconUrl": ""}, {"name": "MAG7 index", "changePercent": -0.69, "displayChange": "-0.69%", "initial": "M", "iconUrl": ""}, {"name": "Digital Music", "changePercent": -0.73, "displayChange": "-0.73%", "initial": "D", "iconUrl": ""}, {"name": "AR", "changePercent": -0.79, "displayChange": "-0.79%", "initial": "AR", "iconUrl": ""}, {"name": "Wireless Charging", "changePercent": -0.98, "displayChange": "-0.98%", "initial": "WC", "iconUrl": ""}, {"name": "Technology Hardware, Storage & Peripherals", "changePercent": -1.67, "displayChange": "-1.67%", "initial": "TH", "iconUrl": ""}], "source": {"provider": "AInvest profile page", "url": "https://www.ainvest.com/stocks/NASDAQ-AAPL/profile/", "endpoint": "https://api.ainvest.com/gw/midquote/v1/block/stockRelatedThemes"}, "language": "zh-CN", "componentUi": {"About Company": "公司资料", "Exchange": "交易所", "Business": "主营业务", "Stock": "股票", "Executive profile": "管理层", "Value": "价值", "Related Section": "相关板块", "Related Sections": "相关板块"}};
const chips = document.getElementById('chips');
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function signedPercent(item) {
  if (item.displayChange) return item.displayChange;
  const value = Number(item.changePercent);
  if (!Number.isFinite(value)) return '--';
  const digits = Math.abs(value) < 0.1 ? 3 : 2;
  return `${value.toFixed(digits).replace(/\.0+$|(?<=\.\d*[1-9])0+$/g, '')}%`;
}
function avatarHtml(item) {
  if (item.iconUrl) return `<span class="avatar"><img src="${escapeHtml(item.iconUrl)}" alt="" /></span>`;
  return `<span class="avatar">${escapeHtml(item.initial || String(item.name || '').slice(0, 1).toUpperCase())}</span>`;
}
chips.innerHTML = (payload.items || []).map(item => {
  const value = Number(item.changePercent);
  const trend = Number.isFinite(value) ? (value > 0 ? 'up' : value < 0 ? 'down' : 'flat') : 'flat';
  return `<span class="chip">
    ${avatarHtml(item)}
    <span class="label" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</span>
    <span class="change ${trend}">${escapeHtml(signedPercent(item))}</span>
  </span>`;
}).join('');
</script>
</body>
</html>
