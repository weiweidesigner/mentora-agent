<!doctype html>
<html lang="zh-CN" data-theme="light">
<head><script src="/static/cases/theme.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>JPM K线</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:auto;min-height:0;margin:0;background:transparent;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:0;color:#18202a}
.kline-component{width:100%;min-height:872px;background:transparent;overflow:visible;--chart-height:360px}
.kline-title{position:relative;height:58px;display:flex;align-items:center;gap:22px;padding:0 14px 0 max(4px,env(safe-area-inset-left));border-bottom:1px solid #e1e6eb;color:#18202a;background:transparent;z-index:60}
.kline-title strong{font-size:16px;line-height:1;font-weight:850;color:#18202a;white-space:nowrap;letter-spacing:.2px}
.period-tabs{display:flex;align-items:center;gap:14px;min-width:0;flex:1;padding-right:18px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-padding-inline:18px}
.period-tabs::-webkit-scrollbar{display:none}
.period-button{height:36px;min-width:52px;padding:0 13px;border:0;border-radius:7px;background:transparent;color:#687383;font:inherit;font-size:16px;font-weight:760;cursor:pointer;white-space:nowrap}
.period-button.active{color:#18202a;background:#edf2f7;font-weight:850}
.annotation-controls{position:relative;flex:0 0 auto}
.annotation-toggle{height:34px;padding:0 12px;border:1px solid #e1e6eb;border-radius:8px;background:#edf2f7;color:#18202a;font:inherit;font-size:13px;font-weight:780;cursor:pointer;white-space:nowrap}
.annotation-toggle.active{background:#2563eb;border-color:#2563eb;color:#fff}
.annotation-toolbar{position:absolute;right:0;top:42px;display:none;align-items:center;gap:5px;width:max-content;max-width:min(760px,92vw);padding:7px;background:transparent;border:1px solid #e1e6eb;border-radius:10px;box-shadow:0 10px 30px rgba(15,23,42,.16);overflow-x:auto;z-index:80}
.annotation-toolbar.open{display:flex}
.annotation-toolbar button{height:30px;padding:0 9px;border:1px solid #e1e6eb;border-radius:7px;background:transparent;color:#18202a;font:inherit;font-size:12px;font-weight:680;cursor:pointer;white-space:nowrap}
.annotation-toolbar button.active{background:#2563eb;border-color:#2563eb;color:#fff}
.annotation-toolbar button:disabled{opacity:.42;cursor:not-allowed}
.annotation-separator{width:1px;height:20px;background:#e1e6eb;flex:0 0 auto}
.chart-host{position:relative;width:100%;height:var(--chart-height);background:transparent;touch-action:pan-y;overflow:visible}
#kline-canvas{display:block;width:100%;height:var(--chart-height);background:transparent;touch-action:pan-y}
#kline-tooltip{position:absolute;z-index:40;top:10px;left:10px;width:240px;padding:8px 14px 8px 12px;box-sizing:border-box;background:rgba(37,43,52,.94);border:1px solid rgba(124,139,160,.55);border-radius:7px;color:#d9e0eb;box-shadow:none;font-size:11px;line-height:1.28;pointer-events:none;opacity:0;transform:translateY(-2px);transition:opacity .08s ease,transform .08s ease;overflow:hidden;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
#kline-tooltip.is-visible{opacity:1;transform:translateY(0)}
#kline-tooltip .tip-time{margin-bottom:6px;color:#e1e7f0;font-weight:850;font-size:12px;white-space:nowrap;overflow:visible}
#kline-tooltip .tip-row{display:grid;grid-template-columns:minmax(0,1fr) 76px;align-items:center;column-gap:5px;margin:2px 0;white-space:nowrap}
#kline-tooltip span{color:#aab4c2;font-size:11px;white-space:nowrap;min-width:0}
#kline-tooltip b{color:#eef3fb;font-size:12px;font-weight:850;white-space:nowrap;width:76px;text-align:right;justify-self:end;overflow:hidden;text-overflow:clip;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
#kline-tooltip .is-up{color:#00b899!important}
#kline-tooltip .is-down{color:#ff2f57!important}
#kline-tooltip .is-flat{color:#a0a8b5!important}
#annotation-editor{position:absolute;z-index:70;display:none;align-items:center;gap:5px;width:min(330px,calc(100% - 16px));padding:7px;background:transparent;border:1px solid #e1e6eb;border-radius:9px;box-shadow:0 10px 28px rgba(15,23,42,.18)}
#annotation-editor.open{display:flex}
#annotation-editor input{min-width:0;flex:1;height:32px;padding:0 9px;border:1px solid #e1e6eb;border-radius:7px;background:transparent;color:#18202a;font:inherit;font-size:13px;outline:none}
#annotation-editor input:focus{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.14)}
#annotation-editor button{height:30px;padding:0 9px;border:1px solid #e1e6eb;border-radius:7px;background:transparent;color:#18202a;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
#annotation-editor button[data-editor-action="confirm"]{background:#2563eb;border-color:#2563eb;color:#fff}
@media(max-width:760px){
  html,body{height:auto;min-height:0;overflow:auto}
  .kline-component{min-height:auto;height:auto}
  .kline-title{height:54px;gap:14px;padding-left:max(4px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
  .kline-title strong{font-size:16px;max-width:100%;overflow:visible;white-space:normal;overflow-wrap:anywhere}
  .period-tabs{gap:8px;flex:1;padding-right:18px;scroll-padding-inline:18px}
  .period-button{height:34px;min-width:44px;padding:0 10px;border-radius:7px;font-size:15px}
  .annotation-toggle{height:32px;padding:0 9px;font-size:12px}
  .annotation-toolbar{position:fixed;left:8px;right:8px;top:auto;bottom:max(8px,env(safe-area-inset-bottom));max-width:none;width:auto}
  #kline-tooltip{width:min(156px,40%);padding:7px 9px 7px 8px;font-size:11px}
  #kline-tooltip .tip-time{font-size:12px}
  #kline-tooltip .tip-row{grid-template-columns:minmax(0,1fr) 58px;column-gap:4px}
  #kline-tooltip b{width:58px;font-size:11px}
  #annotation-editor{left:8px!important;right:8px!important;width:auto}
}
@media(max-width:380px){.period-button{min-width:40px;padding:0 8px;font-size:14px}#kline-tooltip{width:min(148px,40%)}}

.kline-mobile-legend,.kline-mobile-levels{display:none}
@media(max-width:760px){
  .kline-title strong{flex:0 0 auto;white-space:nowrap!important;font-size:15px!important}
  .kline-title{gap:10px;padding-right:8px}
  .period-tabs{touch-action:pan-x;overscroll-behavior-x:contain;gap:4px;padding-right:8px;flex:1;min-width:0}
  .period-button{flex:0 0 auto;min-width:40px;height:32px;padding:0 8px;font-size:14px;-webkit-tap-highlight-color:transparent}
  .kline-mobile-legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 4px;color:var(--kl-text);font-size:11px;line-height:1.4;font-variant-numeric:tabular-nums}
  .kline-mobile-levels{display:flex;flex-wrap:wrap;gap:6px;padding:8px 4px 2px}
  .kline-mobile-levels:empty,.kline-mobile-legend:empty{display:none}
  .kline-mobile-levels button{border:1px solid var(--kl-border);border-radius:6px;background:transparent;color:var(--kl-text);padding:5px 7px;font:inherit;font-size:11px;line-height:1.3;-webkit-tap-highlight-color:transparent}
  .kline-mobile-levels button[aria-pressed="true"]{border-color:var(--level-color);background:color-mix(in srgb,var(--level-color) 12%,transparent)}
  .kline-mobile-levels i{display:inline-block;width:10px;height:2px;margin-right:5px;vertical-align:middle}
}

</style>
<style data-kline-theme="dual">/* Native K-line palettes, shared by standalone and previously saved charts. */
:root[data-theme="light"] {
  --kl-bg:transparent;--kl-title-bg:transparent;--kl-text:#18202a;
  --kl-muted:#687383;--kl-border:#e1e6eb;--kl-active-bg:#edf2f7;--kl-active-text:#18202a;
}
:root[data-theme="dark"] {
  color-scheme:dark;
  --kl-bg:transparent;--kl-title-bg:transparent;--kl-text:#e6edf3;
  --kl-muted:#8b949e;--kl-border:#242b35;--kl-active-bg:#5d6878;--kl-active-text:#fff;
}
:root[data-theme]:has(.kline-component),:root[data-theme] body:has(.kline-component) {background:var(--kl-bg);color:var(--kl-text)}
:root[data-theme] .kline-component,:root[data-theme] .chart-host,:root[data-theme] #kline-canvas {background:var(--kl-bg)}
:root[data-theme] .kline-title {background:var(--kl-title-bg);color:var(--kl-text);border-color:var(--kl-border)}
:root[data-theme] .kline-title strong {color:var(--kl-text)}
/* Size the document to its chart, rather than the iframe's previous height. */
:root[data-theme]:has(.kline-component),:root[data-theme] body:has(.kline-component) {height:auto;min-height:0}
:root[data-theme] .kline-title {height:auto;min-height:58px}
:root[data-theme] .kline-title strong {max-width:100%;overflow:visible;text-overflow:clip;white-space:normal;overflow-wrap:anywhere}
@media(max-width:760px) {
  :root[data-theme] .kline-title {min-height:54px}
}
:root[data-theme] .period-button {color:var(--kl-muted)}
:root[data-theme] .period-button.active {background:var(--kl-active-bg);color:var(--kl-active-text)}
:root[data-theme] :is(.annotation-toggle,.annotation-toolbar,#annotation-editor) {background:var(--kl-title-bg);color:var(--kl-text);border-color:var(--kl-border)}
:root[data-theme] :is(.annotation-toolbar,#annotation-editor) :is(button,input) {background:var(--kl-bg);color:var(--kl-text);border-color:var(--kl-border)}
:root[data-theme] .annotation-separator {background:var(--kl-border)}
:root[data-theme] :is(.annotation-toggle.active,.annotation-toolbar button.active,#annotation-editor button[data-editor-action="confirm"]) {background:#2563eb;border-color:#2563eb;color:#fff}
:root[data-theme="dark"] #kline-tooltip {background:rgba(12,18,27,.96);border-color:#303746;color:#d8e0ec}
:root[data-theme="dark"] #kline-tooltip .tip-time {color:#e6edf3}
:root[data-theme="dark"] #kline-tooltip span {color:#8b949e}
:root[data-theme="dark"] #kline-tooltip b {color:#d8e0ec}
</style>
