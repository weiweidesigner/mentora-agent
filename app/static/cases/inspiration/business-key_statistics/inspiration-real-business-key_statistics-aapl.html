<!doctype html>
<html lang="zh-CN" data-theme="light" data-business-ui="neutral-v1">
<head><script src="/static/cases/theme.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>关键统计数据</title>
<style>
:root{color-scheme:light;--business-text-171717:#171717;--business-text-444:#444;}
:root[data-theme="dark"]{color-scheme:dark;--business-text-171717:#e8edf5;--business-text-444:#e8edf5;}

*{box-sizing:border-box}
html,body{width:100%;margin:0;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:0;color:var(--business-text-171717)}
.key-statistics{width:100%;padding:0;background:transparent}
.grid{display:grid;grid-template-columns:repeat(var(--columns),minmax(0,1fr));column-gap:36px;row-gap:26px;width:100%}
.item{min-width:0}
.label{display:flex;align-items:center;gap:6px;min-width:0;margin:0 0 7px;color:var(--business-text-171717);font-size:14px;font-weight:700;line-height:1.25}
.label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.value-row{display:flex;align-items:baseline;gap:5px;min-width:0}
.value{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--business-text-171717);font-size:18px;line-height:1.25}
.unit{flex:none;color:var(--business-text-444);font-size:11px;font-weight:600}
@media(max-width:820px){.grid{column-gap:24px;row-gap:24px}}
@media(max-width:460px){.key-statistics{padding:0}.grid{row-gap:20px}}

/* Quiet field labels and stable, offline numeric typography. */
:root{--metric-label:#707070;--metric-unit:#777}
:root[data-theme="dark"]{--metric-label:#a0a0a0;--metric-unit:#969696}
.label{color:var(--metric-label);font-size:12px;font-weight:400;line-height:1.5;margin-bottom:4px}
.value{font-size:20px;font-weight:500;line-height:1.35}
.value.is-numeric{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;letter-spacing:0}
.unit{color:var(--metric-unit);font-size:11px;font-weight:400;line-height:1.5}
</style>
<script data-business-theme-runtime>
    (() => {
      const requested = new URLSearchParams(location.search).get('theme');
      if (requested === 'dark' || requested === 'light') document.documentElement.dataset.theme = requested;
    })();
    </script></head>
<body>
<section class="key-statistics">
  <div class="grid" id="grid"></div>
</section>
<script>
const items = [{"key": "最新价格", "value": "340.08", "unit": "USD"}, {"key": "市值", "value": "4.95T", "unit": "USD"}, {"key": "市盈率(TTM)", "value": "40.79"}, {"key": "稀释每股收益(TTM)", "value": "8.26", "unit": "USD"}, {"key": "收入(FY 2025)", "value": "416.16B", "unit": "USD"}, {"key": "净收入(FY 2025)", "value": "112.01B", "unit": "USD"}, {"key": "净利润率(FY 2025)", "value": "26.92%"}, {"key": "交易所", "value": "NasdaqGS"}];
const maxColumns = 4;
const grid = document.getElementById('grid');
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function updateColumns() {
  const width = grid.getBoundingClientRect().width;
  const responsiveMax = width <= 460 ? 1 : width <= 820 ? 2 : width <= 1199 ? 3 : maxColumns;
  grid.style.setProperty('--columns', Math.min(maxColumns, responsiveMax));
}
grid.innerHTML = items.map(item => `
  <div class="item">
    <div class="label"><span>${esc(item.key)}</span></div>
    <div class="value-row">
      <span class="value${ /^[+−-]?(?:\d|\.\d)/.test(String(item.value ?? '').trim()) ? ' is-numeric' : '' }">${esc(item.value)}</span>
      ${item.unit ? `<span class="unit">${esc(item.unit)}</span>` : ''}
    </div>
  </div>
`).join('');
new ResizeObserver(updateColumns).observe(grid);
updateColumns();
</script>
<style data-business-heading-style>.kline-title strong[data-business-title],[data-business-title]{font-size:18px!important;font-weight:700!important;line-height:1.4!important;letter-spacing:0!important;margin:0 0 8px!important;white-space:normal!important;overflow-wrap:anywhere;color:inherit}@media(max-width:720px){.kline-title strong[data-business-title],[data-business-title]{font-size:16px!important}}</style><script data-business-heading-runtime>(()=>{const modelTitle="AAPL 4.95万亿市值与40.79倍市盈率估值分析";const apply=()=>{let heading=document.querySelector('h1:not(.company-name),h2:not(.panel-title):not(.section-title):not(.actions-title),.page-title,.component-title,.chart-title,.multi-title,#title,.pie-title,.waterfall-title,.title,.kline-title strong');if(!heading && modelTitle){heading=document.createElement('h1');const host=document.querySelector('main,.wrap,.component')||document.body;host.prepend(heading);}if(heading){heading.dataset.businessTitle='true';if(modelTitle){heading.textContent=modelTitle;document.title=modelTitle;}}};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply,{once:true});else apply();})();</script></body>
</html>
