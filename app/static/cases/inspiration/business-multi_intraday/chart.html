    subIndicators.forEach(ind =&gt; {
      const type = String(ind).toUpperCase();
      const h = paneHeight(type);
      panes.push({ type, x: 0, y, w: width - rightPad, h, rightPad });
      y += h;
    });
    return { width, height: y + xHeight, panes, rightPad, xHeight };
  }

  function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const layout = getLayout(Math.max(240, Math.floor(rect.width)));
    const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
    canvas.style.width = `${layout.width}px`;
    canvas.style.height = `${layout.height}px`;
    canvas.width = Math.floor(layout.width * dpr);
    canvas.height = Math.floor(layout.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    root.style.setProperty(&#x27;--chart-height&#x27;, `${layout.height}px`);
    const titleHeight = document.querySelector(&#x27;.kline-title&#x27;)?.offsetHeight || 0;
    root.style.minHeight = `${titleHeight + layout.height}px`;
    return layout;
  }

  function autoVisibleCount(layout) {
    return isMinutePeriod()
      ? Math.max(window.innerWidth &lt; 520 ? 150 : 220, Math.floor(layout.panes[0].w / (window.innerWidth &lt; 520 ? 2.4 : 3.2)))
      : Math.max(34, Math.floor(layout.panes[0].w / (window.innerWidth &lt; 520 ? 6.6 : 8.5)));
  }

  function visibleBounds(list) {
    const dataCount = Math.max(1, list.length);
    const requestedMin = Math.max(8, Number(config.zoomMinBars || 20));
    const minBars = Math.min(requestedMin, dataCount);
    const configuredMax = Math.max(requestedMin, Number(config.zoomMaxBars || (isMinutePeriod() ? 2400 : 1200)));
    const maxBars = Math.max(minBars, Math.min(configuredMax, dataCount));
    return { minBars, maxBars };
  }

  function clampVisibleCount(count, list, layout) {
    const autoCount = autoVisibleCount(layout);
    const bounds = visibleBounds(list);
    const initial = Number.isFinite(Number(count)) ? Number(count) : autoCount;
    return Math.round(Math.max(bounds.minBars, Math.min(bounds.maxBars, initial)));
  }

  function visibleSlice(list, layout) {
    if (!list.length) return { start: 0, end: -1, list: [], slots: 0, blankSlots: 0 };
    const autoCount = autoVisibleCount(layout);
    if (!visibleCount) visibleCount = autoCount;
    visibleCount = clampVisibleCount(visibleCount, list, layout);
    if (viewEnd === null) viewEnd = list.length - 1;
    viewEnd = Math.max(0, Math.min(list.length - 1, viewEnd));
    const start = Math.max(0, viewEnd - visibleCount + 1);
    const visible = list.slice(start, viewEnd + 1);
    // Use the loaded/visible bar count as the slot count. Sparse data fills
    // the plot instead of being right-aligned after hundreds of empty slots.
    const slots = Math.max(visibleCount, visible.length, 1);
    const blankSlots = Math.max(0, slots - visible.length);
    return { start, end: viewEnd, list: visible, slots, blankSlots };
  }

  function scale(min, max, y, h) {
    const pad = (max - min) * 0.08 || Math.abs(max || 1) * 0.02;
    const lo = min - pad;
    const hi = max + pad;
    return {
      lo, hi, top: y, height: h,
      y: v =&gt; y + (hi - v) / Math.max(1e-12, hi - lo) * h,
      price: pixelY =&gt; hi - (pixelY - y) / Math.max(1, h) * (hi - lo),
    };
  }

  function drawGrid(pane, yTicks = 4) {
    ctx.strokeStyle = theme.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i &lt;= yTicks; i++) {
      const y = pane.y + pane.h * i / yTicks;
      ctx.moveTo(pane.x, y); ctx.lineTo(pane.x + pane.w, y);
    }
    const xTicks = Math.max(4, Math.floor(pane.w / 160));
    for (let i = 0; i &lt;= xTicks; i++) {
      const x = pane.x + pane.w * i / xTicks;
      ctx.moveTo(x, pane.y); ctx.lineTo(x, pane.y + pane.h);
    }
    ctx.stroke();
  }

  function drawText(text, x, y, color = theme.text, size = 12, weight = 600, align = &#x27;left&#x27;) {
    ctx.font = `${weight} ${size}px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = &#x27;middle&#x27;;
    ctx.fillText(text, x, y);
  }

  function textRect(text, x, y, size = 12, weight = 600, align = &#x27;left&#x27;) {
    ctx.font = `${weight} ${size}px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif`;
    const w = ctx.measureText(String(text || &#x27;&#x27;)).width;
    let left = x;
    if (align === &#x27;center&#x27;) left = x - w / 2;
    if (align === &#x27;right&#x27;) left = x - w;
    return { x: left, y: y - size * 0.62, w, h: size * 1.24 };
  }

  function rectsOverlap(a, b, pad = 0) {
    if (!a || !b) return false;
    return !(
      a.x + a.w + pad &lt; b.x ||
      b.x + b.w + pad &lt; a.x ||
      a.y + a.h + pad &lt; b.y ||
      b.y + b.h + pad &lt; a.y
    );
  }

  function drawDashedLine(x1, y1, x2, y2, color) {
    ctx.save();
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.restore();
  }

  function drawPriceAxis(pane, s, blockedRects = []) {
    ctx.strokeStyle = theme.gridStrong;
    ctx.beginPath(); ctx.moveTo(pane.x + pane.w, pane.y); ctx.lineTo(pane.x + pane.w, pane.y + pane.h); ctx.stroke();
    const ticks = window.innerWidth &lt;= 760 ? 3 : 4;
    const axisFontSize = window.innerWidth &lt;= 760 ? 11 : 12;
    const labelSafePad = 12;
    for (let i = 0; i &lt;= ticks; i++) {
      const val = s.hi - (s.hi - s.lo) * i / ticks;
      const y = pane.y + pane.h * i / ticks;

      // 顶部/底部刻度文字不能直接以边界为中心绘制，否则会被画布裁掉。
      // 只移动文字，不移动网格线和价格映射。
      // 如果刻度与最新价标签发生碰撞，则隐藏该刻度，避免 551.63 一类价签与右轴数字重叠。
      const labelY = Math.max(pane.y + labelSafePad, Math.min(pane.y + pane.h - labelSafePad, y));
      const label = fmtAxisPrice(val);
      const rect = textRect(label, pane.x + pane.w + 7, labelY, axisFontSize, 500, &#x27;left&#x27;);
      if (blockedRects.some(item =&gt; rectsOverlap(rect, item, 5))) continue;
      drawText(label, pane.x + pane.w + 7, labelY, theme.axis, axisFontSize, 500, &#x27;left&#x27;);
    }
  }

  function drawValueAxis(pane, minValue, maxValue, formatter = fmtIndicator) {
    if (!Number.isFinite(minValue) || !Number.isFinite(maxValue)) return;
    ctx.strokeStyle = theme.gridStrong;
    ctx.beginPath(); ctx.moveTo(pane.x + pane.w, pane.y); ctx.lineTo(pane.x + pane.w, pane.y + pane.h); ctx.stroke();
    const lo = minValue;
    const hi = maxValue;
    const axisFontSize = window.innerWidth &lt;= 760 ? 11 : 12;
    const labelSafePad = 10;
    for (const i of [0, 1]) {
      const val = i === 0 ? hi : lo;
      const y = i === 0 ? pane.y : pane.y + pane.h;
      const labelY = Math.max(pane.y + labelSafePad, Math.min(pane.y + pane.h - labelSafePad, y));
      drawText(formatter(val), pane.x + pane.w + 7, labelY, theme.axis, axisFontSize, 500, &#x27;left&#x27;);
    }
  }

  function drawLine(points, color, width = 1.5) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    let started = false;
    points.forEach(p =&gt; {
      if (!Number.isFinite(p.y)) { started = false; return; }
      if (!started) { ctx.moveTo(p.x, p.y); started = true; }
      else ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();
  }

  const annotationStorageKey = `aichart:kline-annotations:v1:${String(config.code || &#x27;&#x27;).toUpperCase()}`;

  function normalizeAnnotation(raw) {
    if (!raw || typeof raw !== &#x27;object&#x27;) return null;
    const rawType = String(raw.type || &#x27;&#x27;).trim();
    const typeKey = rawType.toLowerCase().replace(/_/g, &#x27;-&#x27;);
    const aliases = {
      &#x27;straightline&#x27;: &#x27;straight-line&#x27;, &#x27;straight-line&#x27;: &#x27;straight-line&#x27;,
      &#x27;rayline&#x27;: &#x27;ray-line&#x27;, &#x27;ray-line&#x27;: &#x27;ray-line&#x27;,
      &#x27;arrowsegment&#x27;: &#x27;arrow-segment&#x27;, &#x27;arrow-segment&#x27;: &#x27;arrow-segment&#x27;,
      &#x27;horizontal&#x27;: &#x27;horizontal-line&#x27;, &#x27;horizontal-line&#x27;: &#x27;horizontal-line&#x27;, &#x27;horizontalstraightline&#x27;: &#x27;horizontal-line&#x27;,
      &#x27;vertical&#x27;: &#x27;vertical-line&#x27;, &#x27;vertical-line&#x27;: &#x27;vertical-line&#x27;, &#x27;verticalstraightline&#x27;: &#x27;vertical-line&#x27;,
      &#x27;pure-text&#x27;: &#x27;text&#x27;, &#x27;text&#x27;: &#x27;text&#x27;, &#x27;callout&#x27;: &#x27;callout&#x27;,
      &#x27;segment&#x27;: &#x27;segment&#x27;, &#x27;buy&#x27;: &#x27;buy&#x27;, &#x27;sell&#x27;: &#x27;sell&#x27;
    };
    const type = aliases[typeKey];
    if (!type) return null;
    const points = (Array.isArray(raw.points) ? raw.points : [raw.point]).filter(Boolean).map(point =&gt; ({
      time: normTime(point.time ?? point.timestamp),
      price: Number(point.price ?? point.value),
    })).filter(point =&gt; Number.isFinite(point.time) &amp;&amp; Number.isFinite(point.price));
    const twoPointTypes = new Set([&#x27;straight-line&#x27;, &#x27;ray-line&#x27;, &#x27;segment&#x27;, &#x27;arrow-segment&#x27;]);
    if (!points.length || (twoPointTypes.has(type) &amp;&amp; points.length &lt; 2)) return null;
    const text = String(raw.text || &#x27;&#x27;).slice(0, 80);
    if ((type === &#x27;text&#x27; || type === &#x27;callout&#x27;) &amp;&amp; !text.trim()) return null;
    const period = String(raw.period || raw.dataType || raw.periodTab || activePeriod || config.dataType);
    const fingerprint = JSON.stringify([period, type, points, text]);
    let fingerprintHash = 0;
    for (let i = 0; i &lt; fingerprint.length; i += 1) fingerprintHash = ((fingerprintHash &lt;&lt; 5) - fingerprintHash + fingerprint.charCodeAt(i)) | 0;
    return {
      id: String(raw.id || `annotation-${Math.abs(fingerprintHash).toString(36)}`),
      period,
      type,
      points: twoPointTypes.has(type) ? points.slice(0, 2) : points.slice(0, 1),
      text,
      color: String(raw.color || &#x27;&#x27;).trim(),
      offsetX: Number.isFinite(Number(raw.offsetX)) ? Number(raw.offsetX) : null,
      offsetY: Number.isFinite(Number(raw.offsetY)) ? Number(raw.offsetY) : null,
      source: raw.source === &#x27;model&#x27; ? &#x27;model&#x27; : &#x27;user&#x27;,
    };
  }

  function mergeAnnotations(...collections) {
    const merged = [];
    const seen = new Set();
    collections.flat().forEach(item =&gt; {
      const normalized = normalizeAnnotation(item);
      if (!normalized) return;
      const signature = `${normalized.period}:${normalized.id || JSON.stringify([normalized.type, normalized.points, normalized.text])}`;
      if (seen.has(signature)) return;
      seen.add(signature);
      merged.push(normalized);
    });
    return merged;
  }

  function loadAnnotations() {
    let saved = [];
    try {
      const parsed = JSON.parse(localStorage.getItem(annotationStorageKey) || &#x27;[]&#x27;);
      if (Array.isArray(parsed)) saved = parsed;
    } catch {}
    const model = (Array.isArray(config.annotations) ? config.annotations : []).map(item =&gt; ({ ...item, source: item?.source || &#x27;model&#x27; }));
    return mergeAnnotations(model, saved);
  }

  function saveAnnotations() {
    try {
      localStorage.setItem(annotationStorageKey, JSON.stringify(annotations));
    } catch {}
  }

  function rememberAnnotationState() {
    annotationHistory.push(JSON.stringify(annotations));
    if (annotationHistory.length &gt; 30) annotationHistory.shift();
  }

  function restorePreviousAnnotations() {
    const previous = annotationHistory.pop();
    if (previous === undefined) return;
    try { annotations = mergeAnnotations(JSON.parse(previous)); } catch { return; }
    selectedAnnotationId = null;
    annotationDraft = null;
    saveAnnotations();
    draw();
  }

  function nearestBarIndex(all, timestamp) {
    if (!all.length) return -1;
    let lo = 0; let hi = all.length - 1;
    while (lo &lt; hi) {
      const mid = Math.floor((lo + hi) / 2);
      if (normTime(all[mid].time) &lt; timestamp) lo = mid + 1;
      else hi = mid;
    }
    if (lo &gt; 0 &amp;&amp; Math.abs(normTime(all[lo - 1].time) - timestamp) &lt;= Math.abs(normTime(all[lo].time) - timestamp)) return lo - 1;
    return lo;
  }

  function annotationPointPixel(point, state) {
    const index = nearestBarIndex(state.all, normTime(point.time));
    if (index &lt; state.slice.start || index &gt; state.slice.end) return null;
    return { x: state.xOf(index), y: state.priceScale.y(Number(point.price)), index };
  }

  function distanceToSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1; const dy = y2 - y1;
    const denom = dx * dx + dy * dy;
    if (!denom) return Math.hypot(px - x1, py - y1);
    const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / denom));
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  }

  function annotationColor(item) {
    if (item.color) return item.color;
    if (item.type === &#x27;horizontal-line&#x27;) {
      const text = String(item.text || &#x27;&#x27;);
      const ma = text.match(/\bMA\s*(\d+)/i);
      const maIndex = ma ? (config.ma || [5, 10, 20, 60]).map(Number).indexOf(Number(ma[1])) : -1;
      if (maIndex &gt;= 0 &amp;&amp; maIndex &lt; maColors.length) return maColors[maIndex];
      if (/支撑|支持|support/i.test(text)) return &#x27;#fb923c&#x27;;
      if (/高点|高位|high/i.test(text)) return &#x27;#f472b6&#x27;;
      const palette = [&#x27;#fb923c&#x27;, &#x27;#38bdf8&#x27;, &#x27;#fbbf24&#x27;, &#x27;#8b5cf6&#x27;, &#x27;#60a5fa&#x27;, &#x27;#f472b6&#x27;];
      const peers = annotations.filter(mark =&gt; mark.type === &#x27;horizontal-line&#x27; &amp;&amp; String(mark.period || config.dataType) === String(item.period || config.dataType));
      return palette[Math.max(0, peers.findIndex(mark =&gt; mark.id === item.id)) % palette.length];
    }
    if (item.type === &#x27;buy&#x27;) return upColor;
    if (item.type === &#x27;sell&#x27;) return downColor;
    if (item.type === &#x27;callout&#x27; || item.type === &#x27;text&#x27;) return &#x27;#8b5cf6&#x27;;
    return &#x27;#2563eb&#x27;;
  }

  function lineEndpointsForRect(first, second, main, mode) {
    const dx = second.x - first.x;
    const dy = second.y - first.y;
    if (Math.abs(dx) &lt; .001 &amp;&amp; Math.abs(dy) &lt; .001) return null;
    const candidates = [];
    const push = (t) =&gt; {
      if (!Number.isFinite(t)) return;
      const x = first.x + t * dx;
      const y = first.y + t * dy;
      if (x &gt;= main.x - .5 &amp;&amp; x &lt;= main.x + main.w + .5 &amp;&amp; y &gt;= main.y - .5 &amp;&amp; y &lt;= main.y + main.h + .5) {
        candidates.push({ t, x, y });
      }
    };
    if (Math.abs(dx) &gt;= .001) {
      push((main.x - first.x) / dx);
      push((main.x + main.w - first.x) / dx);
    }
    if (Math.abs(dy) &gt;= .001) {
      push((main.y - first.y) / dy);
      push((main.y + main.h - first.y) / dy);
    }
    candidates.sort((a, b) =&gt; a.t - b.t);
    if (mode === &#x27;straight-line&#x27;) return candidates.length &gt;= 2 ? [candidates[0], candidates[candidates.length - 1]] : null;
    const forward = candidates.filter(point =&gt; point.t &gt;= 0);
    return forward.length ? [first, forward[forward.length - 1]] : null;
  }

  function drawArrowHead(from, to, color, selected) {
    const angle = Math.atan2(to.y - from.y, to.x - from.x);
    const size = selected ? 11 : 9;
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(to.x, to.y);
    ctx.lineTo(to.x - size * Math.cos(angle - Math.PI / 6), to.y - size * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(to.x - size * Math.cos(angle + Math.PI / 6), to.y - size * Math.sin(angle + Math.PI / 6));
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  function annotationTextTokens(text) {
    return String(text || &#x27;&#x27;).match(/\s+|\(?[+-]?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?%?\)?|[A-Za-z]+(?:[-_/][A-Za-z0-9]+)*|./gu) || [];
  }

  function isProtectedAnnotationToken(token) {
    return /^\(?[+-]?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?%?\)?$/u.test(String(token || &#x27;&#x27;).trim());
  }

  function wrapAnnotationText(text, maxWidth, maxLines = 3) {
    const tokens = annotationTextTokens(text);
    const lines = [];
    let current = &#x27;&#x27;;
    let consumed = 0;
    for (const token of tokens) {
      const normalized = /^\s+$/u.test(token) ? &#x27; &#x27; : token;
      if (!current &amp;&amp; normalized === &#x27; &#x27;) { consumed += 1; continue; }
      const next = current + normalized;
      if (current &amp;&amp; ctx.measureText(next).width &gt; maxWidth) {
        lines.push(current.trimEnd());
        current = normalized.trimStart();
        if (lines.length === maxLines) break;
      } else if (!current &amp;&amp; ctx.measureText(normalized).width &gt; maxWidth &amp;&amp; !isProtectedAnnotationToken(normalized)) {
        for (const char of Array.from(normalized)) {
          const charNext = current + char;
          if (current &amp;&amp; ctx.measureText(charNext).width &gt; maxWidth) {
            lines.push(current);
            current = char;
            if (lines.length === maxLines) break;
          } else {
            current = charNext;
          }
        }
        if (lines.length === maxLines) break;
      } else {
        current = next;
      }
      consumed += 1;
    }
    if (lines.length &lt; maxLines &amp;&amp; current.trim()) lines.push(current.trimEnd());
    if (lines.length === maxLines &amp;&amp; consumed &lt; tokens.length) {
      let last = lines[maxLines - 1];
      while (last &amp;&amp; ctx.measureText(`${last}…`).width &gt; maxWidth) last = last.slice(0, -1);
      lines[maxLines - 1] = `${last}…`;
    }
    return lines.length ? lines : [&#x27;&#x27;];
  }

  function fitAnnotationLabel(text, maxWidth) {
    const value = String(text || &#x27;&#x27;);
    if (ctx.measureText(value).width &lt;= maxWidth) return value;
    let fitted = value;
    while (fitted &amp;&amp; ctx.measureText(`${fitted}…`).width &gt; maxWidth) fitted = fitted.slice(0, -1);
    return `${fitted}…`;
  }

  function horizontalAnnotationLabelLayout(items, state) {
    const main = state.main;
    const topEdge = main.y + 5;
    const bottomEdge = main.y + main.h - 5;
    const boxH = 22;
    const gap = 4;
    ctx.save();
    ctx.font = &#x27;750 11px system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif&#x27;;
    const entries = items.map(item =&gt; {
      const lineY = state.priceScale.y(Number(item.points[0].price));
      const priceText = fmtPrice(item.points[0].price);
      const fullText = item.text ? `${item.text} · ${priceText}` : priceText;
      const maxTextW = Math.max(72, Math.min(230, main.w * .48) - 14);
      const text = fitAnnotationLabel(fullText, maxTextW);
      const boxW = Math.max(86, Math.min(main.w * .48, ctx.measureText(text).width + 14));
      return { item, lineY, text, boxW, top: lineY - boxH / 2 };
    }).filter(entry =&gt; entry.lineY &gt;= main.y &amp;&amp; entry.lineY &lt;= main.y + main.h)
      .sort((a, b) =&gt; a.lineY - b.lineY);
    ctx.restore();
    if (!entries.length) return new Map();
    let cursor = topEdge;
    entries.forEach(entry =&gt; {
      entry.top = Math.max(cursor, Math.min(bottomEdge - boxH, entry.top));
      cursor = entry.top + boxH + gap;
    });
    entries[entries.length - 1].top = Math.min(entries[entries.length - 1].top, bottomEdge - boxH);
    for (let index = entries.length - 2; index &gt;= 0; index -= 1) {
      entries[index].top = Math.min(entries[index].top, entries[index + 1].top - boxH - gap);
    }
    if (entries[0].top &lt; topEdge) {
      const shift = topEdge - entries[0].top;
      entries.forEach(entry =&gt; { entry.top += shift; });
    }
    return new Map(entries.map(entry =&gt; [entry.item.id, {
      x: main.x + 5,
      y: entry.top,
      w: entry.boxW,
      h: boxH,
      lineY: entry.lineY,
      text: entry.text,
    }]));
  }

  function annotationBubbleMetrics(item, main) {
    const text = item.text || labels.callout;
    ctx.font = &#x27;700 12px system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif&#x27;;
    const protectedWidths = annotationTextTokens(text)
      .filter(isProtectedAnnotationToken)
      .map(token =&gt; ctx.measureText(token).width);
    const protectedWidth = protectedWidths.length ? Math.max(...protectedWidths) : 0;
    const textMaxWidth = Math.max(80, Math.min(main.w - 30, Math.max(160, main.w * .46, protectedWidth + 2)));
    const lines = wrapAnnotationText(text, textMaxWidth, 4);
    const contentWidth = Math.max(...lines.map(line =&gt; ctx.measureText(line).width));
    const boxW = Math.min(main.w - 8, Math.max(110, contentWidth + 22));
    const lineHeight = 17;
    const boxH = lines.length * lineHeight + 16;
    return { lines, boxW, boxH, lineHeight };
  }

  function annotationBubbleLayout(items, state, reservedRects = []) {
    const main = state.main;
    const occupied = reservedRects.map(rect =&gt; ({ x: rect.x, y: rect.y, w: rect.w, h: rect.h }));
    const result = new Map();
    ctx.save();
    const entries = items.map(item =&gt; {
      const first = annotationPointPixel(item.points[0], state);
      if (!first) return null;
      return { item, first, ...annotationBubbleMetrics(item, main) };
    }).filter(Boolean).sort((a, b) =&gt; a.first.y - b.first.y || a.first.x - b.first.x);
    const clampX = (x, w) =&gt; Math.max(main.x + 4, Math.min(main.x + main.w - w - 4, x));
    const clampY = (y, h) =&gt; Math.max(main.y + 4, Math.min(main.y + main.h - h - 4, y));
    entries.forEach(entry =&gt; {
      const { item, first, boxW, boxH } = entry;
      const requested = Number.isFinite(item.offsetX) || Number.isFinite(item.offsetY)
        ? {
            x: Number.isFinite(item.offsetX) ? first.x + item.offsetX : first.x + 18,
            y: Number.isFinite(item.offsetY) ? first.y + item.offsetY : first.y - boxH - 30,
          }
        : null;
      const bases = [
        requested,
        { x: first.x + 18, y: first.y - boxH - 30 },
        { x: first.x - boxW - 18, y: first.y - boxH - 30 },
        { x: first.x + 18, y: first.y + 30 },
        { x: first.x - boxW - 18, y: first.y + 30 },
      ].filter(Boolean).map(candidate =&gt; ({ x: clampX(candidate.x, boxW), y: clampY(candidate.y, boxH), w: boxW, h: boxH }));
      const scanXs = [...new Set([clampX(first.x + 18, boxW), clampX(first.x - boxW - 18, boxW), main.x + 4, main.x + main.w - boxW - 4])];
      const scanYs = [];
      for (let y = main.y + 4; y &lt;= main.y + main.h - boxH - 4; y += 6) scanYs.push(y);
      scanYs.sort((a, b) =&gt; Math.abs(a - (first.y - boxH / 2)) - Math.abs(b - (first.y - boxH / 2)));
      scanXs.forEach(x =&gt; scanYs.forEach(y =&gt; bases.push({ x, y, w: boxW, h: boxH })));
      const unique = [];
      const seen = new Set();
      bases.forEach(candidate =&gt; {
        const key = `${Math.round(candidate.x)}:${Math.round(candidate.y)}`;
        if (!seen.has(key)) { seen.add(key); unique.push(candidate); }
      });
      const available = unique.find(candidate =&gt; !occupied.some(rect =&gt; rectsOverlap(candidate, rect, 7)));
      const chosen = available || unique.reduce((best, candidate) =&gt; {
        const overlapCount = occupied.filter(rect =&gt; rectsOverlap(candidate, rect, 3)).length;
        const distance = Math.abs(candidate.x - first.x) + Math.abs(candidate.y + boxH / 2 - first.y);
        const score = overlapCount * 10000 + distance;
        return !best || score &lt; best.score ? { candidate, score } : best;
      }, null)?.candidate || bases[0];
      const layout = { ...entry, boxX: chosen.x, boxY: chosen.y };
      result.set(item.id, layout);
      occupied.push({ x: chosen.x, y: chosen.y, w: boxW, h: boxH });
    });
    ctx.restore();
    return result;
  }

  function drawAnnotationBubble(item, first, main, color, selected, isDraft, layout, phase = &#x27;all&#x27;) {
    const metrics = layout || annotationBubbleMetrics(item, main);
    const { lines, boxW, boxH, lineHeight } = metrics;
    ctx.save();
    const preferredRight = first.x + boxW + 22 &lt;= main.x + main.w;
    const defaultX = preferredRight ? first.x + 18 : first.x - boxW - 18;
    const defaultY = first.y - boxH - 34 &gt;= main.y ? first.y - boxH - 30 : first.y + 30;
    const requestedX = Number.isFinite(item.offsetX) ? first.x + item.offsetX : defaultX;
    const requestedY = Number.isFinite(item.offsetY) ? first.y + item.offsetY : defaultY;
    const boxX = Number.isFinite(metrics.boxX) ? metrics.boxX : Math.max(main.x + 4, Math.min(main.x + main.w - boxW - 4, requestedX));
    const boxY = Number.isFinite(metrics.boxY) ? metrics.boxY : Math.max(main.y + 4, Math.min(main.y + main.h - boxH - 4, requestedY));
    const connector = {
      x: Math.max(boxX + 10, Math.min(boxX + boxW - 10, first.x)),
      y: first.y &lt; boxY ? boxY : first.y &gt; boxY + boxH ? boxY + boxH : Math.max(boxY + 10, Math.min(boxY + boxH - 10, first.y)),
    };
    ctx.strokeStyle = color;
    ctx.lineWidth = selected ? 2.5 : 1.6;
    if (isDraft) ctx.setLineDash([5, 4]);
    if (phase === &#x27;all&#x27; || phase === &#x27;connector&#x27;) {
      ctx.beginPath(); ctx.moveTo(connector.x, connector.y); ctx.lineTo(first.x, first.y); ctx.stroke();
      ctx.setLineDash([]);
      drawArrowHead(connector, first, color, selected);
    }
    if (phase === &#x27;all&#x27; || phase === &#x27;label&#x27;) {
      ctx.fillStyle = config.themeMode === &#x27;dark&#x27; ? &#x27;rgba(17,23,34,.97)&#x27; : &#x27;rgba(255,255,255,.98)&#x27;;
      ctx.strokeStyle = color;
      ctx.lineWidth = selected ? 2 : 1.2;
      ctx.beginPath();
      if (typeof ctx.roundRect === &#x27;function&#x27;) ctx.roundRect(boxX, boxY, boxW, boxH, 9);
      else ctx.rect(boxX, boxY, boxW, boxH);
      ctx.fill(); ctx.stroke();
      lines.forEach((line, index) =&gt; drawText(line, boxX + 11, boxY + 9 + lineHeight * (index + .5), theme.text, 12, 700, &#x27;left&#x27;));
    }
    ctx.restore();
    return {
      x: Math.min(first.x - 10, boxX),
      y: Math.min(first.y - 10, boxY),
      w: Math.max(20, boxX + boxW - first.x + 10, first.x - boxX + 10),
      h: Math.max(20, boxY + boxH - first.y + 10, first.y - boxY + 10),
    };
  }

  function drawAnnotationArrow(x, y, direction, color, selected) {
    const size = selected ? 9 : 8;
    ctx.save();
    ctx.fillStyle = color;
    ctx.strokeStyle = selected ? &#x27;#fff&#x27; : color;
    ctx.lineWidth = selected ? 2 : 1;
    ctx.beginPath();
    if (direction === &#x27;up&#x27;) {
      ctx.moveTo(x, y - size); ctx.lineTo(x - size * .75, y + size * .35); ctx.lineTo(x + size * .75, y + size * .35);
    } else {
      ctx.moveTo(x, y + size); ctx.lineTo(x - size * .75, y - size * .35); ctx.lineTo(x + size * .75, y - size * .35);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  }

  function drawAnnotationLayer(state) {
    annotationHitRegions = [];
    const main = state.main;
    const compact = window.innerWidth &lt;= 760;
    const activeAnnotations = annotations.filter(item =&gt; String(item.period || config.dataType) === String(activePeriod));
    const horizontalLabels = horizontalAnnotationLabelLayout(
      compact ? [] : activeAnnotations.filter(item =&gt; item.type === &#x27;horizontal-line&#x27;),
      state,
    );
    const bubbleLayouts = annotationBubbleLayout(
      activeAnnotations.filter(item =&gt; (item.type === &#x27;text&#x27; || item.type === &#x27;callout&#x27;) &amp;&amp; (!compact || item.id === selectedAnnotationId || nearestBarIndex(state.all, normTime(item.points[0].time)) === state.all.length - 1)),
      state,
      [...horizontalLabels.values()],
    );
    const renderOne = (item, isDraft = false, phase = &#x27;geometry&#x27;) =&gt; {
      const color = isDraft ? &#x27;rgba(37,99,235,.7)&#x27; : annotationColor(item);
      const selected = !isDraft &amp;&amp; item.id === selectedAnnotationId;
      const first = annotationPointPixel(item.points[0], state);
      if (item.type === &#x27;horizontal-line&#x27;) {
        const y = state.priceScale.y(Number(item.points[0].price));
        if (y &lt; main.y || y &gt; main.y + main.h) return;
        if (phase === &#x27;geometry&#x27;) {
          ctx.save(); ctx.setLineDash(isDraft ? [5, 4] : [7, 4]);
          ctx.strokeStyle = color; ctx.lineWidth = compact ? (selected ? 1.8 : 1) : (selected ? 3 : (item.source === &#x27;model&#x27; ? 2.2 : 1.5));
          ctx.beginPath(); ctx.moveTo(main.x, y); ctx.lineTo(main.x + main.w, y); ctx.stroke(); ctx.restore();
          if (!isDraft) annotationHitRegions.push({ id: item.id, type: &#x27;line&#x27;, x1: main.x, y1: y, x2: main.x + main.w, y2: y });
        }
        const label = horizontalLabels.get(item.id);
        if (!label) return;
        const labelCenterY = label.y + label.h / 2;
        if (phase === &#x27;connector&#x27; &amp;&amp; Math.abs(labelCenterY - y) &gt; 2) {
          ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(label.x + label.w, labelCenterY);
          ctx.lineTo(label.x + label.w + 10, y);
          ctx.stroke();
          ctx.restore();
        }
        if (phase === &#x27;label&#x27;) {
          ctx.save();
          ctx.fillStyle = color; ctx.fillRect(label.x, label.y, label.w, label.h);
          drawText(label.text, label.x + 7, labelCenterY, &#x27;#fff&#x27;, 11, 750, &#x27;left&#x27;);
          ctx.restore();
          if (!isDraft) annotationHitRegions.push({ id: item.id, type: &#x27;rect&#x27;, x: label.x, y: label.y, w: label.w, h: label.h });
        }
        return;
      }
      if (!first) return;
      if (item.type === &#x27;text&#x27; || item.type === &#x27;callout&#x27;) {
        if (compact &amp;&amp; !selected &amp;&amp; first.index !== state.all.length - 1) {
          if (phase === &#x27;geometry&#x27;) {
            ctx.save(); ctx.fillStyle = color; ctx.beginPath(); ctx.arc(first.x, first.y, 3.5, 0, Math.PI * 2); ctx.fill(); ctx.restore();
            if (!isDraft) annotationHitRegions.push({ id:item.id, type:&#x27;point&#x27;, x:first.x, y:first.y, r:16 });
          }
          return;
        }
        if (phase !== &#x27;connector&#x27; &amp;&amp; phase !== &#x27;label&#x27;) return;
        const hitRect = drawAnnotationBubble(item, first, main, color, selected, isDraft, bubbleLayouts.get(item.id), phase);
        if (!isDraft &amp;&amp; phase === &#x27;label&#x27;) annotationHitRegions.push({ id: item.id, type: &#x27;rect&#x27;, ...hitRect });
        return;
      }
      if (phase !== &#x27;geometry&#x27;) return;
      if (item.type === &#x27;vertical-line&#x27;) {
        ctx.save(); ctx.setLineDash(isDraft ? [5, 4] : [7, 4]);
        ctx.strokeStyle = color; ctx.lineWidth = selected ? 2.6 : 1.5;
        ctx.beginPath(); ctx.moveTo(first.x, main.y); ctx.lineTo(first.x, main.y + main.h); ctx.stroke(); ctx.restore();
        if (!isDraft) annotationHitRegions.push({ id: item.id, type: &#x27;line&#x27;, x1: first.x, y1: main.y, x2: first.x, y2: main.y + main.h });
        return;
      }
      if ([&#x27;straight-line&#x27;, &#x27;ray-line&#x27;, &#x27;segment&#x27;, &#x27;arrow-segment&#x27;].includes(item.type)) {
        const second = annotationPointPixel(item.points[1], state);
        if (!second) return;
        const endpoints = item.type === &#x27;straight-line&#x27; || item.type === &#x27;ray-line&#x27;
          ? lineEndpointsForRect(first, second, main, item.type)
          : [first, second];
        if (!endpoints) return;
        const [lineStart, lineEnd] = endpoints;
        if (selected) {
          ctx.strokeStyle = &#x27;rgba(255,255,255,.9)&#x27;; ctx.lineWidth = 4.5;
          ctx.beginPath(); ctx.moveTo(lineStart.x, lineStart.y); ctx.lineTo(lineEnd.x, lineEnd.y); ctx.stroke();
        }
        ctx.save(); if (isDraft) ctx.setLineDash([5, 4]);
        ctx.strokeStyle = color; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(lineStart.x, lineStart.y); ctx.lineTo(lineEnd.x, lineEnd.y); ctx.stroke(); ctx.restore();
        if (item.type === &#x27;arrow-segment&#x27;) drawArrowHead(lineStart, lineEnd, color, selected);
        ctx.fillStyle = color;
        [first, second].forEach(point =&gt; { ctx.beginPath(); ctx.arc(point.x, point.y, selected ? 4.5 : 3, 0, Math.PI * 2); ctx.fill(); });
        if (!isDraft) annotationHitRegions.push({ id: item.id, type: &#x27;line&#x27;, x1: lineStart.x, y1: lineStart.y, x2: lineEnd.x, y2: lineEnd.y });
        return;
      }
      if (item.type === &#x27;buy&#x27; || item.type === &#x27;sell&#x27;) {
        const isBuy = item.type === &#x27;buy&#x27;;
        drawAnnotationArrow(first.x, first.y, isBuy ? &#x27;up&#x27; : &#x27;down&#x27;, color, selected);
        drawText(isBuy ? labels.buyShort : labels.sellShort, first.x, first.y + (isBuy ? 15 : -15), color, 11, 850, &#x27;center&#x27;);
        if (!isDraft) annotationHitRegions.push({ id: item.id, type: &#x27;point&#x27;, x: first.x, y: first.y, r: 14 });
        return;
      }
    };
    activeAnnotations.forEach(item =&gt; renderOne(item, false, &#x27;geometry&#x27;));
    if (annotationDraft?.type === &#x27;segment&#x27; &amp;&amp; annotationDraft.points?.length &amp;&amp; annotationPointer) {
      renderOne({ ...annotationDraft, points: [annotationDraft.points[0], annotationPointer] }, true, &#x27;geometry&#x27;);
    }
    activeAnnotations.forEach(item =&gt; renderOne(item, false, &#x27;connector&#x27;));
    activeAnnotations.forEach(item =&gt; renderOne(item, false, &#x27;label&#x27;));
  }

  function annotationPointFromClient(clientX, clientY) {
    const state = lastRenderState;
    if (!state) return null;
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * state.layout.width / Math.max(1, rect.width);
    const y = (clientY - rect.top) * state.layout.height / Math.max(1, rect.height);
    const main = state.main;
    if (x &lt; main.x || x &gt; main.x + main.w || y &lt; main.y || y &gt; main.y + main.h) return null;
    const xStep = main.w / Math.max(1, state.slice.slots || state.slice.list.length);
    const rawOffset = Math.round((x - main.x) / xStep - (state.slice.blankSlots || 0) - .5);
    const index = Math.max(state.slice.start, Math.min(state.slice.end, state.slice.start + rawOffset));
    const bar = state.all[index];
    if (!bar) return null;
    return { time: normTime(bar.time), price: state.priceScale.price(y), x, y, index };
  }

  function hitTestAnnotation(x, y) {
    for (let i = annotationHitRegions.length - 1; i &gt;= 0; i -= 1) {
      const hit = annotationHitRegions[i];
      if (hit.type === &#x27;line&#x27; &amp;&amp; distanceToSegment(x, y, hit.x1, hit.y1, hit.x2, hit.y2) &lt;= 8) return hit.id;
      if (hit.type === &#x27;point&#x27; &amp;&amp; Math.hypot(x - hit.x, y - hit.y) &lt;= hit.r) return hit.id;
      if (hit.type === &#x27;rect&#x27; &amp;&amp; x &gt;= hit.x &amp;&amp; x &lt;= hit.x + hit.w &amp;&amp; y &gt;= hit.y &amp;&amp; y &lt;= hit.y + hit.h) return hit.id;
    }
    return null;
  }

  function closeAnnotationEditor() {
    pendingCalloutPoint = null;
    annotationEditor?.classList.remove(&#x27;open&#x27;);
    if (annotationEditorInput) annotationEditorInput.value = &#x27;&#x27;;
  }

  function openAnnotationEditor(point) {
    if (!annotationEditor || !annotationEditorInput || !lastRenderState) return;
    pendingCalloutPoint = point;
    const maxLeft = Math.max(8, lastRenderState.layout.width - Math.min(330, lastRenderState.layout.width - 16) - 8);
    annotationEditor.style.left = `${Math.max(8, Math.min(maxLeft, point.x + 12))}px`;
    annotationEditor.style.top = `${Math.max(8, Math.min(lastRenderState.layout.height - 58, point.y - 48))}px`;
    annotationEditor.classList.add(&#x27;open&#x27;);
    annotationEditorInput.value = &#x27;&#x27;;
    setTimeout(() =&gt; annotationEditorInput.focus(), 0);
  }

  function setAnnotationMode(mode) {
    annotationMode = mode || &#x27;pan&#x27;;
    annotationDraft = null;
    annotationPointer = null;
    closeAnnotationEditor();
    tooltipSuppressed = annotationMode !== &#x27;pan&#x27;;
    if (tooltipSuppressed) hideTooltip();
    canvas.style.cursor = annotationMode === &#x27;pan&#x27; ? &#x27;default&#x27; : annotationMode === &#x27;select&#x27; ? &#x27;pointer&#x27; : &#x27;crosshair&#x27;;
    document.querySelectorAll(&#x27;[data-annotation-mode]&#x27;).forEach(button =&gt; button.classList.toggle(&#x27;active&#x27;, button.dataset.annotationMode === annotationMode));
    document.querySelector(&#x27;.annotation-toggle&#x27;)?.classList.toggle(&#x27;active&#x27;, annotationMode !== &#x27;pan&#x27;);
    draw();
  }

  function addAnnotation(item) {
    const normalized = normalizeAnnotation({ ...item, period: item?.period || activePeriod });
    if (!normalized) return;
    rememberAnnotationState();
    annotations.push(normalized);
    selectedAnnotationId = normalized.id;
    annotationDraft = null;
    saveAnnotations();
    draw();
  }

  function handleAnnotationClick(event) {
    const point = annotationPointFromClient(event.clientX, event.clientY);
    if (!point) return;
    if (annotationMode === &#x27;select&#x27;) {
      selectedAnnotationId = hitTestAnnotation(point.x, point.y);
      draw();
      return;
    }
    if (annotationMode === &#x27;segment&#x27;) {
      if (!annotationDraft) {
        annotationDraft = { type: &#x27;segment&#x27;, points: [point] };
        annotationPointer = point;
        draw();
      } else {
        addAnnotation({ type: &#x27;segment&#x27;, points: [annotationDraft.points[0], point] });
      }
      return;
    }
    if (annotationMode === &#x27;callout&#x27;) {
      openAnnotationEditor(point);
      return;
    }
    if ([&#x27;horizontal&#x27;, &#x27;vertical&#x27;, &#x27;buy&#x27;, &#x27;sell&#x27;].includes(annotationMode)) {
      addAnnotation({ type: annotationMode, points: [point] });
    }
  }

  function draw() {
    const layout = resizeCanvas();
    const all = bars();
    ctx.clearRect(0, 0, layout.width, layout.height);
    ctx.fillStyle = theme.bg;
    ctx.fillRect(0, 0, layout.width, layout.height);

    if (!all.length) {
      drawText(labels.noData, layout.width / 2, layout.height / 2, theme.muted, 15, 700, &#x27;center&#x27;);
      hideTooltip();
      return;
    }

    const isTimeShare = isMinutePeriod();
    const legendFontSize = window.innerWidth &lt; 520 ? 10 : 11;
    const compact = window.innerWidth &lt;= 760;
    const avgValues = isTimeShare ? averagePrice(all) : [];
    const mas = isTimeShare ? [] : (config.ma || [5, 10, 20, 60]).map(n =&gt; Number(n)).filter(n =&gt; Number.isFinite(n) &amp;&amp; n &gt; 1).slice(0, 4);
    const maValues = isTimeShare ? [] : mas.map(n =&gt; movingAverage(all, n));
    if (compact) {
      const index = activeIndex &gt;= 0 ? activeIndex : all.length - 1;
      const entries = isTimeShare ? [[`${labels.price} ${fmtPrice(all[index]?.close)}`, upColor], [`${labels.avgPrice} ${fmtPrice(avgValues[index])}`,maColors[0]]] : mas.map((n,i) =&gt; [`MA${n} ${fmtPrice(maValues[i]?.[index])}`,maColors[i]]).filter((entry,i) =&gt; Number.isFinite(maValues[i]?.[index]));
      syncMobileSummary(entries);
    }
    const slice = visibleSlice(all, layout);
    const visible = slice.list;
    const main = layout.panes[0];
    const xStep = main.w / Math.max(1, slice.slots || visible.length);
    // 控制 K 线之间的视觉间距最大不超过 9px；缩放放大出来的剩余空间全部给实体宽度。
    const candleGap = Math.min(16, Math.max(0, xStep * 0.18));
    const candleW = Math.max(2, xStep - candleGap);
    const xOf = i =&gt; main.x + ((slice.blankSlots || 0) + (i - slice.start) + 0.5) * xStep;

    let minP;
    let maxP;
    if (isTimeShare) {
      const visibleAvg = avgValues.slice(slice.start, slice.end + 1).filter(Number.isFinite);
      const values = [...visible.map(b =&gt; b.close), ...visibleAvg].filter(Number.isFinite);
      minP = Math.min(...values);
      maxP = Math.max(...values);
    } else {
      minP = Math.min(...visible.map(b =&gt; b.low));
      maxP = Math.max(...visible.map(b =&gt; b.high));
      maValues.forEach(arr =&gt; arr.slice(slice.start, slice.end + 1).forEach(v =&gt; { if (Number.isFinite(v)) { minP = Math.min(minP, v); maxP = Math.max(maxP, v); } }));
    }
    const priceScale = scale(minP, maxP, main.y + 16, main.h - 20);
    const latest = all[all.length - 1];
    const latestY = priceScale.y(latest.close);
    const latestPriceLabel = fmtPrice(latest.close);
    const latestPriceLabelW = textRect(latestPriceLabel, 0, 0, 12, 800, &#x27;left&#x27;).w + 14;
    const latestPriceLabelRect = (latestY &gt;= main.y &amp;&amp; latestY &lt;= main.y + main.h)
      ? { x: main.x + main.w + 2, y: latestY - 13, w: latestPriceLabelW, h: 26 }
      : null;

    drawGrid(main, 5);
    drawPriceAxis(main, priceScale, latestPriceLabelRect ? [latestPriceLabelRect] : []);

    if (isTimeShare) {
      const pricePts = visible.map((bar, j) =&gt; ({ x: xOf(slice.start + j), y: priceScale.y(bar.close) }));
      const avgPts = avgValues.slice(slice.start, slice.end + 1).map((v, j) =&gt; ({ x: xOf(slice.start + j), y: Number.isFinite(v) ? priceScale.y(v) : NaN }));
      drawLine(pricePts, upColor, 1.7);
      drawLine(avgPts, maColors[0], 1.4);

      const legendIndex = activeIndex &gt;= 0 ? activeIndex : all.length - 1;
      const priceText = `${labels.price} ${fmtPrice(all[legendIndex]?.close)}`;
      const legendStartX = main.x + 4;
      if (!compact) drawText(priceText, legendStartX, main.y + 18, upColor, legendFontSize, 800);
      const avgText = `${labels.avgPrice} ${fmtPrice(avgValues[legendIndex])}`;
      if (!compact) drawText(avgText, legendStartX + ctx.measureText(priceText).width + 18, main.y + 18, maColors[0], legendFontSize, 800);
    } else {
      const drawCandleBar = (bar, i) =&gt; {
        const x = xOf(i);
        const color = bar.close &gt; bar.open ? upColor : bar.close &lt; bar.open ? downColor : flatColor;
        const yo = priceScale.y(bar.open);
        const yc = priceScale.y(bar.close);
        const yh = priceScale.y(bar.high);
        const yl = priceScale.y(bar.low);

        const bodyW = Math.max(3, Math.round(candleW));
        const cx = Math.round(x) + 0.5;
        const left = Math.round(x - bodyW / 2) + 0.5;
        const rawTop = Math.min(yo, yc);
        const rawBottom = Math.max(yo, yc);
        const rawH = Math.max(0, rawBottom - rawTop);
        const bodyH = Math.max(3, Math.round(rawH));
        let top = rawTop - Math.max(0, bodyH - rawH) / 2;
        top = Math.max(main.y + 1, Math.min(main.y + main.h - bodyH - 1, top));
        top = Math.round(top) + 0.5;
        const bottom = top + bodyH;

        ctx.lineWidth = 1;
        ctx.strokeStyle = color;
        ctx.fillStyle = color;

        // 空心 K 线不能让影线穿过实体，否则移动端会看起来像“两根竖线”。
        // 这里把影线拆成上下两段，再单独画实体边框。
        ctx.beginPath();
        ctx.moveTo(cx, yh);
        ctx.lineTo(cx, top);
        ctx.moveTo(cx, bottom);
        ctx.lineTo(cx, yl);
        ctx.stroke();

        const isUp = bar.close &gt;= bar.open;
        const useHollow = config.klineType !== &#x27;candle-solid&#x27; &amp;&amp; isUp;

        if (useHollow) {
          // 先擦掉实体内部，再画完整边框，保证顶部/底部横线可见。
          if (bodyW &gt; 2 &amp;&amp; bodyH &gt; 2) {
            ctx.fillStyle = theme.bg;
            ctx.fillRect(left + 1, top + 1, bodyW - 2, bodyH - 2);
          }
          ctx.strokeStyle = color;
          ctx.strokeRect(left, top, bodyW, bodyH);
        } else {
          ctx.fillStyle = color;
          ctx.fillRect(left, top, bodyW, bodyH);
        }
      };

      visible.forEach((bar, j) =&gt; drawCandleBar(bar, slice.start + j));

      maValues.forEach((arr, idx) =&gt; {
        const pts = arr.slice(slice.start, slice.end + 1).map((v, j) =&gt; ({ x: xOf(slice.start + j), y: Number.isFinite(v) ? priceScale.y(v) : NaN }));
        drawLine(pts, maColors[idx], 1.6);
      });

      const legendIndex = activeIndex &gt;= 0 ? activeIndex : all.length - 1;
      let lx = main.x + 4;
      let ly = main.y + 18;
      const legendMaxX = main.x + main.w - 8;
      const legendGap = window.innerWidth &lt; 520 ? 14 : 18;
      const legendLineGap = window.innerWidth &lt; 520 ? 17 : 18;
      mas.forEach((n, idx) =&gt; {
        const v = maValues[idx]?.[legendIndex];
        if (!Number.isFinite(v)) return;
        const label = `${labels.ma || &#x27;MA&#x27;}${n} ${fmtPrice(v)}`;
        const labelW = ctx.measureText(label).width;
        if (lx &gt; main.x + 4 &amp;&amp; lx + labelW &gt; legendMaxX) {
          lx = main.x + 4;
          ly += legendLineGap;
        }
        if (!compact) drawText(label, lx, ly, maColors[idx], legendFontSize, 800);
        lx += labelW + legendGap;
      });

      const visibleHigh = visible.reduce((best, b) =&gt; b.high &gt; best.high ? b : best, visible[0]);
      const visibleLow = visible.reduce((best, b) =&gt; b.low &lt; best.low ? b : best, visible[0]);
      const hiIdx = all.indexOf(visibleHigh); const loIdx = all.indexOf(visibleLow);
      const drawExtremeLabel = (value, idx, y, color, marker) =&gt; {
        const x = xOf(idx);
        if (compact) { ctx.save(); ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2); ctx.fill(); ctx.restore(); return; }
        const raw = fmtPrice(value);
        const preferLeft = x &gt; main.x + main.w * 0.66;
        let text = preferLeft ? `${raw} ${marker}` : `${marker} ${raw}`;
        let align = preferLeft ? &#x27;right&#x27; : &#x27;left&#x27;;
        let labelX = preferLeft ? x - 8 : x + 8;
        const measuredW = ctx.measureText(text).width;
        if (align === &#x27;left&#x27; &amp;&amp; labelX + measuredW &gt; main.x + main.w - 4) {
          text = `${raw} ${marker}`;
          align = &#x27;right&#x27;;
          labelX = x - 8;
        } else if (align === &#x27;right&#x27; &amp;&amp; labelX - measuredW &lt; main.x + 4) {
          text = `${marker} ${raw}`;
          align = &#x27;left&#x27;;
          labelX = x + 8;
        }
        const rect = textRect(text, labelX, y, 11, 500, align);
        if (!rectsOverlap(rect, latestPriceLabelRect, 6)) drawText(text, labelX, y, color, 11, 500, align);
      };
      drawExtremeLabel(
        visibleHigh.high,
        hiIdx,
        Math.max(main.y + 14, priceScale.y(visibleHigh.high) - 10),
        upColor,
        labels.highMark || labels.high || &#x27;High&#x27;
      );
      drawExtremeLabel(
        visibleLow.low,
        loIdx,
        Math.min(main.y + main.h - 10, priceScale.y(visibleLow.low) + 10),
        downColor,
        labels.lowMark || labels.low || &#x27;Low&#x27;
      );
    }

    lastRenderState = { layout, all, slice, main, xOf, priceScale };
    drawAnnotationLayer(lastRenderState);

    if (latestPriceLabelRect) {
      drawDashedLine(main.x, latestY, main.x + main.w, latestY, upColor);
      ctx.fillStyle = upColor;
      ctx.fillRect(latestPriceLabelRect.x, latestPriceLabelRect.y, latestPriceLabelRect.w, latestPriceLabelRect.h);
      drawText(latestPriceLabel, main.x + main.w + 9, latestY, &#x27;#fff&#x27;, 12, 800);
    }

    const mc = macd(all);
    layout.panes.slice(1).forEach(pane =&gt; {
      drawGrid(pane, 2);
      ctx.strokeStyle = theme.gridStrong;
      ctx.beginPath(); ctx.moveTo(pane.x, pane.y); ctx.lineTo(pane.x + pane.w + pane.rightPad, pane.y); ctx.stroke();
      if (pane.type === &#x27;VOL&#x27;) {
        const vmax = Math.max(...visible.map(b =&gt; b.volume || 0), 1);
        drawValueAxis(pane, 0, vmax, fmtVolume, 2);
        const legendIndex = activeIndex &gt;= slice.start &amp;&amp; activeIndex &lt;= slice.end ? activeIndex : slice.end;
        const volText = `${labels.vol} ${fmtVolume(all[legendIndex]?.volume)}`;
        drawText(volText, pane.x + 4, pane.y + 15, theme.muted, legendFontSize, 600);
        visible.forEach((bar, j) =&gt; {
          const i = slice.start + j;
          const x = xOf(i);
          const h = (bar.volume || 0) / vmax * (pane.h - 20);
          ctx.fillStyle = bar.close &gt;= bar.open ? upColor : downColor;
          ctx.globalAlpha = 0.8;
          ctx.fillRect(x - candleW / 2, pane.y + pane.h - h - 4, candleW, Math.max(1, h));
          ctx.globalAlpha = 1;
        });
      }
      if (pane.type === &#x27;MACD&#x27;) {
        const vals = [
          ...mc.hist.slice(slice.start, slice.end + 1),
          ...mc.dif.slice(slice.start, slice.end + 1),
          ...mc.dea.slice(slice.start, slice.end + 1),
          0
        ].map(Number).filter(Number.isFinite);

        // MACD 不再用正负对称的 maxAbs 缩放。比如整段都在 0 轴上方时，
        // 对称缩放会浪费下半区，DIF/DEA 和柱体会被压在顶部像一条平线。
        // 这里按当前可视区 min/max（并强制包含 0 轴）映射到图形区，同时预留顶部图例区。
        let minM = Math.min(...vals);
        let maxM = Math.max(...vals);
        const spanM = maxM - minM || Math.max(Math.abs(maxM), 1);
        const padM = spanM * 0.12;
        minM -= padM;
        maxM += padM;
        drawValueAxis(pane, minM, maxM, fmtMacdIndicator, 2);
        const plotTop = pane.y + 24;
        const plotBottom = pane.y + pane.h - 6;
        const plotH = Math.max(12, plotBottom - plotTop);
        const macdY = v =&gt; plotTop + (maxM - Number(v || 0)) / Math.max(1e-12, maxM - minM) * plotH;
        const y0 = macdY(0);

        // 0 轴
        ctx.strokeStyle = theme.gridStrong;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(pane.x, y0);
        ctx.lineTo(pane.x + pane.w, y0);
        ctx.stroke();

        const legendIndex = activeIndex &gt;= slice.start &amp;&amp; activeIndex &lt;= slice.end ? activeIndex : slice.end;
        let lx = pane.x + 4;
        let ly = pane.y + 15;
        const legendMaxX = pane.x + pane.w - 8;
        const legendGap = 16;
        const legendLineGap = 16;
        [
          [labels.dif, mc.dif[legendIndex], &#x27;#f59e0b&#x27;],
          [labels.dea, mc.dea[legendIndex], &#x27;#8b5cf6&#x27;],
          [labels.macd, mc.hist[legendIndex], mc.hist[legendIndex] &gt;= 0 ? upColor : downColor],
        ].forEach(([label, value, color]) =&gt; {
          const text = `${label} ${fmtMacdIndicator(value, true)}`;
          const textW = ctx.measureText(text).width;
          if (lx &gt; pane.x + 4 &amp;&amp; lx + textW &gt; legendMaxX) {
            lx = pane.x + 4;
            ly += legendLineGap;
          }
          drawText(text, lx, ly, color, legendFontSize, 700);
          lx += textW + legendGap;
        });

        visible.forEach((_, j) =&gt; {
          const i = slice.start + j;
          const x = xOf(i);
          const v = Number(mc.hist[i] || 0);
          const y = macdY(v);
          ctx.fillStyle = v &gt;= 0 ? upColor : downColor;
          ctx.globalAlpha = 0.82;
          ctx.fillRect(x - candleW / 2, Math.min(y0, y), candleW, Math.max(1, Math.abs(y - y0)));
          ctx.globalAlpha = 1;
        });

        drawLine(mc.dif.slice(slice.start, slice.end + 1).map((v, j) =&gt; ({
          x: xOf(slice.start + j),
          y: macdY(v)
        })), &#x27;#f59e0b&#x27;, 1.4);

        drawLine(mc.dea.slice(slice.start, slice.end + 1).map((v, j) =&gt; ({
          x: xOf(slice.start + j),
          y: macdY(v)
        })), &#x27;#8b5cf6&#x27;, 1.4);
      }
    });

    const xY = layout.height - 16;
    const labelCount = Math.max(3, Math.floor(main.w / 160));
    const firstVisibleYear = all[slice.start] ? new Date(normTime(all[slice.start].time)).getFullYear() : NaN;
    const lastVisibleYear = all[slice.end] ? new Date(normTime(all[slice.end].time)).getFullYear() : NaN;
    const crossesYear = isDateOnlyPeriod() &amp;&amp; Number.isFinite(firstVisibleYear) &amp;&amp; Number.isFinite(lastVisibleYear) &amp;&amp; firstVisibleYear !== lastVisibleYear;
    for (let k = 0; k &lt;= labelCount; k++) {
      const idx = Math.min(slice.end, Math.round(slice.start + (slice.end - slice.start) * k / labelCount));
      if (!all[idx]) continue;
      const x = xOf(idx);

      // 所有周期的首尾时间都做安全对齐，避免首个/末个时间被画布边缘裁掉。
      const isFirst = k === 0;
      const isLast = k === labelCount;
      const label = fmtAxisTime(all[idx].time, { startYearOnly: isFirst &amp;&amp; crossesYear });
      const safePad = 2;
      const labelX = isFirst ? main.x + safePad : isLast ? main.x + main.w - safePad : x;
      const align = isFirst ? &#x27;left&#x27; : isLast ? &#x27;right&#x27; : &#x27;center&#x27;;
      drawText(label, labelX, xY, theme.axis, window.innerWidth &lt;= 760 ? 11 : 12, 500, align);
    }

    if (activeIndex &gt;= slice.start &amp;&amp; activeIndex &lt;= slice.end) {
      const x = xOf(activeIndex);
      drawDashedLine(x, 0, x, layout.height - 28, &#x27;#8fa0b5&#x27;);
      const label = fmtAxisTime(all[activeIndex].time);
      const w = ctx.measureText(label).width + 16;
      ctx.fillStyle = &#x27;#4b5563&#x27;;
      ctx.fillRect(Math.max(0, Math.min(layout.width - w, x - w / 2)), layout.height - 28, w, 24);
      drawText(label, Math.max(w / 2, Math.min(layout.width - w / 2, x)), layout.height - 16, &#x27;#fff&#x27;, 12, 700, &#x27;center&#x27;);
    }

    positionTooltip(layout, all, slice, xOf);
  }

  function pointerXInCanvas() {
    const n = Number(lastPointerX);
    if (!Number.isFinite(n)) return null;
    const rect = canvas.getBoundingClientRect();
    return n - rect.left;
  }

  function positionTooltip(layout, all, slice, xOf) {
    if (tooltipSuppressed) {
      hideTooltip();
      return;
    }
    if (activeIndex &lt; 0 || activeIndex &gt;= all.length || activeIndex &lt; slice.start || activeIndex &gt; slice.end) {
      hideTooltip();
      return;
    }
    const b = all[activeIndex];
    if (isMinutePeriod()) {
      const avg = averagePrice(all)[activeIndex];
      const m = macd(all);
      const showVol = (config.subIndicators || []).map(x =&gt; String(x).toUpperCase()).includes(&#x27;VOL&#x27;);
      const showMacd = (config.subIndicators || []).map(x =&gt; String(x).toUpperCase()).includes(&#x27;MACD&#x27;);
      const macdValue = Number(m.hist[activeIndex] || 0);
      const macdTone = macdValue &gt; 0 ? &#x27;is-up&#x27; : macdValue &lt; 0 ? &#x27;is-down&#x27; : &#x27;is-flat&#x27;;
      tooltip.innerHTML = `
        &lt;div class=&quot;tip-time&quot;&gt;${fmtTime(b.time)}&lt;/div&gt;
        &lt;div class=&quot;tip-row&quot;&gt;&lt;span&gt;${labels.price}&lt;/span&gt;&lt;b&gt;${fmtPrice(b.close)}&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;tip-row&quot;&gt;&lt;span&gt;${labels.avgPrice}&lt;/span&gt;&lt;b&gt;${fmtPrice(avg)}&lt;/b&gt;&lt;/div&gt;
        ${showVol ? `&lt;div class=&quot;tip-row&quot;&gt;&lt;span&gt;${labels.volume}&lt;/span&gt;&lt;b&gt;${fmtVolume(b.volume)}&lt;/b&gt;&lt;/div&gt;` : &#x27;&#x27;}
        ${showMacd ? `&lt;div class=&quot;tip-row&quot;&gt;&lt;span&gt;${labels.macd}&lt;/span&gt;&lt;b class=&quot;${macdTone}&quot;&gt;${fmtMacdIndicator(macdValue, true)}&lt;/b&gt;&lt;/div&gt;` : &#x27;&#x27;}`;
    } else {
      const prev = activeIndex &gt; 0 ? all[activeIndex - 1] : null;
      const change = b.close - (prev ? prev.close : b.open);
      const pct = prev?.close ? change / prev.close * 100 : (b.open ? change / b.open * 100 : 0);
      const tone = change &gt; 0 ? &#x27;is-up&#x27; : change &lt; 0 ? &#x27;is-down&#x27; : &#x27;is-flat&#x27;;
      tooltip.innerHTML = `
        &lt;div class=&quot;tip-time&quot;&gt;${fmtTime(b.time)}&lt;/div&gt;
        &lt;div class=&quot;tip-row&quot;&gt;&lt;span&gt;${labels.open}&lt;/span&gt;&lt;b&gt;${fmtPrice(b.open)}&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;tip-row&quot;&gt;&lt;span&gt;${labels.high}&lt;/span&gt;&lt;b&gt;${fmtPrice(b.high)}&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;tip-row&quot;&gt;&lt;span&gt;${labels.low}&lt;/span&gt;&lt;b&gt;${fmtPrice(b.low)}&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;tip-row&quot;&gt;&lt;span&gt;${labels.close}&lt;/span&gt;&lt;b&gt;${fmtPrice(b.close)}&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;tip-row&quot;&gt;&lt;span&gt;${labels.change}&lt;/span&gt;&lt;b class=&quot;${tone}&quot;&gt;${fmtPrice(change, true)}&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;tip-row&quot;&gt;&lt;span&gt;${labels.changePct}&lt;/span&gt;&lt;b class=&quot;${tone}&quot;&gt;${Math.abs(pct).toLocaleString(numberLocale(), { minimumFractionDigits: 2, maximumFractionDigits: 2 })}%&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;tip-row&quot;&gt;&lt;span&gt;${labels.volume}&lt;/span&gt;&lt;b&gt;${fmtVolume(b.volume)}&lt;/b&gt;&lt;/div&gt;`;
    }
    const x = xOf(activeIndex);
    tooltip.classList.add(&#x27;is-visible&#x27;);
    const main = layout.panes[0];
    const edgeGap = 8;
    const compactTooltip = window.innerWidth &lt;= 760 || main.w &lt;= 420;
    const tipW = compactTooltip
      ? Math.min(156, Math.floor(main.w * 0.4))
      : Math.min(270, Math.floor(main.w * 0.56));
    tooltip.style.width = `${tipW}px`;
    const plotLeft = main.x + edgeGap;
    const plotRight = main.x + main.w - edgeGap;
    const showRight = x &lt; main.x + main.w / 2;
    const left = showRight ? plotRight - tipW : plotLeft;
    tooltip.style.left = `${left}px`;
    const top = main.y + edgeGap;
    tooltip.style.top = `${top}px`;
    tooltip.classList.remove(&#x27;is-below&#x27;);
  }

  function setActiveFromX(clientX) {
    lastPointerX = clientX;
    const all = bars();
    if (!all.length) return;
    const layout = getLayout(canvas.clientWidth || canvas.parentElement.clientWidth || 360);
    const slice = visibleSlice(all, layout);
    const main = layout.panes[0];
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    const xStep = main.w / Math.max(1, slice.slots || slice.list.length || 1);
    const slotIndex = Math.round((x - main.x) / Math.max(1, xStep) - 0.5);
    const dataOffset = slotIndex - (slice.blankSlots || 0);
    activeIndex = Math.max(slice.start, Math.min(slice.end, slice.start + dataOffset));
    draw();
  }

  function toggleTooltipFromX(clientX) {
    if (!tooltipSuppressed &amp;&amp; tooltip.classList.contains(&#x27;is-visible&#x27;)) {
      tooltipSuppressed = true;
      hideTooltip();
      return;
    }
    tooltipSuppressed = false;
    setActiveFromX(clientX);
  }

  function switchPeriod(period) {
    activePeriod = period;
    activeIndex = -1;
    selectedAnnotationId = null;
    annotationDraft = null;
    annotationPointer = null;
    closeAnnotationEditor();
    tooltipSuppressed = false;
    viewEnd = null;
    visibleCount = null;
    document.querySelectorAll(&#x27;.period-button&#x27;).forEach(btn =&gt; btn.classList.toggle(&#x27;active&#x27;, btn.dataset.period === period));
    scrollActivePeriodIntoView();
    draw();
  }

  function scrollActivePeriodIntoView() {
    const tabs = document.querySelector(&#x27;.period-tabs&#x27;);
    const active = document.querySelector(&#x27;.period-button.active&#x27;);
    if (!tabs || !active) return;
    const tabsRect = tabs.getBoundingClientRect();
    const activeRect = active.getBoundingClientRect();
    const extra = 12;
    if (activeRect.left &lt; tabsRect.left + extra || activeRect.right &gt; tabsRect.right - extra) {
      const delta = activeRect.left - tabsRect.left - Math.max(extra, (tabsRect.width - activeRect.width) / 2);
      tabs.scrollTo({ left: Math.max(0, tabs.scrollLeft + delta), behavior: &#x27;smooth&#x27; });
    }
  }

  function touchDistance(touches) {
    if (!touches || touches.length &lt; 2) return 0;
    const a = touches[0];
    const b = touches[1];
    return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  }

  function zoomToCount(nextCount) {
    const all = bars(); if (!all.length) return;
    const layout = getLayout(canvas.clientWidth || canvas.parentElement.clientWidth || 360);
    visibleCount = clampVisibleCount(nextCount, all, layout);
    maybeLoadPreviousPage();
    draw();
  }

  document.querySelectorAll(&#x27;.period-button&#x27;).forEach(btn =&gt; btn.addEventListener(&#x27;click&#x27;, () =&gt; switchPeriod(btn.dataset.period)));
  canvas.addEventListener(&#x27;mousemove&#x27;, e =&gt; {
    if (annotationMode !== &#x27;pan&#x27;) {
      annotationPointer = annotationPointFromClient(e.clientX, e.clientY);
      if (annotationDraft) draw();
      return;
    }
    if (!isDragging) setActiveFromX(e.clientX);
  });
  canvas.addEventListener(&#x27;mouseleave&#x27;, () =&gt; {
    annotationPointer = null;
    if (annotationMode === &#x27;pan&#x27; &amp;&amp; !isDragging) { activeIndex = -1; hideTooltip(); draw(); }
  });
  canvas.addEventListener(&#x27;click&#x27;, e =&gt; {
    if (ignoreNextClick) {
      ignoreNextClick = false;
      return;
    }
    if (annotationMode !== &#x27;pan&#x27;) {
      handleAnnotationClick(e);
      return;
    }
    if (!dragMoved &amp;&amp; !selectMobileAnnotation(e.clientX, e.clientY)) toggleTooltipFromX(e.clientX);
  });
  const panZoomEnabled = true;
  if (panZoomEnabled) {
    canvas.addEventListener(&#x27;mousedown&#x27;, e =&gt; {
      if (annotationMode !== &#x27;pan&#x27;) return;
      isDragging = true; dragMoved = false; dragStartX = e.clientX; dragStartEnd = viewEnd ?? (bars().length - 1);
    });
    window.addEventListener(&#x27;mouseup&#x27;, () =&gt; {
      isDragging = false;
      dragMoved = false;
    });
    window.addEventListener(&#x27;mousemove&#x27;, e =&gt; {
      if (!isDragging) return;
      const all = bars(); if (!all.length) return;
      const layout = getLayout(canvas.clientWidth || canvas.parentElement.clientWidth || 360);
      dragMoved = dragMoved || Math.abs(e.clientX - dragStartX) &gt; 3;
      const deltaBars = Math.round((dragStartX - e.clientX) / Math.max(1, layout.panes[0].w) * (visibleCount || 60));
      viewEnd = Math.max(0, Math.min(all.length - 1, dragStartEnd + deltaBars));
      if (viewEnd &lt;= 3 &amp;&amp; maybeLoadPreviousPage()) return;
      draw();
	    });
    canvas.addEventListener(&#x27;wheel&#x27;, e =&gt; {
      if (!e.ctrlKey &amp;&amp; Math.abs(e.deltaY) &gt;= Math.abs(e.deltaX)) return;
      e.preventDefault();
      const all = bars(); if (!all.length) return;
      const layout = getLayout(canvas.clientWidth || canvas.parentElement.clientWidth || 360);
      const current = clampVisibleCount(visibleCount || autoVisibleCount(layout), all, layout);
      // 滚轮向下 / 触控板双指向下：缩小，显示更多 K 线；向上：放大。
      const factor = e.deltaY &gt; 0 ? 1.16 : 0.86;
      visibleCount = clampVisibleCount(current * factor, all, layout);
      maybeLoadPreviousPage();
      draw();
    }, { passive: false });
    canvas.addEventListener(&#x27;touchstart&#x27;, e =&gt; {
      if (annotationMode !== &#x27;pan&#x27; &amp;&amp; e.touches[0]) {
        e.preventDefault();
        touchMode = &#x27;annotation&#x27;;
        lastPointerX = e.touches[0].clientX;
        lastPointerY = e.touches[0].clientY;
        annotationPointer = annotationPointFromClient(lastPointerX, lastPointerY);
        return;
      }
      if (e.touches.length &gt;= 2) {
        e.preventDefault();
        touchMode = &#x27;pinch&#x27;;
        isDragging = false;
        const all = bars();
        const layout = getLayout(canvas.clientWidth || canvas.parentElement.clientWidth || 360);
        pinchStartDistance = touchDistance(e.touches);
        pinchStartVisibleCount = clampVisibleCount(visibleCount || autoVisibleCount(layout), all, layout);
        hideTooltip();
        return;
      }
      if (e.touches[0]) {
        touchMode = &#x27;drag&#x27;;
        isDragging = true;
        dragMoved = false;
        dragStartX = e.touches[0].clientX;
        dragStartY = e.touches[0].clientY;
        lastPointerX = e.touches[0].clientX;
        lastPointerY = e.touches[0].clientY;
        dragStartEnd = viewEnd ?? (bars().length - 1);
      }
    }, { passive: false });
    canvas.addEventListener(&#x27;touchmove&#x27;, e =&gt; {
      if (touchMode === &#x27;annotation&#x27; &amp;&amp; e.touches[0]) {
        e.preventDefault();
        lastPointerX = e.touches[0].clientX;
        lastPointerY = e.touches[0].clientY;
        annotationPointer = annotationPointFromClient(lastPointerX, lastPointerY);
