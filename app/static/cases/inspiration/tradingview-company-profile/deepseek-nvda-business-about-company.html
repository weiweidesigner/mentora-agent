<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>英伟达公司资料：行业定位、上市信息与主营业务</title>
<style>
:root{color-scheme:light;--business-text-111:#111;}
:root[data-theme="dark"]{color-scheme:dark;--business-text-111:#e8edf5;}

* { box-sizing:border-box; }
body {
  margin:0;
  background:transparent;
  color:var(--business-text-111);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
.about-company {
  width:100%;
  padding:0;
  background:transparent;
}
.company-name {
  margin:0 0 8px;
  font-size:16px;
  line-height:1.16;
  font-weight:800;
  letter-spacing:0;
}
.tagline {
  margin:0 0 24px;
  font-size:14px;
  line-height:1.35;
  font-weight:400;
}
.info-grid {
  display:grid;
  grid-template-columns:repeat(4, minmax(0,1fr));
  column-gap:64px;
  row-gap:18px;
  margin-bottom:18px;
}
.wide-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  column-gap:72px;
  row-gap:18px;
  margin:0 0 20px;
}
.label {
  margin:0 0 7px;
  font-size:14px;
  line-height:1.15;
  font-weight:800;
}
.value {
  margin:0;
  font-size:14px;
  line-height:1.25;
  font-weight:400;
  color:var(--business-text-111);
}
.value a {
  color:#246bff;
  text-decoration:none;
}
.truncate {
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.intro {
  max-width:820px;
}
.intro .value {
  display:block;
  overflow:visible;
  white-space:normal;
}
@media (max-width: 900px) {
  .about-company { padding:0; }
  .company-name { font-size:16px; }
  .tagline { margin-bottom:18px; font-size:14px; }
  .info-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 28px; margin-bottom:16px; }
  .wide-grid { grid-template-columns:1fr; gap:16px; margin-bottom:18px; }
  .label { font-size:14px; margin-bottom:6px; }
  .value { font-size:14px; }
}
@media (max-width: 480px) {
  .info-grid { grid-template-columns:1fr; }
  .company-name { font-size:16px; }
  .tagline,.value { font-size:14px; }
}
</style>
<script data-business-theme-runtime>
    (() => {
      const requested = new URLSearchParams(location.search).get('theme');
      if (requested === 'dark' || requested === 'light') document.documentElement.dataset.theme = requested;
    })();
    </script></head>
<body>
<section class="about-company">
  <h1 class="company-name" id="company-name"></h1>
  <p class="tagline" id="tagline"></p>
  <div class="info-grid" id="info-grid"></div>
  <div class="wide-grid" id="wide-grid"></div>
  <div class="intro" id="intro"></div>
</section>
<script>
const payload = {"type": "about-company", "name": "公司资料", "title": "英伟达公司资料：行业定位、上市信息与主营业务", "code": "NVDA", "market": "185", "exchange": "NASDAQ", "companyName": "Nvidia Corporation", "tagline": "The world leader in Artificial Intelligence Computing", "fields": [{"key": "industry", "label": "行业", "value": "Semiconductor"}, {"key": "establishedDate", "label": "成立日期", "value": "--"}, {"key": "listingDate", "label": "上市日期", "value": "01/22/1999"}, {"key": "exchange", "label": "交易所", "value": "NASDAQ Stock Exchange"}, {"key": "employees", "label": "全职员工", "value": "42,000"}, {"key": "fiscalYearEnds", "label": "财年结束日", "value": "01-31"}, {"key": "website", "label": "网站", "value": "www.nvidia.com;investor.nvidia.com", "href": "www.nvidia.com;investor.nvidia.com"}, {"key": "securityType", "label": "证券类型", "value": "Common stock"}], "wideFields": [{"key": "officeAddress", "label": "办公地址", "value": "2788 San Tomas Expressway, Santa Clara, CA 95051"}, {"key": "business", "label": "主营业务", "value": "Provides accelerated computing and graphics solutions."}], "introduction": "Nvidia Corporation was incorporated in California in April 1993 and re-incorporated in Delaware in April 1998. The company pioneered accelerated computing to help solve the most challenging computing problems. The company's two main businesses — GPU and Tegra processors — are based on a single underlying architecture. Nvidia has a platform strategy that brings together hardware, system software, programmable algorithms, libraries, systems and services to create unique value for the market it serves.", "source": {"provider": "AInvest stock page __NEXT_DATA__", "url": "https://www.ainvest.com/stocks/NASDAQ-NVDA/"}, "language": "zh-CN", "componentUi": {"About Company": "公司资料", "Industry": "行业", "Established Date": "成立日期", "Listing Date": "上市日期", "Exchange": "交易所", "Full-time Employees": "全职员工", "Fiscal Year Ends": "财年结束日", "Website": "网站", "Security Type": "证券类型", "Office address": "办公地址", "Business": "主营业务", "Introduction": "公司介绍", "Type": "类型", "Stock": "股票", "Value": "价值", "Age": "年龄"}, "customTitle": "英伟达公司资料：行业定位、上市信息与主营业务", "theme": "dark"};
const h = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function websiteHref(value) {
  const text = String(value || '').trim();
  if (!text || text === '--') return '';
  return /^https?:\/\//i.test(text) ? text : `https://${text}`;
}

document.getElementById('company-name').textContent = payload.companyName || '';
document.getElementById('tagline').textContent = payload.tagline || '';
document.getElementById('info-grid').innerHTML = (payload.fields || []).map((item) => {
  const value = item.href && item.value && item.value !== '--'
    ? `<a href="${h(websiteHref(item.value))}" target="_blank" rel="noreferrer">${h(item.value)}</a>`
    : h(item.value || '--');
  const cls = item.key === 'industry' ? 'value truncate' : 'value';
  return `<div class="field"><div class="label">${h(item.label)}</div><div class="${cls}">${value}</div></div>`;
}).join('');
document.getElementById('wide-grid').innerHTML = (payload.wideFields || []).map((item) => (
  `<div class="field"><div class="label">${h(item.label)}</div><div class="value">${h(item.value || '--')}</div></div>`
)).join('');
const intro = document.getElementById('intro');
intro.innerHTML = `<div class="label">公司介绍</div><div class="value">${h(payload.introduction || '--')}</div>`;
</script>
