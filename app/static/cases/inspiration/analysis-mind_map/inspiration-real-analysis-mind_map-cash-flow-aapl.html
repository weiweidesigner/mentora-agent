    :root {
      --blue:#2863f4;
      --orange:#ff6845;
      --green:#2ab7a1;
      --pink:#ff3d7f;
      --total-blue:#3477ed;
      --text:var(--business-text-16181c);
      --muted:var(--business-text-6f7378);
      --grid:var(--business-border-e8e8e8);
      --axis:var(--business-border-767b84);
      --tab-bg:var(--business-bg-f3f3f3);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; margin: 0; }
    body {
      background: transparent;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .cash-flow {
      width: min(100%, 2048px);
      margin: 0;
      padding: 0;
      overflow: visible;
    }
    .page-title {
      display: block;
      margin: 0 0 12px;
      font-size: 16px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: 0;
      white-space: normal;
    }
    .description {
      width: 100%;
      max-width: clamp(980px, calc(100vw - 72px), 1560px);
      margin: 12px 0 12px;
      color:var(--business-text-22252a);
      font-size: 14px;
      line-height: 1.45;
      text-wrap: pretty;
    }
    .panels {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: clamp(34px, 4vw, 70px);
      align-items: start;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 16px;
      min-height: 30px;
      margin-bottom: 0;
    }
    .panel-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.25;
    }
    .panels > section:first-child > .panel-title { margin-bottom: 6px; }
    .metric-tabs {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .metric-tabs::-webkit-scrollbar { display: none; }
    .metric-tab {
      border: 0;
      background: transparent;
      color:var(--business-text-202226);
      font: inherit;
      font-size: 14px;
      line-height: 1;
      padding: 9px 14px;
      min-height: 32px;
      border-radius: 6px;
      white-space: nowrap;
      cursor: pointer;
    }
    .metric-tab.active { background: var(--tab-bg); font-weight: 800; }
    .chart-toolbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      min-height: 34px;
      margin: 2px 0 6px;
    }
    .segmented {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px;
      border-radius: 18px;
      background:var(--business-bg-f2f2f2);
    }
    .segment {
      border: 0;
      background: transparent;
      color:var(--business-text-1c1d20);
      font: inherit;
      font-size: 13px;
      line-height: 1;
      font-weight: 700;
      padding: 7px 16px;
      border-radius: 15px;
      cursor: pointer;
    }
    .segment.active { background:var(--business-bg-fff); box-shadow: 0 1px 4px rgba(0, 0, 0, .05); }
    .trend-stage {
      position: relative;
      width: 100%;
      height: 224px;
      overflow: visible;
    }
    .chart-svg { display: block; width: 100%; min-width: 0; height: 100%; overflow: visible; }
    .waterfall-svg { display: block; width: 100%; height: 232px; overflow: visible; }
    .legend {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
      width: 100%;
      min-height: 24px;
      margin: 0;
      color:var(--business-text-858585);
      font-size: 13px;
      text-align: center;
    }
    .legend-item { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); flex: 0 0 auto; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1.2; }
    .axis-label { fill:var(--business-text-777); font-size:13px; }
    .x-label { fill:var(--business-text-666); font-size:13px; }
    .bar-label { fill: var(--blue); font-size: 11px; font-weight: 700; text-anchor: middle; }
    .line-label { fill: var(--orange); font-size: 11px; font-weight: 700; text-anchor: middle; }
    .hover-band { fill:var(--business-text-8a8a8a); fill-opacity: .08; opacity: 0; transition: opacity .12s ease; pointer-events: none; }
    .hover-band.active { opacity: 1; }
    .hover-zone { fill: rgba(0,0,0,.001); pointer-events: all; cursor: pointer; touch-action: manipulation; }
    .trend-stage,
    .waterfall-svg {
      touch-action: manipulation;
    }
    .waterfall-label { fill:var(--business-text-2e3034); font-size: 13px; font-weight: 700; text-anchor: middle; }
    .waterfall-x { fill:var(--business-text-777); font-size: 12px; text-anchor: middle; }
    .badge-text { fill:var(--business-text-fff); font-size: 11px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .selected-period {
      color:var(--business-text-777);
      font-size: 1em;
      font-weight: 800;
      white-space: nowrap;
      margin-left: 4px;
    }
    .range-shell {
      --handle-size: 32px;
      height: var(--handle-size);
      margin: 6px 0 0;
      padding: 0 calc(var(--handle-size) / 2) 0;
      position: relative;
      touch-action: none;
    }
    .range-track { position: relative; width: 100%; height: var(--handle-size); }
    .range-track::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: calc(var(--handle-size) / 2);
      height: 3px;
      background:var(--business-bg-f1f1f1);
      border-radius: 999px;
      transform: translateY(-50%);
    }
    .range-selection {
      position: absolute;
      top: calc(var(--handle-size) / 2);
      height: 3px;
      background:var(--business-bg-5f5f5f);
      border-radius: 999px;
      transform: translateY(-50%);
    }
    .range-handle {
      appearance: none;
      position: absolute;
      top: calc(var(--handle-size) / 2);
      width: var(--handle-size);
      height: var(--handle-size);
      border-radius: 50%;
      border: 1px solid var(--business-border-ddd);
      background:var(--business-bg-fff);
      box-shadow: 0 1px 5px rgba(0,0,0,.14);
      display: grid;
      place-items: center;
      color:var(--business-text-8e8e8e);
      cursor: ew-resize;
      transform: translate(-50%, -50%);
      user-select: none;
      padding: 0;
    }
    .range-handle::before,
    .range-handle::after {
      content: "";
      display: block;
      width: 2px;
      height: 12px;
      background:var(--business-bg-9b9b9b);
      border-radius: 2px;
      box-shadow: 5px 0 0 var(--business-border-9b9b9b), -5px 0 0 #9b9b9b;
    }
    .range-handle::after { display: none; }
    .tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      min-width: 190px;
      max-width: min(340px, calc(100vw - 20px));
      border-radius: 6px;
      background: rgba(59, 59, 59, .96);
      color:var(--business-text-fff);
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.5;
      opacity: 0;
      visibility: hidden;
      transition: opacity .08s ease;
      white-space: nowrap;
    }
    .tooltip.visible { opacity: 1; visibility: visible; }
    .tooltip::after {
      content: "";
      position: absolute;
      left: var(--arrow-left, 50%);
      bottom: -7px;
      transform: translateX(-50%);
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 8px solid rgba(59, 59, 59, .96);
    }
    .tooltip.below::after {
      top: -7px;
      bottom: auto;
      border-top: 0;
      border-bottom: 8px solid rgba(59, 59, 59, .96);
    }
    .tip-title { color:var(--business-text-d8d8d8); margin-bottom: 6px; font-size: 12px; }
    .tip-row { display: flex; align-items: center; gap: 8px; min-height: 22px; }
    .tip-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
    .tip-name { color:var(--business-text-f5f5f5); min-width: 82px; }
    .tip-value { margin-left: auto; color:var(--business-text-fff); font-weight: 700; font-variant-numeric: tabular-nums; }
    .tip-value.good { color:#24c9b0; }
    .tip-value.bad { color:#ff6a7e; }
    @media (max-width: 1180px) {
      .cash-flow { padding: 0; }
      .description { margin: 12px 0 12px; }
      .panels { grid-template-columns: 1fr; gap: 12px; }
      .waterfall-svg { height: 228px; }
    }
    @media (max-width: 720px) {
      .metric-tabs { gap: 8px; margin-bottom: 10px; }
      .metric-tab { font-size: 13px; padding: 8px 10px; min-height: 29px; }
      .segment { padding: 7px 12px; }
      .chart-toolbar { justify-content: flex-start; min-height: 32px; }
      .trend-stage { height: 214px; }
      .waterfall-svg { height: 222px; }
    }

  <script>
    const payload = JSON.parse(document.getElementById('payload').textContent);
    const i18n = payload.labels || {};
    const state = {
      view: payload.defaultView || 'quarterly',
      metric: payload.defaultMetric || payload.trendMetrics[0].key,
      start: 0,
      end: 0,
      selectedKey: null,
      selectedIndex: null,
      selectedEndDate: null,
      selectedPeriod: null,
      dragging: null,
      rangeInitialized: false
    };
    const colors = {
      blue: '#2863f4',
      orange: '#ff6845',
      green: '#2ab7a1',
      pink: '#ff3d7f',
      total: '#3477ed',
      grid: 'var(--business-border-e8e8e8)',
      axis: 'var(--business-border-767b84)'
    };
    const els = {
      root: document.getElementById('cashFlow'),
      metricTabs: document.getElementById('metricTabs'),
      periodTabs: document.getElementById('periodTabs'),
      trendLegend: document.getElementById('trendLegend'),
      trendStage: document.getElementById('trendStage'),
      trendSvg: document.getElementById('trendSvg'),
      waterfallSvg: document.getElementById('waterfallSvg'),
      selectedPeriod: document.getElementById('selectedPeriod'),
      tooltip: document.getElementById('tooltip'),
      rangeShell: document.getElementById('rangeShell'),
      rangeTrack: document.getElementById('rangeTrack'),
      rangeSelection: document.getElementById('rangeSelection'),
      leftHandle: document.getElementById('leftHandle'),
      rightHandle: document.getElementById('rightHandle')
    };

    function fmtB(v) {
      if (v == null || Number.isNaN(Number(v))) return '-';
      const sign = Number(v) < 0 ? '-' : '';
      return sign + Math.abs(Number(v)).toFixed(2) + 'B';
    }
    function fmtPct(v) {
      if (v == null || Number.isNaN(Number(v))) return '-';
      const sign = Number(v) > 0 ? '+' : '';
      return sign + (Number(v) * 100).toFixed(2) + '%';
    }
    function displayPeriodLabel(label) {
      return String(label || '').replace(/(Q[1-4]|H1|9M),(\d{4})/g, (_, p, y) => `${p} '${String(y).slice(-2)}`);
    }
    function compactPeriodLabel(label) { return displayPeriodLabel(label).replace(/\s+/g, ''); }
    function metric() { return payload.trendMetrics.find(item => item.key === state.metric) || payload.trendMetrics[0]; }
    function view() { return payload.views[state.view] || payload.views.quarterly; }
    function allTrendRecords() {
      const m = metric();
      return (view().trendRecords || []).filter(record => record.values && (m.bars || []).some(bar => record.values[bar.key] != null));
    }
    function visibleRecords() { return allTrendRecords().slice(state.start, state.end + 1); }
    function svgEl(name, attrs = {}, parent) {
      const node = document.createElementNS('http://www.w3.org/2000/svg', name);
      for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
      if (parent) parent.appendChild(node);
      return node;
    }
    function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
    function isCoarsePointerEvent(event) {
      return event.pointerType === 'touch' || event.pointerType === 'pen';
    }
    function clearAllHoverBands() {
      document.querySelectorAll('.hover-band.active').forEach(node => node.classList.remove('active'));
    }
    function bindHoverAndTouch(zone, activate, deactivate) {
      zone.addEventListener('pointerenter', event => {
        if (!isCoarsePointerEvent(event)) activate(event);
      });
      zone.addEventListener('pointermove', event => {
        if (!isCoarsePointerEvent(event)) activate(event);
      });
      zone.addEventListener('pointerleave', event => {
        if (!isCoarsePointerEvent(event)) deactivate(event);
      });
      zone.addEventListener('pointercancel', event => {
        if (!isCoarsePointerEvent(event)) deactivate(event);
      });
      zone.addEventListener('pointerdown', event => {
        activate(event);
        if (isCoarsePointerEvent(event)) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
      zone.addEventListener('click', event => {
        activate(event);
        event.stopPropagation();
      });
    }
    function defaultWindow() { return 8; }

    function initTabs() {
      payload.trendMetrics.forEach(item => {
        const button = document.createElement('button');
        button.className = 'metric-tab';
        button.type = 'button';
        button.textContent = item.label;
        button.onclick = () => { state.metric = item.key; render(); };
        els.metricTabs.appendChild(button);
      });
      Object.entries(payload.views).forEach(([key, item]) => {
        const button = document.createElement('button');
        button.className = 'segment';
        button.type = 'button';
        button.textContent = item.label;
        button.onclick = () => {
          state.view = key;
          const count = allTrendRecords().length;
          const preset = payload.defaultRanges?.[key];
          if (preset) {
            state.start = Number(preset.start || 0);
            state.end = Number(preset.end || 0);
          } else {
            state.start = Math.max(0, count - defaultWindow());
            state.end = Math.max(0, count - 1);
          }
          state.rangeInitialized = true;
          state.selectedKey = null;
          state.selectedIndex = null;
          state.selectedEndDate = null;
          state.selectedPeriod = null;
          render();
        };
        els.periodTabs.appendChild(button);
      });
    }
    function ensureRange() {
      const count = allTrendRecords().length;
      if (!count) { state.start = 0; state.end = 0; return; }
      if (!state.rangeInitialized) {
        const preset = payload.defaultRanges?.[state.view];
        if (preset) {
          state.start = Number(preset.start || 0);
          state.end = Number(preset.end || 0);
        } else {
          state.start = Math.max(0, count - defaultWindow());
          state.end = count - 1;
        }
        state.rangeInitialized = true;
      }
      state.start = Math.max(0, Math.min(state.start, count - 1));
      state.end = Math.max(state.start, Math.min(state.end, count - 1));
    }
    function updateTabs() {
      [...els.metricTabs.children].forEach((button, idx) => button.classList.toggle('active', payload.trendMetrics[idx].key === state.metric));
      [...els.periodTabs.children].forEach((button, idx) => button.classList.toggle('active', Object.keys(payload.views)[idx] === state.view));
      const m = metric();
      els.trendLegend.innerHTML = '';
      (m.bars || []).forEach(item => addLegend(item.label, item.color || colors.blue));
      if (m.line) addLegend(m.line.label || 'YoY', m.line.color || colors.orange);
    }
    function addLegend(label, color) {
      const item = document.createElement('span');
      item.className = 'legend-item';
      item.innerHTML = `<span class="dot" style="background:${color}"></span><span>${label}</span>`;
      els.trendLegend.appendChild(item);
    }
    function updateRangeUI() {
      const records = allTrendRecords();
      const count = records.length;
      if (count <= 1) { els.rangeShell.style.display = 'none'; return; }
      els.rangeShell.style.display = 'block';
      const left = state.start / (count - 1) * 100;
      const right = state.end / (count - 1) * 100;
      els.rangeSelection.style.left = left + '%';
      els.rangeSelection.style.width = Math.max(0, right - left) + '%';
      els.leftHandle.style.left = left + '%';
      els.rightHandle.style.left = right + '%';
    }
    function rangeIndexFromClientX(clientX, count) {
      const rect = els.rangeTrack.getBoundingClientRect();
      const innerLeft = rect.left + 16;
      const innerWidth = Math.max(1, rect.width - 32);
      const ratio = Math.max(0, Math.min(1, (clientX - innerLeft) / innerWidth));
      return Math.round(ratio * (count - 1));
    }
    function updateRangeByIndex(idx) {
      if (state.dragging === 'left') state.start = Math.min(idx, state.end);
      if (state.dragging === 'right') state.end = Math.max(idx, state.start);
      render();
    }
    function setTooltipPosition(clientX, clientTopY, preferBelow = false) {
      const tip = els.tooltip;
      tip.classList.toggle('below', preferBelow);
      const margin = 8;
      const width = tip.offsetWidth || 220;
      const height = tip.offsetHeight || 80;
      let left = Math.max(margin, Math.min(window.innerWidth - width - margin, clientX - width / 2));
      let top = preferBelow ? clientTopY + 12 : clientTopY - height - 14;
      if (top < margin) {
        top = clientTopY + 12;
        tip.classList.add('below');
      }
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
      tip.style.setProperty('--arrow-left', Math.max(14, Math.min(width - 14, clientX - left)) + 'px');
    }
    function setTooltipPositionOutsideChart(clientX, chartTopY) {
      const tip = els.tooltip;
      tip.classList.remove('below');
      const margin = 8;
      const width = tip.offsetWidth || 220;
      const height = tip.offsetHeight || 80;
      let left = Math.max(margin, Math.min(window.innerWidth - width - margin, clientX - width / 2));
      let top = chartTopY - height - 12;
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
      tip.style.setProperty('--arrow-left', Math.max(14, Math.min(width - 14, clientX - left)) + 'px');
    }
    function showTrendTooltip(clientX, topY, record) {
      const m = metric();
      const rows = [`<div class="tip-title">${displayPeriodLabel(record.label)}</div>`];
      (m.bars || []).forEach(bar => {
        rows.push(`<div class="tip-row"><span class="tip-dot" style="background:${bar.color || colors.blue}"></span><span class="tip-name">${bar.label}</span><span class="tip-value">${fmtB(record.values?.[bar.key])}</span></div>`);
      });
      if (m.line) {
        const lineValue = record.lines?.[m.line.key];
        const cls = (Number(lineValue) || 0) >= 0 ? 'good' : 'bad';
        rows.push(`<div class="tip-row"><span class="tip-dot" style="background:${m.line.color || colors.orange}"></span><span class="tip-name">${m.line.label}</span><span class="tip-value ${cls}">${fmtPct(lineValue)}</span></div>`);
      }
      els.tooltip.innerHTML = rows.join('');
      els.tooltip.classList.add('visible');
      setTooltipPosition(clientX, topY, false);
    }
    function showWaterfallTooltip(clientX, chartTopY, record, step) {
      const item = step.item;
      const yoy = record.yoy?.[item.key];
      const cls = (Number(yoy) || 0) >= 0 ? 'good' : 'bad';
      els.tooltip.innerHTML = `
        <div class="tip-title">${displayPeriodLabel(record.label)}</div>
        <div class="tip-row"><span class="tip-dot" style="background:${step.color}"></span><span class="tip-name">${step.label}</span><span class="tip-value">${fmtB(step.displayValue)}</span></div>
        <div class="tip-row"><span class="tip-dot" style="background:${colors.orange}"></span><span class="tip-name">${i18n.yoy || 'YoY'}</span><span class="tip-value ${cls}">${fmtPct(yoy)}</span></div>`;
      els.tooltip.classList.add('visible');
      setTooltipPositionOutsideChart(clientX, chartTopY);
    }
    function hideTooltip() {
      els.tooltip.classList.remove('visible', 'below');
      clearAllHoverBands();
    }

    function renderTrend() {
      const svg = els.trendSvg;
      clear(svg);
      const records = visibleRecords();
      const m = metric();
      const bars = m.bars || [];
      const line = m.line;
      const width = Math.max(360, Math.round(els.trendStage.clientWidth || svg.clientWidth || 720));
      const height = Math.max(200, Math.round(els.trendStage.clientHeight || svg.clientHeight || 224));
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      if (!records.length) return;
      const margin = { top: 16, right: 58, bottom: 44, left: 66 };
      const chartW = Math.max(1, width - margin.left - margin.right);
      const chartH = Math.max(1, height - margin.top - margin.bottom);
      const values = [];
      records.forEach(r => bars.forEach(b => { const v = r.values?.[b.key]; if (v != null && Number.isFinite(Number(v))) values.push(Number(v)); }));
      const lines = line ? records.map(r => r.lines?.[line.key]).filter(v => v != null && Number.isFinite(Number(v))).map(Number) : [];
      const rawMinValue = Math.min(0, ...values);
      const rawMaxValue = Math.max(0, ...values);
      const valuePad = Math.max(.4, (rawMaxValue - rawMinValue) * .14);
      const valueMin = rawMinValue - valuePad;
      const valueMax = rawMaxValue + valuePad;
      const minLine = Math.min(0, ...lines);
      const maxLine = Math.max(.01, ...lines);
      const linePad = Math.max(.05, (maxLine - minLine) * .18);
      const lineMin = minLine - linePad;
      const lineMax = maxLine + linePad;
      const valueY = value => margin.top + (valueMax - Number(value || 0)) / Math.max(valueMax - valueMin, .0001) * chartH;
      const lineY = value => margin.top + (lineMax - Number(value || 0)) / Math.max(lineMax - lineMin, .0001) * chartH;
      const axisY = valueY(0);
      const gridLayer = svgEl('g', {}, svg);
      const hoverLayer = svgEl('g', {}, svg);
      const barLayer = svgEl('g', {}, svg);
      const lineLayer = svgEl('g', {}, svg);
      const labelLayer = svgEl('g', {}, svg);
      const zoneLayer = svgEl('g', {}, svg);
      for (let i = 0; i < 5; i++) {
        const y = margin.top + chartH * i / 4;
        svgEl('line', { x1: margin.left, y1: y, x2: width - margin.right, y2: y, class: Math.abs(y - axisY) < 1 ? 'axis' : 'grid' }, gridLayer);
        const v = valueMax - (valueMax - valueMin) * i / 4;
        const pct = lineMax - (lineMax - lineMin) * i / 4;
        svgEl('text', { x: margin.left - 10, y: y + 4, 'text-anchor': 'end', class: 'axis-label' }, gridLayer).textContent = Math.abs(v) < .005 ? '0' : fmtB(v);
        svgEl('text', { x: width - margin.right + 10, y: y + 4, class: 'axis-label' }, gridLayer).textContent = fmtPct(pct).replace('+', '');
      }
      const xStep = chartW / Math.max(1, records.length);
      const gap = 4;
      const groupW = Math.min(64, xStep * .62);
      const barW = Math.max(2, Math.min(34, groupW / Math.max(1, bars.length) - gap));
      const linePoints = [];
      const canShowAllLabels = records.length <= 1 || xStep >= 74;
      const canShowValues = xStep >= 54;
      const canShowDots = xStep >= 22;
      function clearHoverBands() { hoverLayer.querySelectorAll('.hover-band').forEach(node => node.classList.remove('active')); }
      records.forEach((record, idx) => {
        const cx = margin.left + xStep * idx + xStep / 2;
        const bandLeft = margin.left + xStep * idx;
        const hoverBand = svgEl('rect', { x: bandLeft, y: margin.top, width: xStep, height: chartH, class: 'hover-band' }, hoverLayer);
        bars.forEach((bar, bidx) => {
          const value = Number(record.values?.[bar.key] || 0);
          const vy = valueY(value);
          const y = Math.min(vy, axisY);
          const h = Math.abs(axisY - vy);
          const x = cx - (barW * bars.length + gap * (bars.length - 1)) / 2 + bidx * (barW + gap);
          svgEl('rect', { x, y, width: barW, height: Math.max(1, h), fill: bar.color || colors.blue }, barLayer);
          if (canShowValues && bars.length === 1) {
            const labelY = value >= 0 ? Math.max(12, y - 6) : Math.min(height - 8, y + h + 14);
            svgEl('text', { x: cx, y: labelY, class: 'bar-label' }, labelLayer).textContent = fmtB(value);
          }
        });
        if (line) {
          const lv = record.lines?.[line.key];
          if (lv != null && Number.isFinite(Number(lv))) {
            const yy = lineY(lv);
            linePoints.push({ x: cx, y: yy, value: Number(lv), record });
          }
        }
        const showLabel = canShowAllLabels || idx === 0 || idx === records.length - 1 || idx === Math.floor((records.length - 1) / 2);
        if (showLabel) {
          svgEl('text', { x: cx, y: height - 8, class: 'x-label', 'text-anchor': 'middle' }, labelLayer).textContent = displayPeriodLabel(record.label);
        }
        const zone = svgEl('rect', { x: bandLeft, y: margin.top, width: xStep, height: chartH, class: 'hover-zone' }, zoneLayer);
        const activate = () => {
          clearHoverBands();
          hoverBand.classList.add('active');
          const selectedIndex = state.start + idx;
          const changed =
            state.selectedKey !== record.key ||
            state.selectedIndex !== selectedIndex ||
            state.selectedEndDate !== record.endDate ||
            state.selectedPeriod !== record.period;
          state.selectedKey = record.key;
          state.selectedIndex = selectedIndex;
          state.selectedEndDate = record.endDate || null;
          state.selectedPeriod = record.period || null;
          if (changed) renderWaterfall();

          const liveRect = svg.getBoundingClientRect();
          const liveX = liveRect.left + (cx / width) * liveRect.width;
          const liveTopGridY = liveRect.top + (margin.top / height) * liveRect.height;
          showTrendTooltip(liveX, liveTopGridY, record);
        };
        bindHoverAndTouch(
          zone,
          activate,
          () => { hoverBand.classList.remove('active'); hideTooltip(); }
        );
      });
      if (linePoints.length) {
        const d = linePoints.map((point, idx) => `${idx ? 'L' : 'M'}${point.x},${point.y}`).join('');
        svgEl('path', { d, fill: 'none', stroke: line.color || colors.orange, 'stroke-width': 2 }, lineLayer);
        if (canShowDots) linePoints.forEach(point => svgEl('circle', { cx: point.x, cy: point.y, r: 4, fill: line.color || colors.orange }, lineLayer));
      }
      svg.addEventListener('mouseleave', () => { clearHoverBands(); hideTooltip(); });
    }

    function waterfallRecord() {
      const records = view().waterfallRecords || [];
      if (!records.length) return null;
      if (state.selectedKey) {
        const matched = records.find(item => item.key === state.selectedKey);
        if (matched) return matched;
      }
      if (state.selectedEndDate) {
        const matched = records.find(item => item.endDate === state.selectedEndDate || item.end_date === state.selectedEndDate);
        if (matched) return matched;
      }
      if (state.selectedIndex != null && records[state.selectedIndex]) {
        return records[state.selectedIndex];
      }
      if (state.selectedPeriod) {
        const periodMatches = records.filter(item => item.period === state.selectedPeriod);
        if (periodMatches.length) return periodMatches[periodMatches.length - 1];
      }
      return records[records.length - 1];
    }
    function waterfallSteps(record) {
      let running = 0;
      return (payload.waterfallItems || []).map(item => {
        const value = Number(record.values?.[item.key] || 0);
        if (item.kind === 'total') return { item, label: item.label, kind: 'total', start: 0, end: value, value, color: colors.total, displayValue: value };
        const start = running;
        running += value;
        return { item, label: item.label, kind: 'delta', start, end: running, value, color: value >= 0 ? colors.green : colors.pink, displayValue: value };
      });
    }
    function renderWaterfall() {
      const svg = els.waterfallSvg;
      clear(svg);
      const record = waterfallRecord();
      if (!record) return;
      els.selectedPeriod.textContent = `(${compactPeriodLabel(record.label)})`;
      const width = Math.max(360, Math.round(svg.clientWidth || 620));
      const height = Math.max(200, Math.round(svg.clientHeight || 232));
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      const margin = { top: 12, right: 30, bottom: 52, left: 34 };
      const chartW = Math.max(1, width - margin.left - margin.right);
      const chartH = Math.max(1, height - margin.top - margin.bottom);
      const steps = waterfallSteps(record);
      const domainValues = steps.flatMap(step => [step.start, step.end, 0]);
      const minValue = Math.min(0, ...domainValues);
      const maxValue = Math.max(0, ...domainValues);
      const pad = Math.max((maxValue - minValue) * .16, 1);
      const yMin = minValue - pad;
      const yMax = maxValue + pad;
      const y = value => margin.top + (yMax - value) / Math.max(yMax - yMin, .0001) * chartH;
      const zeroY = y(0);
      const xs = steps.map((_, i) => margin.left + chartW * (i + .5) / steps.length);
      const slot = chartW / steps.length;
      const barW = Math.max(22, Math.min(74, slot * .46));
      const gridYs = Array.from({ length: 5 }, (_, i) => margin.top + chartH * i / 4);
      const zeroGridIndex = gridYs.reduce((best, gy, i) => Math.abs(gy - zeroY) < Math.abs(gridYs[best] - zeroY) ? i : best, 0);
      gridYs.forEach((gy, i) => {
        svgEl('line', { x1: margin.left, y1: gy, x2: width - margin.right, y2: gy, class: i === zeroGridIndex ? 'axis' : 'grid' }, svg);
      });
      const hoverLayer = svgEl('g', {}, svg);
      const barLayer = svgEl('g', {}, svg);
      const connectorLayer = svgEl('g', {}, svg);
      const labelLayer = svgEl('g', {}, svg);
      const zoneLayer = svgEl('g', {}, svg);
      function clearWaterfallHoverBands() { hoverLayer.querySelectorAll('.hover-band').forEach(node => node.classList.remove('active')); }
      steps.forEach((step, idx) => {
        const cx = xs[idx];
        const y1 = y(step.start);
        const y2 = y(step.end);
        const top = Math.min(y1, y2);
        const bottom = Math.max(y1, y2);
        const h = Math.max(2, bottom - top);
        const bandLeft = cx - slot / 2;
        const hoverBand = svgEl('rect', { x: bandLeft, y: margin.top, width: slot, height: chartH, class: 'hover-band' }, hoverLayer);
        svgEl('rect', { x: cx - barW / 2, y: top, width: barW, height: h, fill: step.color, rx: 0 }, barLayer);
        if (idx < steps.length - 1) {
          const nextCx = xs[idx + 1];
          svgEl('line', { x1: cx + barW / 2, y1: y(step.end), x2: nextCx - barW / 2, y2: y(step.end), stroke: 'var(--business-border-d7d7d7)', 'stroke-width': 1, 'stroke-dasharray': '3 3' }, connectorLayer);
        }
        labelWaterfall(labelLayer, cx, top, step.displayValue, record.yoy?.[step.item.key]);
        svgEl('text', { x: cx, y: height - 18, class: 'waterfall-x' }, labelLayer).textContent = step.label;
        const zone = svgEl('rect', { x: bandLeft, y: margin.top, width: slot, height: chartH, class: 'hover-zone', 'pointer-events': 'all' }, zoneLayer);
        const activate = () => {
          clearWaterfallHoverBands();
          hoverBand.classList.add('active');
          const liveRect = svg.getBoundingClientRect();
          const liveX = liveRect.left + (cx / width) * liveRect.width;
          const liveChartTopY = liveRect.top;
          showWaterfallTooltip(liveX, liveChartTopY, record, step);
        };
        bindHoverAndTouch(
          zone,
          activate,
          () => { hoverBand.classList.remove('active'); hideTooltip(); }
        );
      });
      svg.addEventListener('mouseleave', () => { clearWaterfallHoverBands(); hideTooltip(); });
      function labelWaterfall(parent, cx, top, value, yoy) {
        const labelY = Math.max(12, top - 22);
        svgEl('text', { x: cx, y: labelY, class: 'waterfall-label' }, parent).textContent = fmtB(value);
        if (yoy != null && Number.isFinite(Number(yoy))) {
          const text = fmtPct(yoy).replace('+', '');
          const w = Math.max(46, text.length * 7 + 12);
          const x = cx - w / 2;
          const badgeY = Math.max(16, top - 18);
          const fill = Number(yoy) >= 0 ? '#2dbd86' : '#f05b5b';
          svgEl('rect', { x, y: badgeY, width: w, height: 16, rx: 3, fill }, parent);
          svgEl('text', { x: cx, y: badgeY + 8, class: 'badge-text' }, parent).textContent = text;
        }
      }
    }

    function setupRangeDrag() {
      const startDrag = which => event => {
        state.dragging = which;
        event.currentTarget.setPointerCapture?.(event.pointerId);
        event.preventDefault();
      };
      els.leftHandle.addEventListener('pointerdown', startDrag('left'));
      els.rightHandle.addEventListener('pointerdown', startDrag('right'));
      els.rangeTrack.addEventListener('pointerdown', event => {
        if (event.target.closest('.range-handle')) return;
        const records = allTrendRecords();
        if (records.length <= 1) return;
        const idx = rangeIndexFromClientX(event.clientX, records.length);
        state.dragging = Math.abs(idx - state.start) <= Math.abs(idx - state.end) ? 'left' : 'right';
        updateRangeByIndex(idx);
        event.preventDefault();
      });
      window.addEventListener('pointermove', event => {
        if (!state.dragging) return;
        const records = allTrendRecords();
        if (records.length <= 1) return;
        updateRangeByIndex(rangeIndexFromClientX(event.clientX, records.length));
      });
      window.addEventListener('pointerup', () => { state.dragging = null; });
    }
    function render() {
      ensureRange();
      updateTabs();
      updateRangeUI();
      renderTrend();
      renderWaterfall();
    }
    initTabs();
    setupRangeDrag();
    document.addEventListener('pointerdown', event => {
      if (
        !event.target.closest('#trendStage') &&
        !event.target.closest('#waterfallSvg') &&
        !event.target.closest('#tooltip') &&
        !event.target.closest('#rangeShell')
      ) {
        hideTooltip();
      }
    });
    render();
    if ('ResizeObserver' in window) {
      new ResizeObserver(render).observe(els.trendStage);
    }
    window.addEventListener('resize', render);
  </script>
</body>
</html>
