.treemap-component{position:relative;width:100%;min-height:460px;padding:18px 22px 16px;background:transparent;overflow:visible}

ot;legend.visibility&quot;, &quot;default&quot;: true}], &quot;dataContract&quot;: [{&quot;field&quot;: &quot;items[].label&quot;, &quot;type&quot;: &quot;string&quot;, &quot;channel&quot;: &quot;treemap.rect.label&quot;}, {&quot;field&quot;: &quot;items[].value&quot;, &quot;type&quot;: &quot;number&quot;, &quot;channel&quot;: &quot;treemap.rect.area&quot;}, {&quot;field&quot;: &quot;items[].displayValue&quot;, &quot;type&quot;: &quot;string&quot;, &quot;channel&quot;: &quot;treemap.rect.valueLabel&quot;}, {&quot;field&quot;: &quot;items[].color&quot;, &quot;type&quot;: &quot;string&quot;, &quot;channel&quot;: &quot;treemap.rect.color&quot;}, {&quot;field&quot;: &quot;items[].children&quot;, &quot;type&quot;: &quot;array&quot;, &quot;channel&quot;: &quot;treemap.hierarchy.children&quot;}, {&quot;field&quot;: &quot;title&quot;, &quot;type&quot;: &quot;string&quot;, &quot;channel&quot;: &quot;text.title&quot;}, {&quot;field&quot;: &quot;subtitle&quot;, &quot;type&quot;: &quot;string&quot;, &quot;channel&quot;: &quot;text.subtitle&quot;}, {&quot;field&quot;: &quot;height&quot;, &quot;type&quot;: &quot;number&quot;, &quot;channel&quot;: &quot;layout.height&quot;}, {&quot;field&quot;: &quot;showLegend&quot;, &quot;type&quot;: &quot;boolean&quot;, &quot;channel&quot;: &quot;legend.visibility&quot;}], &quot;builtInDataSources&quot;: []}">

<script>
const config = {"items": [{"_id": "0", "label": "iPhone", "value": 209586.0, "displayValue": "209.59B (50.36%)", "color": "#8b5cf6", "colorEnd": "#6b7bff", "textColor": "#ffffff", "textShadow": "0 1px 2px rgba(15,23,42,.22)", "children": []}, {"_id": "1", "label": "Mac", "value": 33708.0, "displayValue": "33.71B (8.10%)", "color": "#e85b85", "colorEnd": "#ea6b91", "textColor": "#202633", "textShadow": "none", "children": []}, {"_id": "2", "label": "iPad", "value": 28023.0, "displayValue": "28.02B (6.73%)", "color": "#19b59f", "colorEnd": "#17a792", "textColor": "#202633", "textShadow": "none", "children": []}, {"_id": "3", "label": "可穿戴/家居/配件", "value": 35686.0, "displayValue": "35.69B (8.58%)", "color": "#ee9b24", "colorEnd": "#db8f21", "textColor": "#202633", "textShadow": "none", "children": []}, {"_id": "4", "label": "服务业务", "value": 109158.0, "displayValue": "109.16B (26.23%)", "color": "#74a82b", "colorEnd": "#82b140", "textColor": "#202633", "textShadow": "none", "children": []}], "title": "苹果公司各产品营收权重（矩形图）", "subtitle": "AAPL · FY 2025 · 截止 2025-09-27 · 单位：百万美元", "height": 460, "unit": "", "showLegend": true, "showValues": true, "minLabelArea": 2600.0, "_chartMarkup": {"version": 1, "chartScript": "treemap.py", "selectionMode": "user-specified", "effectiveMaxMarks": 1, "applied": [{"index": 0, "type": "item-style", "reason": "item color applied"}], "skipped": []}};
const root = document.querySelector('.treemap-component');
const stage = root.querySelector('.treemap-stage');
const legend = root.querySelector('.treemap-legend');
const tooltip = root.querySelector('.treemap-tooltip');
root.classList.toggle('hide-legend', !config.showLegend);

const totalValue = items => items.reduce((sum, item) => sum + Number(item.value || 0), 0);
const groupSplit = items => {
  const sorted = [...items].sort((a,b) => Number(b.value || 0) - Number(a.value || 0));
  const total = totalValue(sorted);
  const a = [];
  const b = [];
  let aSum = 0;
  sorted.forEach(item => {
    if (aSum <= total / 2 || b.length === 0) {
      a.push(item);
      aSum += Number(item.value || 0);
    } else {
      b.push(item);
    }
  });
  return [a, b.length ? b : a.splice(Math.ceil(a.length / 2))];
};
const layoutItems = (items, x, y, w, h, depth = 0, parentId = '') => {
  if (!items.length || w <= 0 || h <= 0) return [];
  if (items.length === 1) {
    const item = items[0];
    const rect = {item, x, y, w, h, depth, parentId};
    if (item.children && item.children.length && w * h > config.minLabelArea * 2.4 && h > 86) {
      const inset = 0;
      const headerH = Math.min(34, Math.max(30, h * .13));
      return [
        rect,
        ...layoutItems(
          item.children,
          x + inset,
          y + headerH,
          Math.max(0, w - inset * 2),
          Math.max(0, h - headerH - inset),
          depth + 1,
          item._id || ''
        ),
      ];
    }
    return [rect];
  }
  const [left, right] = groupSplit(items);
  const leftSum = totalValue(left);
  const rightSum = totalValue(right);
  const ratio = leftSum / Math.max(leftSum + rightSum, 1);
  if (w >= h) {
    const leftW = Math.round(w * ratio);
    return [
      ...layoutItems(left, x, y, leftW, h, depth, parentId),
      ...layoutItems(right, x + leftW, y, w - leftW, h, depth, parentId),
    ];
  }
  const topH = Math.round(h * ratio);
  return [
    ...layoutItems(left, x, y, w, topH, depth, parentId),
    ...layoutItems(right, x, y + topH, w, h - topH, depth, parentId),
  ];

function setChildDim(parentId, active) {
  if (!parentId) return;

function render() {
  stage.innerHTML = '';
  legend.innerHTML = '';
  const width = stage.clientWidth || 640;
  const height = stage.clientHeight || 280;
  const stagePad = 0;
  const gap = 0;
  layoutItems(config.items, stagePad, stagePad, width - stagePad * 2, height - stagePad * 2).forEach(rect => {
    const item = rect.item;
    const cell = document.createElement('div');
    const area = rect.w * rect.h;
    const inset = 0;
    const hasChildren = item.children && item.children.length;
    const renderedW = Math.max(0, rect.w - inset);
    const renderedH = Math.max(0, rect.h - inset);
    const labelMode = getLabelMode(renderedW, renderedH, area, hasChildren);
    cell.className = `treemap-cell ${hasChildren ? 'has-children' : ''} ${labelMode}`;
    cell.dataset.itemId = item._id || '';
    cell.dataset.parentId = rect.parentId || '';
    cell.style.left = `${rect.x + inset / 2}px`;
    cell.style.top = `${rect.y + inset / 2}px`;
    cell.style.width = `${renderedW}px`;
    cell.style.height = `${renderedH}px`;
    cell.style.background = `linear-gradient(135deg, ${item.color} 0%, ${item.colorEnd || item.color} 100%)`;
    cell.style.setProperty('--treemap-text-color', item.textColor || '#fff');
    cell.style.setProperty('--treemap-text-shadow', item.textShadow || 'none');
    cell.innerHTML = `<div class="treemap-label">${item.label}</div>${config.showValues ? `<div class="treemap-value">${item.displayValue}</div>` : ''}`;
    cell.addEventListener('mouseenter', event => {
      if (hasChildren) setChildDim(item._id, true);
      showTooltip(event, item);
    });
    cell.addEventListener('mousemove', event => showTooltip(event, item));
    cell.addEventListener('mouseleave', () => {
      if (hasChildren) setChildDim(item._id, false);
      hideTooltip();
    });
    stage.appendChild(cell);
  });
  if (config.showLegend) {
    config.items.forEach(item => {
      const node = document.createElement('div');
      node.className = 'legend-item';
      node.innerHTML = `<i class="legend-dot" style="background:${item.color}"></i><span class="legend-label">${item.label}</span>`;
      legend.appendChild(node);
    });
  }
}
function getLabelMode(width, height, area, hasChildren) {
  if (area < config.minLabelArea || width < 42 || height < 24) return 'is-small';
  if (hasChildren) {
    if (width < 74 || height < 30) return 'is-small';
    if (width < 112 || height < 42) return 'label-compact label-name-only';
    return 'label-name-only';
  }
  if (height < 38 || width < 70) return config.showValues ? 'label-compact label-value-only' : 'is-small';
  if (height < 54 || width < 112) return 'label-compact label-name-only';
  if (height < 66 || width < 136) return 'label-compact';
  return '';
}
function showTooltip(event, item) {
  tooltip.innerHTML = `<div class="tooltip-title"><i class="tooltip-dot" style="background:${item.color}"></i>${item.label}</div><div class="tooltip-value">${item.displayValue}</div>`;
  tooltip.classList.add('active');
  const rootRect = root.getBoundingClientRect();
  const x = event.clientX - rootRect.left + 14;
  const y = event.clientY - rootRect.top + 14;
  const left = Math.min(root.clientWidth - tooltip.offsetWidth - 8, Math.max(8, x));
  const top = Math.min(root.clientHeight - tooltip.offsetHeight - 8, Math.max(8, y));
  tooltip.style.left = `${left}px`;
  tooltip.style.top = `${top}px`;
}
function hideTooltip() {
  tooltip.classList.remove('active');
}
window.addEventListener('resize', render);
render();
</script>

    tip.style.left=left+'px';tip.style.setProperty('--arrow-left',Math.max(14,Math.min(width-14,anchor-left))+'px');
    if(placement.outer){
      const {portal,host,left:originX,top:originY,width:w,height:h}=placement.outer;
      let px=originX+anchor-w/2,py=originY+parseFloat(tip.style.top||'0');
      if(!active.matches('.hit-area')){
        if(active.matches('.treemap-cell')){px=originX+anchor+14;py=event.clientY+14;}
        else{const side=anchor<viewport/2?'right':'left';portal.dataset.side=side;px=side==='right'?originX+anchor+14:originX+anchor-w-14;py=event.clientY-h/2;}
      }
      px=Math.max(8,Math.min(host.innerWidth-w-8,px));py=Math.max(8,Math.min(host.innerHeight-h-8,py));
      portal.style.left=px+'px';portal.style.top=py+'px';portal.style.setProperty('--local-tip-arrow-x',Math.max(14,Math.min(w-14,originX+anchor-px))+'px');
    }
  };
  const direction = (state,x,y) => {
    if(state.direction==='pending'){
      const dx=Math.abs(x-state.x),dy=Math.abs(y-state.y);
      if(Math.max(dx,dy)>6)state.direction=dx>=dy?'horizontal':'vertical';
    }
    return state.direction;
  };
  const selectCanvas = event => {
    const dom=event.target?.closest?.('#chart')||event.target?.closest?.('canvas')?.parentElement?.closest('#chart');
    const instance=dom&&window.echarts?.getInstanceByDom(dom);
    if(!instance)return false;
    const now=performance.now();
    if(!canvasState||canvasState.instance!==instance){
      clear(event);
      canvasState={instance,dom,updated:-Infinity,selected:null};
    }
    const state=canvasState;
    if(now-state.updated>160){state.option=instance.getOption();state.rect=dom.getBoundingClientRect();state.updated=now;}
    const option=state.option,tooltipOption=option.tooltip?.[0];
    // Respect components which intentionally have no tooltip (dynamic line).
    if(tooltipOption?.show===false){canvasState=null;return false;}
    const x=(event.clientX-state.rect.left)*instance.getWidth()/state.rect.width;
    const y=(event.clientY-state.rect.top)*instance.getHeight()/state.rect.height;
    if(!instance.containPixel({gridIndex:0},[x,y]))return false;
    let nearest=null,distance=Infinity;
    (option.series||[]).forEach((series,seriesIndex)=>{
      if(!Array.isArray(series.data))return;
      if(series.type==='bar'){
        const category=instance.convertFromPixel({seriesIndex},[x,y]);
        const categoryAxis=option.yAxis?.[0]?.type==='category'?1:0;
        const index=Math.round(Array.isArray(category)?category[categoryAxis]:category);
        if(index>=0&&index<series.data.length)nearest={seriesIndex,dataIndex:index};
      }else if(series.type==='scatter'||series.type==='line'){
        series.data.forEach((item,dataIndex)=>{
          const value=item?.value??item,point=instance.convertToPixel({seriesIndex},Array.isArray(value)?value.slice(0,2):[dataIndex,value]);
          if(!Array.isArray(point)||!point.every(Number.isFinite))return;
          const d=(point[0]-x)**2+(point[1]-y)**2;
          if(d<distance){distance=d;nearest={seriesIndex,dataIndex};}
        });
      }
    });
    if(!nearest)return false;
    const key=nearest.seriesIndex+':'+nearest.dataIndex;
    if(state.selected!==key){instance.dispatchAction({type:'downplay'});instance.dispatchAction({type:'highlight',...nearest});state.selected=key;}
    if(state.contentKey!==key||state.contentAt!==state.updated){
      instance.dispatchAction({type:'showTip',...nearest,position:[x,y]});state.contentKey=key;state.contentAt=state.updated;
    }
    const tip=dom.querySelector('.generic-canvas-tooltip');
    if(tip){
      if(!state.outer||state.content!==tip.innerHTML){state.outer=showLocalPortal(tip,state.rect);state.content=tip.innerHTML;}
      tip.style.setProperty('visibility','hidden','important');
      if(state.outer){
        const {portal,host,left:originX,top:originY,width:w,height:h}=state.outer;
        portal.style.left=Math.max(8,Math.min(host.innerWidth-w-8,originX+x-w/2))+'px';
        portal.style.top=Math.max(8,Math.min(host.innerHeight-h-8,originY+y-h-14))+'px';
      }
    }
    return true;
  };

  const select = event => {
    if(selectCanvas(event))return;
    const target=document.elementFromPoint(event.clientX,event.clientY)?.closest(hits)||event.target?.closest(hits)||null;
    if(target!==active){clear(event);active=target;emit(active,'mouseenter',event);}
    // Keep the data DOM stable within one datum; only move the floating layer.
    followTooltip(event);
  };
  document.addEventListener('pointerdown',event=>{
    if(event.pointerType==='touch')clear(event);
    if(event.pointerType!=='touch'||event.target.closest?.('.markmap,.range-shell,button,input'))return;
    if(!event.target.closest?.('svg,canvas,.treemap-cell,#chart'))return;
    gesture={id:event.pointerId,x:event.clientX,y:event.clientY,direction:'pending'};
    select(event);
  },{capture:true,passive:true});
  document.addEventListener('pointermove',event=>{
    if(!gesture||event.pointerId!==gesture.id)return;
    const mode=direction(gesture,event.clientX,event.clientY);
    if(mode==='vertical'){clear(event);event.stopImmediatePropagation();return;
    }
    if(mode==='horizontal'){select(event);if(canvasState)event.stopImmediatePropagation();}
  },{capture:true,passive:true});
  document.addEventListener('pointerup',event=>{
    if(!gesture||event.pointerId!==gesture.id)return;
    if(gesture.direction!=='vertical')select(event);
    gesture=null;
    dismissTimer=setTimeout(dismiss,1200);
  },{passive:true});
  document.addEventListener('pointercancel',event=>{gesture=null;clear(event);},{passive:true});
  // Track the touch stream independently: pointercancel happens when the
  // browser starts scrolling, before legacy touchmove listeners finish.
  document.addEventListener('touchstart',event=>{
    if(event.touches.length!==1||event.target.closest?.('.markmap,.range-shell,input,textarea,select')){touchOrigin=null;return;}
    const t=event.touches[0];touchOrigin={x:t.clientX,y:t.clientY,direction:'pending'};
  },{capture:true,passive:true});
  document.addEventListener('touchmove',event=>{
    if(!touchOrigin||event.touches.length!==1)return;
    const t=event.touches[0],mode=direction(touchOrigin,t.clientX,t.clientY);
    if(mode==='vertical')event.stopImmediatePropagation();
    else if(mode==='horizontal'){select({clientX:t.clientX,clientY:t.clientY,target:event.target});if(canvasState)event.stopImmediatePropagation();}
  },{capture:true,passive:true});
  for(const type of ['touchend','touchcancel'])document.addEventListener(type,()=>{touchOrigin=null;},{passive:true});
  for(const type of ['mouseover','mouseenter','mousemove'])document.addEventListener(type,event=>{
    if(event.sourceCapabilities?.firesTouchEvents){event.stopImmediatePropagation();return;}
    if(event.target.closest?.(hits))nativeHovered=true;
  },{capture:true,passive:true});
  document.addEventListener('click',event=>{
    if(canvasState&&event.sourceCapabilities?.firesTouchEvents&&event.target.closest?.('#chart'))event.stopImmediatePropagation();
  },{capture:true,passive:true});
  let host=window;
  try {
    while(host){
      for(const type of ['scroll','resize','pagehide','veya:chat-navigate'])host.addEventListener(type,dismiss,{capture:true,passive:true});
      if(host!==window)host.document.addEventListener('pointerdown',dismiss,{capture:true,passive:true});
      const doc=host.document;doc.addEventListener('visibilitychange',()=>{if(doc.hidden)dismiss();},{passive:true});
      if(host===host.parent)break;host=host.parent;
    }
  } catch (_) {}
})();
</script>

</body>
</html>
