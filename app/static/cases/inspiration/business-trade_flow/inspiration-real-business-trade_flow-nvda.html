<style>

:root[data-theme="dark"]{color-scheme:dark;--business-text-171717:#e8edf5;--business-text-697181:#a8b3c4;--business-text-404040:#e8edf5;--business-bg-f1f1f1:#202b3a;--business-bg-666:#263242;--business-bg-fff:#202b3a;--business-bg-9b9b9b:#516078;--business-border-ececec:#293646;--business-text-8a8a8a:#a8b3c4;--business-text-5f6267:#a8b3c4;--business-bg-303030:#263242;--business-text-f2f2f2:#f5f7fb;--business-text-fff:#f5f7fb;--business-text-d8d8d8:#a8b3c4;--business-border-ddd:#293646;--business-border-9b9b9b:#566477;--business-border-303030:#566477;}

*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--business-text-171717);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{padding:0}
.wrap{
  width:100%;
  margin:0;
  background:transparent;
  padding:0;
}
.title{
  margin:0 0 18px;
  font-size:16px;
  line-height:1.2;
  font-weight:800;
  letter-spacing:0;
  color:var(--business-text-171717);
}
.grid{
  display:grid;
  grid-template-columns:minmax(420px,1fr) minmax(480px,1fr);
  gap:32px;
  align-items:start;
}
.section-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  margin-bottom:14px;
}
h2{font-size:14px;line-height:1.2;margin:0;font-weight:800;color:var(--business-text-171717)}
.currency{font-size:12px;line-height:1.2;color:var(--business-text-697181);white-space:nowrap}
.flow-left{
  display:grid;
  grid-template-columns:260px minmax(0,1fr);
  gap:24px;
  align-items:center;
  min-height:260px;
}
.donut{width:260px;height:230px}
.flow-summary{font-size:12px;color:var(--business-text-171717)}
.totals{display:flex;gap:22px;align-items:center;margin-bottom:16px;white-space:nowrap;font-size:12px;color:var(--business-text-697181)}
.green{color:#09a866}
.red{color:#ff392a}
.bars{
  display:grid;
  grid-template-columns:76px minmax(88px,1fr) 28px minmax(88px,1fr) 76px;
  column-gap:10px;
  row-gap:12px;
  align-items:center;
}
.bar-value{
  font-size:12px;
  color:var(--business-text-171717);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.in-value{text-align:right}
.out-value{text-align:left}
.size-label{
  font-size:12px;
  font-weight:700;
  text-align:center;
  color:var(--business-text-171717);
  min-width:24px;
}
.flowbar{
  height:8px;
  background:transparent;
  position:relative;
  overflow:visible;
}
.flowbar span{
  display:block;
  height:100%;
  min-width:3px;
  border-radius:0;
}
.in{display:flex;justify-content:flex-end}
.out{display:flex;justify-content:flex-start}
.in span{background:var(--flow-color,#09a866)}
.out span{background:var(--flow-color,#ff392a)}
.tracker-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:14px}
.legend{display:flex;align-items:center;gap:14px;color:var(--business-text-697181);font-size:12px;line-height:1.2;flex-wrap:wrap;margin-top:8px}
.chart-legend{justify-content:center;margin:10px 0 0}
.legend-item{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.tabs{display:inline-flex;align-items:center;gap:8px;padding:0;color:var(--business-text-171717);flex:none;white-space:nowrap}
.tab{
  appearance:none;
  border:0;
  background:transparent;
  color:var(--business-text-404040);
  font:inherit;
  font-size:14px;
  font-weight:400;
  line-height:1;
  cursor:pointer;
  white-space:nowrap;
  border-radius:10px;
  transition:background-color .14s ease,color .14s ease;
  min-width:58px;
  height:36px;
  padding:0 13px;
}
.tab.active{background:var(--business-bg-f1f1f1);color:var(--business-text-171717);font-weight:700;box-shadow:none}
.tab:focus-visible{outline:2px solid #4387f5;outline-offset:2px}
.chart{position:relative;height:260px;overflow:visible;margin-top:2px}
svg{display:block;width:100%;height:100%;overflow:visible}
.time-range-shell{
  --handle-size:28px;
  height:var(--handle-size);
  margin:8px 0 2px;
  padding:0 calc(var(--handle-size) / 2);
  position:relative;
  touch-action:none;
}
.time-range-track{position:relative;width:100%;height:var(--handle-size)}
.time-range-track::before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:calc(var(--handle-size) / 2);
  height:3px;
  background:var(--business-bg-f1f1f1);
  border-radius:999px;
  transform:translateY(-50%);
}
.time-range-selection{
  position:absolute;
  top:calc(var(--handle-size) / 2);
  height:3px;
  background:var(--business-bg-666);
  border-radius:999px;
  transform:translateY(-50%);
}
.time-range-handle{
  appearance:none;
  position:absolute;
  top:calc(var(--handle-size) / 2);
  width:var(--handle-size);
  height:var(--handle-size);
  border-radius:50%;
  border:1px solid var(--business-border-ddd);
  background:var(--business-bg-fff);
  box-shadow:0 1px 5px rgba(0,0,0,.14);
  display:grid;
  place-items:center;
  cursor:ew-resize;
  transform:translate(-50%,-50%);
  padding:0;
}
.time-range-handle::before{
  content:"";
  display:block;
  width:2px;
  height:11px;
  background:var(--business-bg-9b9b9b);
  border-radius:2px;
  box-shadow:5px 0 0 var(--business-border-9b9b9b),-5px 0 0 #9b9b9b;
}
.grid-line{stroke:var(--business-border-ececec);stroke-width:1}
.hover-band{fill:var(--business-text-8a8a8a);fill-opacity:.08;opacity:0;transition:opacity .12s ease;pointer-events:none}
.hover-band.active{opacity:1}
.hover-zone{fill:rgba(0,0,0,.001);pointer-events:all;cursor:pointer}
.axis{fill:var(--business-text-5f6267);font-size:10px;font-weight:400}
.tooltip{
  --arrow-x:50%;
  position:fixed;
  pointer-events:none;
  z-index:50;
  min-width:190px;
  border-radius:6px;
  background:var(--business-bg-303030);
  color:var(--business-text-f2f2f2);
  padding:9px 11px;
  font-size:12px;
  line-height:1.45;
  opacity:0;
  transition:opacity .08s ease;
  white-space:nowrap;
}
.tooltip::after{
  content:"";
  position:absolute;
  left:var(--arrow-x);
  bottom:-6px;
  width:0;
  height:0;
  transform:translateX(-50%);
  border-left:6px solid transparent;
  border-right:6px solid transparent;
  border-top:6px solid var(--business-bg-303030);
}
.tooltip.show{opacity:1}
.tip-title{color:var(--business-text-fff);font-weight:800;margin-bottom:5px}
.tip-row{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:4px;min-width:168px}
.tip-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.tip-label{color:var(--business-text-d8d8d8);font-size:12px;line-height:1.2}
.tip-value{margin-left:auto;color:var(--business-text-fff);font-size:12px;font-weight:700;line-height:1.2}
@media(max-width:1280px){
  .wrap{padding:0}
  .title{font-size:16px;margin-bottom:16px}
  .grid{display:block}
  .section-head{margin-bottom:12px}
  .flow-left{grid-template-columns:minmax(260px,360px) minmax(360px,1fr);gap:18px;min-height:0;align-items:center}
  .donut{width:100%;height:250px}
  .totals{justify-content:center;flex-wrap:wrap;gap:18px;margin-bottom:14px}
  .bars{grid-template-columns:68px minmax(72px,1fr) 24px minmax(72px,1fr) 68px;column-gap:8px}
  .bar-value,.size-label{font-size:11px}
  .tracker-head{display:block;margin-top:22px}
  .tabs{width:max-content;max-width:100%;overflow:auto;margin-top:14px}
  .chart{height:280px;margin-top:14px}
  .axis{font-size:10px}
}
@media(max-width:760px){
  .flow-left{grid-template-columns:1fr;gap:12px}
  .donut{height:240px}
}
</style>

    if (Math.abs(targetTs - before) <= Math.abs(after - targetTs)) return low - 1;
  }
  return low;
}
function bindTimeRange() {
  const track = document.getElementById('timeRangeTrack');
  const leftHandle = document.getElementById('timeRangeLeft');
  const rightHandle = document.getElementById('timeRangeRight');
  if (!track || !leftHandle || !rightHandle) return;

  const startDrag = (which, event) => {
    draggingRange = which;
    event.preventDefault();
    event.currentTarget.setPointerCapture?.(event.pointerId);
  };

  leftHandle.addEventListener('pointerdown', event => startDrag('left', event));
  rightHandle.addEventListener('pointerdown', event => startDrag('right', event));

  track.addEventListener('pointerdown', event => {
    if (event.target.closest('.time-range-handle')) return;
    const state = ensureRangeState(active);
    const idx = timeRangeIndexFromClientX(event.clientX);
    if (Math.abs(idx - state.start) <= Math.abs(idx - state.end)) {
      state.start = Math.min(idx, state.end);
    } else {
      state.end = Math.max(idx, state.start);
    }
    renderChartSvg();
    updateTimeRangeUI();
  });
}
function drawChart(){
  const rawRows=payload.views?.[active] || [];
  if(!rawRows.length) return `<div class="chart">${esc(t('noTrackerData'))}</div>`;

  return `<div class="chart"><svg id="chartSvg" role="img"></svg></div>
  <div class="time-range-shell" id="timeRangeShell">
    <div class="time-range-track" id="timeRangeTrack">
      <div class="time-range-selection" id="timeRangeSelection"></div>
      <button class="time-range-handle" id="timeRangeLeft" aria-label="${esc(t('timeRangeStart'))}"></button>
      <button class="time-range-handle" id="timeRangeRight" aria-label="${esc(t('timeRangeEnd'))}"></button>
    </div>
  </div>`;
}

function renderChartSvg(){
  const svg = document.getElementById('chartSvg');
  if(!svg) return;

  const rawRows=currentRows();
  const rows=rawRows.map(r=>({...r}));
  if(!rows.length) return;

  const wrap = svg.closest('.chart');
  const W=Math.max(360, Math.round(wrap.clientWidth || 680));
  const H=Math.max(220, Math.round(wrap.clientHeight || 260));
  const p={l:0,r:78,t:16,b:36};
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = '';

  const flows=rows.map(r=>Number(r.netFlow||0)).filter(Number.isFinite);
  let minF=Math.min(...flows,0), maxF=Math.max(...flows,0);
  if(minF===maxF){minF-=1;maxF+=1}
  const flowPad=Math.max(1,(maxF-minF)*0.08);
  minF-=flowPad;
  maxF+=flowPad;

  const prices=rows.map(r=>numericOrNull(r.price)).filter(v=>v !== null);
  let minP=Math.min(...prices), maxP=Math.max(...prices);
  if(!Number.isFinite(minP)||minP===maxP){minP=0;maxP=1}

  const chartW = Math.max(1, W - p.l - p.r);
  const chartH = Math.max(1, H - p.t - p.b);
  const startTs = Number(rows[0]?.timestamp);
  const endTs = Number(rows[rows.length - 1]?.timestamp);
  const timeSpan = Math.max(1, endTs - startTs);
  const xForTimestamp = ts => p.l + (Number(ts) - startTs) / timeSpan * chartW;
  const x = i => xForTimestamp(rows[i]?.timestamp);
  const yF=v=>p.t+(maxF-v)/(maxF-minF)*chartH;
  const yP=v=>p.t+(maxP-v)/(maxP-minP)*chartH;

  const ns='http://www.w3.org/2000/svg';
  const el=(name,attrs={},parent=svg)=>{
    const node=document.createElementNS(ns,name);
    Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,v));
    parent.appendChild(node);
    return node;
  };

  const gridLayer=el('g');
  const hoverLayer=el('g');
  const lineLayer=el('g');
  const labelLayer=el('g');
  const zoneLayer=el('g');

  const ticks=[maxF,(maxF+minF)/2,minF];
  ticks.forEach(t=>{
    const yy=yF(t);
    el('line',{class:'grid-line',x1:p.l,y1:yy,x2:W-p.r,y2:yy},gridLayer);
    el('text',{class:'axis',x:W-p.r+10,y:yy+4,'text-anchor':'start'},gridLayer).textContent=compact(t);
  });

  function linePath(field, yScale) {
    let d = '';
    let started = false;
    rows.forEach((r, i) => {
      const value = numericOrNull(r[field]);
      if (value === null) {
        started = false;
        return;
      }
      d += `${started ? 'L' : 'M'}${x(i).toFixed(2)},${yScale(value).toFixed(2)}`;
      started = true;
    });
    return d;
  }

  const pricePath=linePath('price', yP);
  if(pricePath) el('path',{d:pricePath,fill:'none',stroke:colors.blue,'stroke-width':2.3,'stroke-linecap':'round','stroke-linejoin':'round'},lineLayer);

  for(let i=1;i<rows.length;i++){
    const prev=Number(rows[i-1].netFlow||0);
    const next=Number(rows[i].netFlow||0);
    if(!Number.isFinite(prev)||!Number.isFinite(next)) continue;
    el('path',{
      d:`M${x(i-1).toFixed(2)},${yF(prev).toFixed(2)}H${x(i).toFixed(2)}V${yF(next).toFixed(2)}`,
      fill:'none',
      stroke:next >= 0 ? colors.green : colors.red,
      'stroke-width':2.2,
      'stroke-linecap':'round',
      'stroke-linejoin':'round'
    },lineLayer);
  }

  const labelTimes=[startTs, startTs + timeSpan / 2, endTs];
  labelTimes.forEach((timestamp, idx)=>{
    el('text',{
      class:'axis',
      x:xForTimestamp(timestamp),
      y:H-8,
      'text-anchor':idx===0?'start':idx===labelTimes.length-1?'end':'middle'
    },labelLayer).textContent=fmtTime(timestamp);
  });

  rows.forEach((row,index)=>{
    const cx=x(index);
    const left=index===0?p.l:xForTimestamp((Number(rows[index-1].timestamp)+Number(row.timestamp))/2);
    const right=index===rows.length-1?W-p.r:xForTimestamp((Number(row.timestamp)+Number(rows[index+1].timestamp))/2);
    const band=el('rect',{class:'hover-band',x:left,y:p.t,width:Math.max(1,right-left),height:chartH},hoverLayer);
    const zone=el('rect',{class:'hover-zone',x:left,y:p.t,width:Math.max(1,right-left),height:chartH},zoneLayer);

    const activate=event=>{
      hoverLayer.querySelectorAll('.hover-band').forEach(n=>n.classList.remove('active'));
      band.classList.add('active');
      showChartTooltip(event.clientX, row);
    };

    zone.addEventListener('pointerenter',activate);
    zone.addEventListener('pointermove',activate);
    zone.addEventListener('pointerleave',()=>{
      band.classList.remove('active');
      document.getElementById('tooltip').classList.remove('show');
    });
  });
}
function setTooltipPosition(tip, clientX, chartTopY) {
  const margin = 10;
  const gap = 16;
  const box = tip.getBoundingClientRect();
  const width = box.width || 210;
  const height = box.height || 110;
  const left = Math.max(margin, Math.min(window.innerWidth - margin - width, clientX - width / 2));
  const top = Math.max(margin, chartTopY - height - gap);
  const arrowX = Math.max(12, Math.min(width - 12, clientX - left));
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
  tip.style.setProperty('--arrow-x', arrowX + 'px');
}
function showChartTooltip(clientX, r){
  const tip=document.getElementById('tooltip');
  const chart=document.getElementById('chartSvg')?.closest('.chart');
  const topY=chart ? chart.getBoundingClientRect().top : 0;
  tip.innerHTML=`
    <div class="tip-title">${fmtTime(r.timestamp)}</div>
    <div class="tip-row"><span class="tip-dot" style="background:${colors.green}"></span><span class="tip-label">${esc(t('inflow'))}</span><span class="tip-value">${compact(r.inflow)}</span></div>
    <div class="tip-row"><span class="tip-dot" style="background:${colors.red}"></span><span class="tip-label">${esc(t('outflow'))}</span><span class="tip-value">${compact(r.outflow)}</span></div>
    <div class="tip-row"><span class="tip-dot" style="background:${Number(r.netFlow || 0) >= 0 ? colors.green : colors.red}"></span><span class="tip-label">${esc(t('netFlow'))}</span><span class="tip-value">${compact(r.netFlow)}</span></div>
    <div class="tip-row"><span class="tip-dot" style="background:${colors.blue}"></span><span class="tip-label">${esc(t('stockPrice'))}</span><span class="tip-value">${numericOrNull(r.price) !== null ? numericOrNull(r.price).toFixed(2) : '--'}</span></div>`;
  tip.classList.add('show');
  setTooltipPosition(tip, clientX, topY);
}
function bindTooltip(){
  renderChartSvg();
  bindTimeRange();
  updateTimeRangeUI();
}
function render(){
  const tabLabel = key => key === 'XL' ? t('extraLarge') : key === 'L' ? t('large') : t('overall');
  const tabs=Object.keys(payload.views||{}).map(k=>`<button class="tab ${k===active?'active':''}" type="button" data-view="${k}">${esc(tabLabel(k))}</button>`).join('');
  document.getElementById('app').innerHTML=`
    <h1 class="title">${esc(payload.title||t('componentName'))}</h1>
    <section class="grid">
      <div>
        <div class="section-head">
          <h2>${esc(t('orderFlowDistribution'))}</h2>
          <span class="currency">${esc(t('currency'))}: ${esc(payload.currency||'USD')}</span>
        </div>
        ${renderDistribution()}
      </div>
      <div>
        <div class="tracker-head">
          <div>
            <h2>${esc(t('orderFlowTracker'))}</h2>
          </div>
          <nav class="tabs">${tabs}</nav>
        </div>
        ${drawChart()}
        <div class="legend chart-legend">
          <span class="legend-item"><i class="dot" style="background:${colors.green}"></i>${esc(t('netInflow'))}</span>
          <span class="legend-item"><i class="dot" style="background:${colors.red}"></i>${esc(t('netOutflow'))}</span>
          <span class="legend-item"><i class="dot" style="background:${colors.blue}"></i>${esc(t('stockPrice'))}</span>
        </div>
      </div>
    </section>`;
  document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{active=btn.dataset.view; render();}));
  bindTooltip();
}
window.addEventListener('pointermove', event => {
  if (!draggingRange) return;
  const state = ensureRangeState(active);
  const idx = timeRangeIndexFromClientX(event.clientX);
  if (draggingRange === 'left') state.start = Math.min(idx, state.end);
  if (draggingRange === 'right') state.end = Math.max(idx, state.start);
  renderChartSvg();
  updateTimeRangeUI();
});
window.addEventListener('pointerup', () => {
  draggingRange = null;
});
window.addEventListener('resize', () => window.requestAnimationFrame(() => {
  renderChartSvg();
  updateTimeRangeUI();
}));
render();

</script>
