          linePoints.push({ x: cx, y, value: record[line.key] });

            svgEl('text', { x: cx, y: Math.max(12, y - 9), class: 'line-label' }, labelLayer).textContent = fmtPct(record[line.key]);
          }
        }
        if (canShowAllX || sampledX.has(index)) {
          svgEl('text', { x: cx, y: height - 10, 'text-anchor': 'middle', class: 'x-label' }, labelLayer).textContent = record.label;
        }
        const zone = svgEl('rect', { x: bandLeft, y: margin.top, width: xStep, height: chartH, class: 'hover-zone' }, zoneLayer);
        const activate = () => {
          clearBands();
          hoverBand.classList.add('active');
          const rect = els.chart.getBoundingClientRect();
          const pointY = line && record[line.key] != null ? ratioY(record[line.key]) : margin.top;
          showTooltip(rect.left + (cx / width) * rect.width, rect.top + (pointY / height) * rect.height, record);
        };
        zone.addEventListener('pointerenter', activate);
        zone.addEventListener('pointermove', activate);
        zone.addEventListener('pointerleave', () => { hoverBand.classList.remove('active'); hideTooltip(); });
      });
      if (linePoints.length) {
        const d = linePoints.map((point, idx) => `${idx ? 'L' : 'M'}${point.x},${point.y}`).join('');
        svgEl('path', { d, fill: 'none', stroke: line.color, 'stroke-width': 2.2 }, lineLayer);
        linePoints.forEach(point => svgEl('circle', { cx: point.x, cy: point.y, r: 4.5, fill: line.color }, lineLayer));
      }
      updateRangeUI();
    }
    function bindRange() {
      function startDrag(which, event) {
        state.dragging = which;
        event.preventDefault();
        event.currentTarget.setPointerCapture?.(event.pointerId);
      }
      els.leftHandle.addEventListener('pointerdown', event => startDrag('left', event));
      els.rightHandle.addEventListener('pointerdown', event => startDrag('right', event));
      window.addEventListener('pointermove', event => {
        if (!state.dragging) return;
        const idx = rangeIndexFromClientX(event.clientX);
        if (state.dragging === 'left') state.start = Math.min(idx, state.end);
        if (state.dragging === 'right') state.end = Math.max(idx, state.start);
        render();
      });
      window.addEventListener('pointerup', () => { state.dragging = null; });
      window.addEventListener('pointercancel', () => { state.dragging = null; hideTooltip(); });
      els.rangeTrack.addEventListener('pointerdown', event => {
        if (event.target.closest('.range-handle')) return;
        const idx = rangeIndexFromClientX(event.clientX);
        if (Math.abs(idx - state.start) <= Math.abs(idx - state.end)) state.start = Math.min(idx, state.end);
        else state.end = Math.max(idx, state.start);
        render();
      });
    }
    initLegend();
    bindRange();
    render();
    window.addEventListener('resize', () => window.requestAnimationFrame(render));
  </script>
