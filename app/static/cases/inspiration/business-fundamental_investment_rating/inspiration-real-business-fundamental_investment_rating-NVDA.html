<!doctype html>
<html lang="zh-CN" data-theme="light" data-business-ui="neutral-v1">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NVDA基本面五维评分：增长强估值弱</title>
<style>:root{--business-border-eef1f4:#eef1f4;--business-border-e1e6eb:#e1e6eb;}:root[data-theme="dark"]{--business-border-eef1f4:#293646;--business-border-e1e6eb:#293646;}

:root{color-scheme:light;--business-bg-ffffff:#ffffff;--business-text-151820:#151820;--business-text-747b86:#747b86;--business-border-e7ebef:#e7ebef;--business-border-d8dde3:#d8dde3;--business-border-b7bec8:#b7bec8;--business-text-11151c:#11151c;--business-text-2f3540:#2f3540;--business-border-c7ced6:#c7ced6;--business-text-1d232c:#1d232c;}
:root[data-theme="dark"]{color-scheme:dark;--business-bg-ffffff:#202b3a;--business-text-151820:#e8edf5;--business-text-747b86:#a8b3c4;--business-border-e7ebef:#293646;--business-border-d8dde3:#293646;--business-border-b7bec8:#566477;--business-text-11151c:#e8edf5;--business-text-2f3540:#e8edf5;--business-border-c7ced6:#293646;--business-text-1d232c:#e8edf5;}

* { box-sizing:border-box; }
:root {
  --bg:var(--business-bg-ffffff);
  --text:var(--business-text-151820);
  --muted:var(--business-text-747b86);
  --line:var(--business-border-e7ebef);
  --grid:var(--business-border-d8dde3);
  --axis:var(--business-border-b7bec8);
  --accent:#ff8a18;
  --accent-fill:rgba(255,138,24,.22);
  --good:#119c63;
  --risk:#ff6b2b;
}
body {
  margin:0;
  background:transparent;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
.module {
  width:100%;
  max-width:none;
  margin:0;
  min-height:0;
  padding:0;
  background:transparent;
}
.header {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  margin-bottom:4px;
}
.title {
  margin:0;
  color:var(--business-text-11151c);
  font-size:16px;
  line-height:1.22;
  font-weight:780;
  letter-spacing:0;
}
.summary {
  display:flex;
  align-items:center;
  gap:18px;
  color:var(--business-text-11151c);
  white-space:nowrap;
}
.score {
  display:flex;
  align-items:baseline;
  gap:6px;
  font-weight:780;
}
.score strong { font-size:23px; }
.score span { color:var(--muted); font-size:13px; font-weight:680; }
.rating {
  color:var(--muted);
  font-size:13px;
  line-height:1.25;
  font-weight:700;
}
.radar-wrap {
  width:min(420px, 88vw);
  margin:4px auto 18px;
  aspect-ratio:1/1;
}
.radar {
  width:100%;
  height:100%;
  display:block;
  overflow:visible;
}
.sections {
  position:relative;
  padding-top:22px;
}
.sections::before {
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:1px;
  background:var(--line);
}
.section-title {
  margin:0 0 12px;
  color:var(--business-text-151820);
  font-size:15px;
  line-height:1.2;
  font-weight:800;
  letter-spacing:0;
}
.signal-list {
  display:flex;
  flex-direction:column;
  gap:10px;
}
.signal-row {
  display:grid;
  grid-template-columns:10px minmax(0,1fr);
  gap:10px;
  align-items:flex-start;
  color:var(--business-text-2f3540);
  font-size:13px;
  line-height:1.45;
  font-weight:600;
}
.signal-dot {
  width:8px;
  height:8px;
  margin-top:6px;
  border-radius:50%;
  display:block;
  background:var(--good);
}
.signal-dot.risk { background:var(--risk); }
.empty-hint {
  color:var(--muted);
  font-size:13px;
  font-weight:600;
}
@media (max-width: 720px) {
  .module { padding:0; }
  .header { flex-direction:column; gap:8px; }
  .title { font-size:16px; }
  .summary { gap:14px; }
  .score strong { font-size:22px; }
  .radar-wrap { width:min(340px, 92vw); margin-top:8px; margin-bottom:16px; }
  .sections { padding-top:18px; }
}
.module{width:100%;max-width:none;min-height:0}.header{align-items:center;flex-wrap:wrap;gap:8px 16px}.header>.title,.header>div:first-child:not(.summary){flex:1;min-width:0}.summary{display:flex;align-items:baseline;gap:12px;flex:none}.rating{margin:0;font-size:14px;line-height:1.4}.score strong{font-size:24px}.radar-wrap{width:min(480px,100%);margin:8px auto;aspect-ratio:420/350}.sections{padding-top:12px}.sections::before{display:none}.radar path{stroke-width:4!important}.radar circle[fill="none"]{stroke-width:1.6!important}@media(max-width:720px){.header{flex-direction:row}.header>.title,.header>div:first-child:not(.summary){flex-basis:100%}.summary{gap:12px}.radar-wrap{width:min(400px,100%);margin:4px auto}.sections{padding-top:8px}}
</style>
<script data-business-theme-runtime>
    (() => {
      const requested = new URLSearchParams(location.search).get('theme');
      if (requested === 'dark' || requested === 'light') document.documentElement.dataset.theme = requested;
    })();
    </script></head>
<body>
<main class="module" data-rating-layout="2">
  <header class="header">
    <h1 class="title" id="title"></h1>
    <div class="summary">
      <div class="score"><strong id="overallScore"></strong><span>/ 10</span></div>
      <div class="rating" id="rating"></div>
    </div>
  </header>
  <div class="radar-wrap">
    <svg id="radar" class="radar" viewBox="0 0 420 350" role="img" aria-label="Fundamental investment rating radar"></svg>
  </div>
  <section class="sections">
    <h2 class="section-title">基本面分析</h2>
    <div class="signal-list" id="cards"></div>
  </section>
</main>
<script>
const payload = {"type": "fundamental-investment-rating", "name": "基本面评级", "title": "NVDA基本面五维评分：增长强估值弱", "code": "NVDA", "market": "185", "exchange": "NASDAQ", "overallScore": 5.6, "overallScoreLabel": "5.60 / 10", "rating": "中性", "dimensions": [{"key": "value", "label": "价值", "score": 3.7}, {"key": "future", "label": "未来增长", "score": 7.4}, {"key": "past", "label": "历史表现", "score": 6.0}, {"key": "health", "label": "财务健康", "score": 6.8}, {"key": "dividend", "label": "分红", "score": 4.2}], "insights": [{"kind": "fundamental-1", "tone": "neutral", "text": "NVDA 的整体估值合理。", "sourceText": "The overall valuation of NVDA is reasonable."}, {"kind": "fundamental-2", "tone": "neutral", "text": "预计 NVDA 的营收在未来几年将强劲增长。", "sourceText": "NVDA's revenue will have seen strong growth in the next few years."}, {"kind": "fundamental-3", "tone": "neutral", "text": "NVDA 的主要业务是数据中心，数据中心占总营收的 89.7%。", "sourceText": "NVDA's primary product is Data Center, with Data Center accounting for 89.7% of total revenue."}, {"kind": "fundamental-4", "tone": "neutral", "text": "NVDA 的债务权益比为 39.9%，债务风险相对较低。", "sourceText": "NVDA has a debt-to-equity ratio of 39.9%, indicating a relatively low debt risk."}, {"kind": "fundamental-5", "tone": "neutral", "text": "NVDA 当前的股息支付率处于行业中等水平。", "sourceText": "NVDA's current dividend payout ratio is in the middle of the industry."}], "source": {"provider": "AInvest analysis page", "url": "https://www.ainvest.com/stocks/NASDAQ-NVDA/analysis/#fundamental-section-future"}, "extraction": {"mode": "live-playwright-with-fundamental-tab", "httpStatus": 202, "note": "Component built-in extractor failed on the live page; values extracted from the same rendered AInvest Fundamental tab."}, "language": "zh-CN", "componentUi": {"Exchange": "交易所", "Business": "主营业务", "Neutral": "中性", "Stock": "股票", "Fundamental Investment Rating": "基本面评级", "Fundamental Analysis": "基本面分析", "Rating": "评级", "Value": "价值", "Future": "未来增长", "Past": "历史表现", "Health": "财务健康", "Dividend": "分红", "No fundamental analysis text is available.": "暂无基本面分析文本。", "Investment Rating": "综合投资评级"}, "theme": "light", "uiRating": "评级", "customTitle": "NVDA基本面五维评分：增长强估值弱"};
const titleEl = document.getElementById('title');
const scoreEl = document.getElementById('overallScore');
const ratingEl = document.getElementById('rating');
const cardsEl = document.getElementById('cards');
const radar = document.getElementById('radar');
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function scoreText(value) {
  const number = Number(value);
  if (!Number.isFinite(number)) return '--';
  return number.toFixed(2).replace(/\.0+$|(?<=\.\d*[1-9])0+$/g, '');
}
const symbol = String(payload.code || '').toUpperCase();
titleEl.textContent = `${symbol || 'Stock'} ${payload.title}`;
scoreEl.textContent = scoreText(payload.overallScore);
ratingEl.textContent = `${payload.uiRating}: ${payload.rating || '--'}`;
cardsEl.innerHTML = (payload.insights || []).map((item) => `
  <div class="signal-row">
    <span class="signal-dot ${item.tone === 'bearish' ? 'risk' : ''}"></span>
    <span>${escapeHtml(item.text)}</span>
  </div>
`).join('') || '<div class="empty-hint">暂无基本面分析文本。</div>';

function polar(cx, cy, radius, angleDeg) {
  const angle = (angleDeg - 90) * Math.PI / 180;
  return [cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)];
}
function smoothClosedPath(points) {
  if (points.length < 3) return '';
  const d = [`M ${points[0][0].toFixed(1)} ${points[0][1].toFixed(1)}`];
  for (let i = 0; i < points.length; i++) {
    const p0 = points[(i - 1 + points.length) % points.length];
    const p1 = points[i];
    const p2 = points[(i + 1) % points.length];
    const p3 = points[(i + 2) % points.length];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d.push(`C ${c1[0].toFixed(1)} ${c1[1].toFixed(1)}, ${c2[0].toFixed(1)} ${c2[1].toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`);
  }
  d.push('Z');
  return d.join(' ');
}
function el(name, attrs = {}) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', name);
  Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
  return node;
}
function renderRadar() {
  const order = [
    { key:'value', label:"价值", angle:0 },
    { key:'future', label:"未来增长", angle:72 },
    { key:'past', label:"历史表现", angle:144 },
    { key:'health', label:"财务健康", angle:216 },
    { key:'dividend', label:"分红", angle:288 },
  ];
  const dims = payload.dimensions || [];
  const axes = order.map(axis => {
    const found = dims.find(item => String(item.key || '').toLowerCase() === axis.key || String(item.label || '').toLowerCase() === axis.label.toLowerCase());
    return { ...axis, score: Number(found?.score || 0) };
  });
  const cx = 210, cy = 184, r = 130;
  radar.innerHTML = '';
  [0.22, 0.40, 0.58, 0.76, 0.94].forEach((scale, i) => {
    radar.appendChild(el('circle', {cx, cy, r:r*scale, fill:'none', stroke:i % 2 ? 'var(--business-border-eef1f4)' : 'var(--business-border-e1e6eb)', 'stroke-width':1.6, 'vector-effect':'non-scaling-stroke'}));
  });
  const points = axes.map(axis =>
    polar(cx, cy, r * Math.max(0, Math.min(10, axis.score)) / 10, axis.angle)
  );
  radar.appendChild(el('path', {d:smoothClosedPath(points), fill:'var(--accent-fill)', stroke:'var(--accent)', 'stroke-width':4, 'vector-effect':'non-scaling-stroke', 'stroke-linejoin':'round'}));
  axes.forEach(axis => {
    const [lx, ly] = polar(cx, cy, r + 20, axis.angle);
    const label = el('text', {x:lx, y:ly, 'text-anchor':'middle', 'dominant-baseline':'middle', 'font-size':16, 'font-weight':650, 'letter-spacing':0, fill:'var(--business-text-1d232c)'});
    label.textContent = axis.label;
    radar.appendChild(label);
  });
  axes.forEach(axis => {
    const [x, y] = polar(cx, cy, r * Math.max(0, Math.min(10, axis.score)) / 10, axis.angle);
    radar.appendChild(el('circle', {cx:x, cy:y, r:3.2, fill:'#ff8a18'}));
  });
}
renderRadar();
</script>
