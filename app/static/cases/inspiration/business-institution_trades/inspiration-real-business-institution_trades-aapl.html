function esc(v){return String(v ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function compact(v,d=2){const n=Number(v); if(!Number.isFinite(n)) return '--'; const a=Math.abs(n), s=n<0?'-':''; if(a>=1e9)return `${s}${(a/1e9).toFixed(d)}B`; if(a>=1e6)return `${s}${(a/1e6).toFixed(d)}M`; if(a>=1e3)return `${s}${(a/1e3).toFixed(d)}K`; return `${s}${a.toLocaleString('en-US',{maximumFractionDigits:d})}`;}
function fmtDate(v){const d=new Date(`${String(v||'').slice(0,10)}T00:00:00Z`); return Number.isNaN(d.getTime()) ? String(v||'') : d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'});}
function signed(v){const n=Number(v); const cls=n<0?'neg':'pos'; const sign=n>0?'+':''; return `<span class="${cls}">${sign}${compact(n)}</span>`;}
function pct(v){const n=Number(v); if(!Number.isFinite(n)) return ''; return `${n>0?'+':''}${n.toFixed(2)}%`;}
function sameQuarter(date, quarter){const d=new Date(`${date}T00:00:00Z`); if(Number.isNaN(d.getTime())) return false; const q=Math.floor(d.getUTCMonth()/3)+1; return `${d.getUTCFullYear()} Q${q}`===quarter;}

function renderTable(rows){

  const body=rows.map(r=>`<tr>

}
function setupBrush(){
  const brush=document.getElementById('brush');
  if(!brush) return;
  const left=brush.querySelector('.handle.left'), right=brush.querySelector('.handle.right');
  const onDown=(ev)=>{
    const handle=ev.target.closest('.handle');
    if(!handle) return;
    state.dragging=handle.dataset.side;
    handle.setPointerCapture?.(ev.pointerId);
    ev.preventDefault();
  };
  const onMove=(ev)=>{
    if(!state.dragging) return;
    const rect=brush.getBoundingClientRect();
    const metrics=brushMetrics();
    const pad=metrics.pad;
    const width=Math.max(1, rect.width-pad*2);
    let value=(ev.clientX-rect.left-pad)/width;
    value=Math.max(0,Math.min(1,value));
    const minSpan=Math.min(.18, 1/Math.max(2,(payload.activity||[]).length-1));
    if(state.dragging==='left') state.start=Math.min(value, state.end-minSpan);
    if(state.dragging==='right') state.end=Math.max(value, state.start+minSpan);
    state.start=Math.max(0,Math.min(.98,state.start));
    state.end=Math.max(.02,Math.min(1,state.end));
    updateBrush();
    drawChart();
  };
  const onUp=()=>{state.dragging=null;};
  brush.addEventListener('pointerdown',onDown);
  window.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp);
  updateBrush();
}
function updateBrush(){
  const brush=document.getElementById('brush');
  if(!brush) return;
  const metrics=brushMetrics();
  const pad=metrics.pad, railW=Math.max(1, brush.clientWidth-pad*2);
  const l=pad+state.start*railW, r=pad+state.end*railW;
  brush.querySelector('.handle.left').style.left=`${l}px`;
  brush.querySelector('.handle.right').style.left=`${r}px`;
  const selected=brush.querySelector('.selected-rail');
  selected.style.left=`${l}px`;
  selected.style.width=`${Math.max(0,r-l)}px`;
}
function brushMetrics(){
  const brush=document.getElementById('brush');
  const handle=brush?.querySelector('.handle');
  const size=handle?.getBoundingClientRect().width || 32;
  const pad=Math.ceil(size / 2) + 2;
  // Keep the rail and pointer mapping aligned with the rendered handle size.
  brush?.style.setProperty('--track-pad', `${pad}px`, 'important');
  return {pad, handle:size};
}
function chartPadding(){
  const compact=window.matchMedia && window.matchMedia('(max-width: 980px)').matches;
  return compact ? {l:22,r:58,t:10,b:26} : {l:48,r:76,t:24,b:42};
}
function drawChart(){
  const el=document.getElementById('chart');
  const allActivity=payload.activity || [];
  const prices=payload.priceSeries || [];
  if(!allActivity.length && !prices.length){el.innerHTML='<div class="empty">暂无机构交易活动。</div><div class="tooltip" id="tooltip"></div>'; return;}

  const W=Math.max(320, Math.round((panel && panel.getBoundingClientRect().width) || el.getBoundingClientRect().width || el.clientWidth || 980));
  const H=Math.max(160, Math.round(W * 0.4));
  el.style.height=`${H}px`;
  state.lastChartWidth=W;
  const p=chartPadding();
  const startIdx=Math.floor(state.start*Math.max(0, allActivity.length-1));
  const endIdx=Math.max(startIdx, Math.ceil(state.end*Math.max(0, allActivity.length-1)));
  const activity=allActivity.slice(startIdx,endIdx+1);
  const visibleQuarters=new Set(activity.map(d=>d.quarter));
  const visiblePrices=prices.filter(d=>{
    if(!activity.length) return true;
    const date=new Date(`${d.date}T00:00:00Z`);
    if(Number.isNaN(date.getTime())) return false;
    const q=`${date.getUTCFullYear()} Q${Math.floor(date.getUTCMonth()/3)+1}`;
    return visibleQuarters.has(q);
  });
  const maxShares=Math.max(1,...activity.flatMap(d=>[Number(d.buyShares||0),Number(d.sellShares||0)]));
  const shareStep=niceStep(maxShares/4);
  const shareMax=Math.max(shareStep*4, maxShares);
  const closes=(visiblePrices.length?visiblePrices:prices).map(d=>Number(d.close)).filter(Number.isFinite);
  let priceMin=Math.min(...closes), priceMax=Math.max(...closes);
  if(!Number.isFinite(priceMin)||priceMin===priceMax){priceMin=0; priceMax=1}
  const padPrice=(priceMax-priceMin)*.08 || 1;
  priceMin=Math.max(0, priceMin-padPrice);
  priceMax=priceMax+padPrice;
  const plotW=W-p.l-p.r, plotH=H-p.t-p.b;
  const groupCount=Math.max(activity.length,1);
  const groupGapRatio=.5;
  const groupWidth=plotW/(groupCount + Math.max(0,groupCount-1)*groupGapRatio);
  const groupGap=groupWidth*groupGapRatio;
  const barGap=1;
  const barWidth=Math.max(1,(groupWidth-barGap)/2);
  const groupStart=i=>p.l+i*(groupWidth+groupGap);
  const x=i=>groupStart(i)+groupWidth/2;
  const compactLayout=window.matchMedia && window.matchMedia('(max-width: 980px)').matches;
  const xLabelY=compactLayout ? H-8 : H-18;
  const yShares=v=>p.t+(shareMax-v)/shareMax*plotH;
  const yPrice=v=>p.t+(priceMax-v)/(priceMax-priceMin)*plotH;
  const tickSlots=[0,.25,.5,.75,1];
  const priceTicks=tickSlots.map(t=>priceMax-(priceMax-priceMin)*t);
  const shareTicks=tickSlots.map(t=>shareMax*(1-t));
  const grid=tickSlots.map((t,i)=>{
    const y=p.t+plotH*t;
    return `<line class="grid" x1="${p.l}" y1="${y}" x2="${W-p.r}" y2="${y}"></line><text class="axis" x="${p.l-8}" y="${y}" text-anchor="end">${compact(priceTicks[i],0)}</text><text class="axis" x="${W-p.r+10}" y="${y}" text-anchor="start">${compact(shareTicks[i],2)}</text>`;
  }).join('');
  const xLabelIndexes=sampleXAxisIndexes(activity, groupWidth+groupGap);
  const bars=activity.map((d,i)=>{
    const bw=barWidth, base=yShares(0), bx=groupStart(i), sx=bx+bw+barGap;
    const by=yShares(Number(d.buyShares||0)), sy=yShares(Number(d.sellShares||0));
    const label=xLabelIndexes.has(i) ? `<text class="axis" x="${x(i)}" y="${xLabelY}" text-anchor="middle">${esc(d.quarter)}</text>` : '';
    return `<rect class="buy" x="${bx}" y="${by}" width="${bw}" height="${Math.max(1,base-by)}"></rect><rect class="sell" x="${sx}" y="${sy}" width="${bw}" height="${Math.max(1,base-sy)}"></rect>${label}`;
  }).join('');
  const plotPrices=visiblePrices.length ? visiblePrices : prices;
  const pricePts=plotPrices.map((d,idx)=>[idx/Math.max(plotPrices.length-1,1)*plotW+p.l,yPrice(Number(d.close)),d]);
  const line=pricePts.map((pt,i)=>`${i?'L':'M'}${pt[0].toFixed(2)},${pt[1].toFixed(2)}`).join(' ');
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMin meet">${grid}${bars}${line ? `<path class="price-line" d="${line}"></path>` : ''}<rect id="hit" x="${p.l}" y="${p.t}" width="${plotW}" height="${plotH}" fill="transparent"></rect></svg><div class="tooltip" id="tooltip"></div>`;
  const svg=el.querySelector('svg'), tip=document.getElementById('tooltip');
  el.querySelector('#hit').addEventListener('mousemove',ev=>{
    const rect=svg.getBoundingClientRect();
    const px=(ev.clientX-rect.left)/rect.width*W;
    let idx=0,best=Infinity;
    activity.forEach((d,i)=>{const dist=Math.abs(x(i)-px); if(dist<best){best=dist; idx=i;}});
    const d=activity[idx];
    const price=plotPrices.find(p=>sameQuarter(p.date,d.quarter)) || plotPrices[Math.min(plotPrices.length-1, Math.round(idx/Math.max(activity.length-1,1)*(plotPrices.length-1)))] || {};
    const anchorX=x(idx);
    tip.innerHTML=`<strong class="tip-title">${esc(d.quarter)}</strong>
      <div class="tip-row"><span class="tip-label"><span class="tip-dot" style="background:#2f64f6"></span>${esc(payload.code||'Price')}</span><span class="tip-value">${compact(price.close,2)}</span></div>
      <div class="tip-row"><span class="tip-label"><span class="tip-dot" style="background:#079b67"></span>买入</span><span class="tip-value">${compact(d.buyShares,2)}</span></div>
      <div class="tip-row"><span class="tip-label"><span class="tip-dot" style="background:#ff3b25"></span>卖出</span><span class="tip-value">${compact(d.sellShares,2)}</span></div>`;
    tip.classList.add('show');
    const tipRect=tip.getBoundingClientRect();
    const chartRect=el.getBoundingClientRect();
    const left=Math.max(8,Math.min(chartRect.width-tipRect.width-8,anchorX-tipRect.width/2));
    const top=p.t-tipRect.height-8;
    tip.style.left=`${left}px`;
    tip.style.top=`${top}px`;
    tip.style.setProperty('--arrow-left',`${Math.max(16,Math.min(tipRect.width-16,anchorX-left))}px`);
  });
  el.querySelector('#hit').addEventListener('mouseleave',()=>tip.classList.remove('show'));
}
function niceStep(value){
  const raw=Math.max(1, Number(value)||1);
  const pow=Math.pow(10, Math.floor(Math.log10(raw)));
  const n=raw/pow;
  const base=n<=1?1:n<=2?2:n<=5?5:10;
  return base*pow;
}
function sampleXAxisIndexes(rows, xBand){
  const count=rows.length;
  if(count<=2) return new Set(rows.map((_,i)=>i));
  const maxLabelWidth=Math.max(...rows.map(d=>String(d.quarter||'').length*7.2));
  if(xBand >= maxLabelWidth + 8) return new Set(rows.map((_,i)=>i));
  return new Set([0, Math.floor((count-1)/2), count-1]);
}
let resizeTimer=0;
function queueResizeDraw(){
  clearTimeout(resizeTimer);

}
window.addEventListener('resize',queueResizeDraw,{passive:true});
function setupResizeObserver(){
  if(!window.ResizeObserver) return;
  const chart=document.getElementById('chart');
  const brush=document.getElementById('brush');
  const ro=new ResizeObserver(entries=>{
    const chartEntry=entries.find(entry=>entry.target===chart);

      const nextWidth=Math.round(chartEntry.contentRect.width || 0);
      if(Math.abs(nextWidth-state.lastChartWidth) > 2) queueResizeDraw();

    }
    queueResizeDraw();
  });
  if(chart) ro.observe(chart);
  if(brush) ro.observe(brush);
  requestAnimationFrame(()=>requestAnimationFrame(queueResizeDraw));
}
