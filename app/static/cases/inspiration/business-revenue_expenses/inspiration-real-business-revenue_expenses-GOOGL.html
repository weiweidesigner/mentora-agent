:root {
  --blue:#2361ff;
  --blue-soft: rgba(35, 97, 255, .18);
  --red:#ff4d57;
  --red-soft: rgba(255, 77, 87, .18);
  --green:#23a987;
  --green-soft: rgba(35, 169, 135, .18);
  --ink:var(--business-text-24272e);
  --muted:var(--business-text-7b828c);
  --line:var(--business-border-eceff4);
  --panel:var(--business-bg-ffffff);
  --bg:var(--business-bg-ffffff);
}

* { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  min-height: 100%;
  overflow: hidden;
}
body {
  margin: 0;
  background: transparent;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
}

.wrap {
  width: 100%;
  height: 100vh;
  min-height: 0;
  padding: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) 42px;
  gap: 2px;
  background: transparent;
  overflow: hidden;
}

.toolbar {
  min-height: 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.title-block {
  display: flex;
  align-items: baseline;
  gap: 10px;
  min-width: 0;
}
.title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -.01em;
  color:var(--business-text-202329);
  white-space: nowrap;
}
.sub {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}
.legend {
  display: flex;
  align-items: center;
  gap: 10px;
  color:var(--business-text-69717d);
  font-size: 11px;
  white-space: nowrap;
}
.leg {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.dot {
  width: 9px;
  height: 9px;
  border-radius: 999px;
  display: inline-block;
}
.actions {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
}
.segmented {
  height: 24px;
  padding: 2px;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  background:var(--business-bg-f3f5f8);
  border: 1px solid var(--business-border-edf0f5);
  border-radius: 999px;
}
.seg-btn,
.yoy-btn {
  height: 20px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color:var(--business-text-69717d);
  padding: 0 8px;
  font-size: 10px;
  font-weight: 650;
  cursor: pointer;
}
.seg-btn.active {
  background:var(--business-bg-fff);
  color:var(--business-text-1f2430);
  box-shadow: 0 2px 8px rgba(29, 37, 52, .08);
}
.seg-btn:disabled {
  cursor: not-allowed;
  opacity: .35;
}
.yoy-btn {
  height: 24px;
  min-width: 42px;
  border: 1px solid var(--business-border-edf0f5);
  background:var(--business-bg-fff);
}
.yoy-btn.active {
  color: var(--blue);
  border-color: rgba(35, 97, 255, .30);
  background: rgba(35, 97, 255, .06);
}

.chart {
  position: relative;
  min-height: 0;
  background:var(--business-bg-fff);
  overflow: visible;
}
#svg,
.ghost-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  overflow: visible;
}
#svg {
  z-index: 1;
  transition: opacity 380ms cubic-bezier(.22, .8, .2, 1), transform 380ms cubic-bezier(.22, .8, .2, 1);
  will-change: opacity, transform;
}
.ghost-svg {
  z-index: 2;
  pointer-events: none;
  opacity: 1;
  transition: opacity 380ms cubic-bezier(.22, .8, .2, 1), transform 380ms cubic-bezier(.22, .8, .2, 1);
  will-change: opacity, transform;
}
.flow {
  stroke: none;
  shape-rendering: geometricPrecision;
}
.flow.rev { fill: var(--blue-soft); }
.flow.profit { fill: var(--green-soft); }
.flow.exp { fill: var(--red-soft); }
.flow.neg { fill: rgba(255, 77, 87, .16); }

.node-bar {
  rx: 1.5;
  ry: 1.5;
}
.node-bar.blue { fill: var(--blue); }
.node-bar.green { fill: var(--green); }
.node-bar.red { fill: var(--red); }
.node-hit {
  fill: transparent;
  cursor: default;
}
.label-name {
  font-size: 10px;
  font-weight: 690;
  fill:var(--business-text-24272e);
}
.label-value {
  font-size: 12.5px;
  font-weight: 760;
  letter-spacing: -.02em;
}
.label-value.blue { fill: var(--blue); }
.label-value.green { fill: var(--green); }
.label-value.red { fill: var(--red); }
.label-yoy {
  font-size: 10px;
  font-weight: 720;
}
.label-yoy.up { fill: var(--green); }
.label-yoy.down { fill: var(--red); }
.label-yoy.flat { fill: var(--muted); }
.period-text {
  font-size: 12px;
  font-weight: 760;
  fill:var(--business-text-7a818c);
}
.badge-bg {
  fill:var(--business-text-fff);
  stroke:var(--business-border-e8edf7);
  stroke-width: 1;
  filter: drop-shadow(0 5px 14px rgba(35, 97, 255, .13));
}
.badge-inner { fill: var(--blue); }
.badge-letter {
  font-size: 18px;
  font-weight: 850;
  fill:var(--business-text-fff);
}
.empty {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--muted);
  font-size: 14px;
}

.bottom {
  min-height: 0;
  position: relative;
  padding: 2px clamp(12px, 1.4vw, 22px) 0;
  display: grid;
  grid-template-columns: 32px max-content minmax(150px, 1fr) max-content;
  align-items: center;
  column-gap: clamp(12px, 1.2vw, 22px);
  overflow: visible;
}
.play {
  position: relative;
  z-index: 6;
  width: 30px;
  height: 30px;
  border: 1px solid var(--business-border-dfe5ee);
  border-radius: 50%;
  background:var(--business-bg-fff);
  color: var(--blue);
  display: grid;
  place-items: center;
  cursor: pointer;
  box-shadow: 0 5px 16px rgba(31, 41, 55, .12);
  padding: 0;
}
.play:hover { background:var(--business-bg-f7f9ff); border-color: rgba(35, 97, 255, .28); }
.play svg {
  width: 25px;
  height: 25px;
  fill: currentColor;
  display: block;
}
.play svg path {
  stroke-linejoin: round;
}
.axis-date {
  flex: 0 0 auto;
  color:var(--business-text-727272);
  font-size: clamp(12px, .95vw, 15px);
  font-weight: 560;
  white-space: nowrap;
  letter-spacing: -.01em;
}
.timeline {
  position: relative;
  min-width: 0;
  height: 26px;
}
.track {
  position: absolute;
  left: 0;
  right: 0;
  top: 10px;
  height: 10px;
  border-radius: 3px;
  background:var(--business-bg-f0f0f0);
}
.tick {
  position: absolute;
  top: 12px;
  width: 2px;
  height: 7px;
  border-radius: 3px;
  background:var(--business-bg-b5b5b5);
  transform: translateX(-50%);
  cursor: pointer;
}
.tick.active {
  background:var(--business-bg-8b8b8b);
}
.thumb {
  position: absolute;
  top: 4px;
  width: 20px;
  height: 20px;
  border-radius: 6px;
  background:var(--business-bg-fff);
  border: 1px solid var(--business-border-d9d9d9);
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  z-index: 3;
  cursor: grab;
  transition: left 420ms cubic-bezier(.22, .8, .2, 1), transform 180ms ease;
}
.thumb:active { cursor: grabbing; }
.thumb i {
  width: 2px;
  height: 10px;
  border-radius: 3px;
  background:var(--business-bg-9a9a9a);
  display: block;
}
.tooltip {
  position: absolute;
  z-index: 4;
  min-width: 150px;
  padding: 9px 10px;
  border-radius: 12px;
  background: rgba(255,255,255,.96);
  border: 1px solid var(--business-border-edf0f5);
  box-shadow: 0 10px 28px rgba(31, 41, 55, .14);
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -100%);
  transition: opacity .12s ease;
}
.tooltip.show { opacity: 1; }
.tooltip .t-name { font-size: 12px; color:var(--business-text-1f2430); font-weight: 750; margin-bottom: 4px; }
.tooltip .t-value { font-size: 14px; font-weight: 800; }
.tooltip .t-yoy { font-size: 11px; margin-top: 3px; font-weight: 700; }

@media (max-width: 860px) {

  lines.forEach((line, i) => {
    const tspan = document.createElementNS(ns, 'tspan');
    tspan.setAttribute('x', String(x));
    tspan.setAttribute('dy', i === 0 ? '0' : String(lineHeight));
    tspan.textContent = line;
    el.appendChild(tspan);
  });
  return el;
}

function make(tag, attrs = {}, parent = svg) {
  const el = document.createElementNS(ns, tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value !== undefined && value !== null) el.setAttribute(key, String(value));
  }
  parent.appendChild(el);
  return el;
}

function svgText(parent, x, y, text, cls, anchor = 'start') {
  const el = make('text', { x, y, class: cls, 'text-anchor': anchor }, parent);
  el.textContent = text;
  return el;
}

function ribbonPath(x0, y0Top, y0Bottom, x1, y1Top, y1Bottom) {
  const dx = Math.max(36, (x1 - x0) * 0.52);
  return [
    `M ${x0} ${y0Top}`,
    `C ${x0 + dx} ${y0Top}, ${x1 - dx} ${y1Top}, ${x1} ${y1Top}`,
    `L ${x1} ${y1Bottom}`,
    `C ${x1 - dx} ${y1Bottom}, ${x0 + dx} ${y0Bottom}, ${x0} ${y0Bottom}`,
    'Z',
  ].join(' ');
}

function calcYoyMetric(key, projectName = null) {
  const data = getData();
  const current = data[state.index];
  if (!current) return null;

  const currentYear = Number(current.subject?.year);
  const currentPeriod = current.subject?.period;
  let prevIndex = -1;

  if (Number.isFinite(currentYear)) {
    prevIndex = data.findIndex((d) => {
      const y = Number(d.subject?.year);
      if (state.periodType === 'annual') return y === currentYear - 1;
      return y === currentYear - 1 && d.subject?.period === currentPeriod;
    });
  }

  if (prevIndex < 0) {
    prevIndex = state.periodType === 'quarterly' ? state.index - 4 : state.index - 1;
  }
  if (prevIndex < 0 || !data[prevIndex]) return null;

  const prev = data[prevIndex];
  let currentValue = 0;
  let prevValue = 0;

  if (projectName) {
    currentValue = val((current.projects || []).find((p) => p.name === projectName)?.value);
    prevValue = val((prev.projects || []).find((p) => p.name === projectName)?.value);
  } else if (key === 'sum_positive') {
    currentValue = (current.projects || []).filter((p) => val(p.value) > 0).reduce((s, p) => s + val(p.value), 0);
    prevValue = (prev.projects || []).filter((p) => val(p.value) > 0).reduce((s, p) => s + val(p.value), 0);
  } else if (key === 'negative_business') {
    currentValue = Math.abs((current.projects || []).filter((p) => val(p.value) < 0).reduce((s, p) => s + val(p.value), 0));
    prevValue = Math.abs((prev.projects || []).filter((p) => val(p.value) < 0).reduce((s, p) => s + val(p.value), 0));
  } else {
    currentValue = itemValue(current, key);
    prevValue = itemValue(prev, key);
  }

  if (!Number.isFinite(prevValue) || Math.abs(prevValue) < 1) return null;
  const pct = ((currentValue - prevValue) / Math.abs(prevValue)) * 100;
  if (!Number.isFinite(pct)) return null;
  return pct;
}

function yoyClass(pct) {
  if (pct > 0.05) return 'up';
  if (pct < -0.05) return 'down';
  return 'flat';
}

function yoyText(pct) {
  if (pct === null || pct === undefined || !Number.isFinite(pct)) return '';
  const arrow = pct > 0.05 ? '▲' : pct < -0.05 ? '▼' : '—';
  return `${arrow} ${t('yoy')} ${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%`;
}

function computeModel(item, width, height) {
  const projects = Array.isArray(item.projects) ? item.projects : [];
  const positives = projects.filter((p) => val(p.value) > 0);
  const negatives = projects.filter((p) => val(p.value) < 0);
  const sumPositive = positives.reduce((s, p) => s + val(p.value), 0);
  const negativeAbs = Math.abs(negatives.reduce((s, p) => s + val(p.value), 0));

  const revenue = itemValue(item, 'operating_income_total');
  const cogs = Math.abs(itemValue(item, 'revenue_cost'));
  const gross = itemValue(item, 'gross_profit');
  const operatingProfit = itemValue(item, 'operating_profit');
  const operatingExpenses = Math.abs(itemValue(item, 'operating_expenses'));
  const sga = Math.abs(itemValue(item, 'selling_administrative_expenses'));
  const rd = Math.abs(itemValue(item, 'research_development_expenses'));
  const tax = Math.abs(itemValue(item, 'income_tax_expense'));
  const other = itemValue(item, 'other_item');
  const net = itemValue(item, 'net_profit');

  const rightTotal = Math.abs(net) + Math.abs(other) + tax + sga + rd;
  const maxTotal = Math.max(
    sumPositive + negativeAbs,
    Math.abs(revenue),
    Math.abs(gross) + Math.abs(cogs),
    Math.abs(operatingProfit) + Math.abs(operatingExpenses),
    rightTotal,
    1
  );
  const plotH = Math.max(180, height - 20);
  const dynamicMaxLink = Math.min(MAX_LINK_W, Math.max(28, width * 0.038));
  const maxVisualHeight = Math.min(plotH * 0.76, Math.max(150, plotH * 0.68));
  const scale = maxVisualHeight / maxTotal;
  const w = (v) => Math.min(dynamicMaxLink, Math.max(MIN_LINK_W, Math.abs(v) * scale));

  const compact = width < 980;
  const tiny = width < 720;
  // Move the whole Sankey slightly right, but push the last layer closer to the edge
  // so the chart uses the available screen instead of leaving a blank right column.
  const leftPad = tiny ? 58 : compact ? 82 : 116;
  const rightPad = tiny ? 16 : compact ? 22 : 28;
  const chartW = Math.max(260, width - leftPad - rightPad);
  const ratios = tiny ? [0, .19, .36, .53, .70, .88] : compact ? [0, .19, .36, .53, .70, .90] : [0, .18, .35, .53, .70, .91];
  const cols = ratios.map((t) => leftPad + chartW * t);
  const top = 12;
  const bottom = height - 10;
  const center = top + (bottom - top) * 0.50;

  const nodes = [];
  const nodeMap = new Map();

  function addNode(id, name, value, x, y, color, side = 'right', key = null, projectName = null) {
    const node = {
      id, name, value, x, y, color, side, key, projectName,
      inLinks: [], outLinks: [], inCursor: 0, outCursor: 0, h: w(value),
    };
    nodes.push(node);
    nodeMap.set(id, node);
    return node;
  }

  const positiveSpecs = positives.map((p, i) => ({ id: `project_${i}`, name: p.name || `Revenue ${i + 1}`, value: val(p.value), color: 'blue', key: 'project', projectName: p.name }));
  const nodeGap = tiny ? 12 : compact ? 16 : 20;
  const positiveH = positiveSpecs.reduce((s, n) => s + w(n.value), 0) + Math.max(0, positiveSpecs.length - 1) * nodeGap;
  let startY = Math.max(top + 10, center - positiveH * 0.55);

  for (const spec of positiveSpecs) {
    const h = w(spec.value);
    addNode(spec.id, spec.name, spec.value, cols[0], startY + h / 2, 'blue', 'left', spec.key, spec.projectName);
    startY += h + nodeGap;
  }

  let negSource = null;
  let negBusiness = null;
  if (negativeAbs > 0) {
    const hNeg = w(negativeAbs);
  const negName = negatives.length === 1 ? negatives[0].name || t('negativeBusiness') : t('negativeBusiness');
    negSource = addNode('negative_source', negName, -negativeAbs, cols[0], Math.max(top + 12, center - positiveH * 0.68 - 22), 'red', 'left', 'negative_business');
    negBusiness = addNode('negative_business', t('negativeBusiness'), -negativeAbs, cols[1], Math.max(top + 32, center - Math.max(70, plotH * 0.24)), 'red', 'left', 'negative_business');
    negSource.h = hNeg;
    negBusiness.h = hNeg;
  }

  const sumNode = addNode('sum_positive', t('sumPositive'), sumPositive, cols[1], center + 12, 'blue', 'left', 'sum_positive');
  const revenueNode = addNode('revenue', t('revenueNode'), revenue, cols[2], center, 'blue', 'left', 'operating_income_total');

  const splitGap = Math.max(56, Math.min(98, plotH * 0.20));
  const smallSplitGap = Math.max(44, Math.min(78, plotH * 0.16));
  const grossNode = addNode('gross', t('grossProfit'), gross, cols[3], center - splitGap * 0.78, 'green', 'right', 'gross_profit');
  const cogsNode = addNode('cogs', t('costOfRevenue'), cogs, cols[3], center + splitGap * 0.88, 'red', 'right', 'revenue_cost');
  const opNode = addNode('operating_profit', t('operatingProfit'), operatingProfit, cols[4], center - smallSplitGap * 0.72, 'green', 'right', 'operating_profit');
  const opexNode = addNode('opex', t('operatingExpenses'), operatingExpenses, cols[4], center + smallSplitGap * 0.92, 'red', 'right', 'operating_expenses');

  const rightTop = top + Math.max(28, plotH * 0.12);
  const rightGap = Math.max(34, (bottom - rightTop) / 5.15);
  const netNode = addNode('net', t('netProfit'), net, cols[5], rightTop, 'green', 'right', 'net_profit');
  const otherNode = addNode('other', t('otherItems'), other, cols[5], rightTop + rightGap * 1.25, other < 0 ? 'red' : 'green', 'right', 'other_item');
  const taxNode = addNode('tax', t('tax'), tax, cols[5], rightTop + rightGap * 2.45, 'red', 'right', 'income_tax_expense');
  const sgaNode = addNode('sga', 'SG&A', sga, cols[5], rightTop + rightGap * 3.55, 'red', 'right', 'selling_administrative_expenses');
  const rdNode = addNode('rd', 'R&D', rd, cols[5], rightTop + rightGap * 4.65, 'red', 'right', 'research_development_expenses');

  const links = [];
  function addLink(sourceId, targetId, value, kind) {
    const source = nodeMap.get(sourceId);
    const target = nodeMap.get(targetId);
    if (!source || !target || Math.abs(value) <= 0) return null;
    const link = { source, target, value: Math.abs(value), width: w(value), kind };
    source.outLinks.push(link);
    target.inLinks.push(link);
    links.push(link);
    return link;
  }

  for (const spec of positiveSpecs) addLink(spec.id, 'sum_positive', spec.value, 'rev');
  addLink('sum_positive', 'revenue', sumPositive, 'rev');
  if (negativeAbs > 0) {
    addLink('negative_source', 'negative_business', negativeAbs, 'neg');
    addLink('negative_business', 'revenue', negativeAbs, 'neg');
  }
  addLink('revenue', 'gross', gross, 'profit');
  addLink('revenue', 'cogs', cogs, 'exp');
  addLink('gross', 'operating_profit', operatingProfit, 'profit');
  addLink('gross', 'opex', operatingExpenses, 'exp');
  addLink('opex', 'sga', sga, 'exp');
  addLink('opex', 'rd', rd, 'exp');

  // Keep the right side visually readable even when financial statement rows do not add up perfectly.
  addLink('operating_profit', 'net', Math.min(Math.abs(net), Math.max(Math.abs(operatingProfit), Math.abs(net) * .72)), 'profit');
  addLink('operating_profit', 'tax', tax, 'exp');
  addLink('operating_profit', 'other', Math.abs(other), other < 0 ? 'exp' : 'profit');

  for (const node of nodes) {
    const inSum = node.inLinks.reduce((s, l) => s + l.width, 0);
    const outSum = node.outLinks.reduce((s, l) => s + l.width, 0);
    node.h = Math.max(MIN_NODE_H, node.h, inSum, outSum);
    node.y0 = node.y - node.h / 2;
    node.y1 = node.y + node.h / 2;
    node.inCursor = node.y - inSum / 2;
    node.outCursor = node.y - outSum / 2;
  }

  // Assign link slots after all node heights are known.
  for (const node of nodes) {
    let out = node.outCursor;
    for (const link of node.outLinks) {
      link.sy0 = out;
      link.sy1 = out + link.width;
      out += link.width;
    }
    let inn = node.inCursor;
    for (const link of node.inLinks) {
      link.ty0 = inn;
      link.ty1 = inn + link.width;
      inn += link.width;
    }
  }

  return { nodes, links, cols, center, w };
}


function linkKey(link) {
  const sourceId = link.source?.id || link.sourceId || '';
  const targetId = link.target?.id || link.targetId || '';
  return `${sourceId}__${targetId}__${link.kind || ''}`;
}

function snapshotModel(model) {
  return {
    nodes: model.nodes.map((node) => ({
      id: node.id,
      x: node.x,
      y: node.y,
      y0: node.y0,
      y1: node.y1,
      h: node.h,
      color: node.color,
    })),
    links: model.links.map((link) => ({
      key: linkKey(link),
      sourceId: link.source.id,
      targetId: link.target.id,
      kind: link.kind,
      sy0: link.sy0,
      sy1: link.sy1,
      ty0: link.ty0,
      ty1: link.ty1,
      width: link.width,
    })),
  };
}

function snapshotNodeMap(snapshot) {
  return new Map((snapshot?.nodes || []).map((node) => [node.id, node]));
}

function snapshotLinkMap(snapshot) {
  return new Map((snapshot?.links || []).map((link) => [link.key, link]));
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function nodeFrame(node, fromNodes, t) {
  const from = fromNodes.get(node.id);
  if (!from) {
    const center = node.y;
    return {
      x: node.x,
      y0: lerp(center, node.y0, t),
      h: lerp(0, Math.max(MIN_NODE_H, node.h), t),
    };
  }
  return {
    x: lerp(from.x, node.x, t),
    y0: lerp(from.y0, node.y0, t),
    h: lerp(Math.max(MIN_NODE_H, from.h), Math.max(MIN_NODE_H, node.h), t),
  };
}

function linkFrame(link, fromNodes, fromLinks, t) {
  const key = linkKey(link);
  const fromLink = fromLinks.get(key);
  const fromSource = fromNodes.get(link.source.id);
  const fromTarget = fromNodes.get(link.target.id);

  const targetSourceX = link.source.x;
  const targetTargetX = link.target.x;
  const sourceX = lerp(fromSource?.x ?? targetSourceX, targetSourceX, t);
  const targetX = lerp(fromTarget?.x ?? targetTargetX, targetTargetX, t);

  if (!fromLink) {
    const syMid = (link.sy0 + link.sy1) / 2;
    const tyMid = (link.ty0 + link.ty1) / 2;
    return {
      x0: sourceX + NODE_W,
      x1: targetX,
      sy0: lerp(syMid, link.sy0, t),
      sy1: lerp(syMid, link.sy1, t),
      ty0: lerp(tyMid, link.ty0, t),
      ty1: lerp(tyMid, link.ty1, t),
    };
  }

  return {
    x0: sourceX + NODE_W,
    x1: targetX,
    sy0: lerp(fromLink.sy0, link.sy0, t),
    sy1: lerp(fromLink.sy1, link.sy1, t),
    ty0: lerp(fromLink.ty0, link.ty0, t),
    ty1: lerp(fromLink.ty1, link.ty1, t),
  };
}

function ribbonPathFromFrame(frame) {
  return ribbonPath(frame.x0, frame.sy0, frame.sy1, frame.x1, frame.ty0, frame.ty1);
}

function animateSankeyGeometry(elements, fromSnapshot, duration = FRAME_TRANSITION_MS) {
  const fromNodes = snapshotNodeMap(fromSnapshot);
  const fromLinks = snapshotLinkMap(fromSnapshot);
  const start = performance.now();
  if (transitionRaf) cancelAnimationFrame(transitionRaf);

  function step(now) {
    const raw = Math.min(1, (now - start) / duration);
    const t = easeInOutCubic(raw);

    for (const item of elements.nodes) {
      const frame = nodeFrame(item.node, fromNodes, t);
      item.el.setAttribute('x', String(frame.x));
      item.el.setAttribute('y', String(frame.y0));
      item.el.setAttribute('height', String(frame.h));
    }

    for (const item of elements.links) {
      const frame = linkFrame(item.link, fromNodes, fromLinks, t);
      item.el.setAttribute('d', ribbonPathFromFrame(frame));
    }

    if (raw < 1) {
      transitionRaf = requestAnimationFrame(step);
    } else {
      transitionRaf = null;
    }
  }

  transitionRaf = requestAnimationFrame(step);
}

function drawNodeLabels(labelLayer, node, model, width) {
  const anchor = node.side === 'left' ? 'end' : 'start';
  const x = node.side === 'left' ? node.x - 7 : node.x + NODE_W + 7;
  const isSmall = node.h < 14;
  const yBase = node.y + (isSmall ? -3 : -7);
  const colIndex = model.cols.reduce((best, col, i) => Math.abs(col - node.x) < Math.abs(model.cols[best] - node.x) ? i : best, 0);
  let availablePx;
  if (anchor === 'end') {
    availablePx = Math.max(42, x - 4);
  } else {
    const nextCol = model.cols[colIndex + 1];
    // Give labels more room than before. We wrap names instead of ellipsizing first.
    availablePx = nextCol ? Math.max(52, nextCol - x - 14) : Math.max(80, width - x - 4);
  }
  const maxChars = Math.min(34, charsForWidth(availablePx, 10));
  const nameLines = splitLabelIntoLines(node.name, maxChars, 2);
  const value = money(node.value);

  const group = make('g', { class: 'label-group', 'data-priority': Math.round(node.h * 100) }, labelLayer);
  svgTextLines(group, x, yBase, nameLines, 'label-name', anchor, 12);
  const valueY = yBase + nameLines.length * 12 + 5;
  svgText(group, x, valueY, value, `label-value ${node.color}`, anchor);

  if (state.yoy) {
    const pct = node.projectName ? calcYoyMetric(null, node.projectName) : calcYoyMetric(node.key);
    if (pct !== null) svgText(group, x, valueY + 12, yoyText(pct), `label-yoy ${yoyClass(pct)}`, anchor);
  }
}


function rectsOverlap(a, b, pad = 4) {
  return !(a.x + a.width + pad < b.x || b.x + b.width + pad < a.x || a.y + a.height + pad < b.y || b.y + b.height + pad < a.y);
}

function resolveSvgLabelCollisions(labelLayer, width, height) {
  const groups = Array.from(labelLayer.querySelectorAll('.label-group'));
  groups.forEach((g, i) => {
    g.style.display = '';
    g.dataset.order = String(i);
  });

  const sorted = groups.slice().sort((a, b) => {
    const pa = Number(a.getAttribute('data-priority') || 0);
    const pb = Number(b.getAttribute('data-priority') || 0);
    if (pb !== pa) return pb - pa;
    return Number(a.dataset.order || 0) - Number(b.dataset.order || 0);
  });

  const kept = [];
  for (const group of sorted) {
    let box;
    try {
      box = group.getBBox();
    } catch (err) {
      group.style.display = 'none';
      continue;
    }
    const outOfBounds = box.x < 0 || box.y < 0 || box.x + box.width > width || box.y + box.height > height;
    const overlap = kept.some((item) => rectsOverlap(box, item, 7));
    if (outOfBounds || overlap) {
      group.style.display = 'none';
    } else {
      kept.push(box);
    }
  }
}

function resolveTimelineLabelCollisions() {
  const container = document.getElementById('periodLabels');
  const labels = Array.from(container.querySelectorAll('.period-label'));
  const c = container.getBoundingClientRect();
  const kept = [];
  for (const label of labels) {
    label.style.display = '';
    const b = label.getBoundingClientRect();
    const rel = { x: b.left - c.left, y: b.top - c.top, width: b.width, height: b.height };
    const out = rel.x < 0 || rel.x + rel.width > c.width;
    const overlap = kept.some((item) => rectsOverlap(rel, item, 10));
    if (out || overlap) {
      label.style.display = 'none';
    } else {
      kept.push(rel);
    }
  }
}

function showTooltip(evt, node) {
  const pct = node.projectName ? calcYoyMetric(null, node.projectName) : calcYoyMetric(node.key);
  const cls = pct == null ? 'flat' : yoyClass(pct);
  tooltip.innerHTML = `
    <div class="t-name">${node.name}</div>
    <div class="t-value" style="color:var(--${node.color})">${money(node.value)}</div>
    ${pct == null ? '' : `<div class="t-yoy ${cls}">${yoyText(pct)}</div>`}
  `;
  const rect = chart.getBoundingClientRect();
  tooltip.style.left = `${evt.clientX - rect.left}px`;
  tooltip.style.top = `${evt.clientY - rect.top - 12}px`;
  tooltip.classList.add('show');
}

function hideTooltip() {
  tooltip.classList.remove('show');
}

function render(options = {}) {
  const data = getData();
  const shouldAnimate = Boolean(options.animate && lastModelSnapshot && !window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  if (transitionRaf) {
    cancelAnimationFrame(transitionRaf);
    transitionRaf = null;
  }

  svg.innerHTML = '';
  svg.style.transition = 'none';
  svg.style.opacity = '1';
  svg.style.transform = 'none';
  hideTooltip();

  document.getElementById('subtitle').textContent = `${payload.code || ''} · ${state.periodType === 'annual' ? t('annual') : t('quarterly')}`;

  if (!data.length) {
    lastModelSnapshot = null;
    chart.querySelectorAll('.empty').forEach((el) => el.remove());
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = t('noData');
    chart.appendChild(empty);
    updateControls();
    return;
  }
  chart.querySelectorAll('.empty').forEach((el) => el.remove());

  state.index = Math.min(Math.max(0, state.index), data.length - 1);

  const rect = chart.getBoundingClientRect();
  const width = Math.max(320, rect.width);
  const height = Math.max(220, rect.height);
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);

  const item = data[state.index];
  const model = computeModel(item, width, height);

  const flowLayer = make('g', { class: 'flow-layer' });
  const nodeLayer = make('g', { class: 'node-layer' });
  const labelLayer = make('g', { class: 'label-layer' });
  const transitionElements = { links: [], nodes: [] };
  const fromNodes = shouldAnimate ? snapshotNodeMap(lastModelSnapshot) : new Map();
  const fromLinks = shouldAnimate ? snapshotLinkMap(lastModelSnapshot) : new Map();

  for (const link of model.links) {
    const initialFrame = shouldAnimate
      ? linkFrame(link, fromNodes, fromLinks, 0)
      : { x0: link.source.x + NODE_W, x1: link.target.x, sy0: link.sy0, sy1: link.sy1, ty0: link.ty0, ty1: link.ty1 };
    const path = make('path', {
      class: `flow ${link.kind}`,
      d: ribbonPathFromFrame(initialFrame),
    }, flowLayer);
    transitionElements.links.push({ el: path, link });
  }

  for (const node of model.nodes) {
    const initialFrame = shouldAnimate
      ? nodeFrame(node, fromNodes, 0)
      : { x: node.x, y0: node.y0, h: Math.max(MIN_NODE_H, node.h) };
    const rectEl = make('rect', {
      class: `node-bar ${node.color}`,
      x: initialFrame.x,
      y: initialFrame.y0,
      width: NODE_W,
      height: initialFrame.h,
      rx: 1.5,
      ry: 1.5,
    }, nodeLayer);
    transitionElements.nodes.push({ el: rectEl, node });

    const hit = make('rect', {
      class: 'node-hit',
      x: node.x - 7,
      y: node.y0 - 7,
      width: NODE_W + 14,
      height: Math.max(MIN_NODE_H, node.h) + 14,
    }, nodeLayer);
    hit.addEventListener('mousemove', (evt) => showTooltip(evt, node));
    hit.addEventListener('mouseleave', hideTooltip);
  }

  // Period only; logo / ticker badge is intentionally removed.
  const period = svgText(labelLayer, model.cols[2] + NODE_W / 2, Math.max(24, model.center - 118), periodLabel(item), 'period-text', 'middle');
  period.setAttribute('pointer-events', 'none');

  for (const node of model.nodes) drawNodeLabels(labelLayer, node, model, width);
  resolveSvgLabelCollisions(labelLayer, width, height);

  const nextSnapshot = snapshotModel(model);
  if (shouldAnimate) {
    animateSankeyGeometry(transitionElements, lastModelSnapshot, FRAME_TRANSITION_MS);
  }
  lastModelSnapshot = nextSnapshot;

  updateControls();
  updateTimeline();
}

function updateControls() {
  const qBtn = document.getElementById('quarterlyBtn');
  const aBtn = document.getElementById('annualBtn');
  qBtn.classList.toggle('active', state.periodType === 'quarterly');
  aBtn.classList.toggle('active', state.periodType === 'annual');
  qBtn.disabled = !datasets.quarterly.length;
  aBtn.disabled = !datasets.annual.length;

  const yoyBtn = document.getElementById('yoyBtn');
  yoyBtn.classList.toggle('active', state.yoy);
  yoyBtn.setAttribute('aria-pressed', String(state.yoy));

}

function updateTimeline() {
  const data = getData();
  const timeline = document.getElementById('timeline');
  const thumb = document.getElementById('thumb');
  const startDate = document.getElementById('startDate');
  const endDate = document.getElementById('endDate');
  timeline.querySelectorAll('.tick').forEach((el) => el.remove());

  if (!data.length) {
    thumb.style.left = '0%';
    startDate.textContent = '';
    endDate.textContent = '';
    return;
  }

  startDate.textContent = periodLabel(data[0]);
  endDate.textContent = periodLabel(data[data.length - 1]);

  data.forEach((item, i) => {
    const p = timelineVisualPercent(i, data.length);
    const tick = document.createElement('span');
    tick.className = `tick${i === state.index ? ' active' : ''}`;
    tick.style.left = `${p}%`;
    tick.title = periodLabel(item);
    tick.addEventListener('click', (evt) => {
      evt.stopPropagation();
      state.index = i;
      stopPlay();
      render({ animate: true });
    });
    timeline.appendChild(tick);
  });

  thumb.style.left = `${timelineVisualPercent(state.index, data.length)}%`;
}

function setPlayIcon(mode) {
  const icon = document.getElementById('playIcon');
  const playBtn = document.getElementById('playBtn');
  playBtn.classList.toggle('is-playing',mode==='pause');
  icon.setAttribute('viewBox', '0 0 1024 1024');
  if (mode === 'pause') {
    playBtn.setAttribute('aria-label', t('pause'));
    icon.innerHTML = '<path d="M512 958.464c-246.272 0-446.464-200.192-446.464-446.464S265.728 65.536 512 65.536s446.464 200.192 446.464 446.464-200.192 446.464-446.464 446.464z m1.024-875.008c-235.52 0-427.52 192-427.52 427.52 0 236.032 192 427.52 427.52 427.52s427.52-192 427.52-427.52-192-427.52-427.52-427.52z"></path><path d="M386 318h92v388h-92zM548 318h92v388h-92z"></path>';
  } else {
    playBtn.setAttribute('aria-label', t('play'));
    icon.innerHTML = '<path d="M512 958.464c-246.272 0-446.464-200.192-446.464-446.464S265.728 65.536 512 65.536s446.464 200.192 446.464 446.464-200.192 446.464-446.464 446.464z m1.024-875.008c-235.52 0-427.52 192-427.52 427.52 0 236.032 192 427.52 427.52 427.52s427.52-192 427.52-427.52-192-427.52-427.52-427.52z"></path><path d="M408.064 326.144l-0.512 394.24 328.192-192.512z"></path>';
  }
}

function stopPlay() {
  state.playing = false;
  if (state.timer) clearTimeout(state.timer);
  state.timer = null;
  setPlayIcon('play');
}

function scheduleNextPlayFrame() {
  if (!state.playing) return;
  state.timer = window.setTimeout(() => {
    const data = getData();
    if (!state.playing || data.length <= 1) return;

    if (state.index >= data.length - 1) {
      stopPlay();
      return;
    }

    state.index += 1;
    render({ animate: true });

    if (state.index >= data.length - 1) {
      state.timer = window.setTimeout(stopPlay, FRAME_TRANSITION_MS + 80);
    } else {
      scheduleNextPlayFrame();
    }
  }, PLAY_STEP_MS);
}

function startPlay() {
  const data = getData();
  if (data.length <= 1) return;
  if (state.timer) clearTimeout(state.timer);

  state.playing = true;
  setPlayIcon('pause');

  // If the user is already at the end, replay once from the first frame.
  // It does not loop: after the final frame the animation stops and the icon returns to play.
  if (state.index >= data.length - 1) {
    state.index = 0;
    render({ animate: true });
  }

  scheduleNextPlayFrame();
}

function setPeriodType(type) {
  if (!datasets[type]?.length || state.periodType === type) return;
  stopPlay();
  state.periodType = type;
  state.index = Math.max(0, datasets[type].length - 1);
  render({ animate: true });
}

function setIndexFromTimelineEvent(evt) {
  const data = getData();
  if (data.length <= 1) return;
  const timeline = document.getElementById('timeline');
  const rect = timeline.getBoundingClientRect();
  const rawRatio = Math.min(1, Math.max(0, (evt.clientX - rect.left) / rect.width));
  const edge = TIMELINE_EDGE_PAD_PCT / 100;
  const ratio = Math.min(1, Math.max(0, (rawRatio - edge) / (1 - edge * 2)));
  state.index = Math.round(ratio * (data.length - 1));
  stopPlay();
  render({ animate: true });
}

document.getElementById('quarterlyBtn').addEventListener('click', () => setPeriodType('quarterly'));
document.getElementById('annualBtn').addEventListener('click', () => setPeriodType('annual'));
document.getElementById('yoyBtn').addEventListener('click', () => {
  state.yoy = !state.yoy;
  render();
});
document.getElementById('timeline').addEventListener('pointerdown', setIndexFromTimelineEvent);
document.getElementById('playBtn').addEventListener('click', () => {
  if (state.playing) stopPlay();
  else startPlay();
});

window.addEventListener('resize', () => {
  window.clearTimeout(window.__sankeyResizeTimer);
  window.__sankeyResizeTimer = window.setTimeout(render, 80);
});

render();
</script>
