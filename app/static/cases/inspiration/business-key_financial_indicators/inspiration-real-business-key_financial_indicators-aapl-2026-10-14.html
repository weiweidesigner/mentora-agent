const root = document.querySelector('.component');

function el(name, attrs = {}, parent = svg) {
  const node = document.createElementNS(NS, name);
  Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
  parent.appendChild(node);
  return node;
}
function fmt(value, decimals = 2, unit = '') {
  if (value === null || value === undefined || Number.isNaN(Number(value))) return '-';
  return `${Number(value).toFixed(decimals)}${unit}`;
}
function hideTip() { tooltip.classList.remove('active'); }
function setTipPosition(anchorX, topGridY = 24) {
  const stageRect = root.querySelector('.stage').getBoundingClientRect();
  const left = Math.max(8, Math.min(stageRect.width - tooltip.offsetWidth - 8, anchorX - tooltip.offsetWidth / 2));
  const arrowH = 8;
  const gap = 6;
  const top = topGridY - tooltip.offsetHeight - arrowH - gap;
  tooltip.style.left = `${left}px`;
  tooltip.style.top = `${top}px`;
  tooltip.style.setProperty('--arrow-left', `${Math.max(14, Math.min(tooltip.offsetWidth - 14, anchorX - left))}px`);
}
function showTipForX(anchorX, row, metric, topGridY = 24) {
  const value = row.values[metric.key];
  const yoy = row.yoy?.[metric.key];
  tooltip.innerHTML = `
    <div class="tip-title">${row.label}</div>
    <div class="tip-row">
      <span class="tip-dot" style="background:#2f63f6"></span>
      <span class="tip-name">${metric.label}</span>
      <span class="tip-value">${fmt(value, metric.decimals, metric.unit)}</span>

    <div class="tip-row">
      <span class="tip-dot" style="background:#ff7043"></span>
      <span class="tip-name">同比</span>
      <span class="tip-value">${fmt(yoy == null ? null : yoy * 100, 2, '%')}</span>
    </div>`;
  setTipPosition(anchorX);
  tooltip.classList.add('active');
}
function showTip(event, row, metric) {
  const stageRect = root.querySelector('.stage').getBoundingClientRect();
  const x = event.clientX - stageRect.left;
  showTipForX(x, row, metric);
}

function buildControls() {
  payload.metrics.forEach(metric => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'metric-tab';
    button.role = 'tab';
    button.textContent = metric.label;
    button.setAttribute('aria-selected', String(metric.key === metricKey));
    button.addEventListener('click', () => { metricKey = metric.key; buildControlsState(); render(); });
    topTabs.appendChild(button);
  });
  Object.entries(payload.views).forEach(([key, view]) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.role = 'tab';
    button.textContent = view.label;
    button.dataset.value = key;
    button.setAttribute('aria-selected', String(key === viewKey));
    button.addEventListener('click', () => { viewKey = key; buildControlsState(); render(); });

  legend.innerHTML = `<span class="legend-item"><span class="legend-dot" style="background:#2f63f6"></span>${metric.label}</span><span class="legend-item"><span class="legend-dot" style="background:#ff7043"></span>同比</span>`;
}
function rangeKey() {
  return viewKey;
}
function getRangeState(count) {
  const key = rangeKey();
  if (!rangeByView[key]) {
    rangeByView[key] = {start:0, end:Math.max(0, count - 1)};
  }
  const state = rangeByView[key];
  const maxIndex = Math.max(0, count - 1);
  state.start = Math.max(0, Math.min(maxIndex, state.start));
  state.end = Math.max(0, Math.min(maxIndex, state.end));
  if (state.start > state.end) {
    state.start = 0;
    state.end = maxIndex;
  }
  return state;
}
function clientXToRangeIndex(clientX, count) {
  const rect = rangeTrack.getBoundingClientRect();
  const ratio = rect.width <= 0 ? 0 : Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  return Math.round(ratio * Math.max(0, count - 1));
}
function updateRangeByPointer(clientX) {
  if (!dragRangeHandle || currentRangeCount <= 1) return;
  const state = getRangeState(currentRangeCount);
  const index = clientXToRangeIndex(clientX, currentRangeCount);
  if (dragRangeHandle === 'start') {
    state.start = Math.min(index, state.end);
  } else {
    state.end = Math.max(index, state.start);
  }
  rangeByView[rangeKey()] = state;

}
function onRangePointerMove(event) {
  event.preventDefault();
  updateRangeByPointer(event.clientX);
}
function onRangePointerUp() {
  dragRangeHandle = null;
  document.removeEventListener('pointermove', onRangePointerMove);
  document.removeEventListener('pointerup', onRangePointerUp);
}
function startRangeDrag(handle, event) {
  if (currentRangeCount <= 1) return;

function initRangeFilter() {

  rangeHandleEnd.addEventListener('pointerdown', event => startRangeDrag('end', event));
  rangeTrack.addEventListener('pointerdown', event => {
    if (event.target.closest('.range-handle')) return;
    const state = getRangeState(currentRangeCount);
    const index = clientXToRangeIndex(event.clientX, currentRangeCount);
    dragRangeHandle = Math.abs(index - state.start) <= Math.abs(index - state.end) ? 'start' : 'end';

function renderRangeFilter(allRows, range) {
  currentRangeCount = allRows.length;
  if (allRows.length <= 1) {

    return;
  }
  rangeFilter.hidden = false;
  const denominator = Math.max(1, allRows.length - 1);
  const leftPct = range.start / denominator * 100;
  const rightPct = range.end / denominator * 100;
  rangeActive.style.left = `${leftPct}%`;
  rangeActive.style.width = `${Math.max(0, rightPct - leftPct)}%`;
  rangeHandleStart.style.left = `${leftPct}%`;
  rangeHandleEnd.style.left = `${rightPct}%`;
  rangeHandleStart.setAttribute('aria-label', `起始周期 ${allRows[range.start]?.label || ''}`);
  rangeHandleEnd.setAttribute('aria-label', `结束周期 ${allRows[range.end]?.label || ''}`);
}

function render() {
  hideTip();
  svg.innerHTML = '';
  const metric = payload.metrics.find(item => item.key === metricKey) || payload.metrics[0];
  const allRows = (payload.views[viewKey]?.records || []).filter(row => row.values?.[metric.key] != null);
  const range = getRangeState(allRows.length);
  renderRangeFilter(allRows, range);
  const rows = allRows.slice(range.start, range.end + 1);
  renderLegend(metric);
  const stage = root.querySelector('.stage');
  const stageRect = stage.getBoundingClientRect();
  const w = Math.max(320, stageRect.width || root.clientWidth);
  const h = Math.max(280, stageRect.height || 380);

  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  const m = {left: 54, right: 52, top: 24, bottom: 56};
  const cw = w - m.left - m.right;
  const ch = h - m.top - m.bottom;
  const values = rows.map(row => Number(row.values[metric.key]));
  const yoyValues = rows.map(row => row.yoy?.[metric.key]).filter(v => v != null).map(v => Number(v) * 100);
  const minValue = Math.min(0, ...values);
  const maxValue = Math.max(0, ...values);
  const valuePad = Math.max((maxValue - minValue) * .18, 1);
  const vMin = minValue < 0 ? minValue - valuePad : 0;
  const vMax = maxValue + valuePad;
  const yMin = Math.min(-10, ...yoyValues, 0);
  const yMax = Math.max(10, ...yoyValues, 0);
  const yPad = Math.max((yMax - yMin) * .18, 20);
  const lMin = yMin - yPad;
  const lMax = yMax + yPad;
  const band = cw / Math.max(rows.length, 1);
  const x = i => m.left + (rows.length <= 1 ? cw / 2 : band * (i + .5));
  const yBar = v => m.top + (vMax - v) / Math.max(vMax - vMin, .0001) * ch;
  const yLine = v => m.top + (lMax - v) / Math.max(lMax - lMin, .0001) * ch;
  const zeroY = yBar(0);
  for (let i = 0; i < 5; i++) {
    const gy = m.top + ch * i / 4;
    el('line', {x1:m.left, y1:gy, x2:w-m.right, y2:gy, class:'grid'});
    const leftVal = lMax - (lMax - lMin) * i / 4;
    const rightVal = vMax - (vMax - vMin) * i / 4;
    el('text', {x:m.left - 10, y:gy + 4, class:'y-label', 'text-anchor':'end'}).textContent = `${leftVal.toFixed(0)}%`;
    el('text', {x:w - m.right + 10, y:gy + 4, class:'y-label'}).textContent = fmt(rightVal, metric.decimals, metric.unit);
  }
  el('line', {x1:m.left, y1:zeroY, x2:w-m.right, y2:zeroY, class:'axis'});
  const barW = Math.max(3, Math.min(42, band * .48));
  const canShowBarValue = band >= 46 && barW >= 18;
  const canShowDots = band >= 18;
  const labelMode = band >= 58 ? 'all' : rows.length <= 3 ? 'all' : 'edge-middle';
  const hoverLayer = el('g', {}, svg);
  const barLayer = el('g', {}, svg);
  const labelLayer = el('g', {}, svg);
  const hoverLeaveHandler = () => {
    hoverLayer.querySelectorAll('.hover-band').forEach(node => node.classList.remove('active'));
    hideTip();
  };
  rows.forEach((row, i) => {
    const cx = x(i);
    const v = Number(row.values[metric.key]);
    const top = yBar(Math.max(v, 0));
    const bottom = yBar(Math.min(v, 0));
    const bandLeft = m.left + band * i;
    const bandWidth = Math.max(8, band);
    const hoverBand = el('rect', {x: bandLeft + 1, y: m.top, width: Math.max(0, bandWidth - 2), height: ch, class:'hover-band'}, hoverLayer);
    const hoverZone = el('rect', {x: bandLeft, y: m.top, width: bandWidth, height: ch, class:'hover-zone'}, hoverLayer);
    el('rect', {x:cx - barW / 2, y:top, width:barW, height:Math.max(1, bottom - top), fill:'#2f63f6', rx:0}, barLayer);
    if (canShowBarValue) {
      el('text', {x:cx, y:top - 7, class:'bar-value'}, labelLayer).textContent = fmt(v, metric.decimals, metric.unit);
    }
    const midIndex = Math.floor((rows.length - 1) / 2);
    const shouldShowLabel = labelMode === 'all' || i === 0 || i === midIndex || i === rows.length - 1;
    if (shouldShowLabel) {
      const label = el('text', {x:cx, y:h - 20, class:'x-label', 'text-anchor':'middle'}, labelLayer);
      label.textContent = row.label;
    }
    const activateHover = () => {
      hoverLayer.querySelectorAll('.hover-band').forEach(node => node.classList.remove('active'));
      hoverBand.classList.add('active');
      const anchorX = (cx / w) * stageRect.width;
      const topGridY = (m.top / h) * stageRect.height;
      showTipForX(anchorX, row, metric, topGridY);
    };
    hoverZone.addEventListener('mouseenter', activateHover);
    hoverZone.addEventListener('mousemove', activateHover);
    hoverZone.addEventListener('mouseleave', hoverLeaveHandler);
  });
  const lineRows = rows.map((row, i) => ({row, i, yoy:row.yoy?.[metric.key]})).filter(item => item.yoy != null);
  if (lineRows.length) {
    let d = '';
    lineRows.forEach((item, idx) => {
      const px = x(item.i);
      const py = yLine(Number(item.yoy) * 100);
      d += `${idx ? 'L' : 'M'}${px},${py}`;
    });
    el('path', {d, fill:'none', stroke:'#ff7043', 'stroke-width':2});
    lineRows.forEach(item => {
      const cx = x(item.i);
      const cy = yLine(Number(item.yoy) * 100);

  }
}
