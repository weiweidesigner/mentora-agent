<!doctype html>
<html lang="zh-CN">
<head><script src="/static/cases/theme.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AAPL 2026 年财报披露与重要公司公告时间线（截至 2026-10-14）</title>
<style>
:root{
  --tl-page-bg:transparent;
  --tl-surface:transparent;
  --tl-text:#0F172A;
  --tl-muted:#64748B;
  --tl-line:#2563EB;
  --tl-button-bg:rgba(255,255,255,.94);
  --tl-button-border:rgba(15,23,42,.12);
  --tl-shadow:0 7px 20px rgba(15,23,42,.12);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:0;
  background:var(--tl-page-bg);
  color:var(--tl-text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  overflow-x:hidden;
  overflow-y:visible;
}
#container{
  position:relative;
  width:100%;
  height:auto;
  min-height:0;
  overflow:visible;
  background:var(--tl-surface);
}
#title{
  position:relative;
  top:auto;
  left:auto;
  right:auto;
  width:auto;
  margin:0 52px 0 16px;
  padding-top:16px;
  z-index:10;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:18px;
  line-height:28px;
  font-weight:760;
  letter-spacing:-.01em;
  pointer-events:none;
}
#fullscreenBtn,#exitFullscreenBtn{
  position:absolute;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  width:26px;
  height:26px;
  padding:0;
  border:1px solid var(--tl-button-border);
  border-radius:7px;
  background:var(--tl-button-bg);
  color:#334155;
  box-shadow:var(--tl-shadow);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
#fullscreenBtn{right:14px;top:17px}
#exitFullscreenBtn{right:14px;top:14px}
#fullscreenBtn svg,#exitFullscreenBtn svg{
  width:14px;
  height:14px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
#viewport{
  position:relative;
  inset:auto;
  width:100%;
  padding:8px 0 24px 16px;
  overflow-x:auto;
  overflow-y:hidden;
  overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;
}
#root{
  width:100%;
  min-width:0;
  display:block;
  text-align:left;
}
.timeline{
  --axis-x:88px;
  --gap-x:18px;
  --content-width:560px;
  position:relative;
  width:fit-content;
  min-width:0;
  margin:0;
  padding:4px 0 16px;
  transform:none;
}
.timeline-line{
  position:absolute;
  left:calc(var(--axis-x) + var(--gap-x)/2);
  top:0;
  width:2px;
  height:0;
  border-radius:2px;
  background:#2563EB;
  transform:translateX(-1px);
}
.entry{
  --title-line:21px;
  position:relative;
  display:grid;
  grid-template-columns:var(--axis-x) var(--gap-x) var(--content-width, 560px);
  align-items:start;
  min-height:58px;
  margin:16px 0;
}
.date{
  grid-column:1;
  padding-right:8px;
  color:var(--tl-muted);
  text-align:right;
  font-size:13px;
  line-height:var(--title-line);
  font-weight:600;
  white-space:nowrap;
  overflow:visible;
  text-overflow:clip;
}
.axis{grid-column:2;position:relative;height:100%;min-height:var(--title-line)}
.dot{
  position:absolute;
  left:50%;
  top:calc(var(--title-line)/2);
  width:12px;
  height:12px;
  border:3px solid #2563EB;
  border-radius:50%;
  background:#FFFFFF;
  box-shadow:0 0 0 4px rgba(37,99,235,.10);
  transform:translate(-50%,-50%);
}
.content{
  grid-column:3;
  min-width:0;
  margin-left:8px;
  padding:0;
  border:0;
  border-radius:0;
  background:transparent;
  box-shadow:none;
}
.item-title{
  color:var(--tl-text);
  font-size:14px;
  line-height:var(--title-line);
  font-weight:720;
  overflow-wrap:anywhere;
}
.description{
  margin-top:4px;
  color:#475569;
  font-size:13px;
  line-height:1.6;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}
.description:empty{display:none}
.empty{
  width:100%;
  margin:8px 0;
  padding:22px;
  border:1px dashed #CBD5E1;
  border-radius:10px;
  color:var(--tl-muted);
  text-align:center;
  font-size:13px;
  background:rgba(248,250,252,.66);
}
@media(max-width:720px){
  #container{height:auto;min-height:0;max-height:none}
  #title{margin:0 46px 0 0;padding-top:10px;font-size:16px;line-height:26px}
  #fullscreenBtn{display:inline-flex;top:10px;right:8px}
  #viewport{inset:auto;padding:6px 0 18px 0}
  .timeline{--axis-x:80px;--gap-x:18px;--content-width:220px}
  .entry{min-height:54px;margin:14px 0}
  .date{padding-right:8px;font-size:12px}
  .content{margin-left:8px;padding:0;width:100%}
  .item-title{font-size:13px}
  .description{font-size:12px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
  .dot{width:11px;height:11px}
}
@media(max-width:420px){
  .timeline{--axis-x:80px;--gap-x:18px}
  .date{font-size:11px}
}
@media(min-width:721px){#fullscreenBtn{display:none!important}}
body.is-fullscreen{
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#F8FAFC;
}
body.is-fullscreen #container{
  position:fixed;
  inset:0;
  z-index:9999;
  width:100vw;
  height:100vh;
  min-height:0;
  max-height:none;
  background:#FFFFFF;
}
body.is-fullscreen #title{
  position:absolute;
  top:14px;
  left:0;
  right:52px;
  width:auto;
  margin:0;
  padding:0;
  transform:none;
  font-size:16px;
}
body.is-fullscreen #fullscreenBtn{display:none!important}
body.is-fullscreen #exitFullscreenBtn{display:inline-flex}
body.is-fullscreen #viewport{
  position:absolute;
  inset:52px 0 0;
  width:auto;
  padding:8px 0 24px 0;
  overflow:auto;
}
body.is-fullscreen .timeline{
  width:fit-content;
  margin:0;
  --axis-x:88px;
  --gap-x:18px;
}
body.is-fullscreen.is-forced-landscape #container{
  width:100vh;
  height:100vw;
  left:50%;
  top:50%;
  right:auto;
  bottom:auto;
  transform:translate(-50%,-50%) rotate(90deg);
  transform-origin:center center;
}
</style>

<body>
<div id="container" data-timeline-container="true">

<script>
const items=[{"date": "2026-01-12", "title": "服务业务年度成绩更新", "description": "Apple 公布 2025 年服务业务创纪录：App Store 全球周均用户超 8.5 亿，开发者自 2008 年累计收入超 5,500 亿美元，Apple Pay 覆盖 89 个市场。\n来源：Apple Newsroom（apple.com/newsroom，2026-01-12）。", "colorIndex": 3, "style": {}}, {"date": "2026-01-29", "title": "Q1 FY2026 财报披露（假日季）", "description": "报告期截至 2025-12-27。营收 1,438 亿美元、同比 +16%；摊薄 EPS 2.84 美元、同比 +19%；净利润 421 亿美元（第三方摘要口径）；iPhone 与服务创同期新高，活跃设备装机量超 25 亿台。同日董事会宣派季度股息 0.26 美元/股。\n来源：Apple Newsroom Q1 FY2026 业绩稿；SEC Form 8-K（Item 2.02/9.01，2026-01-29）。", "colorIndex": 0, "style": {}}, {"date": "2026-02-12", "title": "Q1 FY2026 股息支付（0.26 美元/股）", "description": "登记日 2026-02-09，支付日 2026-02-12，每股 0.26 美元。当日盘面出现 -5.00% 的除息/回调（自 275.50 跌至 261.73 美元）。\n来源：Apple Newsroom Q1 FY2026 业绩稿（董事会宣派口径）。", "colorIndex": 1, "style": {}}, {"date": "2026-04-20", "title": "CEO 交接公告：John Ternus 接任", "description": "Apple 宣布 Tim Cook 转任执行董事长，John Ternus 出任 CEO 并加入董事会，2026-09-01 生效；Arthur Levinson 同日转任首席独立董事。\n来源：Apple Newsroom CEO 交接公告；SEC Form 8-K（Item 5.02，2026-04-20）。", "colorIndex": 2, "style": {}}, {"date": "2026-04-30", "title": "Q2 FY2026 财报 + 股息上调 + 千亿美元回购授权", "description": "营收 1,112 亿美元，净利润 296 亿美元，摊薄 EPS 2.01 美元，毛利率 49.3%，经营现金流超 280 亿美元。董事会将季度股息由 0.26 上调至 0.27 美元/股（+4%），并额外授权最高 1,000 亿美元回购。次日（05-01）股价 +3.24%。\n来源：Apple Newsroom Q2 FY2026 业绩稿；SEC Form 8-K（2026-04-30）与 Form 10-Q。", "colorIndex": 0, "style": {}}, {"date": "2026-05-14", "title": "Q2 FY2026 股息支付（0.27 美元/股）", "description": "登记日 2026-05-11，支付日 2026-05-14，每股 0.27 美元（上调后首次派发）。\n来源：Apple Newsroom Q2 FY2026 业绩稿；SEC Form 10-Q（aapl-20260328）。", "colorIndex": 1, "style": {}}, {"date": "2026-06-08", "title": "WWDC 2026 主题演讲（会期至 06-12）", "description": "Apple Park 主题演讲发布 iOS 27 / iPadOS 27 / macOS 27、改版 AI Siri 与 Liquid Glass 可读性改进；多家现场报道称这是 Tim Cook 以 CEO 身份主持的最后一次 WWDC。次日（06-09）股价 -3.64%。\n来源：WWDC 2026 现场直播汇总（媒体报道，非官方业绩稿）。", "colorIndex": 3, "style": {}}, {"date": "2026-07-30", "title": "Q3 FY2026 财报披露", "description": "报告期截至 2026-06-27。营收 1,094 亿美元、同比 +16%；毛利率 50.1%（含约 2 个百分点关税退款利好）；摊薄 EPS 2.02 美元、同比 +29%（含 0.11 美元关税退款）；净利润 298 亿美元。季度股息维持 0.27 美元/股。次日（07-31）股价 -7.35%，为年内最大单日跌幅。\n来源：Apple Newsroom Q3 FY2026 业绩稿；SEC Form 10-Q（aapl-20260627）。", "colorIndex": 0, "style": {}}, {"date": "2026-08-13", "title": "Q3 FY2026 股息支付（0.27 美元/股）", "description": "登记日 2026-08-10，支付日 2026-08-13，每股 0.27 美元，未见再次上调。\n来源：Apple Newsroom Q3 FY2026 业绩稿；SEC Form 10-Q（aapl-20260627）。", "colorIndex": 1, "style": {}}, {"date": "2026-09-01", "title": "John Ternus 正式接任 CEO", "description": "CEO 交接生效：John Ternus 出任 Apple CEO，Tim Cook 转任执行董事长，管理层完成代际过渡。\n来源：Apple Newsroom CEO 交接公告；SEC Form 8-K（Item 5.02，2026-04-20）。", "colorIndex": 2, "style": {}}, {"date": "2026-11-02", "title": "Q4 FY2026 财报电话会（已排期、尚未发生）", "description": "Apple IR 列示 Q4 FY2026 业绩电话会为 2026-11-02 14:00 PT / 17:00 ET。截至 2026-10-14，该季业绩稿与对应 SEC 8-K 均未发布，Q4 股息亦未宣派。\n来源：Apple Investor Relations 财报电话会页面。", "colorIndex": 4, "style": {}}];
const config={"palette": [{"accent": "#2563EB", "soft": "#EFF6FF", "border": "#BFDBFE", "title": "#1E3A8A"}, {"accent": "#059669", "soft": "#ECFDF5", "border": "#A7F3D0", "title": "#065F46"}, {"accent": "#EA580C", "soft": "#FFF7ED", "border": "#FED7AA", "title": "#9A3412"}, {"accent": "#7C3AED", "soft": "#F5F3FF", "border": "#DDD6FE", "title": "#5B21B6"}, {"accent": "#0891B2", "soft": "#ECFEFF", "border": "#A5F3FC", "title": "#155E75"}], "colorMode": "custom", "emptyText": "暂无时间轴数据"};
const root=document.getElementById("root");
const container=document.getElementById("container");
const viewport=document.getElementById("viewport");
const fullscreenBtn=document.getElementById("fullscreenBtn");
const exitFullscreenBtn=document.getElementById("exitFullscreenBtn");

function safeColor(value,fallback){
  return typeof value==="string"&&/^#[0-9a-f]{3}(?:[0-9a-f]{3})?$/i.test(value)?value:fallback;
}
function styleForItem(item,index){
  const palette=Array.isArray(config.palette)&&config.palette.length?config.palette:[{}];
  let paletteIndex=0;
  if(config.colorMode!=="single"){
    paletteIndex=Number.isInteger(item.colorIndex)?item.colorIndex:index;
  }
  const base=palette[((paletteIndex%palette.length)+palette.length)%palette.length]||{};
  const override=item&&item.style&&typeof item.style==="object"?item.style:{};
  return {
    accent:safeColor(override.accent,safeColor(base.accent,"#2563EB")),
    soft:safeColor(override.soft,safeColor(base.soft,"#EFF6FF")),
    border:safeColor(override.border,safeColor(base.border,"#BFDBFE")),
    title:safeColor(override.title,safeColor(base.title,"#1E3A8A"))
  };
}
function makeElement(tag,className,text){
  const element=document.createElement(tag);
  if(className) element.className=className;
  if(text!==undefined&&text!==null) element.textContent=String(text);
  return element;
}
function alignTimelineLine(){
  const timeline=root.querySelector(".timeline");
  const line=timeline?timeline.querySelector(".timeline-line"):null;
  const dots=timeline?[...timeline.querySelectorAll(".dot")]:[];
  if(!timeline||!line||!dots.length) return;
  const timelineRect=timeline.getBoundingClientRect();
  const firstRect=dots[0].getBoundingClientRect();
  const lastRect=dots[dots.length-1].getBoundingClientRect();
  const firstCenter=firstRect.top+firstRect.height/2-timelineRect.top;
  const lastCenter=lastRect.top+lastRect.height/2-timelineRect.top;
  line.style.top=`${firstCenter}px`;
  line.style.height=`${Math.max(0,lastCenter-firstCenter)}px`;
}
function intrinsicTextWidth(element){
  if(!element) return 0;
  try{
    const range=document.createRange();
    range.selectNodeContents(element);
    const width=range.getBoundingClientRect().width;
    if(Number.isFinite(width)&&width>0) return Math.ceil(width);
  }catch(e){}
  const text=element.textContent||"";
  const canvas=intrinsicTextWidth.canvas||(intrinsicTextWidth.canvas=document.createElement("canvas"));
  const context=canvas.getContext("2d");
  if(!context) return 0;
  const styles=getComputedStyle(element);
  context.font=`${styles.fontWeight} ${styles.fontSize} ${styles.fontFamily}`;
  return Math.ceil(context.measureText(text).width);
}
function updateTimelineSizing(){
  const timeline=root.querySelector(".timeline");
  if(!timeline||!viewport) return;

  const dates=[...timeline.querySelectorAll(".date")];
  const mobile=viewport.clientWidth<=720;
  if(dates.length){
    // Measure the text itself instead of the grid cell width. Measuring
    // scrollWidth caused a feedback loop where every resize made the date
    // column wider again, producing the large blank area before the axis.
    const widestDate=Math.max(...dates.map(intrinsicTextWidth));
    const axisPadding=mobile?8:10;
    const axisWidth=Math.max(1,widestDate+axisPadding);
    timeline.style.setProperty("--axis-x",`${axisWidth}px`);
  }else{
    timeline.style.removeProperty("--axis-x");
  }

  const styles=getComputedStyle(timeline);
  const axisWidth=parseFloat(styles.getPropertyValue("--axis-x"))||88;
  const gapWidth=parseFloat(styles.getPropertyValue("--gap-x"))||18;
  const contentMargin=8;
  const outerAllowance=mobile?8:16;
  const available=Math.max(160,viewport.clientWidth-axisWidth-gapWidth-contentMargin-outerAllowance);
  timeline.style.setProperty("--content-width",`${available}px`);
}
function renderTimeline(){
  root.replaceChildren();
  if(!Array.isArray(items)||!items.length){
    root.appendChild(makeElement("div","empty",config.emptyText||"暂无时间轴数据"));
    sendTimelineHeight();
    return;
  }
  const timeline=makeElement("div","timeline");
  timeline.appendChild(makeElement("div","timeline-line"));
  items.forEach((item,index)=>{
    const entry=makeElement("article","entry");

    entry.appendChild(makeElement("div","date",item.date||""));
    const axis=makeElement("div","axis");
    axis.appendChild(makeElement("div","dot"));
    entry.appendChild(axis);

    const content=makeElement("div","content");
    content.appendChild(makeElement("div","item-title",item.title||item.date||`事件 ${index+1}`));
    content.appendChild(makeElement("div","description",item.description||""));
    entry.appendChild(content);
    timeline.appendChild(entry);
  });
  root.appendChild(timeline);
  requestAnimationFrame(()=>{
    updateTimelineSizing();
    alignTimelineLine();
    sendTimelineHeight();
  });
}
function sendTimelineHeight(){
  if(document.body.classList.contains("is-fullscreen")) return;
  // The document and body heights are at least as tall as the iframe viewport.
  // Reading them here makes an oversized iframe self perpetuating. The
  // container is height:auto, so its border box is the actual timeline height.
  const rect=container?container.getBoundingClientRect():null;
  const height=Math.ceil(Math.max(rect?rect.height:0,1));
  try{parent.postMessage({type:"analysis-planner-report-height",height},"*");}catch(e){}
}
function updateFullscreenLayout(){
  const active=document.body.classList.contains("is-fullscreen");
  const needsForcedLandscape=active&&window.innerHeight>window.innerWidth;
  document.body.classList.toggle("is-forced-landscape",needsForcedLandscape);
}
function lockLandscape(){
  try{
    const orientation=screen.orientation;
    if(orientation&&typeof orientation.lock==="function") orientation.lock("landscape").catch(()=>{});
  }catch(e){}
}
function unlockOrientation(){
  try{
    const orientation=screen.orientation;
    if(orientation&&typeof orientation.unlock==="function") orientation.unlock();
  }catch(e){}
}
function refreshLayout(){
  updateFullscreenLayout();
  requestAnimationFrame(()=>{
    updateTimelineSizing();
    alignTimelineLine();
    sendTimelineHeight();
  });
}
async function enterFullscreen(){
  document.body.classList.add("is-fullscreen");
  updateFullscreenLayout();
  const target=document.documentElement||document.body;
  try{
    if(target.requestFullscreen) await target.requestFullscreen();
    else if(target.webkitRequestFullscreen) target.webkitRequestFullscreen();
  }catch(e){}
  lockLandscape();
  setTimeout(refreshLayout,80);
  setTimeout(refreshLayout,320);
}
function exitFullscreen(){
  document.body.classList.remove("is-fullscreen","is-forced-landscape");
  unlockOrientation();
  try{
    if(document.fullscreenElement&&document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitFullscreenElement&&document.webkitExitFullscreen) document.webkitExitFullscreen();
  }catch(e){}
  setTimeout(refreshLayout,80);
  setTimeout(refreshLayout,320);
}
fullscreenBtn.addEventListener("click",enterFullscreen);
exitFullscreenBtn.addEventListener("click",exitFullscreen);
document.addEventListener("fullscreenchange",()=>{
  if(!document.fullscreenElement){
    document.body.classList.remove("is-fullscreen","is-forced-landscape");
    unlockOrientation();
    refreshLayout();
  }
});
document.addEventListener("webkitfullscreenchange",()=>{
  if(!document.webkitFullscreenElement){
    document.body.classList.remove("is-fullscreen","is-forced-landscape");
    unlockOrientation();
    refreshLayout();
  }
});
window.addEventListener("resize",refreshLayout);
window.addEventListener("orientationchange",()=>{setTimeout(refreshLayout,120);setTimeout(refreshLayout,420)});
renderTimeline();
setTimeout(refreshLayout,120);
setTimeout(refreshLayout,500);
setTimeout(sendTimelineHeight,900);
if(document.fonts&&document.fonts.ready){
  document.fonts.ready.then(()=>{refreshLayout();sendTimelineHeight();}).catch(()=>{});
}
if("ResizeObserver" in window){
  try{
    const heightObserver=new ResizeObserver(()=>{
      requestAnimationFrame(()=>{
        alignTimelineLine();
        sendTimelineHeight();
      });
    });
    heightObserver.observe(root);
  }catch(e){}
}
</script>

<script id="genericMobileTouch">
(() => {
