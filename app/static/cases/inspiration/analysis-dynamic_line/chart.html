  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0b0e14;

    }

    #wrap {
      position: relative;
      width: 100%;

        radial-gradient(circle at top, rgba(30, 64, 175, 0.16), transparent 36%),

    .timeLabel .md {

    #sliderWrap {
      position: relative;

      height: 22px;
      display: flex;
      align-items: center;
      min-width: 0;
    }

    #sliderTrack {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 4px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.18);
      pointer-events: none;
    }

    #sliderProgress {

      left: 0;

    #timelineRange {
      position: relative;
      width: 100%;

      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      height: 22px;
      cursor: pointer;
      z-index: 2;
    }

    #timelineRange::-webkit-slider-runnable-track {
      height: 4px;
      background: transparent;
      border-radius: 999px;
    }

<script>
const mobileLegendSelection={};

let dynamicFullRangeCache=null;
function getDynamicFullRange(){
 if(dynamicFullRangeCache)return dynamicFullRangeCache;
 const values=Object.values(fullSeriesDataMap).flat().filter(value=>value!==null&&value!==undefined&&value!=='').map(Number).filter(Number.isFinite);
 if(!values.length)return {};
 const low=Math.min(...values),high=Math.max(...values),span=high-low;
 const pad=span>0?span*.02:Math.max(1,Math.abs(high)*.06);
 const target=(span+2*pad)/4,power=Math.pow(10,Math.floor(Math.log10(target)));
 const steps=[1,2,2.5,5,10,20].map(n=>n*power);
 let step=steps.find(n=>n>=target)||steps.at(-1),min,max;
 for(const candidate of steps.filter(n=>n>=step)){
  step=candidate;
  min=Math.floor((low-pad)/(step/2))*(step/2);
  max=min+4*step;
  if(max>=high+pad)break;
 }
 dynamicFullRangeCache={min:Number(min.toPrecision(12)),max:Number(max.toPrecision(12)),interval:step};
 return dynamicFullRangeCache;
}
function getDynamicPlayerBottom(){return Math.ceil(document.getElementById('timelineBar').getBoundingClientRect().height)+24;}
function alignDynamicPlayer(){
 const wrap=document.getElementById('wrap');
 wrap.style.setProperty('--dynamic-player-left','0px');
 wrap.style.setProperty('--dynamic-player-right','0px');
}

function updateMobileDynamicHeader(){
 let header=document.querySelector('.mobileDynamicHeader');
 if(!header){header=document.createElement('div');header.className='mobileDynamicHeader';document.getElementById('wrap').append(header);}
 const compact=isCompactLayout();header.hidden=false;
 header.replaceChildren();
 const heading=document.createElement('div');heading.className='mobileDynamicTitle';heading.textContent=title;heading.style.color=window.__projectDynamicLineTheme.text;header.append(heading);
 const legend=document.createElement('div');legend.className='mobileDynamicLegend';legend.style.color=window.__projectDynamicLineTheme.muted;
 seriesList.forEach((name,index)=>{
  const button=document.createElement('button');button.type='button';button.title=name;button.setAttribute('aria-pressed',String(mobileLegendSelection[name]!==false));
  const marker=document.createElement('i');marker.style.background=colorPalette[index%colorPalette.length].line;
  const label=document.createElement('span');label.textContent=name.replace(/（(.*?)）/g,'·$1');
  const value=document.createElement('b'),data=fullSeriesDataMap[name]||[],point=getLastValidPoint(data.slice(0,Math.min(getSafeIndex(),data.length-1)+1));value.textContent=point?formatPlainValue(point.value):'—';
  button.append(marker,label,value);button.onclick=()=>{mobileLegendSelection[name]=mobileLegendSelection[name]===false;renderChart();};legend.append(button);
 });
 header.append(legend);
 const height=Math.ceil(header.getBoundingClientRect().height)+250+10+getDynamicPlayerBottom();
 const wrap=document.getElementById('wrap');
 if(compact && wrap.style.getPropertyValue('--mobile-dynamic-height')!==height+'px'){wrap.style.setProperty('--mobile-dynamic-height',height+'px');chart.resize();}
}
</script>
<script>
    const chart = echarts.init(document.getElementById('chart'));
    const chartDom = document.getElementById('chart');
    const errorBox = document.getElementById('errorBox');

    const title = "财务指标演进（演示数据）";
    const unit = "";
    const xKey = "time";
    const yKey = "value";
    const seriesKey = "name";
    const rows = [];
    const seriesList = ["营收","净利润"];
    const xList = ["Q1","Q2","Q3","Q4"];
    const bgmDataUri = "";
    const bgmFilename = "";

    function estimateLegendRows() {
      const compact = isCompactLayout();
      const width = chart.getWidth() || chartDom.clientWidth || 320;
      const usableWidth = Math.max(120, width - (compact ? 24 : 32));
      const averageItemWidth = compact ? 92 : 124;
      return Math.max(1, Math.ceil((seriesList.length * averageItemWidth) / usableWidth));
    }

    function dynamicChartLayout() {
      const compact = isCompactLayout();
      const legendTop = compact ? 40 : 46;
      const legendRows = estimateLegendRows();
      const legendRowHeight = compact ? 20 : 22;
      return {
        legendTop,
        legendLeft: 0,
        legendRight: 0,
        gridLeft: 0,
        gridRight: 12,
        gridTop: document.querySelector('.mobileDynamicHeader').offsetHeight + 16,
        gridBottom: getDynamicPlayerBottom()
      };
    }

    const playBtn = document.getElementById('playBtn');
    const speedBtn = document.getElementById('speedBtn');
    const timelineRange = document.getElementById('timelineRange');
    const sliderProgress = document.getElementById('sliderProgress');
    const startLabel = document.getElementById('startLabel');
    const endLabel = document.getElementById('endLabel');
    const musicBtn = document.getElementById('musicBtn');
    const bgmAudio = document.getElementById('bgmAudio');

    const speedPresets = [
      { label: '1x', interval: 700 },
      { label: '2x', interval: 350 },
      { label: '3x', interval: 230 }
    ];

    function showError(message) {
      chartDom.style.display = 'none';
      document.getElementById('timelineBar').style.display = 'none';
      errorBox.style.display = 'block';
      errorBox.textContent = '渲染失败：' + message;
    }

    function numberLocale() {
      const localeText = [title, unit, xKey, yKey, seriesKey, ...seriesList].filter(Boolean).join(' ');
      if (/[\u4e00-\u9fff]/.test(localeText)) return 'zh-CN';
      if (/[\u3040-\u30ff]/.test(localeText)) return 'ja-JP';
      if (/[\uac00-\ud7af]/.test(localeText)) return 'ko-KR';
      return 'en-US';
    }

    function trimCompactZeros(text) {
      return String(text).replace(/\.0+$/, '').replace(/(\.\d*?)0+$/, '$1');
    }

    function compactNumber(value) {
      const num = Number(value);
      if (!Number.isFinite(num)) return String(value ?? '-');
      const locale = numberLocale();
      const abs = Math.abs(num);
      let scaled = num;
      let compactUnit = '';
      const cjkUnits = locale === 'ja-JP'
        ? [['兆', 1e12], ['億', 1e8], ['万', 1e4]]
        : locale === 'ko-KR'
          ? [['조', 1e12], ['억', 1e8], ['만', 1e4]]
          : locale === 'zh-CN'
            ? [['万亿', 1e12], ['亿', 1e8], ['万', 1e4]]
            : null;
      if (cjkUnits) {
        const matched = cjkUnits.find(([, threshold]) => abs >= threshold);
        if (matched) {
          compactUnit = matched[0];
          scaled = num / matched[1];
        }
      } else if (abs >= 1e4) {
        if (abs >= 1e12) { scaled = num / 1e12; compactUnit = 'T'; }
        else if (abs >= 1e9) { scaled = num / 1e9; compactUnit = 'B'; }
        else if (abs >= 1e6) { scaled = num / 1e6; compactUnit = 'M'; }
        else { scaled = num / 1e3; compactUnit = 'K'; }
      }
      const digits = Math.abs(scaled) >= 100 ? 0 : Math.abs(scaled) >= 10 ? 1 : 2;
      const fixed = trimCompactZeros(scaled.toFixed(digits));
      return new Intl.NumberFormat(locale, { maximumFractionDigits: digits }).format(Number(fixed)) + compactUnit;
    }

    function formatValue(value) {
      if (value === null || value === undefined || value === '') return '-';
      return `${compactNumber(value)}${unit}`;
    }

    function formatPlainValue(value) {
      if (value === null || value === undefined || value === '') return '-';
      return compactNumber(value);
    }

    function formatDateParts(value) {
      if (!value) return { md: '', yy: '' };
      const s = String(value);
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (m) {
        return { md: `${m[2]}-${m[3]}`, yy: m[1] };
      }
      return { md: s, yy: '' };
    }

    function setTimeLabel(el, value) {
      const parts = formatDateParts(value);
      el.innerHTML = `<span class="md">${parts.md}</span><span class="yy">${parts.yy}</span>`;
    }

    function isCompactLayout() {
      return window.innerWidth <= 768;
    }

    function rowValueToNumber(value) {
      if (value === null || value === undefined || value === '') return null;
      const num = Number(value);
      return Number.isFinite(num) ? num : null;
    }

    const colorPalette = [
      { line: '#18e0b5', areaTop: 'rgba(24, 224, 181, 0.20)', areaBottom: 'rgba(24, 224, 181, 0)' },
      { line: '#4c97ff', areaTop: 'rgba(76, 151, 255, 0.18)', areaBottom: 'rgba(76, 151, 255, 0)' },
      { line: '#9b6bff', areaTop: 'rgba(155, 107, 255, 0.18)', areaBottom: 'rgba(155, 107, 255, 0)' },
      { line: '#f59e0b', areaTop: 'rgba(245, 158, 11, 0.18)', areaBottom: 'rgba(245, 158, 11, 0)' },
      { line: '#ec4899', areaTop: 'rgba(236, 72, 153, 0.18)', areaBottom: 'rgba(236, 72, 153, 0)' },
      { line: '#b4d93b', areaTop: 'rgba(180, 217, 59, 0.18)', areaBottom: 'rgba(180, 217, 59, 0)' },
      { line: '#ff6b4a', areaTop: 'rgba(255, 107, 74, 0.18)', areaBottom: 'rgba(255, 107, 74, 0)' }
    ];

    const fullSeriesDataMap = {"营收":[100.0,120.0,135.0,150.0],"净利润":[20.0,26.0,30.0,36.0]};

        left=side==='right'?anchor+14:anchor-width-14;
        tip.style.top=Math.max(1,Math.min(placement.parentHeight-placement.height-1,y-placement.height/2))+'px';
      }
    }
    left=Math.max(8,Math.min(Math.max(8,viewport-width-8),left));
    tip.style.left=left+'px';tip.style.setProperty('--arrow-left',Math.max(14,Math.min(width-14,anchor-left))+'px');
    if(placement.outer){
      const {portal,host,left:originX,top:originY,width:w,height:h}=placement.outer;
      let px=originX+anchor-w/2,py=originY+parseFloat(tip.style.top||'0');
      if(!active.matches('.hit-area')){
        if(active.matches('.treemap-cell')){px=originX+anchor+14;py=event.clientY+14;}
        else{const side=anchor<viewport/2?'right':'left';portal.dataset.side=side;px=side==='right'?originX+anchor+14:originX+anchor-w-14;py=event.clientY-h/2;}
      }
      px=Math.max(8,Math.min(host.innerWidth-w-8,px));py=Math.max(8,Math.min(host.innerHeight-h-8,py));
      portal.style.left=px+'px';portal.style.top=py+'px';portal.style.setProperty('--local-tip-arrow-x',Math.max(14,Math.min(w-14,originX+anchor-px))+'px');
    }
  };
  const direction = (state,x,y) => {
    if(state.direction==='pending'){
      const dx=Math.abs(x-state.x),dy=Math.abs(y-state.y);
      if(Math.max(dx,dy)>6)state.direction=dx>=dy?'horizontal':'vertical';
    }
    return state.direction;
  };
  const selectCanvas = event => {
    const dom=event.target?.closest?.('#chart')||event.target?.closest?.('canvas')?.parentElement?.closest('#chart');
    const instance=dom&&window.echarts?.getInstanceByDom(dom);
    if(!instance)return false;
    const now=performance.now();
    if(!canvasState||canvasState.instance!==instance){
      clear(event);
      canvasState={instance,dom,updated:-Infinity,selected:null};
    }
    const state=canvasState;
    if(now-state.updated>160){state.option=instance.getOption();state.rect=dom.getBoundingClientRect();state.updated=now;}
    const option=state.option,tooltipOption=option.tooltip?.[0];
    // Respect components which intentionally have no tooltip (dynamic line).
    if(tooltipOption?.show===false){canvasState=null;return false;}
    const x=(event.clientX-state.rect.left)*instance.getWidth()/state.rect.width;
    const y=(event.clientY-state.rect.top)*instance.getHeight()/state.rect.height;
    if(!instance.containPixel({gridIndex:0},[x,y]))return false;
    let nearest=null,distance=Infinity;
    (option.series||[]).forEach((series,seriesIndex)=>{
      if(!Array.isArray(series.data))return;
      if(series.type==='bar'){
        const category=instance.convertFromPixel({seriesIndex},[x,y]);
        const categoryAxis=option.yAxis?.[0]?.type==='category'?1:0;
        const index=Math.round(Array.isArray(category)?category[categoryAxis]:category);
        if(index>=0&&index<series.data.length)nearest={seriesIndex,dataIndex:index};
      }else if(series.type==='scatter'||series.type==='line'){
        series.data.forEach((item,dataIndex)=>{
          const value=item?.value??item,point=instance.convertToPixel({seriesIndex},Array.isArray(value)?value.slice(0,2):[dataIndex,value]);
          if(!Array.isArray(point)||!point.every(Number.isFinite))return;
          const d=(point[0]-x)**2+(point[1]-y)**2;
          if(d<distance){distance=d;nearest={seriesIndex,dataIndex};}
        });
      }
    });
    if(!nearest)return false;
    const key=nearest.seriesIndex+':'+nearest.dataIndex;
    if(state.selected!==key){instance.dispatchAction({type:'downplay'});instance.dispatchAction({type:'highlight',...nearest});state.selected=key;}
    if(state.contentKey!==key||state.contentAt!==state.updated){
      instance.dispatchAction({type:'showTip',...nearest,position:[x,y]});state.contentKey=key;state.contentAt=state.updated;
    }
    const tip=dom.querySelector('.generic-canvas-tooltip');
    if(tip){
      if(!state.outer||state.content!==tip.innerHTML){state.outer=showLocalPortal(tip,state.rect);state.content=tip.innerHTML;}
      tip.style.setProperty('visibility','hidden','important');
      if(state.outer){
        const {portal,host,left:originX,top:originY,width:w,height:h}=state.outer;
        portal.style.left=Math.max(8,Math.min(host.innerWidth-w-8,originX+x-w/2))+'px';
        portal.style.top=Math.max(8,Math.min(host.innerHeight-h-8,originY+y-h-14))+'px';
      }
    }
    return true;
  };

  const select = event => {
    if(selectCanvas(event))return;
    const target=document.elementFromPoint(event.clientX,event.clientY)?.closest(hits)||event.target?.closest(hits)||null;
    if(target!==active){clear(event);active=target;emit(active,'mouseenter',event);}
    // Keep the data DOM stable within one datum; only move the floating layer.
    followTooltip(event);
  };
  document.addEventListener('pointerdown',event=>{
    if(event.pointerType==='touch')clear(event);
    if(event.pointerType!=='touch'||event.target.closest?.('.markmap,.range-shell,button,input'))return;
    if(!event.target.closest?.('svg,canvas,.treemap-cell,#chart'))return;
    gesture={id:event.pointerId,x:event.clientX,y:event.clientY,direction:'pending'};
    select(event);
  },{capture:true,passive:true});
  document.addEventListener('pointermove',event=>{
    if(!gesture||event.pointerId!==gesture.id)return;
    const mode=direction(gesture,event.clientX,event.clientY);
    if(mode==='vertical'){clear(event);event.stopImmediatePropagation();return;
    }
    if(mode==='horizontal'){select(event);if(canvasState)event.stopImmediatePropagation();}
  },{capture:true,passive:true});
  document.addEventListener('pointerup',event=>{
    if(!gesture||event.pointerId!==gesture.id)return;
    if(gesture.direction!=='vertical')select(event);
    gesture=null;
    dismissTimer=setTimeout(dismiss,1200);
  },{passive:true});
  document.addEventListener('pointercancel',event=>{gesture=null;clear(event);},{passive:true});
  // Track the touch stream independently: pointercancel happens when the
  // browser starts scrolling, before legacy touchmove listeners finish.
  document.addEventListener('touchstart',event=>{
    if(event.touches.length!==1||event.target.closest?.('.markmap,.range-shell,input,textarea,select')){touchOrigin=null;return;}
    const t=event.touches[0];touchOrigin={x:t.clientX,y:t.clientY,direction:'pending'};
  },{capture:true,passive:true});
  document.addEventListener('touchmove',event=>{
    if(!touchOrigin||event.touches.length!==1)return;
    const t=event.touches[0],mode=direction(touchOrigin,t.clientX,t.clientY);
    if(mode==='vertical')event.stopImmediatePropagation();
    else if(mode==='horizontal'){select({clientX:t.clientX,clientY:t.clientY,target:event.target});if(canvasState)event.stopImmediatePropagation();}
  },{capture:true,passive:true});
  for(const type of ['touchend','touchcancel'])document.addEventListener(type,()=>{touchOrigin=null;},{passive:true});
  for(const type of ['mouseover','mouseenter','mousemove'])document.addEventListener(type,event=>{
    if(event.sourceCapabilities?.firesTouchEvents){event.stopImmediatePropagation();return;}
    if(event.target.closest?.(hits))nativeHovered=true;
  },{capture:true,passive:true});
  document.addEventListener('click',event=>{
    if(canvasState&&event.sourceCapabilities?.firesTouchEvents&&event.target.closest?.('#chart'))event.stopImmediatePropagation();
  },{capture:true,passive:true});
  let host=window;
  try {
    while(host){
      for(const type of ['scroll','resize','pagehide','veya:chat-navigate'])host.addEventListener(type,dismiss,{capture:true,passive:true});
      if(host!==window)host.document.addEventListener('pointerdown',dismiss,{capture:true,passive:true});
      const doc=host.document;doc.addEventListener('visibilitychange',()=>{if(doc.hidden)dismiss();},{passive:true});
      if(host===host.parent)break;host=host.parent;
    }
  } catch (_) {}
})();
</script>
</body>
</html>
