<!doctype html>
<html lang="zh-CN" data-theme="light">
<head><script src="/static/cases/theme.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>关键统计数据</title>
<style>
:root{color-scheme:light;--business-text-0b0b0d:#0b0b0d;--business-text-9c9c9f:#9c9c9f;--business-bg-f0f0f1:#f0f0f1;--business-border-000:#000;}
:root[data-theme="dark"]{color-scheme:dark;--business-text-0b0b0d:#e8edf5;--business-text-9c9c9f:#a8b3c4;--business-bg-f0f0f1:#202b3a;--business-border-000:#566477;}

* { box-sizing:border-box; }
body {
  margin:0;
  background:transparent;
  color:var(--business-text-0b0b0d);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
.key-stats {
  width:100%;
  padding:0;
  background:transparent;
}
.title {
  margin:0 0 22px;
  font-size:16px;
  font-weight:800;
  line-height:1.15;
}
.ranges {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:64px;
  margin-bottom:58px;
}
.range-head {
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:14px;
  margin-bottom:18px;
}
.range-value {
  font-size:14px;
  line-height:1;
  font-weight:800;
}
.range-label {
  text-align:center;
  color:var(--business-text-9c9c9f);
  font-size:14px;
  line-height:1;
  font-weight:800;
  letter-spacing:.01em;
}
.range-track {
  position:relative;
  height:10px;
  background:var(--business-bg-f0f0f1);
  border-radius:999px;
  overflow:visible;
}
.range-fill {
  position:absolute;
  top:0;
  height:10px;
  background:var(--range-color, #ff321f);
}
.range-point {
  width:4px;
  transform:translateX(-50%);
  border-radius:999px;
}
.range-band {
  min-width:4px;
}
.marker {
  position:absolute;
  top:20px;
  width:0;
  height:0;
  transform:translateX(-50%);
  border-left:7px solid transparent;
  border-right:7px solid transparent;
  border-bottom:8px solid var(--business-border-000);
}
.grid {
  display:grid;
  grid-template-columns:repeat(4, minmax(0,1fr));
  column-gap:74px;
  row-gap:24px;
}
.stat-label {
  margin:0 0 7px;
  font-size:14px;
  font-weight:800;
  line-height:1.1;
}
.stat-value {
  font-size:14px;
  line-height:1.1;
  font-weight:400;
}
@media (max-width: 860px) {
  .key-stats { padding:0; }
  .title { font-size:16px; margin-bottom:18px; }
  .ranges { grid-template-columns:1fr; gap:34px; margin-bottom:38px; }
  .range-value { font-size:14px; }
  .range-label { font-size:14px; }
  .grid { grid-template-columns:repeat(2, minmax(0,1fr)); gap:20px 26px; }
  .stat-label { font-size:14px; }
  .stat-value { font-size:14px; }
}
@media (max-width: 420px) {
  .grid { grid-template-columns:1fr 1fr; column-gap:18px; }
  .stat-value { font-size:14px; }
}
</style>
<script data-business-theme-runtime>
    (() => {
      const requested = new URLSearchParams(location.search).get('theme');
      if (requested === 'dark' || requested === 'light') document.documentElement.dataset.theme = requested;
    })();
    </script></head>
<body>
<section class="key-stats">
  <h1 class="title">关键统计数据</h1>

</section>
<script>
const payload = {"type": "key-stats", "name": "关键统计数据", "title": "关键统计数据", "code": "NVDA", "market": "185", "fields": {"current": 228.52, "prevClose": 226.32, "open": 224.34, "high": 228.64, "low": 223.0602, "week52High": 243.37, "week52Low": 164.27, "rangePercent": 2.465447, "volume": 84036941, "turnover": 19047436190.103764, "avgVol4w": 105580329.4, "marketCap": 5507332000000, "dividendYield": 0.228078, "peTtm": 28.553152, "epsTtm": 7.95, "beta": 1.3966, "sharesOutstanding": 24100000000, "freeFloat": 23188176500, "turnoverPercent": 0.362413, "peDyn": 60.925858, "pb": 24.051165, "bvps": 9.482917, "dividendPerShare": 0.521203}, "ranges": {"day": {"label": "日内区间", "low": 223.0602, "high": 228.64, "current": 228.52, "lowLabel": "223.06", "highLabel": "228.64", "currentRatio": 0.9784938528262703, "startRatio": 0.22936305960787118, "endRatio": 0.9784938528262703, "color": "#00a06a"}, "week52": {"label": "52周区间", "low": 164.27, "high": 243.37, "current": 228.52, "lowLabel": "164.27", "highLabel": "243.37", "currentRatio": 0.8122629582806574, "startRatio": 0.8122629582806574, "endRatio": 0.8122629582806574, "color": "#00a06a"}}, "stats": [{"key": "open", "label": "开盘", "value": "224.34", "raw": 224.34}, {"key": "prevClose", "label": "前收", "value": "226.32", "raw": 226.32}, {"key": "rangePercent", "label": "振幅", "value": "2.47%", "raw": 2.465447}, {"key": "turnover", "label": "成交额", "value": "19.05B", "raw": 19047436190.103764}, {"key": "avgVol4w", "label": "4周均量", "value": "105.58M", "raw": 105580329.4}, {"key": "marketCap", "label": "市值", "value": "5.51T", "raw": 5507332000000}, {"key": "dividendYield", "label": "股息率", "value": "0.23%", "raw": 0.228078}, {"key": "peTtm", "label": "市盈率(TTM)", "value": "28.55", "raw": 28.553152}, {"key": "epsTtm", "label": "每股收益(TTM)", "value": "7.95", "raw": 7.95}, {"key": "beta", "label": "Beta", "value": "1.4", "raw": 1.3966}, {"key": "freeFloat", "label": "自由流通股", "value": "23.19B", "raw": 23188176500}, {"key": "sharesOutstanding", "label": "总股本", "value": "24.10B", "raw": 24100000000}, {"key": "turnoverPercent", "label": "换手率", "value": "0.36%", "raw": 0.362413}, {"key": "peDyn", "label": "动态市盈率", "value": "60.93", "raw": 60.925858}, {"key": "pb", "label": "市净率", "value": "24.05", "raw": 24.051165}, {"key": "bvps", "label": "每股净资产", "value": "9.48", "raw": 9.482917}, {"key": "high", "label": "最高", "value": "228.64", "raw": 228.64}, {"key": "low", "label": "最低", "value": "223.06", "raw": 223.0602}, {"key": "week52High", "label": "52周高点", "value": "243.37", "raw": 243.37}, {"key": "week52Low", "label": "52周低点", "value": "164.27", "raw": 164.27}], "source": {"provider": "AInvest index query", "endpoint": "https://extquote.ainvest.com/index_api/v1/query", "indexes": [{"index_id": "6"}, {"index_id": "7"}, {"index_id": "8"}, {"index_id": "9"}, {"index_id": "10"}, {"index_id": "inr-high_price-max", "index_attr": {"time_period": "week_52"}}, {"index_id": "inr-low_price-min", "index_attr": {"time_period": "week_52"}}, {"index_id": "price_amplitude_ratio_pct", "index_attr": {"trade_class": "intraday"}}, {"index_id": "13"}, {"index_id": "19"}, {"index_id": "inr-volume-avg", "index_attr": {"time_period": "day_20", "trade_class": "intraday"}}, {"index_id": "total_market_value"}, {"index_id": "dividend_ratio_pct_ttm"}, {"index_id": "pe_ttm"}, {"index_id": "1002"}, {"index_id": "beta"}, {"index_id": "402"}, {"index_id": "flow_capital"}, {"index_id": "turnover_ratio_pct"}, {"index_id": "pe_mrq"}, {"index_id": "pb_mrq"}, {"index_id": "1005"}, {"index_id": "per_share_dividend_ttm"}]}, "language": "zh-CN", "componentUi": {"Business": "主营业务", "Type": "类型", "Stock": "股票", "Value": "价值", "BVPS": "每股净资产", "Key Statistics": "关键统计数据", "Market Cap": "市值", "P/E Ratio": "市盈率", "Ratio": "占比", "Key Stats": "关键指标", "Age": "年龄"}, "theme": "light"};
const ranges = document.getElementById('ranges');
const stats = document.getElementById('stats');

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function renderRange(item) {
  const ratio = clamp(Number(item.currentRatio ?? 0), 0, 1);
  const pct = ratio * 100;
  const startRatio = clamp(Number(item.startRatio ?? item.currentRatio ?? 0), 0, 1);
  const endRatio = clamp(Number(item.endRatio ?? item.currentRatio ?? 0), 0, 1);
  const startPct = Math.min(startRatio, endRatio) * 100;
  const endPct = Math.max(startRatio, endRatio) * 100;
  const isBand = Math.abs(endPct - startPct) > 0.2;
  const fillClass = isBand ? 'range-fill range-band' : 'range-fill range-point';
  const color = item.color || '#ff321f';
  const fillStyle = isBand
    ? `left:${startPct}%; width:${Math.max(0.4, endPct - startPct)}%; --range-color:${color}`
    : `left:${pct}%; --range-color:${color}`;
  return `
    <div class="range-card">
      <div class="range-head">
        <div class="range-value">${item.lowLabel || '--'}</div>
        <div class="range-label">${item.label || ''}</div>
        <div class="range-value">${item.highLabel || '--'}</div>
      </div>
      <div class="range-track">
        <div class="${fillClass}" style="${fillStyle}"></div>
        <div class="marker" style="left:${pct}%"></div>
      </div>
    </div>
  `;
}

function render() {
  const day = payload.ranges?.day || {};
  const week52 = payload.ranges?.week52 || {};
  ranges.innerHTML = renderRange(day) + renderRange(week52);
  stats.innerHTML = (payload.stats || []).map(item => `
    <div class="stat">
      <div class="stat-label">${item.label || ''}</div>
      <div class="stat-value">${item.value || '--'}</div>
    </div>
  `).join('');
}
render();
</script>
<style data-business-heading-style>.kline-title strong[data-business-title],[data-business-title]{font-size:18px!important;font-weight:700!important;line-height:1.4!important;letter-spacing:0!important;margin:0 0 8px!important;white-space:normal!important;overflow-wrap:anywhere;color:inherit}@media(max-width:720px){.kline-title strong[data-business-title],[data-business-title]{font-size:16px!important}}</style><script data-business-heading-runtime>(()=>{const modelTitle="NVDA缩量收复日内高位，量价背离";const apply=()=>{let heading=document.querySelector('h1:not(.company-name),h2:not(.panel-title):not(.section-title):not(.actions-title),.page-title,.component-title,.chart-title,.multi-title,#title,.pie-title,.waterfall-title,.title,.kline-title strong');if(!heading && modelTitle){heading=document.createElement('h1');const host=document.querySelector('main,.wrap,.component')||document.body;host.prepend(heading);}if(heading){heading.dataset.businessTitle='true';if(modelTitle){heading.textContent=modelTitle;document.title=modelTitle;}}};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply,{once:true});else apply();})();</script></body>
