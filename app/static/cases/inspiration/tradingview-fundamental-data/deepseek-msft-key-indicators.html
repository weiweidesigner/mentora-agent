  rangeHandleStart.style.left = `${leftPct}%`;
  rangeHandleEnd.style.left = `${rightPct}%`;
  rangeHandleStart.setAttribute('aria-label', `起始周期 ${allRows[range.start]?.label || ''}`);
  rangeHandleEnd.setAttribute('aria-label', `结束周期 ${allRows[range.end]?.label || ''}`);
}

function render() {
  hideTip();
  svg.innerHTML = '';
  const metric = payload.metrics.find(item => item.key === metricKey) || payload.metrics[0];
  const allRows = (payload.views[viewKey]?.records || []).filter(row => row.values?.[metric.key] != null);
  const range = getRangeState(allRows.length);
  renderRangeFilter(allRows, range);
  const rows = allRows.slice(range.start, range.end + 1);
  renderLegend(metric);
  const stage = root.querySelector('.stage');
  const stageRect = stage.getBoundingClientRect();
  const w = Math.max(320, stageRect.width || root.clientWidth);
  const h = Math.max(280, stageRect.height || 380);
  svg.style.width = '100%';
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  const m = {left: 54, right: 52, top: 24, bottom: 56};
  const cw = w - m.left - m.right;
  const ch = h - m.top - m.bottom;
  const values = rows.map(row => Number(row.values[metric.key]));
  const yoyValues = rows.map(row => row.yoy?.[metric.key]).filter(v => v != null).map(v => Number(v) * 100);
  const minValue = Math.min(0, ...values);
  const maxValue = Math.max(0, ...values);
  const valuePad = Math.max((maxValue - minValue) * .18, 1);
  const vMin = minValue < 0 ? minValue - valuePad : 0;
  const vMax = maxValue + valuePad;
  const yMin = Math.min(-10, ...yoyValues, 0);
  const yMax = Math.max(10, ...yoyValues, 0);
  const yPad = Math.max((yMax - yMin) * .18, 20);
  const lMin = yMin - yPad;
  const lMax = yMax + yPad;
  const band = cw / Math.max(rows.length, 1);
  const x = i => m.left + (rows.length <= 1 ? cw / 2 : band * (i + .5));
  const yBar = v => m.top + (vMax - v) / Math.max(vMax - vMin, .0001) * ch;
  const yLine = v => m.top + (lMax - v) / Math.max(lMax - lMin, .0001) * ch;
  const zeroY = yBar(0);
  for (let i = 0; i < 5; i++) {
    const gy = m.top + ch * i / 4;
    el('line', {x1:m.left, y1:gy, x2:w-m.right, y2:gy, class:'grid'});
    const leftVal = lMax - (lMax - lMin) * i / 4;
    const rightVal = vMax - (vMax - vMin) * i / 4;
    el('text', {x:m.left - 10, y:gy + 4, class:'y-label', 'text-anchor':'end'}).textContent = `${leftVal.toFixed(0)}%`;
    el('text', {x:w - m.right + 10, y:gy + 4, class:'y-label'}).textContent = fmt(rightVal, metric.decimals, metric.unit);
  }
  el('line', {x1:m.left, y1:zeroY, x2:w-m.right, y2:zeroY, class:'axis'});
  const barW = Math.max(3, Math.min(42, band * .48));
  const canShowBarValue = band >= 46 && barW >= 18;
  const canShowDots = band >= 18;
  const labelMode = band >= 58 ? 'all' : rows.length <= 3 ? 'all' : 'edge-middle';
  const hoverLayer = el('g', {}, svg);
  const barLayer = el('g', {}, svg);
  const labelLayer = el('g', {}, svg);
  const hoverLeaveHandler = () => {
    hoverLayer.querySelectorAll('.hover-band').forEach(node => node.classList.remove('active'));
    hideTip();
  };
  rows.forEach((row, i) => {
    const cx = x(i);
    const v = Number(row.values[metric.key]);
    const top = yBar(Math.max(v, 0));
    const bottom = yBar(Math.min(v, 0));
    const bandLeft = m.left + band * i;
    const bandWidth = Math.max(8, band);
    const hoverBand = el('rect', {x: bandLeft + 1, y: m.top, width: Math.max(0, bandWidth - 2), height: ch, class:'hover-band'}, hoverLayer);
    const hoverZone = el('rect', {x: bandLeft, y: m.top, width: bandWidth, height: ch, class:'hover-zone'}, hoverLayer);
    el('rect', {x:cx - barW / 2, y:top, width:barW, height:Math.max(1, bottom - top), fill:'#2f63f6', rx:0}, barLayer);
    if (canShowBarValue) {
      el('text', {x:cx, y:top - 7, class:'bar-value'}, labelLayer).textContent = fmt(v, metric.decimals, metric.unit);
    }
    const midIndex = Math.floor((rows.length - 1) / 2);
    const shouldShowLabel = labelMode === 'all' || i === 0 || i === midIndex || i === rows.length - 1;
    if (shouldShowLabel) {
      const label = el('text', {x:cx, y:h - 20, class:'x-label', 'text-anchor':'middle'}, labelLayer);
      label.textContent = row.label;
    }
    const activateHover = () => {
      hoverLayer.querySelectorAll('.hover-band').forEach(node => node.classList.remove('active'));
      hoverBand.classList.add('active');
      const anchorX = (cx / w) * stageRect.width;
      const topGridY = (m.top / h) * stageRect.height;
      showTipForX(anchorX, row, metric, topGridY);
    };
    hoverZone.addEventListener('mouseenter', activateHover);
    hoverZone.addEventListener('mousemove', activateHover);
    hoverZone.addEventListener('mouseleave', hoverLeaveHandler);
  });
  const lineRows = rows.map((row, i) => ({row, i, yoy:row.yoy?.[metric.key]})).filter(item => item.yoy != null);
  if (lineRows.length) {
    let d = '';
    lineRows.forEach((item, idx) => {
      const px = x(item.i);
      const py = yLine(Number(item.yoy) * 100);
      d += `${idx ? 'L' : 'M'}${px},${py}`;
    });
    el('path', {d, fill:'none', stroke:'#ff7043', 'stroke-width':2});
    lineRows.forEach(item => {
      const cx = x(item.i);
      const cy = yLine(Number(item.yoy) * 100);
      if (canShowDots) {
        el('circle', {cx, cy, r:4, fill:'#ff7043'});
      }
    });
  }
}
buildControls();
initRangeFilter();
render();
function postChartHeight() {
  const nodes = [document.querySelector('.component'), document.querySelector('main'), document.body].filter(Boolean);
  const height = Math.ceil(Math.max(180, ...nodes.map(node => node.getBoundingClientRect().bottom || node.scrollHeight || 0)));
  try { parent.postMessage({type:'analysis-planner-chart-height', height}, '*'); } catch (e) {}
}
new ResizeObserver(() => { render(); postChartHeight(); }).observe(root.querySelector('.stage'));
postChartHeight();
setTimeout(postChartHeight, 80);
setTimeout(postChartHeight, 300);
</script>
