      right: 0;

      transform: translateY(-50%);

      height: 3px;
      background: var(--selection);
      border-radius: 999px;
      transform: translateY(-50%);

      height: var(--handle-size);

      padding: 0;

      bottom: -7px;
      transform: translateX(-50%);
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 8px solid rgba(59, 59, 59, .96);

      bottom: auto;
      border-top: 0;

      if (v == null || Number.isNaN(Number(v))) return '-';
      const sign = Number(v) > 0 ? '+' : '';
      return sign + (Number(v) * 100).toFixed(2) + '%';
    }
    function fmtAxisB(v) {
      if (Math.abs(Number(v) || 0) < 1e-9) return '0';
      return fmtB(v);
    }
    function fmtAxisPct(v) {
      const value = Number(v) || 0;
      if (Math.abs(value) < 1e-9) return '0.00%';
      const abs = Math.abs(value);
      const digits = abs >= 100 ? 0 : abs >= 10 ? 1 : 2;
      return value.toFixed(digits) + '%';
    }
    function axisDomain(values, forceMixed = false, minSpan = 1) {
      const finite = values.map(Number).filter(Number.isFinite);
      const min = Math.min(0, ...finite);
      const max = Math.max(0, ...finite);
      const hasNeg = min < 0;
      const hasPos = max > 0;
      if ((forceMixed || (hasNeg && hasPos)) && (hasNeg || hasPos)) {
        const abs = Math.max(Math.abs(min), Math.abs(max), minSpan);
        return [-abs * 1.18, abs * 1.18];
      }
      if (hasNeg) return [min * 1.18, 0];
      return [0, Math.max(max * 1.18, minSpan)];
    }
    function axisTicks(min, max, count = 5) {
      if (min < 0 && max > 0) {
        const abs = Math.max(Math.abs(min), Math.abs(max));
        return Array.from({ length: count }, (_, i) => abs - (abs * 2 * i) / (count - 1));
      }
      return Array.from({ length: count }, (_, i) => max - ((max - min) * i) / (count - 1));
    }
    function compactPeriodLabel(label) {
      return String(label || '').replace(/\s+/g, '');
    }
    function metric() {
      return payload.trendMetrics.find(item => item.key === state.metric) || payload.trendMetrics[0];
    }
    function view() { return payload.views[state.view] || payload.views.quarterly; }
    function allTrendRecords() {
      return (view().trendRecords || []).filter(record => record.values && record.values[state.metric] != null);
    }
    function visibleRecords() {
      return allTrendRecords().slice(state.start, state.end + 1);
    }
    function svgEl(name, attrs = {}, parent) {
      const node = document.createElementNS('http://www.w3.org/2000/svg', name);
      for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
      if (parent) parent.appendChild(node);
      return node;
    }
    function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
    function isCoarsePointerEvent(event) {
      return event.pointerType === 'touch' || event.pointerType === 'pen';
    }
    function bindPressLikeHover(zone, activate, deactivate) {
      zone.addEventListener('mouseenter', activate);
      zone.addEventListener('mousemove', activate);
      zone.addEventListener('pointerenter', event => {
        if (!isCoarsePointerEvent(event)) activate(event);
      });
      zone.addEventListener('pointermove', event => {
        if (!isCoarsePointerEvent(event)) activate(event);
      });
      zone.addEventListener('pointerdown', event => {
        activate(event);
        if (isCoarsePointerEvent(event)) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
      zone.addEventListener('click', event => {
        activate(event);
        event.stopPropagation();
      });
      zone.addEventListener('mouseleave', deactivate);
      zone.addEventListener('pointerleave', event => {
        if (!isCoarsePointerEvent(event)) deactivate(event);
      });
      zone.addEventListener('pointercancel', deactivate);
    }

    function defaultWindow() {
      return state.view === 'quarterly' ? 8 : 8;
    }
    function initTabs() {
      payload.trendMetrics.forEach(item => {
        const button = document.createElement('button');
        button.className = 'metric-tab';
        button.type = 'button';
        button.textContent = item.label;
        button.onclick = () => { state.metric = item.key; render(); };
        els.metricTabs.appendChild(button);
      });
      Object.entries(payload.views).forEach(([key, item]) => {
        const button = document.createElement('button');
        button.className = 'segment';
        button.type = 'button';
        button.textContent = item.label;
        button.onclick = () => {
          state.view = key;
          const count = allTrendRecords().length;
          const preset = payload.defaultRanges?.[key];
          if (preset) {
            state.start = Number(preset.start || 0);
            state.end = Number(preset.end || 0);
          } else {
            state.start = Math.max(0, count - defaultWindow());
            state.end = Math.max(0, count - 1);
          }
          state.rangeInitialized = true;
          state.selectedKey = null;
          state.selectedIndex = null;
          state.selectedEndDate = null;
          state.selectedPeriod = null;
          render();
        };
        els.periodTabs.appendChild(button);
      });
    }
    function ensureRange() {
      const count = allTrendRecords().length;
      if (!count) { state.start = 0; state.end = 0; return; }
      if (!state.rangeInitialized) {
        const preset = payload.defaultRanges?.[state.view];
        if (preset) {
          state.start = Number(preset.start || 0);
          state.end = Number(preset.end || 0);
        } else {
          state.start = Math.max(0, count - defaultWindow());
          state.end = count - 1;
        }
        state.rangeInitialized = true;
      }
      state.start = Math.max(0, Math.min(state.start, count - 1));
      state.end = Math.max(state.start, Math.min(state.end, count - 1));
    }
    function updateTabs() {
      [...els.metricTabs.children].forEach((button, idx) => button.classList.toggle('active', payload.trendMetrics[idx].key === state.metric));
      [...els.periodTabs.children].forEach((button, idx) => button.classList.toggle('active', Object.keys(payload.views)[idx] === state.view));
      els.metricLegend.textContent = metric().label;
    }
    function updateRangeUI() {
      const records = allTrendRecords();
      const count = records.length;
      if (count <= 1) {
        els.rangeShell.hidden = true;
        return;
      }
      els.rangeShell.hidden = false;
      const denominator = Math.max(1, count - 1);
      const left = state.start / denominator * 100;
      const right = state.end / denominator * 100;
      els.rangeSelection.style.left = left + '%';
      els.rangeSelection.style.width = Math.max(0, right - left) + '%';
      els.leftHandle.style.left = left + '%';
      els.rightHandle.style.left = right + '%';
      els.leftHandle.setAttribute('aria-label', payload.i18n.rangeStart + ' ' + (records[state.start]?.label || ''));
      els.rightHandle.setAttribute('aria-label', payload.i18n.rangeEnd + ' ' + (records[state.end]?.label || ''));
    }

    function hideTooltip() {
      els.tooltip.classList.remove('visible', 'below');
    }
    function setTooltipPosition(clientX, clientTopY, preferBelow = false) {
      const tip = els.tooltip;
      tip.classList.toggle('below', preferBelow);
      const margin = 8;
      const width = tip.offsetWidth || 220;
      const height = tip.offsetHeight || 80;
      let left = Math.max(margin, Math.min(window.innerWidth - width - margin, clientX - width / 2));
      let top = preferBelow ? clientTopY + 12 : clientTopY - height - 14;
      if (top < margin) {
        top = clientTopY + 12;
        tip.classList.add('below');
      }
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
      tip.style.setProperty('--arrow-left', Math.max(14, Math.min(width - 14, clientX - left)) + 'px');
    }
    function setTooltipPositionOutsideChart(clientX, chartTopY) {
      const tip = els.tooltip;
      tip.classList.remove('below');
      const margin = 8;
      const width = tip.offsetWidth || 220;
      const height = tip.offsetHeight || 80;
      let left = Math.max(margin, Math.min(window.innerWidth - width - margin, clientX - width / 2));
      // Keep the tooltip outside the chart without reserving layout space.
      // Do not clamp the top value; if it exceeds the module/viewport, let it overflow.
      let top = chartTopY - height - 12;
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
      tip.style.setProperty('--arrow-left', Math.max(14, Math.min(width - 14, clientX - left)) + 'px');
    }
    function trendTooltipHtml(record) {
      const m = metric();
      const value = record.values[state.metric];
      const yoy = record.yoy[state.metric];
      const cls = (yoy || 0) >= 0 ? 'good' : 'bad';
      return `
        <div class="tip-title">${record.label}</div>
        <div class="tip-row"><span class="tip-dot" style="background:${colors.blue}"></span><span class="tip-name">${m.label}</span><span class="tip-value">${fmtB(value)}</span></div>
        <div class="tip-row"><span class="tip-dot" style="background:${colors.orange}"></span><span class="tip-name">${payload.i18n.yoy}</span><span class="tip-value ${cls}">${fmtPct(yoy)}</span></div>`;
    }
    function showTrendTooltip(clientX, clientTopY, record) {
      els.tooltip.innerHTML = trendTooltipHtml(record);
      els.tooltip.classList.add('visible');
      setTooltipPosition(clientX, clientTopY, false);
    }
    function showWaterfallTooltip(clientX, chartTopY, record, step) {
      const yoy = record.yoy?.[step.item.key];
      const cls = (yoy || 0) >= 0 ? 'good' : 'bad';
      els.tooltip.innerHTML = `
        <div class="tip-title">${record.label}</div>
        <div class="tip-row"><span class="tip-dot" style="background:${step.color}"></span><span class="tip-name">${step.label}</span><span class="tip-value">${fmtB(step.displayValue)}</span></div>
        <div class="tip-row"><span class="tip-dot" style="background:${colors.orange}"></span><span class="tip-name">${payload.i18n.yoy}</span><span class="tip-value ${cls}">${fmtPct(yoy)}</span></div>`;
      els.tooltip.classList.add('visible');
      setTooltipPositionOutsideChart(clientX, chartTopY);
    }

    function renderTrend() {
      const svg = els.trendSvg;
      clear(svg);
      const records = visibleRecords();
      const width = Math.max(360, Math.round(els.trendStage.clientWidth || svg.clientWidth || 720));
      const height = Math.max(200, Math.round(els.trendStage.clientHeight || 248));
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      if (!records.length) return;

      const values = records.map(r => Number(r.values[state.metric])).filter(Number.isFinite);
      const yoyPctValues = records.map(r => r.yoy[state.metric]).filter(v => v != null).map(v => Number(v) * 100).filter(Number.isFinite);
      const rawMinValue = Math.min(0, ...values);
      const rawMaxValue = Math.max(0, ...values);
      const rawMinYoy = Math.min(0, ...yoyPctValues);
      const rawMaxYoy = Math.max(0, ...yoyPctValues);
      const sharedMixedAxis = (rawMinValue < 0 || rawMinYoy < 0) && (rawMaxValue > 0 || rawMaxYoy > 0);
      const [vMin, vMax] = axisDomain(values, sharedMixedAxis, 1);
      const [lMin, lMax] = axisDomain(yoyPctValues, sharedMixedAxis, 10);
      const valueTicks = axisTicks(vMin, vMax, 5);
      const pctTicks = axisTicks(lMin, lMax, 5);
      const leftTickLabels = pctTicks.map(fmtAxisPct);
      const leftChars = Math.max(...leftTickLabels.map(label => label.length), 4);
      const margin = {
        left: Math.max(76, Math.min(118, 26 + leftChars * 7)),
        right: 74,
        top: 24,
        bottom: 52
      };
      const chartW = Math.max(1, width - margin.left - margin.right);
      const chartH = Math.max(1, height - margin.top - margin.bottom);
      const band = chartW / Math.max(records.length, 1);
      const x = idx => margin.left + band * (idx + .5);
      const yBar = value => margin.top + (vMax - value) / Math.max(vMax - vMin, .0001) * chartH;
      const yLine = value => margin.top + (lMax - value) / Math.max(lMax - lMin, .0001) * chartH;

      const bandLayer = svgEl('g', {}, svg);
      const gridLayer = svgEl('g', {}, svg);
      const barLayer = svgEl('g', {}, svg);
      const lineLayer = svgEl('g', {}, svg);
      const labelLayer = svgEl('g', {}, svg);
      const zoneLayer = svgEl('g', {}, svg);

      valueTicks.forEach((rightVal, i) => {
        const gy = yBar(rightVal);
        const isZero = Math.abs(rightVal) < 1e-9;
        svgEl('line', { x1: margin.left, y1: gy, x2: width - margin.right, y2: gy, class: isZero ? 'axis' : 'grid' }, gridLayer);
        svgEl('text', { x: margin.left - 10, y: gy + 4, 'text-anchor': 'end', class: 'axis-label' }, gridLayer).textContent = leftTickLabels[i];
        svgEl('text', { x: width - margin.right + 10, y: gy + 4, class: 'axis-label' }, gridLayer).textContent = fmtAxisB(rightVal);
      });

      const barW = Math.max(3, Math.min(42, band * .48));
      const canShowBarValue = band >= 48 && barW >= 16;
      const canShowDots = band >= 18;
      const labelMode = band >= 58 ? 'all' : records.length <= 3 ? 'all' : 'edge-middle';
      const midIndex = Math.floor((records.length - 1) / 2);
      const linePoints = [];
      const stageRect = els.trendStage.getBoundingClientRect();
      const topGridClientY = stageRect.top + (margin.top / height) * stageRect.height;

      function clearHoverBands() {
        bandLayer.querySelectorAll('.hover-band').forEach(node => node.classList.remove('active'));
      }
      records.forEach((record, idx) => {
        const cx = x(idx);
        const value = Number(record.values[state.metric] || 0);
        const top = yBar(Math.max(value, 0));
        const bottom = yBar(Math.min(value, 0));
        const bandLeft = margin.left + band * idx;
        const hoverBand = svgEl('rect', { x: bandLeft, y: margin.top, width: Math.max(1, band), height: chartH, class: 'hover-band' }, bandLayer);
        svgEl('rect', { x: cx - barW / 2, y: top, width: barW, height: Math.max(1, bottom - top), fill: colors.blue, rx: 0 }, barLayer);
        if (canShowBarValue) {
          svgEl('text', { x: cx, y: Math.max(12, top - 7), class: 'bar-label' }, labelLayer).textContent = fmtB(value);
        }
        const shouldShowLabel = labelMode === 'all' || idx === 0 || idx === midIndex || idx === records.length - 1;
        if (shouldShowLabel) {
          svgEl('text', { x: cx, y: height - 8, class: 'x-label', 'text-anchor': 'middle' }, labelLayer).textContent = record.label;
        }
        const yoy = record.yoy[state.metric];
        if (yoy != null && Number.isFinite(Number(yoy))) {
          linePoints.push({ x: cx, y: yLine(Number(yoy) * 100), record });
        }
        const zone = svgEl('rect', { x: bandLeft, y: margin.top, width: Math.max(1, band), height: chartH, class: 'hover-zone' }, zoneLayer);
        const activate = () => {
          clearHoverBands();
          hoverBand.classList.add('active');
          const selectedIndex = state.start + idx;
          const changed =
            state.selectedKey !== record.key ||
            state.selectedIndex !== selectedIndex ||
            state.selectedEndDate !== record.endDate ||
            state.selectedPeriod !== record.period;
          state.selectedKey = record.key;
          state.selectedIndex = selectedIndex;
          state.selectedEndDate = record.endDate || null;
          state.selectedPeriod = record.period || null;
          if (changed) renderWaterfall();
          const clientX = stageRect.left + (cx / width) * stageRect.width;
          showTrendTooltip(clientX, topGridClientY, record);
        };
        bindPressLikeHover(
          zone,
          activate,
          () => { hoverBand.classList.remove('active'); hideTooltip(); }
        );
      });

      if (linePoints.length) {
        const d = linePoints.map((point, idx) => `${idx ? 'L' : 'M'}${point.x},${point.y}`).join('');
        svgEl('path', { d, fill: 'none', stroke: colors.orange, 'stroke-width': 2 }, lineLayer);
        if (canShowDots) {
          linePoints.forEach(point => svgEl('circle', { cx: point.x, cy: point.y, r: 4, fill: colors.orange }, lineLayer));
        }
      }
    }

    function waterfallRecord() {
      const records = view().waterfallRecords || [];
      if (!records.length) return null;
      if (state.selectedKey) {
        const matched = records.find(item => item.key === state.selectedKey);
        if (matched) return matched;
      }
      if (state.selectedEndDate) {
        const matched = records.find(item => item.endDate === state.selectedEndDate || item.end_date === state.selectedEndDate);
        if (matched) return matched;
      }
      if (state.selectedPeriod) {
        const matched = records.find(item => item.period === state.selectedPeriod);
        if (matched) return matched;
      }
      if (state.selectedIndex != null && Number.isFinite(Number(state.selectedIndex))) {
        const idx = Math.max(0, Math.min(records.length - 1, Number(state.selectedIndex)));
        return records[idx];
      }
      return records[records.length - 1];
    }
    function waterfallSteps(record) {
      const revenue = Number(record.values.operating_income_total || 0);
      const gross = Number(record.values.gross_profit ?? (revenue - Math.abs(Number(record.values.sales_cost || 0))));
      const net = Number(record.values.net_profit || 0);
      const cogs = gross - revenue;
      const expenses = net - gross;
      return [
        { item: payload.waterfallItems[0], label: payload.waterfallItems[0]?.label || 'Revenue', kind: 'total', start: 0, end: revenue, value: revenue, color: colors.green, displayValue: revenue },
        { item: payload.waterfallItems[1], label: payload.waterfallItems[1]?.label || 'COGS', kind: 'delta', start: revenue, end: gross, value: cogs, color: colors.pink, displayValue: cogs },
        { item: payload.waterfallItems[2], label: payload.waterfallItems[2]?.label || 'Gross Profit', kind: 'total', start: 0, end: gross, value: gross, color: colors.total, displayValue: gross },
        { item: payload.waterfallItems[3], label: payload.waterfallItems[3]?.label || 'Expenses', kind: 'delta', start: gross, end: net, value: expenses, color: expenses >= 0 ? colors.green : colors.pink, displayValue: expenses },
        { item: payload.waterfallItems[4], label: payload.waterfallItems[4]?.label || 'Net Income', kind: 'total', start: 0, end: net, value: net, color: colors.total, displayValue: net }
      ];
    }
    function renderWaterfall() {
      if (!payload.showBreakdown) return;
      const svg = els.waterfallSvg;
      clear(svg);
      const record = waterfallRecord();
      if (!record) return;
      els.selectedPeriod.textContent = `(${compactPeriodLabel(record.label)})`;
      const width = Math.max(360, Math.round(svg.clientWidth || 620));
      const height = Math.max(210, Math.round(svg.clientHeight || 254));
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      const margin = { top: 12, right: 30, bottom: 52, left: 34 };
      const chartW = Math.max(1, width - margin.left - margin.right);
      const chartH = Math.max(1, height - margin.top - margin.bottom);
      const baseY = margin.top + chartH;
      const steps = waterfallSteps(record);
      const domainValues = steps.flatMap(step => [step.start, step.end, 0]);
      const [yMin, yMax] = axisDomain(domainValues, false, 1);
      const y = value => margin.top + (yMax - value) / Math.max(yMax - yMin, .0001) * chartH;
      const xs = steps.map((_, i) => margin.left + chartW * (i + .5) / steps.length);
      const slot = chartW / steps.length;
      const barW = Math.max(28, Math.min(86, slot * .46));
      axisTicks(yMin, yMax, 5).forEach(value => {
        const gy = y(value);
        svgEl('line', {
          x1: margin.left,
          y1: gy,
          x2: width - margin.right,
          y2: gy,
          class: Math.abs(value) < 1e-9 ? 'axis' : 'grid'
        }, svg);
      });

      const hoverLayer = svgEl('g', {}, svg);
      const barLayer = svgEl('g', {}, svg);
      const connectorLayer = svgEl('g', {}, svg);
      const labelLayer = svgEl('g', {}, svg);
      const zoneLayer = svgEl('g', {}, svg);

      function clearWaterfallHoverBands() {
        hoverLayer.querySelectorAll('.hover-band').forEach(node => node.classList.remove('active'));
      }

      steps.forEach((step, idx) => {
        const cx = xs[idx];
        const y1 = y(step.start);
        const y2 = y(step.end);
        const top = Math.min(y1, y2);
        const bottom = Math.max(y1, y2);
        const h = Math.max(2, bottom - top);
        const bandLeft = cx - slot / 2;
        const hoverBand = svgEl('rect', { x: bandLeft, y: margin.top, width: slot, height: chartH, class: 'hover-band' }, hoverLayer);
        svgEl('rect', { x: cx - barW / 2, y: top, width: barW, height: h, fill: step.color, rx: 0 }, barLayer);
        if (idx < steps.length - 1) {
          const nextCx = xs[idx + 1];
          svgEl('line', { x1: cx + barW / 2, y1: y(step.end), x2: nextCx - barW / 2, y2: y(step.end), stroke: 'var(--axis)', 'stroke-width': 1, 'stroke-dasharray': '3 3' }, connectorLayer);
        }
        labelWaterfall(labelLayer, cx, top, step.displayValue, record.yoy?.[step.item.key]);
        svgEl('text', { x: cx, y: height - 18, class: 'waterfall-x' }, labelLayer).textContent = step.label;
        const zone = svgEl('rect', { x: bandLeft, y: margin.top, width: slot, height: chartH, class: 'hover-zone', 'pointer-events': 'all' }, zoneLayer);
        const activate = () => {
          clearWaterfallHoverBands();
          hoverBand.classList.add('active');
          const liveRect = svg.getBoundingClientRect();
          const liveX = liveRect.left + (cx / width) * liveRect.width;
          // Anchor to the SVG top edge, so the tooltip stays outside the chart.
          const liveChartTopY = liveRect.top;
          showWaterfallTooltip(liveX, liveChartTopY, record, step);
        };
        bindPressLikeHover(
          zone,
          activate,
          () => { hoverBand.classList.remove('active'); hideTooltip(); }
        );
      });
      svg.addEventListener('mouseleave', () => { clearWaterfallHoverBands(); hideTooltip(); });

      function labelWaterfall(parent, cx, top, value, yoy) {
        svgEl('text', { x: cx, y: Math.max(12, top - 22), class: 'waterfall-label' }, parent).textContent = fmtB(value);
        if (yoy != null && Number.isFinite(Number(yoy))) {
          const text = fmtPct(yoy).replace('+', '');
          const w = Math.max(46, text.length * 7 + 12);
          const x = cx - w / 2;
          const fill = Number(yoy) >= 0 ? '#2dbd86' : '#f05b5b';
          svgEl('rect', { x, y: Math.max(16, top - 18), width: w, height: 16, rx: 3, fill }, parent);
          svgEl('text', { x: cx, y: Math.max(24, top - 10), class: 'badge-text' }, parent).textContent = text;
        }
      }
    }

    function setupRangeDrag() {
      const startDrag = which => event => {
        state.dragging = which;
        event.currentTarget.setPointerCapture?.(event.pointerId);
        event.preventDefault();
      };
      els.leftHandle.addEventListener('pointerdown', startDrag('left'));
      els.rightHandle.addEventListener('pointerdown', startDrag('right'));
      els.rangeTrack.addEventListener('pointerdown', event => {
        if (event.target.closest('.range-handle')) return;
        const records = allTrendRecords();
        if (records.length <= 1) return;
        const idx = rangeIndexFromClientX(event.clientX, records.length);
        state.dragging = Math.abs(idx - state.start) <= Math.abs(idx - state.end) ? 'left' : 'right';
        updateRangeByIndex(idx);
        event.preventDefault();
      });
      window.addEventListener('pointermove', event => {
        if (!state.dragging) return;
        const records = allTrendRecords();
        if (records.length <= 1) return;
        updateRangeByIndex(rangeIndexFromClientX(event.clientX, records.length));
      });
      window.addEventListener('pointerup', () => { state.dragging = null; });
    }
    function rangeIndexFromClientX(clientX, count) {
      const rect = els.rangeTrack.getBoundingClientRect();
      const ratio = rect.width <= 0 ? 0 : Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      return Math.round(ratio * Math.max(0, count - 1));
    }
    function updateRangeByIndex(idx) {
      if (state.dragging === 'left') state.start = Math.min(idx, state.end);
      if (state.dragging === 'right') state.end = Math.max(idx, state.start);
      render();
    }

    function render() {
      hideTooltip();
      ensureRange();
      updateTabs();
      updateRangeUI();
      renderTrend();
      if (payload.showBreakdown) renderWaterfall();
    }
    initTabs();
    setupRangeDrag();
    document.addEventListener('pointerdown', event => {
      if (!event.target.closest('#trendStage') && !event.target.closest('#waterfallSvg') && !event.target.closest('#tooltip')) {
        hideTooltip();
      }
    });
    render();
    new ResizeObserver(render).observe(els.trendStage);
    window.addEventListener('resize', render);
  </script>
</body>
</html>
