*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--business-text-1f2329);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{padding:0}
.wrap{max-width:1750px;margin:0;background:transparent}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(420px,.72fr);gap:46px;align-items:start}
.chart-panel{min-width:0}
.legend{height:26px;display:flex;align-items:center;gap:28px;color:var(--business-text-70757d);font-size:15px;font-weight:500;margin-bottom:4px}
.legend-item{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.dot{width:13px;height:13px;border-radius:50%;display:inline-block}
.chart{width:100%;height:auto;aspect-ratio:5 / 2;position:relative;overflow:visible}
svg{display:block;width:100%;height:100%;overflow:visible}
.axis{fill:var(--business-text-767b82);font-size:12px;font-weight:500;dominant-baseline:middle}
.gridline{stroke:var(--business-border-e9edf2);stroke-width:1}
.price-line{fill:none;stroke:#2f64f6;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.bar-buy{fill:#079b67}
.bar-sell{fill:#ff3b25}
.brush{--handle-size:32px;--track-pad:16px;--track-height:3px;height:var(--handle-size);margin:6px 0 0;position:relative;touch-action:none;user-select:none}
.track{position:absolute;left:var(--track-pad);right:var(--track-pad);top:calc(var(--handle-size) / 2);height:var(--track-height);border-radius:999px;background:var(--business-bg-f1f1f1);transform:translateY(-50%)}
.selection{position:absolute;top:calc(var(--handle-size) / 2);height:var(--track-height);border-radius:999px;background:var(--business-bg-5f5f5f);transform:translateY(-50%)}
.handle{appearance:none;position:absolute;top:calc(var(--handle-size) / 2);width:var(--handle-size);height:var(--handle-size);border-radius:50%;background:var(--business-bg-fff);border:1px solid var(--business-border-d5d5d5);box-shadow:0 1px 4px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;cursor:grab;z-index:2;transform:translate(-50%,-50%);padding:0}
.handle:active{cursor:grabbing}
.handle::before{content:"";width:2px;height:13px;border-radius:999px;background:var(--business-bg-8a8a8a);box-shadow:-5px 0 0 var(--business-border-8a8a8a),5px 0 0 #8a8a8a;opacity:.9}
.table-wrap{min-width:0}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{height:30px;padding:0 10px 8px;text-align:right;color:var(--business-text-565d68);font-size:12px;font-weight:720;border-bottom:1px solid var(--business-border-edf0f4)}
th:first-child{text-align:left;width:38%}
td{padding:9px 10px;border-bottom:1px solid var(--business-border-edf0f4);font-size:13px;line-height:1.18;text-align:right;vertical-align:middle;color:var(--business-text-242830)}
td:first-child{text-align:left;font-size:13px;font-weight:400}
.name{font-weight:400;color:var(--business-text-20242b);margin-bottom:1px}
.position{color:var(--business-text-9aa0a9);font-size:11px}
.chg.sell{color:#ff3b25}
.chg.buy{color:#079b67}
.sub{display:block;margin-top:1px;color:var(--business-text-a6abb3);font-size:11px;font-weight:500}
.empty{height:220px;display:flex;align-items:center;justify-content:center;color:var(--business-text-8a9099);font-size:13px}
.tooltip{position:absolute;z-index:20;min-width:178px;padding:10px 12px;background:var(--business-bg-3b3b3b);color:var(--business-text-fff);border-radius:6px;font-size:12px;line-height:1.5;pointer-events:none;opacity:0;visibility:hidden;box-shadow:none;filter:none}
.tooltip.show{opacity:1;visibility:visible}
.tooltip::after{content:"";position:absolute;left:var(--arrow-left,50%);bottom:-7px;transform:translateX(-50%);border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid var(--business-border-3b3b3b)}
.tip-title{display:block;color:var(--business-text-d8d8d8);margin-bottom:6px;font-size:12px;font-weight:500}
.tip-row{display:flex;align-items:center;justify-content:space-between;gap:20px;white-space:nowrap;min-height:21px}
.tip-label{display:flex;align-items:center;gap:7px;color:var(--business-text-d0d0d0)}
.tip-dot{width:8px;height:8px;border-radius:50%;flex:none}
.tip-value{color:var(--business-text-fff);font-weight:750;font-variant-numeric:tabular-nums}
@media(max-width:980px){
  body{padding:0}
  .layout{display:block}

  .axis{font-size:10px}
  .brush{--handle-size:20px;--track-pad:10px;--track-height:2px;height:var(--handle-size);margin:0}
  .handle::before{height:8px;box-shadow:-3px 0 0 var(--business-border-8a8a8a),3px 0 0 #8a8a8a}
  .table-wrap{margin-top:0;overflow:auto}
  th{height:24px;padding:0 8px 5px;font-size:11px}
  td{padding:6px 8px;font-size:12px;line-height:1.14}
  td:first-child{font-size:12px}
  .sub,.position{font-size:10px}
  table{min-width:680px}
}

function esc(v){return String(v ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
const i18n = payload.i18n || {};
function t(key, fallback){return i18n[key] || fallback;}
function compact(v,d=2){const n=Number(v); if(!Number.isFinite(n)) return '--'; const a=Math.abs(n), s=n<0?'-':''; if(a>=1e9)return `${s}${(a/1e9).toFixed(d)}B`; if(a>=1e6)return `${s}${(a/1e6).toFixed(d)}M`; if(a>=1e3)return `${s}${(a/1e3).toFixed(d)}K`; return `${s}${a.toLocaleString('en-US',{maximumFractionDigits:d})}`;}
function render(){
  document.getElementById('app').innerHTML = `<section class="layout">
    <div class="chart-panel">

function renderTable(rows){
  if(!rows.length) return `<div class="empty">${esc(t('emptyRows','No insider trade data.'))}</div>`;
  return `<table><thead><tr><th>${esc(t('insider','Insider'))}</th><th>${esc(t('sharesChg','Shares Chg'))}</th><th>${esc(t('sharesHeld','Shares Held'))}</th><th>${esc(t('filed','Filed'))}</th><th>${esc(t('traded','Traded'))}</th></tr></thead><tbody>${rows.map(row => `

      <td>${esc(row.tradedLabel)}</td>
    </tr>`).join('')}</tbody></table>`;
}
const state={start:0,end:1,dragging:null,lastChartWidth:0};
function brushMetrics(){
  const brush=document.getElementById('brush');
  const handle=brush?.querySelector('.handle');
  const size=handle?.getBoundingClientRect().width || 32;
  const pad=Math.ceil(size / 2) + 2;
  // Keep the rail and pointer mapping aligned with the rendered handle size.
  brush?.style.setProperty('--track-pad', `${pad}px`, 'important');
  return {pad, handle:size};
}
function chartPadding(){const compact=window.matchMedia && window.matchMedia('(max-width: 980px)').matches; return compact ? {l:22,r:58,t:10,b:26} : {l:48,r:76,t:24,b:42};}
function setupBrush(){
  const brush=document.getElementById('brush');
  if(!brush) return;
  brush.addEventListener('pointerdown',ev=>{
    const handle=ev.target.closest('.handle');
    if(!handle) return;
    state.dragging=handle.dataset.side;
    handle.setPointerCapture?.(ev.pointerId);
    ev.preventDefault();
  });
  window.addEventListener('pointermove',ev=>{
    if(!state.dragging) return;
    const rect=brush.getBoundingClientRect();
    const pad=brushMetrics().pad;
    const ratio=Math.max(0,Math.min(1,(ev.clientX-rect.left-pad)/Math.max(1,rect.width-pad*2)));
    const minSpan=Math.min(.18,1/Math.max(2,(payload.quarters||[]).length-1));
    if(state.dragging==='left') state.start=Math.min(ratio,state.end-minSpan);
    if(state.dragging==='right') state.end=Math.max(ratio,state.start+minSpan);
    state.start=Math.max(0,Math.min(.98,state.start));
    state.end=Math.max(.02,Math.min(1,state.end));
    updateBrush();
    drawChart();
  });
  window.addEventListener('pointerup',()=>{state.dragging=null;});
  updateBrush();
}
function updateBrush(){
  const brush=document.getElementById('brush');
  if(!brush) return;
  const {pad}=brushMetrics();
  const railW=Math.max(1,brush.clientWidth-pad*2);
  const l=pad+state.start*railW, r=pad+state.end*railW;
  brush.querySelector('.handle.left').style.left=`${l}px`;
  brush.querySelector('.handle.right').style.left=`${r}px`;
  const selected=brush.querySelector('.selection');
  selected.style.left=`${l}px`;
  selected.style.width=`${Math.max(0,r-l)}px`;
}
function sameQuarter(date, quarter){const d=new Date(`${date}T00:00:00Z`); if(Number.isNaN(d.getTime())) return false; const q=Math.floor(d.getUTCMonth()/3)+1; return `${d.getUTCFullYear()} Q${q}`===quarter;}
function drawChart(){
  const el=document.getElementById('chart');
  const allQuarters=(payload.quarters || []).filter(q=>q.label);
  const prices=(payload.priceSeries || []).map(p=>({date:p.date, close:Number(p.close)})).filter(p=>Number.isFinite(p.close));
  if(!allQuarters.length){el.innerHTML=`<div class="empty">${esc(t('emptyChart','No insider activity data.'))}</div>`; return;}
  const panel=document.querySelector('.chart-panel');
  const W=Math.max(320,Math.round((panel && panel.getBoundingClientRect().width) || el.getBoundingClientRect().width || 980));
  const H=Math.max(160,Math.round(W*.4));
  el.style.height=`${H}px`;
  state.lastChartWidth=W;
  const p=chartPadding();
  const startIdx=Math.floor(state.start*Math.max(0,allQuarters.length-1));
  const endIdx=Math.max(startIdx,Math.ceil(state.end*Math.max(0,allQuarters.length-1)));
  const quarters=allQuarters.slice(startIdx,endIdx+1);
  const visibleLabels=new Set(quarters.map(q=>q.label));
  const plotPrices=prices.filter(row=>visibleLabels.has(`${new Date(`${row.date}T00:00:00Z`).getUTCFullYear()} Q${Math.floor(new Date(`${row.date}T00:00:00Z`).getUTCMonth()/3)+1}`));
  const plotW=W-p.l-p.r, plotH=H-p.t-p.b;
  const maxShares=Math.max(1,...quarters.flatMap(q=>[Number(q.buyShares||0),Number(q.sellShares||0)]));
  const shareMax=niceStep(maxShares/4)*4;
  const closes=(plotPrices.length?plotPrices:prices).map(row=>row.close);
  let priceMin=Math.min(...closes), priceMax=Math.max(...closes);
  if(!Number.isFinite(priceMin)||priceMin===priceMax){priceMin=0; priceMax=1}
  const padPrice=(priceMax-priceMin)*.08||1; priceMin=Math.max(0,priceMin-padPrice); priceMax+=padPrice;
  const groupCount=Math.max(quarters.length,1), groupWidth=plotW/(groupCount+Math.max(0,groupCount-1)*.5), groupGap=groupWidth*.5, barGap=1, barWidth=Math.max(1,(groupWidth-barGap)/2);
  const groupStart=i=>p.l+i*(groupWidth+groupGap), x=i=>groupStart(i)+groupWidth/2;
  const yShares=v=>p.t+(shareMax-v)/shareMax*plotH, yPrice=v=>p.t+(priceMax-v)/(priceMax-priceMin)*plotH;
  const ticks=[0,.25,.5,.75,1];
  const grid=ticks.map(t=>{const y=p.t+plotH*t; return `<line class="gridline" x1="${p.l}" y1="${y}" x2="${W-p.r}" y2="${y}"></line><text class="axis" x="${p.l-8}" y="${y}" text-anchor="end">${compact(priceMax-(priceMax-priceMin)*t,0)}</text><text class="axis" x="${W-p.r+10}" y="${y}" text-anchor="start">${compact(shareMax*(1-t),2)}</text>`;}).join('');
  const labelIndexes=sampleXAxisIndexes(quarters,groupWidth+groupGap);
  const compactLayout=window.matchMedia && window.matchMedia('(max-width: 980px)').matches;
  const labelY=compactLayout ? H-8 : H-18;
  const bars=quarters.map((q,i)=>{const bx=groupStart(i), sx=bx+barWidth+barGap, base=yShares(0), by=yShares(Number(q.buyShares||0)), sy=yShares(Number(q.sellShares||0)); const label=labelIndexes.has(i)?`<text class="axis" x="${x(i)}" y="${labelY}" text-anchor="middle">${esc(q.label)}</text>`:''; return `<rect class="bar-buy" x="${bx}" y="${by}" width="${barWidth}" height="${Math.max(1,base-by)}"></rect><rect class="bar-sell" x="${sx}" y="${sy}" width="${barWidth}" height="${Math.max(1,base-sy)}"></rect>${label}`;}).join('');
  const linePrices=plotPrices.length?plotPrices:prices;
  const line=linePrices.map((row,i)=>`${i?'L':'M'}${(i/Math.max(1,linePrices.length-1)*plotW+p.l).toFixed(2)},${yPrice(row.close).toFixed(2)}`).join(' ');
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMin meet">${grid}${bars}${line?`<path class="price-line" d="${line}"></path>`:''}<rect id="hit" x="${p.l}" y="${p.t}" width="${plotW}" height="${plotH}" fill="transparent"></rect></svg><div class="tooltip" id="tooltip"></div>`;
  const svg=el.querySelector('svg'), tip=document.getElementById('tooltip');
  el.querySelector('#hit').addEventListener('mousemove',ev=>{
    const rect=svg.getBoundingClientRect();
    const px=(ev.clientX-rect.left)/rect.width*W;
    let idx=0,best=Infinity; quarters.forEach((q,i)=>{const d=Math.abs(x(i)-px); if(d<best){best=d; idx=i;}});
    const q=quarters[idx], price=(linePrices.find(row=>sameQuarter(row.date,q.label)) || linePrices[Math.min(linePrices.length-1,Math.round(idx/Math.max(1,quarters.length-1)*(linePrices.length-1)))] || {});
    const anchorX=x(idx);
    tip.innerHTML=`<strong class="tip-title">${esc(q.label)}</strong><div class="tip-row"><span class="tip-label"><span class="tip-dot" style="background:#2f64f6"></span>${esc(payload.code||t('price','Price'))}</span><span class="tip-value">${compact(price.close,2)}</span></div><div class="tip-row"><span class="tip-label"><span class="tip-dot" style="background:#079b67"></span>${esc(t('buy','Buy'))}</span><span class="tip-value">${compact(q.buyShares,2)}</span></div><div class="tip-row"><span class="tip-label"><span class="tip-dot" style="background:#ff3b25"></span>${esc(t('sell','Sell'))}</span><span class="tip-value">${compact(q.sellShares,2)}</span></div>`;
    tip.classList.add('show');
    const tipRect=tip.getBoundingClientRect(), chartRect=el.getBoundingClientRect();
    const left=Math.max(8,Math.min(chartRect.width-tipRect.width-8,anchorX-tipRect.width/2));
    tip.style.left=`${left}px`; tip.style.top=`${p.t-tipRect.height-8}px`; tip.style.setProperty('--arrow-left',`${Math.max(16,Math.min(tipRect.width-16,anchorX-left))}px`);
  });
  el.querySelector('#hit').addEventListener('mouseleave',()=>tip.classList.remove('show'));
}
function sampleXAxisIndexes(rows,xBand){const count=rows.length; if(count<=2) return new Set(rows.map((_,i)=>i)); const maxLabelWidth=Math.max(...rows.map(row=>String(row.label||'').length*7.2)); if(xBand>=maxLabelWidth+8) return new Set(rows.map((_,i)=>i)); return new Set([0,Math.floor((count-1)/2),count-1]);}
function niceStep(value){const raw=Math.max(1,Number(value)||1), pow=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/pow; return (n<=1?1:n<=2?2:n<=5?5:10)*pow;}
let resizeTimer=0;
function queueResizeDraw(){clearTimeout(resizeTimer); resizeTimer=setTimeout(()=>{updateBrush(); drawChart();},80);}
window.addEventListener('resize',queueResizeDraw,{passive:true});
function setupResizeObserver(){if(!window.ResizeObserver) return; const chart=document.getElementById('chart'), brush=document.getElementById('brush'); const ro=new ResizeObserver(entries=>{const ce=entries.find(e=>e.target===chart); if(ce){const next=Math.round(ce.contentRect.width||0); if(Math.abs(next-state.lastChartWidth)>2) queueResizeDraw(); return;} queueResizeDraw();}); if(chart) ro.observe(chart); if(brush) ro.observe(brush); requestAnimationFrame(()=>requestAnimationFrame(queueResizeDraw));}
render();

</script>
