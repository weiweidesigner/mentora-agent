:root {

}
* { box-sizing:border-box; }
body {

}
.seasonals {

}
.section-title {

}
.top {

.range-control,.metric-control {

}
.range-select,.select {

  border-radius:10px;
  color:var(--business-text-20242c);
  background:var(--business-bg-fff);
  font-size:14px;

  cursor:pointer;
}
.range-select {

}
.range-popover {

  z-index:1000;
}
.range-popover.open {
  opacity:1;
  pointer-events:auto;
  transform:translateY(0);
}
.year-grid {
  display:grid;
  grid-template-columns:repeat(4, minmax(112px, 1fr));

}
.year-chip {

  height:58px;
  border:1.5px solid var(--business-border-cfcfd2);
  border-radius:29px;
  background:var(--business-bg-fff);
  color:var(--business-text-050505);
  font-size:22px;
  font-weight:500;
  cursor:pointer;
  pointer-events:auto;
  touch-action:manipulation;
  user-select:none;
}
.year-chip.selected {
  border:3px solid var(--business-border-050505);
}
.range-actions {
  display:flex;
  justify-content:flex-end;
  gap:12px;
  padding:28px 32px;
  border-top:1px solid var(--business-border-e5e5e5);
}
.range-action {
  min-width:108px;
  height:48px;
  border:0;
  border-radius:24px;
  background:var(--business-bg-f1f1f2);
  color:var(--business-text-050505);
  font-size:18px;
  font-weight:700;
  cursor:pointer;
}
.range-action.done {
  background:var(--business-bg-050505);
  color:var(--business-text-fff);
}
.chev {
  display:inline-block;
  width:8px;
  height:8px;
  margin-left:10px;
  margin-top:-4px;
  border-right:2px solid currentColor;
  border-bottom:2px solid currentColor;
  transform:rotate(45deg);
  font-size:0;
  line-height:0;
  flex:0 0 auto;
}
.controls {
  display:flex;
  align-items:center;
  gap:10px;
}
.segmented {
  display:flex;
  align-items:center;
  height:36px;
  padding:0;
  border:0;
  border-radius:0;
  background:transparent;
}
.segment {
  display:grid;
  place-items:center;
  min-width:58px;
  height:36px;
  padding:0 14px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:var(--business-text-777d87);
  font-size:14px;
  font-weight:500;
  cursor:pointer;
}
.segment.active {
  color:var(--business-text-141820);
  background:var(--business-bg-f1f1f1);
  box-shadow:none;
  font-weight:700;
}
.toggle {
  display:grid;
  place-items:center;
  min-width:84px;
  height:36px;
  padding:0 14px;
  border:1px solid transparent;
  border-radius:10px;
  background:var(--business-bg-fff);
  color:var(--business-text-141820);
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}
.toggle.active {
  background:var(--business-bg-050505);
  color:var(--business-text-fff);
}
.metric-menu {
  position:absolute;
  top:50px;
  right:0;
  min-width:210px;
  padding:24px 0;
  border-radius:12px;
  background:var(--business-bg-fff);
  box-shadow:0 12px 32px rgba(15,23,42,.16);

  pointer-events:none;
  transform:translateY(-4px);

  z-index:100;

.metric-menu.open {
  opacity:1;

.metric-item {

  text-align:left;

.metric-item:hover {

}
.checkmark {
  font-size:22px;
  font-weight:800;
}
.legend {

  justify-content:center;
  gap:16px;
  min-height:20px;
  margin:14px 0 0;
  color:var(--business-text-7b808a);
  font-size:12px;

.legend-item {

  align-items:center;
  gap:8px;
  white-space:nowrap;
}
.dot {
  width:8px;
  height:8px;
  border-radius:50%;
  background:currentColor;
}
.chart-wrap {
  position:relative;
  z-index:1000;
  width:100%;
  height:480px;
  overflow:visible;
}
svg {
  display:block;
  width:100%;
  height:100%;
  overflow:hidden;
}
.grid-line {

  stroke-width:1;
}
.axis-line {
  stroke:var(--axis);
  stroke-width:1.2;
}
.hover-band {
  fill:var(--business-text-111827);
  opacity:.075;
  pointer-events:none;
}
.hover-guide {
  stroke:var(--business-border-374151);
  stroke-width:1.4;
  stroke-dasharray:0;
  opacity:.82;
  pointer-events:none;
  vector-effect:non-scaling-stroke;
}
.hover-marker {
  stroke:var(--business-border-fff);
  stroke-width:2.2;
  pointer-events:none;
  vector-effect:non-scaling-stroke;
}
.month-label,.axis-label {
  fill:var(--business-text-2a2e35);
  font-size:10px;
}
@media (max-width: 480px) {
  .month-label,.axis-label {

  }
}
.axis-label {
  fill:var(--business-text-777b84);
}
.series-line {
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
  transition:stroke-width .12s ease, opacity .12s ease;
}
.series-line.dashed {
  stroke-dasharray:8 7;
}
.endpoint {
  stroke:var(--business-border-fff);
  stroke-width:2;
}
.badge {
  font-size:10px;
  font-weight:700;
  fill:var(--business-text-fff);
}
.tooltip {
  position:fixed;
  width:max-content;
  min-width:178px;
  max-width:min(220px, calc(100vw - 16px));

  border-radius:8px;

  pointer-events:none;

  z-index:9999;

.tooltip::after {

.tip-title {

}

}

}

  gap:7px;
  min-width:0;
  overflow:hidden;
}

  height:7px;
  border-radius:50%;
  background:currentColor;
  flex:0 0 auto;
}

  text-align:right;
  justify-self:end;

.empty.visible { display:flex; }

.series-name {

  align-items:center;
  gap:8px;
  font-weight:700;

    { label: "价格", value: 'price' },
    { label: 'Percentage', value: 'percentage' },
  ];
  return options;
}

function selectedSeries() {
  return allSeries
    .filter((item) => selectedYears.has(Number(item.year)))
    .sort((a, b) => Number(a.year) - Number(b.year));
}

function latestSelectedYear(series = selectedSeries()) {
  const years = series.map((item) => Number(item.year)).filter(Number.isFinite);
  return years.length ? Math.max(...years) : null;
}

function isAverageSeries(item) {
  return String(item.year) === 'Average' || String(item.label || item.year) === 'Average' || String(item.label || '') === t('average', 'Average');
}

function lineStyleFor(item, latestYear) {
  if (isAverageSeries(item)) return { strokeWidth: 2.2, opacity: 0.78 };
  if (Number(item.year) === latestYear) return { strokeWidth: 3.2, opacity: 1 };
  return { strokeWidth: 1.45, opacity: 0.46 };
}

function orderedForDrawing(chartSeries, latestYear) {
  const normal = chartSeries.filter((item) => !isAverageSeries(item) && Number(item.year) !== latestYear);
  const average = chartSeries.filter((item) => isAverageSeries(item));
  const latest = chartSeries.filter((item) => Number(item.year) === latestYear);
  return [...normal, ...average, ...latest];
}

function valueOf(point, mode = metric) {
  return mode === 'price' ? Number(point.price) : Number(point.priceReturn);
}

function valueLabel(value, mode = metric) {
  if (value == null || !Number.isFinite(value)) return '-';
  if (mode === 'price') return fmt.format(value);
  const prefix = value > 0 ? '+' : '';
  return prefix + value.toFixed(2) + '%';
}

function axisLabel(value, mode = metric) {
  if (mode === 'price') return fmt.format(value);
  if (Math.abs(value) < 1e-9) return '0.0000%';
  return value.toFixed(2) + '%';
}

function estimateEndpointGutter(chartSeries) {
  if (!Array.isArray(chartSeries) || !chartSeries.length) return 132;
  let maxWidth = 0;
  chartSeries.forEach((item) => {
    const last = [...(item.points || [])].reverse().find((point) => {
      const value = valueOf(point);
      return value != null && Number.isFinite(value);
    });
    if (!last) return;
    const value = valueOf(last);
    const text = `${item.label || item.year} | ${valueLabel(value).replace('+', '')}`;
    const width = Math.max(58, text.length * 6.6 + 12);
    if (width > maxWidth) maxWidth = width;
  });
  return Math.max(132, Math.ceil(maxWidth + 18));
}

function niceTicks(min, max, count = 5) {
  if (!Number.isFinite(min) || !Number.isFinite(max)) return [0, 25, 50, 75, 100];
  if (min === max) { min -= 1; max += 1; }

  const niceSteps = [1, 2, 2.5, 3, 5, 7.5, 10];
  const span = Math.max(1e-9, max - min);
  const roughStep = span / Math.max(1, count - 1);
  const magnitude = Math.pow(10, Math.floor(Math.log10(Math.abs(roughStep) || 1)));
  const normalized = roughStep / magnitude;
  let step = (niceSteps.find((candidate) => candidate >= normalized - 1e-9) || 10) * magnitude;

  const nextStep = (current) => {
    const mag = Math.pow(10, Math.floor(Math.log10(Math.abs(current) || 1)));
    const norm = current / mag;
    for (const candidate of niceSteps) {
      if (candidate > norm + 1e-9) return candidate * mag;
    }
    return 10 * mag;
  };

  let start = Math.floor(min / step) * step;
  let end = start + step * (count - 1);

  // Do not shift the tick window upward to chase the max value.
  // Shifting can drop the min value outside the y-domain and make the line overflow below the chart.
  while (end < max - 1e-9) {
    step = nextStep(step);
    start = Math.floor(min / step) * step;
    end = start + step * (count - 1);
  }

  const ticks = [];
  for (let i = 0; i < count; i += 1) {
    const v = start + step * i;
    ticks.push(Math.abs(v) < 1e-9 ? 0 : Number(v.toFixed(10)));
  }
  return ticks;
}


function nearestNiceStep(raw) {
  const value = Math.max(1e-9, Math.abs(raw));
  const magnitude = Math.pow(10, Math.floor(Math.log10(value)));
  const candidates = [1, 2, 2.5, 5, 10].map((item) => item * magnitude);
  return candidates.reduce((best, candidate) => {
    const bestScore = Math.abs(Math.log(best / value));
    const candidateScore = Math.abs(Math.log(candidate / value));
    return candidateScore < bestScore ? candidate : best;
  }, candidates[0]);
}

function compactDomain(dataMin, dataMax, mode = metric, targetFill = 0.8) {
  if (!Number.isFinite(dataMin) || !Number.isFinite(dataMax)) return { min: 0, max: 1 };

  if (dataMin === dataMax) {
    const unit = nearestNiceStep(Math.max(1, Math.abs(dataMin || 1) * 0.1));
    return { min: dataMin - unit * 2, max: dataMax + unit * 2 };
  }

  const dataSpan = Math.max(1e-9, dataMax - dataMin);
  const targetSpan = dataSpan / targetFill;
  const unit = nearestNiceStep(targetSpan / 10);

  let min = mode === 'percentage' ? Math.min(0, dataMin) : dataMin;
  let max = mode === 'percentage' ? Math.max(0, dataMax) : dataMax;
  min = Math.floor(min / unit) * unit;
  max = Math.ceil(max / unit) * unit;

  if (min === max) max = min + unit;

  // Keep the visible curve around 80% of plot height, but do not over-expand to very coarse ticks.
  // A small tolerance avoids jumping from a compact domain such as -40..60 to -40..70.
  const minAcceptedSpan = targetSpan * 0.96;
  while ((max - min) < minAcceptedSpan) {
    const lowerPad = dataMin - min;
    const upperPad = max - dataMax;
    if (lowerPad <= upperPad) min -= unit;
    else max += unit;
  }

  return { min, max };
}

function linearTicks(min, max, count = 5) {
  if (!Number.isFinite(min) || !Number.isFinite(max) || count <= 1) return [min, max];
  const step = (max - min) / (count - 1 || 1);
  const ticks = [];
  for (let i = 0; i < count; i += 1) {
    const value = min + step * i;
    ticks.push(Math.abs(value) < 1e-9 ? 0 : Number(value.toFixed(10)));
  }
  return ticks;
}

function pathFor(points, x, y) {
  const parts = [];
  points.forEach((point) => {
    const value = valueOf(point);
    if (value == null || !Number.isFinite(value)) return;
    const cmd = parts.length ? 'L' : 'M';
    parts.push(`${cmd}${x(point.seasonDay || point.dayOfYear).toFixed(2)},${y(value).toFixed(2)}`);
  });
  return parts.join(' ');
}

function buildAverageSeries(series, mode = metric) {
  const normalized = series.map((item) => {
    return (item.points || [])
      .filter((point) => Number.isFinite(valueOf(point, mode)) && point.seasonDay != null)
      .sort((a, b) => Number(a.seasonDay) - Number(b.seasonDay));
  }).filter((points) => points.length);
  if (!normalized.length) return null;
  const cursors = normalized.map(() => 0);
  const latest = normalized.map(() => null);
  const points = [];
  for (let day = 1; day <= 365; day += 1) {
    const source = [];
    normalized.forEach((itemPoints, index) => {
      while (cursors[index] < itemPoints.length && Number(itemPoints[cursors[index]].seasonDay) <= day) {
        latest[index] = itemPoints[cursors[index]];
        cursors[index] += 1;
      }
      if (latest[index]) {
        const lastDay = Number(itemPoints[itemPoints.length - 1].seasonDay);
        if (day <= lastDay || lastDay >= 330) source.push(latest[index]);
      }
    });
    const values = source.map((point) => valueOf(point, mode)).filter(Number.isFinite);
    if (!values.length) continue;
    const representative = source[source.length - 1] || {};
    const average = values.reduce((sum, value) => sum + value, 0) / values.length;
    points.push({
      date: representative.date || '',
      dayOfYear: day,
      seasonDay: day,
      month: representative.month,
      day: representative.day,
      price: mode === 'price' ? average : null,
      priceReturn: mode === 'percentage' ? average : null,
    });
  }
  if (!points.length) return null;
  return {
    year: 'Average',
    label: t('average', 'Average'),
    color: '#8b95a6',
    strokeStyle: 'dashed',
    points,
  };
}

function labelRect(svgEl, rightX, y, text, color) {
  const padX = 6;
  const height = 19;
  const boxWidth = Math.max(58, text.length * 6.6 + padX * 2);
  const x = rightX - boxWidth;

  const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x);
  rect.setAttribute('y', y - height / 2);
  rect.setAttribute('width', boxWidth);
  rect.setAttribute('height', height);
  rect.setAttribute('rx', 3);
  rect.setAttribute('fill', color);
  rect.setAttribute('opacity', '.92');

  const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  label.setAttribute('x', x + padX);
  label.setAttribute('y', y + 4);
  label.setAttribute('class', 'badge');
  label.textContent = text;

  group.append(rect, label);
  svgEl.appendChild(group);
  return { x, width: boxWidth, height };
}

function drawLeaderLine(svgEl, item, labelBox, color) {
  const startX = item.cx + 6;
  const startY = item.cy;
  const endX = labelBox.x - 6;
  const endY = item.layoutY;
  if (endX <= startX) return;

  const elbowX = Math.max(startX + 12, Math.min(endX - 10, startX + 28));
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  line.setAttribute(
    'd',
    `M${startX.toFixed(2)},${startY.toFixed(2)} L${elbowX.toFixed(2)},${startY.toFixed(2)} L${elbowX.toFixed(2)},${endY.toFixed(2)} L${endX.toFixed(2)},${endY.toFixed(2)}`
  );
  line.setAttribute('fill', 'none');
  line.setAttribute('stroke', color);
  line.setAttribute('stroke-width', '1.1');
  line.setAttribute('stroke-linecap', 'round');
  line.setAttribute('stroke-linejoin', 'round');
  line.setAttribute('opacity', '.62');
  svgEl.appendChild(line);
}

function layoutEndpointLabels(svgEl, labels, width, height, margin) {
  if (!labels.length) return;

  const labelHeight = 19;
  const gap = 4;
  const step = labelHeight + gap;
  const yAxisGutter = 8;
  const labelRightX = width - yAxisGutter;

  const topLimit = margin.top + labelHeight / 2;
  const bottomLimit = height - margin.bottom - labelHeight / 2;
  const sorted = labels.slice().sort((a, b) => a.cy - b.cy);

  let lastY = -Infinity;
  sorted.forEach(item => {
    let y = Math.max(topLimit, Math.min(bottomLimit, item.cy));
    if (y - lastY < step) y = lastY + step;
    item.layoutY = y;
    lastY = y;
  });

  const bottomOverflow = sorted.length ? sorted[sorted.length - 1].layoutY - bottomLimit : 0;
  if (bottomOverflow > 0) sorted.forEach(item => item.layoutY -= bottomOverflow);

  const topOverflow = sorted.length ? topLimit - sorted[0].layoutY : 0;
  if (topOverflow > 0) sorted.forEach(item => item.layoutY += topOverflow);

  sorted.forEach(item => {
    const padX = 6;
    const labelWidth = Math.max(58, item.text.length * 6.6 + padX * 2);
    const labelBox = { x: labelRightX - labelWidth, width: labelWidth, height: labelHeight };
    drawLeaderLine(svgEl, item, labelBox, item.color);
  });

  sorted.forEach(item => labelRect(svgEl, labelRightX, item.layoutY, item.text, item.color));
}

function renderLegend(series) {
  legend.innerHTML = series.map(item => `
    <span class="legend-item" style="color:${item.color || '#2563eb'}">
      <span class="dot"></span><span>${item.label || item.year}</span>
    </span>
  `).join('');
}

function updateRangeLabel() {
  const years = Array.from(selectedYears).sort((a, b) => a - b);
  if (!years.length) {
    rangeLabel.textContent = t('selectYears', 'Select years');
    return;
  }
  rangeLabel.textContent = years.length === 1 ? String(years[0]) : `${years[0]}-${years[years.length - 1]}`;
}

function renderYearGrid() {
  const years = availableYears.length ? availableYears : Array.from(selectedYears);
  yearGrid.innerHTML = years.slice().sort((a, b) => b - a).map((year) => `
    <button class="year-chip ${draftYears.has(year) ? 'selected' : ''}" type="button" data-year="${year}" aria-pressed="${draftYears.has(year) ? 'true' : 'false'}">${year}</button>
  `).join('');
}

function renderMetricMenu() {
  metricMenu.innerHTML = metricOptions().map((item) => `
    <button class="metric-item" type="button" data-metric="${item.value}">
      <span>${item.label}</span><span class="checkmark">${item.value === metric ? '✓' : ''}</span>
    </button>
  `).join('');
  const selected = metricOptions().find((item) => item.value === metric);
  metricLabel.textContent = selected ? selected.label : t('percentage', 'Percentage');
}

function renderTable(series, average) {
  const rows = [...series];
  if (showAverage && average) rows.push(average);
  if (!rows.length) {
    tableWrap.innerHTML = `<div class="empty visible" style="position:static;height:160px;">${t('noData', 'No seasonals data')}</div>`;
    return;
  }
  tableWrap.innerHTML = `
    <table class="season-table">
      <thead><tr><th>${t('year', 'Year')}</th><th>${t('latestPrice', 'Latest Price')}</th><th>${t('percentage', 'Percentage')}</th><th>${t('points', 'Points')}</th></tr></thead>
      <tbody>
        ${rows.map((item) => {
          const last = [...(item.points || [])].reverse().find((point) => Number.isFinite(Number(point.price)) || Number.isFinite(Number(point.priceReturn)));
          const price = last && Number.isFinite(Number(last.price)) ? fmt.format(Number(last.price)) : '-';
          const percentage = last && Number.isFinite(Number(last.priceReturn)) ? valueLabel(Number(last.priceReturn), 'percentage') : '-';
          return `<tr>
            <td><span class="series-name" style="color:${item.color || '#2563eb'}"><span class="dot"></span>${item.label || item.year}</span></td>
            <td>${price}</td>
            <td>${percentage}</td>
            <td>${(item.points || []).length}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
}

function render() {
  updateRangeLabel();
  renderMetricMenu();
  lastTooltipSignature = '';
  const series = selectedSeries();
  const latestYear = latestSelectedYear(series);
  const average = showAverage ? buildAverageSeries(series, metric) : null;
  const chartSeries = average ? [...series, average] : series;
  const drawSeries = orderedForDrawing(chartSeries, latestYear);
  renderLegend(chartSeries);
  chartWrap.style.display = viewMode === 'chart' ? 'block' : 'none';
  tableWrap.classList.toggle('visible', viewMode === 'table');
  document.querySelectorAll('.segment').forEach((button) => button.classList.toggle('active', button.dataset.view === viewMode));
  averageToggle.classList.toggle('active', showAverage);
  if (viewMode === 'table') {
    renderTable(series, average);
    hideTooltip();
    return;
  }
  const box = svg.getBoundingClientRect();
  const width = Math.max(320, box.width || 1200);
  const height = Math.max(260, box.height || 500);
  const rightGutter = estimateEndpointGutter(chartSeries);
  const margin = { top: 16, right: rightGutter, bottom: 32, left: 0 };
  const innerW = width - margin.left - margin.right;
  const innerH = height - margin.top - margin.bottom;
  currentChartLayout = { margin, innerW, innerH, width, height, firstGridY: margin.top, plotLeft: margin.left, plotRight: margin.left + innerW, hoverDays: [] };
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  svg.innerHTML = '';
  empty.classList.toggle('visible', !series.length);
  if (!series.length) return;
  const values = chartSeries.flatMap((item) => item.points.map((point) => valueOf(point))).filter((value) => value != null && Number.isFinite(value));
  const dataMin = Math.min(...values);
  const dataMax = Math.max(...values);
  const domain = compactDomain(dataMin, dataMax, metric, 0.8);
  let min = domain.min;
  let max = domain.max;
  const ticks = linearTicks(min, max, 5);
  const x = (day) => margin.left + ((day - 1) / 364) * innerW;
  const y = (value) => margin.top + (1 - (value - min) / (max - min || 1)) * innerH;
  hoverPoints = [];

  ticks.forEach((tick, tickIndex) => {
    const yy = y(tick);
    if (tickIndex === ticks.length - 1) currentChartLayout.firstGridY = yy;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('class', metric === 'percentage' && tick === 0 ? 'axis-line' : 'grid-line');
    line.setAttribute('x1', margin.left);
    line.setAttribute('x2', width - 8);
    line.setAttribute('y1', yy);
    line.setAttribute('y2', yy);
    svg.appendChild(line);
    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('class', 'axis-label');
    label.setAttribute('x', width - 8);
    label.setAttribute('y', yy - 6);
    label.setAttribute('text-anchor', 'end');
    label.textContent = axisLabel(tick);
    svg.appendChild(label);
  });

  const visibleMonths = visibleMonthIndices(width);
  const monthStep = visibleMonths.length > 1 ? innerW / (visibleMonths.length - 1) : 0;
  visibleMonths.forEach((idx, visibleIndex) => {
    const isFirst = visibleIndex === 0;
    const isLast = visibleIndex === visibleMonths.length - 1;
    const xPos = margin.left + monthStep * visibleIndex;

    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('class', 'month-label');
    label.setAttribute('x', xPos);
    label.setAttribute('y', height - 12);
    label.setAttribute('text-anchor', isFirst ? 'start' : (isLast ? 'end' : 'middle'));
    label.textContent = monthNames[idx];
    svg.appendChild(label);
  });
  

  const hoverUnderlay = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  hoverUnderlay.setAttribute('id', 'hoverUnderlay');
  svg.appendChild(hoverUnderlay);

  const endpointLabels = [];

  drawSeries.forEach((item) => {
    const style = lineStyleFor(item, latestYear);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('class', `series-line ${item.strokeStyle === 'dashed' ? 'dashed' : ''}`);
    path.setAttribute('d', pathFor(item.points, x, y));
    path.setAttribute('stroke', item.color || '#2563eb');
    path.setAttribute('stroke-width', style.strokeWidth);
    path.setAttribute('opacity', style.opacity);
    svg.appendChild(path);

    item.points.forEach((point) => {
      const value = valueOf(point);
      if (value == null || !Number.isFinite(value)) return;
      hoverPoints.push({ item, point, x: x(point.seasonDay || point.dayOfYear), y: y(value), value });
    });

    const last = [...item.points].reverse().find((point) => {
      const value = valueOf(point);
      return value != null && Number.isFinite(value);
    });
    if (!last) return;

    const value = valueOf(last);
    const cx = x(last.seasonDay || last.dayOfYear);
    const cy = y(value);

    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('class', 'endpoint');
    dot.setAttribute('cx', cx);
    dot.setAttribute('cy', cy);
    dot.setAttribute('r', item.strokeStyle === 'dashed' ? 0 : (Number(item.year) === latestYear ? 4.8 : 3.5));
    dot.setAttribute('fill', item.color || '#2563eb');
    dot.setAttribute('opacity', lineStyleFor(item, latestYear).opacity);
    svg.appendChild(dot);

    endpointLabels.push({
      cx,
      cy,
      text: `${item.label || item.year} | ${valueLabel(value).replace('+', '')}`,
      color: item.color || '#2563eb'
    });
  });

  currentChartLayout.hoverDays = Array.from(new Set(
    hoverPoints
      .map((item) => Number(item.point.seasonDay || item.point.dayOfYear))
      .filter(Number.isFinite)
  )).sort((a, b) => a - b);

  layoutEndpointLabels(svg, endpointLabels, width, height, margin);

  const hoverOverlay = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  hoverOverlay.setAttribute('id', 'hoverOverlay');
  svg.appendChild(hoverOverlay);
}

function clearHoverSelection() {
  const underlay = document.getElementById('hoverUnderlay');
  const overlay = document.getElementById('hoverOverlay');
  if (underlay) underlay.innerHTML = '';
  if (overlay) overlay.innerHTML = '';
}

function hideTooltip() {
  tooltip.classList.remove('visible');
  lastTooltipSignature = '';
  clearHoverSelection();
}

function tooltipRows(rows) {
  return rows.slice();
}

function updateHoverSelection(activeDay) {
  const underlay = document.getElementById('hoverUnderlay');
  const overlay = document.getElementById('hoverOverlay');
  if (!underlay || !overlay) return null;

  const layout = currentChartLayout || { margin: { top: 16, right: 132, bottom: 32, left: 0 }, innerW: 0, innerH: 0, plotLeft: 0, plotRight: 0, hoverDays: [] };
  const margin = layout.margin || { top: 16, right: 132, bottom: 32, left: 0 };
  const plotLeft = Number.isFinite(layout.plotLeft) ? layout.plotLeft : margin.left;
  const plotRight = Number.isFinite(layout.plotRight) ? layout.plotRight : margin.left + (layout.innerW || 0);
  const plotTop = margin.top;
  const plotBottom = (layout.height || 0) - margin.bottom;
  const innerW = Math.max(1, plotRight - plotLeft);
  const dayToX = (day) => plotLeft + ((day - 1) / 364) * innerW;

  const days = Array.isArray(layout.hoverDays) && layout.hoverDays.length
    ? layout.hoverDays
    : [Number(activeDay)].filter(Number.isFinite);

  let index = days.findIndex((day) => Number(day) === Number(activeDay));
  if (index < 0) {
    index = 0;
    let bestDist = Infinity;
    days.forEach((day, i) => {
      const dist = Math.abs(Number(day) - Number(activeDay));
      if (dist < bestDist) {
        bestDist = dist;
        index = i;
      }
    });
  }

  const currentDay = Number(days[index]);
  const prevDay = index > 0 ? Number(days[index - 1]) : currentDay - 1;
  const nextDay = index < days.length - 1 ? Number(days[index + 1]) : currentDay + 1;

  // hover 区域按“当前数据点”的前后中点来算，而不是按月份/刻度宽度。
  const leftDay = Math.max(1, (prevDay + currentDay) / 2);
  const rightDay = Math.min(365, (currentDay + nextDay) / 2);
  const bandX = Math.max(plotLeft, dayToX(leftDay));
  const bandRight = Math.min(plotRight, dayToX(rightDay));
  const bandWidth = Math.max(1, bandRight - bandX);
  const anchorX = dayToX(currentDay);

  underlay.innerHTML = '';
  overlay.innerHTML = '';

  const band = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  band.setAttribute('class', 'hover-band');
  band.setAttribute('x', bandX.toFixed(2));
  band.setAttribute('y', plotTop.toFixed(2));
  band.setAttribute('width', bandWidth.toFixed(2));
  band.setAttribute('height', Math.max(0, plotBottom - plotTop).toFixed(2));
  underlay.appendChild(band);

  return anchorX;
}

function placeTooltip(anchorX) {
  const rect = svg.getBoundingClientRect();
  const layout = currentChartLayout || { margin: { top: 16, right: 132, bottom: 32, left: 0 }, firstGridY: 16 };
  const margin = layout.margin || { top: 16, right: 132, bottom: 32, left: 0 };

  const tipWidth = Math.max(178, tooltip.offsetWidth || 178);
  const tipHeight = Math.max(48, tooltip.offsetHeight || 48);
  const half = tipWidth / 2;

  // tooltip 位置逻辑保留为“第一条网格线上方”，但不占用图表内部空间；
  // fixed 定位让它可以自然超出图表区域，且不受父级层级影响。
  const firstGridY = Number.isFinite(layout.firstGridY) ? layout.firstGridY : margin.top;
  const top = rect.top + firstGridY - tipHeight - 8;

  const viewportWidth = document.documentElement.clientWidth || window.innerWidth || rect.width;
  const rawLeft = rect.left + anchorX;
  const minLeft = half + 8;
  const maxLeft = Math.max(minLeft, viewportWidth - half - 8);
  const left = Math.min(Math.max(rawLeft, minLeft), maxLeft);

  const anchorViewportX = rect.left + anchorX;
  const arrowX = Math.min(Math.max(anchorViewportX - (left - half), 14), tipWidth - 14);

  tooltip.style.left = `${left}px`;
  tooltip.style.top = `${top}px`;
  tooltip.style.setProperty('--arrow-x', `${arrowX}px`);
}

function showTooltip(event) {
  if (!hoverPoints.length) return;

  const rect = svg.getBoundingClientRect();
  const px = event.clientX - rect.left;
  const layout = currentChartLayout || { margin: { top: 16, right: 132, bottom: 32, left: 0 }, innerW: rect.width, plotLeft: 0, plotRight: rect.width };
  const margin = layout.margin || { top: 16, right: 132, bottom: 32, left: 0 };
  const plotLeft = Number.isFinite(layout.plotLeft) ? layout.plotLeft : margin.left;
  const plotRight = Number.isFinite(layout.plotRight) ? layout.plotRight : margin.left + (layout.innerW || rect.width);
  const innerW = Math.max(1, plotRight - plotLeft);

  if (px < plotLeft - 16 || px > plotRight + 16) {
    hideTooltip();
    return;
  }

  const clampedX = Math.min(Math.max(px, plotLeft), plotRight);
  const rawDay = 1 + ((clampedX - plotLeft) / innerW) * 364;
  const hoverDays = Array.isArray(layout.hoverDays) && layout.hoverDays.length ? layout.hoverDays : [];
  let nearestDay = Math.round(rawDay);
  if (hoverDays.length) {
    let bestDist = Infinity;
    hoverDays.forEach((day) => {
      const dist = Math.abs(Number(day) - rawDay);
      if (dist < bestDist) {
        bestDist = dist;
        nearestDay = Number(day);
      }
    });
  }
  const nearestX = plotLeft + ((nearestDay - 1) / 364) * innerW;

  const groups = new Map();
  hoverPoints.forEach((candidate) => {
    const key = String(candidate.item.label || candidate.item.year);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(candidate);
  });

  const rows = [];
  const latestYearForTooltip = latestSelectedYear();

  groups.forEach((points) => {
    let best = null;
    let bestDayDist = Infinity;

    const orderedPoints = points.slice().sort((a, b) => {
      const aDay = Number(a.point.seasonDay || a.point.dayOfYear);
      const bDay = Number(b.point.seasonDay || b.point.dayOfYear);
      return aDay - bDay;
    });

    points.forEach((candidate) => {
      const day = Number(candidate.point.seasonDay || candidate.point.dayOfYear);
      if (!Number.isFinite(day)) return;
      const dist = Math.abs(day - nearestDay);
      if (dist < bestDayDist) {
        bestDayDist = dist;
        best = candidate;
      }
    });

    const isLatestYear = best && Number(best.item.year) === Number(latestYearForTooltip);

    if (best && bestDayDist <= 20) {
      rows.push(best);
      return;
    }

    // 最新年份即使后续日期没有值，也继续展示它的最后一个已知数据点。
    if (isLatestYear) {
      const lastKnown = [...orderedPoints].reverse().find((candidate) => {
        const day = Number(candidate.point.seasonDay || candidate.point.dayOfYear);
        return Number.isFinite(day) && day <= nearestDay;
      }) || orderedPoints[orderedPoints.length - 1];

      if (lastKnown) rows.push(lastKnown);
    }
  });

  rows.sort((a, b) => {
    const aLabel = String(a.item.label || a.item.year);
    const bLabel = String(b.item.label || b.item.year);
    if (String(a.item.year) === 'Average' || aLabel === 'Average' || aLabel === t('average', 'Average')) return 1;
    if (String(b.item.year) === 'Average' || bLabel === 'Average' || bLabel === t('average', 'Average')) return -1;
    return Number(a.item.year) - Number(b.item.year);
  });

  const displayRows = tooltipRows(rows);

  if (!displayRows.length) {
    hideTooltip();
    return;
  }

  const titlePoint = displayRows[0].point || {};
  const dateLabel = titlePoint.month && titlePoint.day ? `${titlePoint.month}/${titlePoint.day}` : `${t('day', 'Day')} ${nearestDay}`;
  const signature = `${nearestDay}|${displayRows.map((row) => `${row.item.label || row.item.year}:${Number(row.value).toFixed(4)}`).join('|')}`;

  if (signature !== lastTooltipSignature) {
    tooltip.innerHTML = `
      <div class="tip-title">${dateLabel}</div>
      <div class="tip-rows">
        ${displayRows.map((row) => `
          <div class="tip-row">
            <span class="tip-name" style="color:${row.item.color || '#2563eb'}">
              <span class="tip-dot"></span>
              <span>${row.item.label || row.item.year}</span>
            </span>
            <b>${valueLabel(row.value)}</b>
          </div>
        `).join('')}
      </div>
    `;
    lastTooltipSignature = signature;
  }

  const visualAnchorX = updateHoverSelection(nearestDay);
  tooltip.classList.add('visible');
  placeTooltip(Number.isFinite(visualAnchorX) ? visualAnchorX : nearestX);
}

function queueTooltip(event) {
  pendingTooltipEvent = { clientX: event.clientX, clientY: event.clientY };
  if (tooltipFrame) return;
  tooltipFrame = requestAnimationFrame(() => {
    tooltipFrame = 0;
    if (pendingTooltipEvent) showTooltip(pendingTooltipEvent);
  });
}

rangeButton.addEventListener('click', (event) => {
  event.stopPropagation();
  draftYears = new Set(selectedYears);
  renderYearGrid();
  yearPopover.classList.toggle('open');
  rangeButton.setAttribute('aria-expanded', yearPopover.classList.contains('open') ? 'true' : 'false');
  metricMenu.classList.remove('open');
});

yearPopover.addEventListener('pointerdown', (event) => {
  event.stopPropagation();
});

yearPopover.addEventListener('click', (event) => {
  event.stopPropagation();
});

yearGrid.addEventListener('click', (event) => {
  const button = event.target.closest('[data-year]');
  if (!button) return;
  event.preventDefault();
  event.stopPropagation();
  const year = Number(button.dataset.year);
  if (draftYears.has(year)) draftYears.delete(year);
  else draftYears.add(year);
  const isSelected = draftYears.has(year);
  button.classList.toggle('selected', isSelected);
  button.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
});

cancelYears.addEventListener('click', (event) => {
  event.preventDefault();
  event.stopPropagation();
  draftYears = new Set(selectedYears);
  yearPopover.classList.remove('open');
  rangeButton.setAttribute('aria-expanded', 'false');
  renderYearGrid();
});

doneYears.addEventListener('click', (event) => {
  event.preventDefault();
  event.stopPropagation();
  if (!draftYears.size) return;
  selectedYears = new Set(draftYears);
  yearPopover.classList.remove('open');
  rangeButton.setAttribute('aria-expanded', 'false');
  render();
});

document.querySelectorAll('.segment').forEach((button) => {
  button.addEventListener('click', () => {
    viewMode = button.dataset.view || 'chart';
    render();
  });
});

averageToggle.addEventListener('click', () => {
  showAverage = !showAverage;
  render();
});

metricButton.addEventListener('click', (event) => {
  event.stopPropagation();
  renderMetricMenu();
  metricMenu.classList.toggle('open');
  yearPopover.classList.remove('open');
});

metricMenu.addEventListener('click', (event) => {
  const button = event.target.closest('[data-metric]');
  if (!button) return;
  metric = button.dataset.metric === 'price' ? 'price' : 'percentage';
  metricMenu.classList.remove('open');
  render();
});

document.addEventListener('click', (event) => {
  if (!yearPopover.contains(event.target) && !rangeButton.contains(event.target)) {
    yearPopover.classList.remove('open');
    rangeButton.setAttribute('aria-expanded', 'false');
  }
  if (!metricMenu.contains(event.target) && !metricButton.contains(event.target)) metricMenu.classList.remove('open');
});

svg.addEventListener('pointermove', queueTooltip);
svg.addEventListener('pointerleave', hideTooltip);
window.addEventListener('resize', render);
renderYearGrid();
renderMetricMenu();
render();
</script>
</body>
</html>
