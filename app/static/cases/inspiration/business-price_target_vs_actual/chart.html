*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--business-text-171717);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{padding:0}
.card{
  width:100%;
  max-width:none;
  margin:0;
  background:transparent;
  border:0;
  border-radius:0;
  padding:0;
  box-shadow:none;
}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}
.title{margin:0 0 8px;font-size:16px;line-height:1.2;font-weight:800;color:var(--business-text-171717);letter-spacing:0}
.subtitle{margin:0;color:var(--business-text-697181);font-size:12px;line-height:1.25;font-weight:500}
.subtitle .up{color:#00a866}
.subtitle .down{color:#e8454f}
.tabs{display:inline-flex;align-items:center;gap:8px;padding:0;color:var(--business-text-171717);flex:none}
.tab{
  appearance:none;
  border:0;
  background:transparent;
  color:var(--business-text-404040);
  font:inherit;
  font-size:14px;
  font-weight:400;
  line-height:1;
  cursor:pointer;
  white-space:nowrap;
  border-radius:10px;
  transition:background-color .14s ease,color .14s ease;
  min-width:58px;
  height:36px;
  padding:0 13px;
}
.tab.active{background:var(--business-bg-f1f1f1);color:var(--business-text-171717);font-weight:700;box-shadow:none}
.tab:focus-visible{outline:2px solid #4387f5;outline-offset:2px}
.chart-wrap{position:relative;height:280px;margin-top:6px;overflow:visible}
svg{display:block;width:100%;height:100%;overflow:visible}
.grid line{stroke:var(--business-border-ececec);stroke-width:1}
.axis{stroke:var(--business-border-777);stroke-width:1.15}
.axis-label{fill:var(--business-text-303236);font-size:10px;font-weight:400}
.x-label{fill:var(--business-text-35373b);font-size:10px;font-weight:400}
.line{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.actual{stroke:#3b6fe0}
.target{stroke:#14b8a6}
.hover-band{fill:var(--business-text-8a8a8a);fill-opacity:.08;opacity:0;transition:opacity .12s ease;pointer-events:none}
.hover-band.active{opacity:1}
.hover-zone{fill:rgba(0,0,0,.001);pointer-events:all;cursor:pointer}
.hover-dot{stroke:var(--business-border-fff);stroke-width:2}
.tooltip{
  --arrow-x:50%;
  position:fixed;
  pointer-events:none;
  z-index:50;
  min-width:210px;
  border-radius:6px;
  background:var(--business-bg-303030);
  color:var(--business-text-f2f2f2);
  padding:9px 11px;
  font-size:12px;
  line-height:1.45;
  opacity:0;
  transition:opacity .08s ease;
  white-space:nowrap;
}
.tooltip::after{
  content:"";
  position:absolute;
  left:var(--arrow-x);
  bottom:-6px;
  width:0;
  height:0;
  transform:translateX(-50%);
  border-left:6px solid transparent;
  border-right:6px solid transparent;
  border-top:6px solid var(--business-bg-303030);
}
.tooltip.show{opacity:1}
.tip-title{color:var(--business-text-fff);font-weight:800;margin-bottom:5px}
.tooltip-row{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:4px;min-width:188px}
.tip-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.tip-label{color:var(--business-text-d8d8d8);font-size:12px;line-height:1.2}
.tip-value{margin-left:auto;color:var(--business-text-fff);font-size:12px;font-weight:700;line-height:1.2}
.chart-legend{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
  margin-top:10px;
  color:var(--business-text-697181);
  font-size:12px;
  line-height:1.2;
}
.chart-legend-item{
  display:inline-flex;
  align-items:center;
  gap:8px;
  white-space:nowrap;
}
.chart-legend-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  flex:0 0 auto;
}
.empty{height:220px;display:flex;align-items:center;justify-content:center;color:var(--business-text-697181);font-size:14px}
@media(max-width:760px){
  .card{padding:0}
  .head{display:block;margin-bottom:20px}
  .title{font-size:16px}
  .subtitle{font-size:12px;margin-bottom:14px}
  .tabs{width:max-content;max-width:100%;overflow:auto}
  .tab{min-width:58px;height:36px;font-size:14px}
  .chart-wrap{height:240px}
  .axis-label,.x-label{font-size:10px}
}

function drawChart(rows) {
  const svg = document.getElementById('chart');
  const tip = document.getElementById('tip');
  const wrap = svg.closest('.chart-wrap');
  const W = Math.max(360, Math.round(wrap.clientWidth || 900));
  const H = Math.max(220, Math.round(wrap.clientHeight || 280));
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = '';

  const values = rows.flatMap((x) => [Number(x.actual), Number(x.target)]).filter(Number.isFinite);
  let min = Math.min(...values);
  let max = Math.max(...values);
  const span = max - min || Math.max(1, max * 0.2);
  min = Math.max(0, Math.floor((min - span * 0.12) / 10) * 10);
  max = Math.ceil((max + span * 0.12) / 10) * 10;

  const ticks = Array.from({ length: 5 }, (_, i) => max - (max - min) * i / 4);
  const axisLabels = ticks.map((t) => `${Math.round(t)}`);
  const estimateTextWidth = (label) => String(label || '').length * 7.2;
  const axisGap = 8;
  const edgePad = 2;
  const rightAxisWidth = Math.max(36, ...axisLabels.map(estimateTextWidth));
  const pad = {
    top: 12,
    right: Math.ceil(rightAxisWidth + axisGap + edgePad),
    bottom: 44,
    left: 0
  };

  const chartW = Math.max(1, W - pad.left - pad.right);
  const chartH = Math.max(1, H - pad.top - pad.bottom);
  const x = (i) => rows.length === 1 ? pad.left + chartW / 2 : pad.left + i / (rows.length - 1) * chartW;

  const ns = 'http://www.w3.org/2000/svg';
  const el = (name, attrs = {}, parent = svg) => {
    const node = document.createElementNS(ns, name);

    return node;
  };

  const gridLayer = el('g', { class: 'grid' });
  const hoverLayer = el('g');
  const lineLayer = el('g');
  const labelLayer = el('g');
  const zoneLayer = el('g');

  ticks.forEach((t, i) => {
    const yy = pad.top + chartH * i / 4;
    el('line', { x1: pad.left, y1: yy, x2: W - pad.right, y2: yy, class: i === ticks.length - 1 ? 'axis' : 'grid' }, gridLayer);
    el('text', { x: W - pad.right + axisGap, y: yy + 4, class: 'axis-label' }, gridLayer).textContent = axisLabels[i];
  });

  function linePath(field) {

      .filter((p) => Number.isFinite(Number(p.row[field])))

    tip.style.setProperty('--arrow-x', arrowX + 'px');
  }

  function showTooltip(clientX, row) {
    tip.innerHTML = `
      <div class="tip-title">${esc(fmtDate(row.date))}</div>
      <div class="tooltip-row">

    tip.classList.add('show');

  }

    tip.classList.remove('show');
  }

  function clearBands() {
    hoverLayer.querySelectorAll('.hover-band').forEach((node) => node.classList.remove('active'));
  }

  const touchActivators=[];
  points.forEach((point, index) => {
    const left = index === 0 ? pad.left : (points[index - 1].x + point.x) / 2;
    const right = index === points.length - 1 ? W - pad.right : (point.x + points[index + 1].x) / 2;
    const band = el('rect', { x: left, y: pad.top, width: Math.max(1, right - left), height: chartH, class: 'hover-band' }, hoverLayer);
    const zone = el('rect', { x: left, y: pad.top, width: Math.max(1, right - left), height: chartH, class: 'hover-zone' }, zoneLayer);

    const activate = (event) => {
      clearBands();
      band.classList.add('active');
      svg.querySelectorAll('.hover-dot').forEach((n) => n.remove());

      const actual = Number(point.row.actual);
      const target = Number(point.row.target);
      const markerY = [];

      if (Number.isFinite(actual)) {
        markerY.push(y(actual));
        el('circle', { class: 'hover-dot', cx: point.x, cy: y(actual), r: 4.8, fill: '#3b6fe0' }, lineLayer);
      }
      if (Number.isFinite(target)) {
        markerY.push(y(target));
        el('circle', { class: 'hover-dot', cx: point.x, cy: y(target), r: 4.8, fill: '#14b8a6' }, lineLayer);
      }

      const rect = svg.getBoundingClientRect();
      showTooltip(event?.pointerType==='touch'?event.clientX:rect.left + (point.x / W) * rect.width, point.row);
    };

    touchActivators.push(activate);
    zone.addEventListener('pointerenter', activate);
    zone.addEventListener('pointermove', activate);
    zone.addEventListener('pointerleave', (event) => {
      if(event.pointerType==='touch')return;
      band.classList.remove('active');
      svg.querySelectorAll('.hover-dot').forEach((n) => n.remove());
      hideTooltip();
    });
  });
  svg.touchCleanup?.();
  const touchController=new AbortController();let touch=null,lastIndex=-1,dismissTimer=null;
  svg.style.touchAction='pan-y';
  const resetTouch=()=>{if(!touch&&lastIndex<0&&!tip.classList.contains('show')){clearTimeout(dismissTimer);return;}touch=null;lastIndex=-1;clearTimeout(dismissTimer);clearBands();svg.querySelectorAll('.hover-dot').forEach(n=>n.remove());hideTooltip();};
  const selectTouch=event=>{
    const rect=svg.getBoundingClientRect(),sx=(event.clientX-rect.left)*W/rect.width;
    const index=points.reduce((nearest,p,i)=>Math.abs(p.x-sx)<Math.abs(points[nearest].x-sx)?i:nearest,0);
    if(index!==lastIndex){touchActivators[index](event);lastIndex=index;}
    else setTooltipPosition(event.clientX);
  };
  svg.addEventListener('pointerdown',event=>{
    if(event.pointerType!=='touch')return;
    resetTouch();touch={id:event.pointerId,x:event.clientX,y:event.clientY,direction:'pending'};selectTouch(event);
  },{capture:true,passive:true,signal:touchController.signal});
  svg.addEventListener('pointermove',event=>{
    if(!touch||event.pointerType!=='touch'||event.pointerId!==touch.id)return;
    const dx=Math.abs(event.clientX-touch.x),dy=Math.abs(event.clientY-touch.y);
    if(touch.direction==='pending'&&Math.max(dx,dy)>6)touch.direction=dx>=dy?'horizontal':'vertical';
    if(touch.direction==='vertical'){clearBands();hideTooltip();lastIndex=-1;}
    else if(touch.direction==='horizontal')selectTouch(event);
    event.stopImmediatePropagation();
  },{capture:true,passive:true,signal:touchController.signal});
  svg.addEventListener('pointerup',event=>{
    if(!touch||event.pointerId!==touch.id)return;
    if(touch.direction!=='vertical')selectTouch(event);
    touch=null;dismissTimer=setTimeout(resetTouch,1200);
  },{passive:true,signal:touchController.signal});
  svg.addEventListener('pointercancel',resetTouch,{passive:true,signal:touchController.signal});
  const onOutside=event=>{if(!svg.contains(event.target))resetTouch();};
  document.addEventListener('pointerdown',onOutside,{capture:true,passive:true,signal:touchController.signal});
  window.addEventListener('scroll',resetTouch,{capture:true,passive:true,signal:touchController.signal});
  try{
    if(parent!==window){parent.addEventListener('scroll',resetTouch,{capture:true,passive:true,signal:touchController.signal});parent.document.addEventListener('pointerdown',resetTouch,{capture:true,passive:true,signal:touchController.signal});}
  }catch(_){}
  svg.touchCleanup=()=>{touchController.abort();clearTimeout(dismissTimer);};

}

window.addEventListener('resize', () => window.requestAnimationFrame(() => {
  const rows = (payload.views?.[active] || []).filter((x) => Number.isFinite(Number(x.target)) || Number.isFinite(Number(x.actual)));
  if (rows.length) drawChart(rows);
}));

draw();

</script>
