    :root {
      --blue:#2863f4;
      --cyan:#3fc8ed;
      --orange:#ff6845;
      --green:#2ab7a1;
      --pink:#ff3d7f;
      --total-blue:#3477ed;
      --text:var(--business-text-16181c);
      --muted:var(--business-text-6f7378);
      --grid:var(--business-border-e8e8e8);
      --axis:var(--business-border-767b84);
      --tab-bg:var(--business-bg-f3f3f3);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; margin: 0; }
    body {
      background: transparent;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .balance-sheet {
      width: min(100%, 2048px);
      margin: 0;
      padding: 0;
      overflow: visible;
    }
    .page-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      font-size: 16px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: 0;
    }
    .description {
      width: 100%;
      max-width: clamp(980px, calc(100vw - 72px), 1560px);
      margin: 12px 0 12px;
      color:var(--business-text-22252a);
      font-size: 14px;
      line-height: 1.45;
      text-wrap: pretty;
    }
    .panels {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: clamp(34px, 4vw, 70px);
      align-items: start;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 16px;
      min-height: 30px;
      margin-bottom: 0;
    }
    .panel-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.25;
    }
    .panels > section:first-child > .panel-title { margin-bottom: 6px; }
    .metric-tabs {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .metric-tabs::-webkit-scrollbar { display: none; }
    .metric-tab {
      border: 0;
      background: transparent;
      color:var(--business-text-202226);
      font: inherit;
      font-size: 14px;
      line-height: 1;
      padding: 9px 14px;
      min-height: 32px;
      border-radius: 6px;
      white-space: nowrap;
      cursor: pointer;
    }
    .metric-tab.active { background: var(--tab-bg); font-weight: 800; }
    .chart-toolbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      min-height: 34px;
      margin: 2px 0 6px;
    }
    .segmented {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px;
      border-radius: 18px;
      background:var(--business-bg-f2f2f2);
    }
    .segment {
      border: 0;
      background: transparent;
      color:var(--business-text-1c1d20);
      font: inherit;
      font-size: 13px;
      line-height: 1;
      font-weight: 700;
      padding: 7px 16px;
      border-radius: 15px;
      cursor: pointer;
    }
    .segment.active { background:var(--business-bg-fff); box-shadow: 0 1px 4px rgba(0, 0, 0, .05); }
    .trend-stage {
      position: relative;
      width: 100%;
      height: 224px;
      overflow: visible;
    }
    .chart-svg { display: block; width: 100%; min-width: 0; height: 100%; overflow: visible; }
    .waterfall-svg { display: block; width: 100%; height: 214px; overflow: visible; }
    .legend {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
      width: 100%;
      min-height: 24px;
      margin: 0;
      color:var(--business-text-858585);
      font-size: 13px;
      text-align: center;
    }
    .legend-item { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); flex: 0 0 auto; }
    .dot.orange { background: var(--orange); }
    .dot.cyan { background: var(--cyan); }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1.2; }
    .axis-label { fill:var(--business-text-777); font-size: 12px; }
    .x-label { fill:var(--business-text-666); font-size: 12px; }
    .bar-label { fill: var(--blue); font-size: 11px; font-weight: 700; text-anchor: middle; }
    .line-label { fill: var(--orange); font-size: 11px; font-weight: 700; text-anchor: middle; }
    .hover-band { fill:var(--business-text-8a8a8a); fill-opacity: .08; opacity: 0; transition: opacity .12s ease; pointer-events: none; }
    .hover-band.active { opacity: 1; }
    .hover-zone { fill: rgba(0,0,0,.001); pointer-events: all; cursor: pointer; touch-action: manipulation; }
    .trend-stage,
    .waterfall-svg {
      touch-action: manipulation;
    }
    .waterfall-label { fill:var(--business-text-2e3034); font-size: 13px; font-weight: 700; text-anchor: middle; }
    .waterfall-x { fill:var(--business-text-777); font-size: 12px; text-anchor: middle; }
    .badge-text { fill:var(--business-text-fff); font-size: 11px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .empty-title { fill:var(--business-text-2e3034); font-size: 15px; font-weight: 800; text-anchor: middle; }
    .empty-subtitle { fill:var(--business-text-777); font-size: 12px; text-anchor: middle; }
    .selected-period {
      color:var(--business-text-777);
      font-size: 1em;
      font-weight: 800;
      white-space: nowrap;
      margin-left: 4px;
    }
    .range-shell {
      --handle-size: 32px;
      height: var(--handle-size);
      margin: 6px 0 0;
      padding: 0 calc(var(--handle-size) / 2) 0;
      position: relative;
      touch-action: none;
    }
    .range-track { position: relative; width: 100%; height: var(--handle-size); }
    .range-track::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: calc(var(--handle-size) / 2);
      height: 3px;
      background:var(--business-bg-f1f1f1);
      border-radius: 999px;
      transform: translateY(-50%);
    }
    .range-selection {
      position: absolute;
      top: calc(var(--handle-size) / 2);
      height: 3px;
      background:var(--business-bg-5f5f5f);
      border-radius: 999px;
      transform: translateY(-50%);
    }
    .range-handle {
      appearance: none;
      position: absolute;
      top: calc(var(--handle-size) / 2);
      width: var(--handle-size);
      height: var(--handle-size);
      border-radius: 50%;
      border: 1px solid var(--business-border-d5d5d5);
      background:var(--business-bg-fff);
      box-shadow: 0 1px 4px rgba(0,0,0,.18);
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      z-index: 2;
      padding: 0;
      user-select: none;
    }
    .range-handle:active { cursor: grabbing; }
    .range-handle::before {
      content: "";
      width: 2px;
      height: 13px;
      border-radius: 999px;
      background:var(--business-bg-8a8a8a);
      box-shadow: -5px 0 0 var(--business-border-8a8a8a), 5px 0 0 #8a8a8a;
      opacity: .9;
    }
    .range-shell[hidden] { display: none; }
    .tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      min-width: 190px;
      max-width: min(340px, calc(100vw - 20px));
      border-radius: 6px;
      background: rgba(59, 59, 59, .96);
      color:var(--business-text-fff);
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.5;
      opacity: 0;
      visibility: hidden;
      transition: opacity .08s ease;
      white-space: nowrap;
    }
    .tooltip.visible { opacity: 1; visibility: visible; }
    .tooltip::after {
      content: "";
      position: absolute;
      left: var(--arrow-left, 50%);
      bottom: -7px;
      transform: translateX(-50%);
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 8px solid rgba(59, 59, 59, .96);
    }
    .tooltip.below::after {
      top: -7px;
      bottom: auto;
      border-top: 0;
      border-bottom: 8px solid rgba(59, 59, 59, .96);
    }
    .tip-title { color:var(--business-text-d8d8d8); margin-bottom: 6px; font-size: 12px; }
    .tip-row { display: flex; align-items: center; gap: 8px; min-height: 22px; }
    .tip-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
    .tip-name { color:var(--business-text-f5f5f5); min-width: 82px; }
    .tip-value { margin-left: auto; color:var(--business-text-fff); font-weight: 700; font-variant-numeric: tabular-nums; }
    .tip-value.good { color:#24c9b0; }
    .tip-value.bad { color:#ff6a7e; }
    @media (max-width: 1180px) {
      .description { max-width: 100%; }
      .panels { grid-template-columns: 1fr; gap: 12px; }
      .trend-stage { height: 220px; }

    }
    @media (max-width: 720px) {

      .segment { font-size: 12px; padding: 7px 12px; }
      .chart-toolbar { justify-content: flex-start; min-height: 32px; }
      .trend-stage { height: 214px; }
      .waterfall-svg { height: 222px; }
      .legend { justify-content: center; overflow-x: visible; flex-wrap: wrap; padding-bottom: 2px; }
      .selected-period { font-size: 15px; }
    }

    function ensureRange() {

          state.end = Number(preset.end || 0);

    function addLegend(label, color, extraClass = '') {

    function updateRangeUI() {

    function hideTooltip() {

    function renderTrend() {
      const svg = els.trendSvg;
      clear(svg);
      const records = visibleRecords();
      const m = metric();
      const bars = m.bars || [];
      const line = m.line;
      const width = Math.max(360, Math.round(els.trendStage.clientWidth || svg.clientWidth || 720));
      const height = Math.max(200, Math.round(els.trendStage.clientHeight || svg.clientHeight || 224));
      const values = [];
      records.forEach(record => bars.forEach(bar => { const value = Number(record.values?.[bar.key]); if (Number.isFinite(value)) values.push(value); }));
      const maxValue = Math.max(1, ...values) * 1.18;
      const sampleLabel = fmtB(maxValue);
      const leftPad = Math.max(54, Math.min(82, sampleLabel.length * 7 + 18));
      const margin = { top: 16, right: 56, bottom: 50, left: leftPad };
      const chartW = Math.max(1, width - margin.left - margin.right);
      const chartH = Math.max(1, height - margin.top - margin.bottom);
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);

      const minLine = Math.min(0, ...lineValues);
      const maxLine = Math.max(.01, ...lineValues);

      const lineMin = minLine - linePad;
      const lineMax = maxLine + linePad;
      const valueY = value => margin.top + chartH - Math.max(0, Number(value) || 0) / maxValue * chartH;

      const xStep = chartW / Math.max(1, records.length);
      const groupW = Math.min(64, xStep * .62);
      const gap = bars.length > 1 ? 4 : 0;
      const barW = Math.max(4, Math.min(34, (groupW - gap * Math.max(0, bars.length - 1)) / Math.max(1, bars.length)));
      const axisY = margin.top + chartH;
      const topGridClientY = svg.getBoundingClientRect().top + (margin.top / height) * svg.getBoundingClientRect().height;
      const canShowAllLabels = xStep >= 54;
      const canShowValues = xStep >= 64 && records.length <= 10;
      const canShowDots = xStep >= 32;

      for (let i = 0; i < 5; i++) {
        const y = margin.top + chartH * i / 4;
        svgEl('line', { x1: margin.left, y1: y, x2: width - margin.right, y2: y, class: i === 4 ? 'axis' : 'grid' }, svg);
        const v = maxValue * (1 - i / 4);
        const pct = lineMax - (lineMax - lineMin) * i / 4;
        svgEl('text', { x: margin.left - 10, y: y + 4, 'text-anchor': 'end', class: 'axis-label' }, svg).textContent = i === 4 ? '0' : fmtB(v);

      const barLayer = svgEl('g', {}, svg);
      const lineLayer = svgEl('g', {}, svg);
      const labelLayer = svgEl('g', {}, svg);
      const zoneLayer = svgEl('g', {}, svg);
      const linePoints = [];
      function clearHoverBands() { hoverLayer.querySelectorAll('.hover-band').forEach(node => node.classList.remove('active')); }

      records.forEach((record, idx) => {
        const cx = margin.left + xStep * idx + xStep / 2;
        const bandLeft = margin.left + xStep * idx;

        bars.forEach((bar, bidx) => {
          const value = Number(record.values?.[bar.key]) || 0;

          }

          const lv = record.lines?.[line.key];
          if (lv != null && Number.isFinite(Number(lv))) {
            const yy = lineY(lv);
            linePoints.push({ x: cx, y: yy, value: lv, record });
            if (canShowValues) {
              svgEl('text', { x: cx, y: Math.max(12, yy - 9), class: 'line-label' }, labelLayer).textContent = fmtPct(lv).replace('+', '');
            }
          }
        }
        const showLabel = canShowAllLabels || idx === 0 || idx === records.length - 1 || idx === Math.floor((records.length - 1) / 2);
        if (showLabel) {

        }

    }

    function waterfallRecord() {
      const records = view().waterfallRecords || [];
      if (!records.length) return null;

      if (state.selectedKey) {
        const matched = records.find(item => item.key === state.selectedKey);
        if (matched) return matched;
      }
      if (state.selectedEndDate) {
        const matched = records.find(item => item.endDate === state.selectedEndDate || item.end_date === state.selectedEndDate);
        if (matched) return matched;
      }
      if (state.selectedIndex != null && records[state.selectedIndex]) {
        return records[state.selectedIndex];
      }
      if (state.selectedPeriod) {
        const periodMatches = records.filter(item => item.period === state.selectedPeriod);
        if (periodMatches.length) return periodMatches[periodMatches.length - 1];
      }
      return records[records.length - 1];
    }
    function waterfallSteps(record) {
      const assetsItem = payload.waterfallItems.find(item => item.key === 'assets_total') || payload.waterfallItems[0];
      const debtItem = payload.waterfallItems.find(item => item.key === 'total_debt') || payload.waterfallItems[1];
      const equityItem = payload.waterfallItems.find(item => item.key === 'holder_equity_total') || payload.waterfallItems[2];
      const assets = Number(record.values.assets_total || 0);
      const liabilities = Number(record.values.total_debt || 0);
      const equity = Number(record.values.holder_equity_total ?? (assets - liabilities));
      return [
        { item: assetsItem, label: assetsItem.label || 'Assets', kind: 'total', start: 0, end: assets, value: assets, color: colors.green, displayValue: assets },
        { item: debtItem, label: debtItem.label || 'Liabilities', kind: 'delta', start: assets, end: equity, value: -Math.abs(liabilities), color: colors.pink, displayValue: liabilities },
        { item: equityItem, label: equityItem.label || 'Equity', kind: 'total', start: 0, end: equity, value: equity, color: colors.total, displayValue: equity }
      ];
    }
    function renderWaterfall() {
      const svg = els.waterfallSvg;
      clear(svg);
      const record = waterfallRecord();
      const width = Math.max(360, Math.round(svg.clientWidth || 620));
      const height = Math.max(200, Math.round(svg.clientHeight || 232));
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      if (!record) {
        els.selectedPeriod.textContent = '';
        drawEmptyState(svg, width, height, i18n.noBreakdownData, noDataMessage('waterfall'));
        return;
      }
      els.selectedPeriod.textContent = `(${compactPeriodLabel(record.label)})`;
      const margin = { top: 12, right: 30, bottom: 52, left: 34 };
      const chartW = Math.max(1, width - margin.left - margin.right);
      const chartH = Math.max(1, height - margin.top - margin.bottom);
      const steps = waterfallSteps(record);
      const domainValues = steps.flatMap(step => [step.start, step.end, 0]);
      const minValue = Math.min(0, ...domainValues);
      const maxValue = Math.max(0, ...domainValues);
      const pad = Math.max((maxValue - minValue) * .16, 1);
      const yMin = minValue < 0 ? minValue - pad : 0;
      const yMax = maxValue + pad;
      const y = value => margin.top + (yMax - value) / Math.max(yMax - yMin, .0001) * chartH;
      const zeroY = y(0);
      const xs = steps.map((_, i) => margin.left + chartW * (i + .5) / steps.length);
      const slot = chartW / steps.length;
      const barW = Math.max(28, Math.min(86, slot * .46));
      const gridYs = Array.from({ length: 5 }, (_, i) => margin.top + chartH * i / 4);
      const zeroGridIndex = gridYs.reduce((best, gy, i) => Math.abs(gy - zeroY) < Math.abs(gridYs[best] - zeroY) ? i : best, 0);
      gridYs.forEach((gy, i) => {
        svgEl('line', { x1: margin.left, y1: gy, x2: width - margin.right, y2: gy, class: i === zeroGridIndex ? 'axis' : 'grid' }, svg);
      });
      const hoverLayer = svgEl('g', {}, svg);
      const barLayer = svgEl('g', {}, svg);
      const connectorLayer = svgEl('g', {}, svg);
      const labelLayer = svgEl('g', {}, svg);
      const zoneLayer = svgEl('g', {}, svg);
      function clearWaterfallHoverBands() { hoverLayer.querySelectorAll('.hover-band').forEach(node => node.classList.remove('active')); }
      steps.forEach((step, idx) => {
        const cx = xs[idx];
        const y1 = y(step.start);
        const y2 = y(step.end);
        const top = Math.min(y1, y2);
        const bottom = Math.max(y1, y2);
        const h = Math.max(2, bottom - top);
        const bandLeft = cx - slot / 2;
        const hoverBand = svgEl('rect', { x: bandLeft, y: margin.top, width: slot, height: chartH, class: 'hover-band' }, hoverLayer);
        svgEl('rect', { x: cx - barW / 2, y: top, width: barW, height: h, fill: step.color, rx: 0 }, barLayer);
        if (idx < steps.length - 1) {
          const nextCx = xs[idx + 1];
          svgEl('line', { x1: cx + barW / 2, y1: y(step.end), x2: nextCx - barW / 2, y2: y(step.end), stroke: 'var(--business-border-d7d7d7)', 'stroke-width': 1, 'stroke-dasharray': '3 3' }, connectorLayer);
        }
        labelWaterfall(labelLayer, cx, top, step.displayValue, record.yoy?.[step.item.key]);
        svgEl('text', { x: cx, y: height - 18, class: 'waterfall-x' }, labelLayer).textContent = step.label;
        const zone = svgEl('rect', { x: bandLeft, y: margin.top, width: slot, height: chartH, class: 'hover-zone', 'pointer-events': 'all' }, zoneLayer);
        const activate = () => {
          clearWaterfallHoverBands();
          hoverBand.classList.add('active');
          const liveRect = svg.getBoundingClientRect();
          const liveX = liveRect.left + (cx / width) * liveRect.width;
          // Anchor to the SVG top edge so the tooltip stays outside the chart.
          // It may overflow upward; no layout spacing is added.

        );
      });
      svg.addEventListener('mouseleave', () => { clearWaterfallHoverBands(); hideTooltip(); });
      function labelWaterfall(parent, cx, top, value, yoy) {
        svgEl('text', { x: cx, y: Math.max(12, top - 22), class: 'waterfall-label' }, parent).textContent = fmtB(value);
        if (yoy != null && Number.isFinite(Number(yoy))) {
          const text = fmtPct(yoy).replace('+', '');
          const w = Math.max(46, text.length * 7 + 12);
          const x = cx - w / 2;
          const fill = Number(yoy) >= 0 ? '#2dbd86' : '#f05b5b';
          svgEl('rect', { x, y: Math.max(16, top - 18), width: w, height: 16, rx: 3, fill }, parent);
          svgEl('text', { x: cx, y: Math.max(24, top - 10), class: 'badge-text' }, parent).textContent = text;
        }

    }

    function setupRangeDrag() {
      const startDrag = which => event => {
        state.dragging = which;
        event.currentTarget.setPointerCapture?.(event.pointerId);
        event.preventDefault();
      };
      els.leftHandle.addEventListener('pointerdown', startDrag('left'));
      els.rightHandle.addEventListener('pointerdown', startDrag('right'));
      els.rangeTrack.addEventListener('pointerdown', event => {
        if (event.target.closest('.range-handle')) return;
        const records = allTrendRecords();
        if (records.length <= 1) return;
        const idx = rangeIndexFromClientX(event.clientX, records.length);
        state.dragging = Math.abs(idx - state.start) <= Math.abs(idx - state.end) ? 'left' : 'right';
        updateRangeByIndex(idx);
        event.preventDefault();
      });
      window.addEventListener('pointermove', event => {
        if (!state.dragging) return;
        const records = allTrendRecords();
        if (records.length <= 1) return;
        updateRangeByIndex(rangeIndexFromClientX(event.clientX, records.length));
      });
      window.addEventListener('pointerup', () => { state.dragging = null; });
    }
    function rangeIndexFromClientX(clientX, count) {
      const rect = els.rangeTrack.getBoundingClientRect();
      const ratio = rect.width <= 0 ? 0 : Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      return Math.round(ratio * Math.max(0, count - 1));
    }
    function updateRangeByIndex(idx) {
      if (state.dragging === 'left') state.start = Math.min(idx, state.end);
      if (state.dragging === 'right') state.end = Math.max(idx, state.start);
      render();
    }
    function render() {
      hideTooltip();
      ensureRange();
      updateTabs();
      updateRangeUI();
      renderTrend();
      renderWaterfall();
    }
    initTabs();
    setupRangeDrag();
    document.addEventListener('pointerdown', event => {
      if (
        !event.target.closest('#trendStage') &&
        !event.target.closest('#waterfallSvg') &&
        !event.target.closest('#tooltip') &&
        !event.target.closest('#rangeShell')
      ) {
        hideTooltip();
      }
    });
    render();
    new ResizeObserver(render).observe(els.trendStage);
    window.addEventListener('resize', render);
  </script>
