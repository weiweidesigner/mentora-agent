<style>:root{--business-text-8a8a8a:#8a8a8a;}:root[data-theme="dark"]{--business-text-8a8a8a:#a8b3c4;}

:root{color-scheme:light;--business-text-171717:#171717;--business-bg-f6f7f8:#f6f7f8;--business-text-697181:#697181;--business-bg-fff:#fff;--business-bg-f1f2f4:#f1f2f4;--business-bg-303030:#303030;--business-text-f2f2f2:#f2f2f2;--business-text-fff:#fff;--business-text-d8d8d8:#d8d8d8;--business-bg-697181:#697181;--business-bg-8a8a8a:#8a8a8a;--business-border-e5e7eb:#e5e7eb;--business-border-303030:#303030;}
:root[data-theme="dark"]{color-scheme:dark;--business-text-171717:#e8edf5;--business-bg-f6f7f8:#202b3a;--business-text-697181:#a8b3c4;--business-bg-fff:#202b3a;--business-bg-f1f2f4:#202b3a;--business-bg-303030:#263242;--business-text-f2f2f2:#f5f7fb;--business-text-fff:#f5f7fb;--business-text-d8d8d8:#a8b3c4;--business-bg-697181:#516078;--business-bg-8a8a8a:#516078;--business-border-e5e7eb:#293646;--business-border-303030:#566477;}

*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--business-text-171717);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{padding:0}
.vp{
  width:100%;
  margin:0;
  background:transparent;
  padding:0;
}
.title{
  margin:0 0 18px;
  font-size:16px;
  line-height:1.2;
  font-weight:800;
  letter-spacing:0;
  color:var(--business-text-171717);
}
.grid{
  display:grid;
  grid-template-columns:minmax(320px,.9fr) minmax(500px,1.1fr);
  gap:32px;
  align-items:start;
}
.summary{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  background:var(--business-bg-f6f7f8);
  border-radius:10px;
  margin-bottom:22px;
  overflow:hidden;
}
.metric{padding:14px 16px;text-align:left}
.metric-label{display:block;color:var(--business-text-697181);font-size:12px;font-weight:600;margin-bottom:5px;line-height:1.2}
.metric-value{display:block;color:var(--business-text-171717);font-size:14px;line-height:1.2;font-weight:700}
.metric-value.green{color:#05a66b}
.donut-wrap{
  min-height:260px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.donut{width:min(420px,100%);height:280px}
.donut text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.table-wrap{
  width:100%;
  max-height:360px;
  overflow:auto;
  padding-right:0;
}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{
  position:sticky;
  top:0;
  background:var(--business-bg-fff);
  z-index:1;
  padding:0 10px 12px;
  text-align:left;
  color:var(--business-text-697181);
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.04em;
  border-bottom:1px solid var(--business-border-e5e7eb);
  white-space:nowrap;
}
td{
  padding:13px 10px;
  border-bottom:1px solid var(--business-border-e5e7eb);
  font-size:12px;
  line-height:1.35;
  color:var(--business-text-171717);
  vertical-align:middle;
}
td:first-child,th:first-child{padding-left:0}
th:nth-child(1),td:nth-child(1){width:17%}
th:nth-child(2),td:nth-child(2),
th:nth-child(3),td:nth-child(3){width:18%}
th:nth-child(4),td:nth-child(4){width:33%}
th:nth-child(5),td:nth-child(5){width:14%;text-align:right;padding-right:0}
.buy{color:#05a66b;font-weight:650}
.sell{color:#ff3b25;font-weight:650}
.ratio-bar{
  height:8px;
  background:var(--business-bg-f1f2f4);
  border-radius:999px;
  position:relative;
  overflow:hidden;
  min-width:14px;
}
.ratio-fill{
  height:100%;
  width:100%;
  min-width:14px;
  display:flex;
  border-radius:999px;
  overflow:hidden;
}
.ratio-segment{height:100%;flex:0 0 auto}
.ratio-buy{background:#05a66b;min-width:2px}
.ratio-sell{background:#ff3b25;min-width:2px}
.ratio-text{font-variant-numeric:tabular-nums;color:var(--business-text-171717)}
.tooltip{
  --arrow-x:50%;
  position:fixed;
  z-index:50;
  pointer-events:none;
  min-width:190px;
  border-radius:6px;
  background:var(--business-bg-303030);
  color:var(--business-text-f2f2f2);
  padding:9px 11px;
  font-size:12px;
  line-height:1.45;
  opacity:0;
  transition:opacity .08s ease;
  white-space:nowrap;
}
.tooltip::after{
  content:"";
  position:absolute;
  left:var(--arrow-x);
  bottom:-6px;
  width:0;
  height:0;
  transform:translateX(-50%);
  border-left:6px solid transparent;
  border-right:6px solid transparent;
  border-top:6px solid var(--business-bg-303030);
}
.tooltip.show{opacity:1}
.tip-title{color:var(--business-text-fff);font-weight:800;margin-bottom:5px}
.tip-row{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:4px;min-width:168px}
.tip-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.tip-label{color:var(--business-text-d8d8d8);font-size:12px;line-height:1.2}
.tip-value{margin-left:auto;color:var(--business-text-fff);font-size:12px;font-weight:700;line-height:1.2}
.muted{color:var(--business-text-d8d8d8)}
@media(max-width:860px){
  .vp{padding:0}
  .title{font-size:16px;margin-bottom:16px}
  .grid{display:block}
  .summary{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:18px}
  .metric{padding:12px 10px}
  .metric-label{font-size:11px}
  .metric-value{font-size:13px}
  .donut-wrap{min-height:220px}
  .donut{height:240px}
  .table-wrap{max-height:none;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:20px}
  table{min-width:620px}
  th{font-size:10px;padding:0 8px 10px}
  td{font-size:12px;padding:12px 8px}
  th:nth-child(4),td:nth-child(4){display:table-cell}
}
</style>

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtPct(v) {
  const n = Number(v);

function rowBar(row) {
  const total = Math.max(Number(row.total || 0), 1);
  const buyValue = Math.max(0, Number(row.buy || 0));
  const sellValue = Math.max(0, Number(row.sell || 0));
  const parts = [
    { cls: 'ratio-buy', value: buyValue },
    { cls: 'ratio-sell', value: sellValue },
  ].filter(item => item.value > 0);
  const width = Math.max(14, Number(row.barRatio || 0) * 100);

  if (!parts.length) {
    return `<div class="ratio-bar" style="width:${width}%"><div class="ratio-fill"></div></div>`;
  }

  const html = parts.map(item => {
    const pct = item.value / total * 100;
    return `<span class="ratio-segment ${item.cls}" style="width:${Math.max(0.8, pct)}%"></span>`;
  }).join('');

  return `<div class="ratio-bar" style="width:${width}%"><div class="ratio-fill">${html}</div></div>`;

function arcPath(cx, cy, rOuter, rInner, start, end) {

  const p1 = polar(cx, cy, rOuter, start);
  const p2 = polar(cx, cy, rOuter, end);

  const p4 = polar(cx, cy, rInner, start);
  const large = end - start > 180 ? 1 : 0;

function donutSvg() {

  const parts = [

          <div class="tip-row"><span class="tip-dot" style="background:#ff3b25"></span><span class="tip-label">卖出</span><span class="tip-value">${el.dataset.sell}</span></div>
          <div class="tip-row"><span class="tip-dot" style="background:var(--business-bg-8a8a8a)"></span><span class="tip-label">中性</span><span class="tip-value">${el.dataset.neutral}</span></div>
          <div class="tip-row"><span></span><span class="tip-label">占比</span><span class="tip-value">${el.dataset.ratio}</span></div>`;
      }
      tip.classList.add('show');
      setTooltipPosition(tip, event.clientX, event.clientY);
    });
    el.addEventListener('mouseleave', () => tip.classList.remove('show'));
  });
}
render();

</script>
</body>
</html>
