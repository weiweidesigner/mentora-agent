*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--business-text-171717);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{padding:0}
.vp{
  width:100%;
  margin:0;
  background:transparent;
  padding:0;
}
.title{
  margin:0 0 18px;
  font-size:16px;
  line-height:1.2;
  font-weight:800;
  letter-spacing:0;
  color:var(--business-text-171717);
}
.grid{
  display:grid;
  grid-template-columns:minmax(320px,.9fr) minmax(500px,1.1fr);
  gap:32px;
  align-items:start;
}
.summary{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  background:var(--business-bg-f6f7f8);
  border-radius:10px;
  margin-bottom:22px;
  overflow:hidden;
}
.metric{padding:14px 16px;text-align:left}
.metric-label{display:block;color:var(--business-text-697181);font-size:12px;font-weight:600;margin-bottom:5px;line-height:1.2}
.metric-value{display:block;color:var(--business-text-171717);font-size:14px;line-height:1.2;font-weight:700}
.metric-value.green{color:#05a66b}
.donut-wrap{
  min-height:260px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.donut{width:min(420px,100%);height:280px}
.donut text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.table-wrap{
  width:100%;
  max-height:360px;
  overflow:auto;
  padding-right:0;
}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{
  position:sticky;
  top:0;
  background:var(--business-bg-fff);
  z-index:1;
  padding:0 10px 12px;
  text-align:left;
  color:var(--business-text-697181);
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.04em;
  border-bottom:1px solid var(--business-border-e5e7eb);
  white-space:nowrap;
}
td{
  padding:13px 10px;
  border-bottom:1px solid var(--business-border-e5e7eb);
  font-size:12px;
  line-height:1.35;
  color:var(--business-text-171717);
  vertical-align:middle;
}
td:first-child,th:first-child{padding-left:0}
th:nth-child(1),td:nth-child(1){width:17%}
th:nth-child(2),td:nth-child(2),
th:nth-child(3),td:nth-child(3){width:18%}
th:nth-child(4),td:nth-child(4){width:33%}
th:nth-child(5),td:nth-child(5){width:14%;text-align:right;padding-right:0}
.buy{color:#05a66b;font-weight:650}
.sell{color:#ff3b25;font-weight:650}
.ratio-bar{
  height:8px;
  background:var(--business-text-8a8a8a);
  border-radius:999px;
  position:relative;
  overflow:hidden;
  min-width:14px;
}
.ratio-fill{
  height:100%;
  width:100%;
  min-width:14px;
  display:flex;
  border-radius:999px;
  overflow:hidden;
}
.ratio-segment{height:100%;flex:0 0 auto}
.ratio-buy{background:#05a66b;min-width:2px}
.ratio-sell{background:#ff3b25;min-width:2px}
.ratio-text{font-variant-numeric:tabular-nums;color:var(--business-text-171717)}
.tooltip{
  --arrow-x:50%;
  position:fixed;
  z-index:50;
  pointer-events:none;
  min-width:190px;
  border-radius:6px;
  background:var(--ui-tooltip);
  color:var(--ui-tooltip-text);
  padding:10px 12px;
  font-size:13px;
  line-height:1.5;
  opacity:0;
  transition:opacity .08s ease;
  white-space:nowrap;border:0;box-shadow:none;}
.tooltip::after{
  content:"";
  position:absolute;
  left:var(--arrow-x);
  bottom:-6px;
  width:0;
  height:0;
  transform:translateX(-50%);
  border-left:6px solid transparent;
  border-right:6px solid transparent;
  border-top:6px solid var(--ui-tooltip);
}
.tooltip.show{opacity:1}
.tip-title{color:var(--ui-tooltip-text);font-weight:800;margin-bottom:6px;font-size:13px;line-height:1.5;}
.tip-row{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:4px;min-width:168px;min-height:22px;line-height:1.5;}
.tip-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.tip-label{color:var(--ui-tooltip-muted);font-size:13px;line-height:1.5;}
.tip-value{margin-left:auto;color:var(--ui-tooltip-text);font-size:14px;font-weight:700;line-height:1.5;}
.muted{color:var(--business-text-d8d8d8)}
@media(max-width:860px){
  .vp{padding:0}
  .title{font-size:16px;margin-bottom:16px}
  .grid{display:block}
  .summary{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:18px}
  .metric{padding:12px 10px}
  .metric-label{font-size:11px}
  .metric-value{font-size:13px}
  .donut-wrap{min-height:220px}
  .donut{height:240px}
  .table-wrap{max-height:none;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:20px}
  table{min-width:620px}
  th{font-size:10px;padding:0 8px 10px}
  td{font-size:12px;padding:12px 8px}
  th:nth-child(4),td:nth-child(4){display:table-cell}
}
</style>

  const p4 = polar(cx, cy, rInner, start);

  return `M${p1.x},${p1.y} A${rOuter},${rOuter} 0 ${large} 1 ${p2.x},${p2.y} L${p3.x},${p3.y} A${rInner},${rInner} 0 ${large} 0 ${p4.x},${p4.y} Z`;
}
function labelLine(cx, cy, r, start, end, name, value, color, anchorHint) {
  const angle = (start + end) / 2;
  const p1 = polar(cx, cy, r + 3, angle);
  const p2 = polar(cx, cy, r + 18, angle);
  const side = anchorHint || (Math.cos((angle - 90) * Math.PI / 180) >= 0 ? 1 : -1);
  const p3 = { x: p2.x + side * 22, y: p2.y };
  const textX = p3.x + side * 6;
  const anchor = side > 0 ? 'start' : 'end';
  return `<path d="M${p1.x},${p1.y} L${p2.x},${p2.y} L${p3.x},${p3.y}" fill="none" stroke="${color}" stroke-width="1.2"/>
    <text x="${textX}" y="${p3.y - 7}" text-anchor="${anchor}" fill="var(--business-text-697181)" font-size="12" font-weight="600">${esc(name)}</text>
    <text x="${textX}" y="${p3.y + 12}" text-anchor="${anchor}" fill="var(--business-text-171717)" font-size="14" font-weight="700">${esc(value)}</text>`;
}
function donutSvg() {
  const cx = 250, cy = 140, ro = 74, ri = 42;
  const parts = [
    { key:'buy', name:"买入", value:Number(payload.buyTotal || 0), label:payload.buyTotalLabel, color:'#05a66b', side:1 },
    { key:'sell', name:"卖出", value:Number(payload.sellTotal || 0), label:payload.sellTotalLabel, color:'#ff3b25', side:-1 },
    { key:'neutral', name:"中性", value:Number(payload.neutralTotal || 0), label:payload.neutralTotalLabel, color:'var(--business-text-8a8a8a)', side:-1 },
  ];
  const total = Math.max(parts.reduce((s, p) => s + p.value, 0), 1);
  let start = 0;
  const arcs = parts.map((p) => {
    const end = start + p.value / total * 360;
    const path = `<path class="arc" data-name="${esc(p.name)}" data-value="${esc(p.label)}" d="${arcPath(cx, cy, ro, ri, start, end)}" fill="${p.color}"></path>`;
    const line = labelLine(cx, cy, ro, start, end, p.name, p.label, p.color, p.side);
    start = end;
    return path + line;
  }).join('');
  return `<svg class="donut" viewBox="0 0 500 280" aria-label="Volume profile donut">
    ${arcs}
    <text x="${cx}" y="${cy - 6}" text-anchor="middle" fill="var(--business-text-697181)" font-size="12">合计</text>
    <text x="${cx}" y="${cy + 18}" text-anchor="middle" fill="var(--business-text-171717)" font-size="16" font-weight="700">${esc(payload.volumeLabel)}</text>
  </svg>`;
}
function render() {
  const rows = payload.rows || [];
  document.getElementById('app').innerHTML = `
    <h1 class="title">成交分布</h1>
    <section class="grid">
      <div>
        <div class="summary">
          <div class="metric"><span class="metric-label">平均价格</span><span class="metric-value">${esc(payload.averagePriceLabel)}</span></div>
          <div class="metric"><span class="metric-label">成交笔数</span><span class="metric-value">${esc(payload.transactionsLabel)}</span></div>
          <div class="metric"><span class="metric-label">成交量</span><span class="metric-value green">${esc(payload.volumeLabel)}</span></div>
        </div>
        <div class="donut-wrap">${donutSvg()}</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>价格</th><th>买入</th><th>卖出</th><th>成交量</th><th>占比</th></tr></thead>
          <tbody>${rows.map((r) => `
            <tr data-price="${esc(r.priceLabel)}" data-buy="${esc(r.buyLabel)}" data-sell="${esc(r.sellLabel)}" data-neutral="${esc(r.neutralLabel)}" data-ratio="${fmtPct(r.ratio)}">
              <td>${esc(r.priceLabel)}</td>
              <td class="buy">${esc(r.buyLabel)}</td>
              <td class="sell">${esc(r.sellLabel)}</td>
              <td>${rowBar(r)}</td>
              <td class="ratio-text">${fmtPct(r.ratio)}</td>
            </tr>`).join('')}</tbody>
        </table>
      </div>
    </section>`;
  bindTooltip();
}
function setTooltipPosition(tip, clientX, topY) {
  const margin = 10;
  const gap = 12;
  const box = tip.getBoundingClientRect();
  const width = box.width || 200;
  const height = box.height || 96;
  const left = Math.max(margin, Math.min(window.innerWidth - margin - width, clientX - width / 2));
  const top = Math.max(margin, topY - height - gap);
  const arrowX = Math.max(12, Math.min(width - 12, clientX - left));
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
  tip.style.setProperty('--arrow-x', arrowX + 'px');
}
function bindTooltip() {
  const tip = document.getElementById('tooltip');
  document.querySelectorAll('tbody tr,.arc').forEach((el) => {
    el.addEventListener('mousemove', (event) => {
      if (el.classList.contains('arc')) {
        tip.innerHTML = `
          <div class="tip-title">${el.dataset.name}</div>
          <div class="tip-row"><span class="tip-dot" style="background:var(--business-bg-697181)"></span><span class="tip-label">成交量</span><span class="tip-value">${el.dataset.value}</span></div>`;
      } else {
        tip.innerHTML = `
          <div class="tip-title">Price ${el.dataset.price}</div>
          <div class="tip-row"><span class="tip-dot" style="background:#05a66b"></span><span class="tip-label">买入</span><span class="tip-value">${el.dataset.buy}</span></div>
          <div class="tip-row"><span class="tip-dot" style="background:#ff3b25"></span><span class="tip-label">卖出</span><span class="tip-value">${el.dataset.sell}</span></div>
          <div class="tip-row"><span class="tip-dot" style="background:var(--business-bg-8a8a8a)"></span><span class="tip-label">中性</span><span class="tip-value">${el.dataset.neutral}</span></div>
          <div class="tip-row"><span></span><span class="tip-label">占比</span><span class="tip-value">${el.dataset.ratio}</span></div>`;
      }
      tip.classList.add('show');
      setTooltipPosition(tip, event.clientX, event.clientY);
    });
    el.addEventListener('mouseleave', () => tip.classList.remove('show'));
  });
}
render();

</script>
