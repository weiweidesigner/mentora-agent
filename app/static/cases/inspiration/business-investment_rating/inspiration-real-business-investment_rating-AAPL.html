<script>
const payload = {"type": "investment-rating", "name": "投资评级", "title": "AAPL多维度投资评级：情绪支撑下的中性评分", "code": "AAPL", "market": "185", "exchange": "NASDAQ", "overallScore": 6.46, "overallScoreLabel": "6.46 / 10", "rating": "中性", "dimensions": [{"key": "value", "label": "价值", "score": 1.3}, {"key": "future", "label": "未来增长", "score": 7.0}, {"key": "past", "label": "历史表现", "score": 6.8}, {"key": "health", "label": "财务健康", "score": 4.8}, {"key": "dividend", "label": "分红", "score": 7.6}, {"key": "fundamental", "label": "Fundamental", "score": 5.5}, {"key": "technical", "label": "Technical", "score": 5.24}, {"key": "sentiment", "label": "Sentiment", "score": 8.63}], "insights": [{"kind": "fundamental", "tone": "bullish", "text": "AAPL 综合评分为 6.46/10，当前评级为中性；基本面 5.50/10、情绪 8.63/10 是主要观察项。"}, {"kind": "technical", "tone": "bearish", "text": "技术面评分为 5.24/10，若低于其他维度，说明近期走势与交易信号仍需继续验证。"}], "source": {"provider": "AInvest analysis page", "url": "https://www.ainvest.com/stocks/NASDAQ-AAPL/analysis/", "snapshotEndpoint": "https://extquote.ainvest.com/index_api/indicator/v2/snapshot", "retrievedAt": "2026-10-14"}, "language": "zh-CN", "labels": {"rating": "评级", "rewards": "亮点", "risks": "风险分析", "emptyRisk": "当前模块未突出显示主要风险提示。", "emptyReward": "暂无亮点信号。", "axes": {"value": "价值", "future": "未来", "past": "过往", "health": "健康", "dividend": "分红"}}, "componentUi": {"Exchange": "交易所", "Business": "主营业务", "Neutral": "中性", "Stock": "股票", "Rating": "评级", "Value": "价值", "Future": "未来增长", "Past": "历史表现", "Health": "财务健康", "Dividend": "分红", "Total": "合计", "Investment Rating": "综合投资评级", "Shareholder Returns": "股东回报"}, "theme": "light", "customTitle": "AAPL多维度投资评级：情绪支撑下的中性评分"};
const i18n = payload.labels || {};
const $ = (id) => document.getElementById(id);
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function fmtScore(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return '--';
  return n.toFixed(2).replace(/\.0+$|(?<=\.\d*[1-9])0+$/g, '');
}
function row(text, kind) {
  const value = String(text || '').replace(/\s+/g, ' ').trim();
  return `<div class="signal-row"><span class="signal-icon ${kind === 'risk' ? 'risk' : ''}"></span><span>${esc(value)}</span></div>`;
}
const symbol = String(payload.code || '').toUpperCase();
$('title').textContent = `${symbol || 'Stock'} ${payload.title || 'Investment Rating'}`;
$('score').textContent = fmtScore(payload.overallScore);
$('rewards-title').textContent = i18n.rewards || 'Rewards';
$('risks-title').textContent = i18n.risks || 'Risk Analysis';
const insights = Array.isArray(payload.insights) ? payload.insights : [];
let rewards = insights.filter(item => String(item.tone || '').toLowerCase() !== 'bearish' && String(item.kind || '').toLowerCase() !== 'overall');
let risks = insights.filter(item => String(item.tone || '').toLowerCase() === 'bearish');
if (!rewards.length) rewards = insights.filter(item => String(item.kind || '').toLowerCase() !== 'overall').slice(0, 2);
if (!risks.length) risks = [{text:i18n.emptyRisk || 'No major risk warning is currently highlighted in this module.'}];
$('rewards').innerHTML = rewards.slice(0, 3).map(item => row(item.text, 'reward')).join('') || `<div class="empty-hint">${esc(i18n.emptyReward || 'No reward signals available.')}</div>`;
$('risks').innerHTML = risks.slice(0, 3).map(item => row(item.text, 'risk')).join('');
function scoreFromDimensions(key, label) {
  const dims = Array.isArray(payload.dimensions) ? payload.dimensions : [];
  const found = dims.find(d => String(d.key || '').toLowerCase() === key.toLowerCase() || String(d.label || '').toLowerCase() === label.toLowerCase());
  const n = Number(found?.score);
  return Number.isFinite(n) ? n : null;
}
function scoreFromText(label) {
  const text = insights.map(x => x.text || '').join(' ');
  const re = new RegExp(label + '\\s+(-?\\d+(?:\\.\\d+)?)', 'i');
  const m = text.match(re);
  if (!m) return null;
  const n = Number(m[1]);
  return Number.isFinite(n) ? n : null;
}
function derivedScores() {
  const fundamental = scoreFromDimensions('fundamental', 'fundamental');
  const technical = scoreFromDimensions('technical', 'technical');
  const sentiment = scoreFromDimensions('sentiment', 'sentiment');
  const overall = Number(payload.overallScore);
  return {
    value: scoreFromText('Value') ?? scoreFromDimensions('value','value') ?? (fundamental != null ? Math.max(0, fundamental - 1.2) : (Number.isFinite(overall) ? overall : 5)),
    future: scoreFromText('Future') ?? scoreFromDimensions('future','future') ?? (sentiment != null ? sentiment : (Number.isFinite(overall) ? overall : 5)),
    past: scoreFromText('Past') ?? scoreFromDimensions('past','past') ?? (technical != null ? technical : (Number.isFinite(overall) ? overall : 5)),
    health: scoreFromText('Health') ?? scoreFromDimensions('health','health') ?? (fundamental != null ? fundamental : (Number.isFinite(overall) ? overall : 5)),
    dividend: scoreFromText('Dividend') ?? scoreFromDimensions('dividend','dividend') ?? (sentiment != null ? Math.min(10, sentiment) : (Number.isFinite(overall) ? overall : 5)),
  };
}
function polar(cx, cy, radius, angleDeg) {
  const angle = (angleDeg - 90) * Math.PI / 180;
  return [cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)];
}
function smoothClosedPath(points) {
  if (points.length < 3) return '';
  const d = [`M ${points[0][0].toFixed(1)} ${points[0][1].toFixed(1)}`];
  for (let i = 0; i < points.length; i++) {
    const p0 = points[(i - 1 + points.length) % points.length];
    const p1 = points[i];
    const p2 = points[(i + 1) % points.length];
    const p3 = points[(i + 2) % points.length];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d.push(`C ${c1[0].toFixed(1)} ${c1[1].toFixed(1)}, ${c2[0].toFixed(1)} ${c2[1].toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`);
  }
  d.push('Z');
  return d.join(' ');
}
function el(name, attrs = {}) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', name);
  Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
  return node;
}
function renderRadar() {
  const svg = $('radar');
  const scores = derivedScores();
  const cx = 210, cy = 184, r = 130;
  const axes = [
    {key:'value', label:(i18n.axes || {}).value || 'VALUE', angle:0},
    {key:'future', label:(i18n.axes || {}).future || 'FUTURE', angle:72},
    {key:'past', label:(i18n.axes || {}).past || 'PAST', angle:144},
    {key:'health', label:(i18n.axes || {}).health || 'HEALTH', angle:216},
    {key:'dividend', label:(i18n.axes || {}).dividend || 'DIVIDEND', angle:288},
  ];
  svg.innerHTML = '';
  [0.22, 0.40, 0.58, 0.76, 0.94].forEach((scale, i) => {
    svg.appendChild(el('circle', {cx, cy, r:r*scale, fill:'none', stroke:i % 2 ? 'var(--business-border-eef1f4)' : 'var(--business-border-e1e6eb)', 'stroke-width':1.6, 'vector-effect':'non-scaling-stroke'}));
  });
  const pts = axes.map(axis => {
    const v = Math.max(0, Math.min(10, Number(scores[axis.key] ?? 0))) / 10;
    return polar(cx, cy, r * v, axis.angle);
  });
  const path = smoothClosedPath(pts);
  svg.appendChild(el('path', {d:path, fill:'var(--accent-fill)', stroke:'var(--accent)', 'stroke-width':4, 'vector-effect':'non-scaling-stroke', 'stroke-linejoin':'round'}));
  const tip = $('radar-tip');
  const wrap = svg.closest('.radar-wrap');
  function reset() {
    svg.querySelectorAll('.radar-label').forEach(node => node.classList.remove('is-muted'));
    svg.querySelectorAll('.radar-point').forEach(node => node.classList.remove('is-active'));
    tip.hidden = true;
  }
  function activate(index) {
    const axis = axes[index];
    svg.querySelectorAll('.radar-label').forEach((node, i) => node.classList.toggle('is-muted', i !== index));
    svg.querySelectorAll('.radar-point').forEach((node, i) => node.classList.toggle('is-active', i === index));
    tip.innerHTML = `<div class="radar-tooltip-row"><span>${esc(axis.label)}</span><strong>${esc(fmtScore(scores[axis.key]))} / 10</strong></div>`;
    tip.hidden = false;
    const bounds = svg.getBoundingClientRect();
    const [x, y] = pts[index];
    const left = x * bounds.width / 420 - tip.offsetWidth / 2;
    const top = y * bounds.height / 350 - tip.offsetHeight - 12;
    tip.style.left = `${Math.max(8, Math.min(wrap.clientWidth - tip.offsetWidth - 8, left))}px`;
    tip.style.top = `${Math.max(8, Math.min(wrap.clientHeight - tip.offsetHeight - 8, top))}px`;
  }
  axes.forEach((axis, index) => {
    const [dx, dy] = polar(0, 0, 1, axis.angle);
    const [lx, ly] = polar(cx, cy, r * .94 + 12, axis.angle);
    const label = el('text', {
      x:lx, y:ly, class:'radar-label', 'data-axis':axis.key,
      'text-anchor':dx > .2 ? 'start' : dx < -.2 ? 'end' : 'middle',
      'dominant-baseline':dy < -.8 ? 'text-after-edge' : dy > .5 ? 'hanging' : 'middle',
      'font-size':13, 'font-weight':600, 'letter-spacing':0,
      fill:'var(--business-text-1d232c)', tabindex:0, role:'button',
      'aria-label':`${axis.label}: ${fmtScore(scores[axis.key])} / 10`
    });
    label.textContent = axis.label;
    svg.appendChild(label);
    const [x, y] = pts[index];
    const point = el('circle', {cx:x, cy:y, r:4, fill:'var(--accent)', class:'radar-point', 'data-axis':axis.key});
    const hit = el('circle', {cx:x, cy:y, r:14, class:'radar-hit', 'data-axis':axis.key});
    svg.appendChild(point);
    svg.appendChild(hit);
    label.addEventListener('pointerenter', () => activate(index));
    label.addEventListener('pointerleave', reset);
    label.addEventListener('focus', () => activate(index));
    label.addEventListener('blur', reset);
    label.addEventListener('click', () => activate(index));
    label.addEventListener('keydown', event => {
      if (event.key === 'Escape') reset();
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); activate(index); }
    });
    hit.addEventListener('pointerenter', () => activate(index));
    hit.addEventListener('pointerleave', reset);
    hit.addEventListener('click', () => activate(index));
  });
  svg.onpointerleave = reset;
  window.addEventListener('resize', reset);
}
renderRadar();
</script>
