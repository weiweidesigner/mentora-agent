*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--business-text-111827);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{padding:0}
.wrap{max-width:1750px;margin:0;background:transparent}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(420px,.72fr);gap:46px;align-items:start}
.chart-panel{min-width:0}
.legend{height:26px;display:flex;align-items:center;gap:28px;color:var(--business-text-70757d);font-size:15px;font-weight:500;margin-bottom:4px}

.axis{fill:var(--business-text-767b82);font-size:12px;font-weight:500;dominant-baseline:middle}
.grid{stroke:var(--business-border-e9edf2);stroke-width:1}
.price-line{fill:none;stroke:#3c73ff;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.buy{fill:#0aa06e}
.sell{fill:#ff3b25}
.brush{--handle-size:32px;--track-pad:16px;--track-height:3px;height:var(--handle-size);margin:6px 0 0;position:relative;touch-action:none;user-select:none}
.rail{position:absolute;left:var(--track-pad);right:var(--track-pad);top:calc(var(--handle-size) / 2);height:var(--track-height);border-radius:999px;background:var(--business-bg-f1f1f1);transform:translateY(-50%)}
.selected-rail{position:absolute;top:calc(var(--handle-size) / 2);height:var(--track-height);border-radius:999px;background:var(--business-bg-5f5f5f);transform:translateY(-50%)}
.handle{appearance:none;position:absolute;top:calc(var(--handle-size) / 2);width:var(--handle-size);height:var(--handle-size);border-radius:50%;background:var(--business-bg-fff);border:1px solid var(--business-border-d5d5d5);box-shadow:0 1px 4px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;cursor:grab;z-index:2;transform:translate(-50%,-50%);padding:0}
.handle:active{cursor:grabbing}
.handle::before{content:"";width:2px;height:13px;border-radius:999px;background:var(--business-bg-8a8a8a);box-shadow:-5px 0 0 var(--business-border-8a8a8a),5px 0 0 #8a8a8a;opacity:.9}
.table-wrap{min-width:0}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{height:30px;padding:0 10px 8px;text-align:right;color:var(--business-text-565d68);font-size:12px;font-weight:720;border-bottom:1px solid var(--business-border-edf0f4)}
th:first-child{text-align:left;width:40%}
td{padding:9px 10px;border-bottom:1px solid var(--business-border-edf0f4);text-align:right;font-size:13px;line-height:1.18;vertical-align:middle;color:var(--business-text-242830)}
td:first-child{text-align:left;font-size:13px;font-weight:400}
.person{display:flex;align-items:center;gap:8px;min-width:0}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--business-bg-eef1f5);flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.main{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:block;margin-top:1px;color:var(--business-text-a6abb3);font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buy-text{color:#0aa06e}
.sell-text{color:#ff3b25}
.flat-text{color:var(--business-text-111827)}
.empty{height:260px;display:flex;align-items:center;justify-content:center;color:var(--business-text-8a9099);font-size:15px}
.tooltip{position:absolute;z-index:20;min-width:178px;padding:10px 12px;background:var(--business-bg-3b3b3b);color:var(--business-text-fff);border-radius:6px;font-size:12px;line-height:1.5;pointer-events:none;opacity:0;visibility:hidden;box-shadow:none;filter:none}
.tooltip.show{opacity:1;visibility:visible}
.tooltip::after{content:"";position:absolute;left:var(--arrow-left,50%);bottom:-7px;transform:translateX(-50%);border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid var(--business-border-3b3b3b)}
.tip-title{display:block;color:var(--business-text-d8d8d8);margin-bottom:6px;font-size:12px;font-weight:500}
.tip-row{display:flex;align-items:center;justify-content:space-between;gap:20px;white-space:nowrap;min-height:21px}
.tip-label{display:flex;align-items:center;gap:7px;color:var(--business-text-d0d0d0)}
.tip-dot{width:8px;height:8px;border-radius:50%;flex:none}
.tip-value{color:var(--business-text-fff);font-weight:750;font-variant-numeric:tabular-nums}
@media(max-width:980px){

function esc(v){return String(v ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function compact(v,d=2){
  const n=Number(v);
  if(!Number.isFinite(n)) return '--';
  const a=Math.abs(n), s=n<0?'-':'';
  if(a>=1e9)return `${s}${(a/1e9).toFixed(d)}B`;
  if(a>=1e6)return `${s}${(a/1e6).toFixed(d)}M`;
  if(a>=1e3)return `${s}${(a/1e3).toFixed(d)}K`;
  return `${s}${a.toLocaleString('en-US',{maximumFractionDigits:d})}`;
}

function setupBrush(){
  const brush=document.getElementById('brush');
  if(!brush) return;
  const onDown=(ev)=>{
    const handle=ev.target.closest('.handle');
    if(!handle) return;
    state.dragging=handle.dataset.side;
    handle.setPointerCapture?.(ev.pointerId);
    ev.preventDefault();
  };
  const onMove=(ev)=>{
    if(!state.dragging) return;
    const rect=brush.getBoundingClientRect();
    const metrics=brushMetrics();
    const pad=metrics.pad;
    const width=Math.max(1, rect.width-pad*2);
    let value=(ev.clientX-rect.left-pad)/width;
    value=Math.max(0,Math.min(1,value));
    const minSpan=Math.min(.18, 1/Math.max(2,(payload.volumeSeries||[]).length-1));
    if(state.dragging==='left') state.start=Math.min(value, state.end-minSpan);
    if(state.dragging==='right') state.end=Math.max(value, state.start+minSpan);
    state.start=Math.max(0,Math.min(.98,state.start));
    state.end=Math.max(.02,Math.min(1,state.end));
    updateBrush();
    drawChart();
  };
  brush.addEventListener('pointerdown',onDown);
  window.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',()=>{state.dragging=null;});
  updateBrush();
}
function updateBrush(){
  const brush=document.getElementById('brush');
  if(!brush) return;
  const metrics=brushMetrics();
  const pad=metrics.pad, railW=Math.max(1, brush.clientWidth-pad*2);
  const l=pad+state.start*railW, r=pad+state.end*railW;
  brush.querySelector('.handle.left').style.left=`${l}px`;
  brush.querySelector('.handle.right').style.left=`${r}px`;
  const selected=brush.querySelector('.selected-rail');
  selected.style.left=`${l}px`;
  selected.style.width=`${Math.max(0,r-l)}px`;
}
function brushMetrics(){
  const compactLayout=window.matchMedia && window.matchMedia('(max-width: 980px)').matches;
  return compactLayout ? {pad:10, handle:20} : {pad:16, handle:32};
}
function chartPadding(){
  const compactLayout=window.matchMedia && window.matchMedia('(max-width: 980px)').matches;
  return compactLayout ? {l:22,r:58,t:10,b:26} : {l:48,r:76,t:24,b:42};
}
function sameQuarter(date, quarter){
  const d=new Date(`${String(date||'').slice(0,10)}T00:00:00Z`);
  if(Number.isNaN(d.getTime())) return false;
  const q=Math.floor(d.getUTCMonth()/3)+1;
  return `${d.getUTCFullYear()} Q${q}`===quarter;
}
function drawChart(){
  const el=document.getElementById('chart');
  const allVolumes = payload.volumeSeries || [];
  const prices = payload.priceSeries || [];
  if(!allVolumes.length){
    el.innerHTML = '<div class="empty">暂无议员交易汇总。</div><div class="tooltip" id="tooltip"></div>';
    return;
  }
  const panel=document.querySelector('.chart-panel');
  const W=Math.max(320, Math.round((panel && panel.getBoundingClientRect().width) || el.getBoundingClientRect().width || el.clientWidth || 980));
  const H=Math.max(160, Math.round(W * 0.4));
  el.style.height=`${H}px`;
  state.lastChartWidth=W;
  const p=chartPadding();
  const startIdx=Math.floor(state.start*Math.max(0, allVolumes.length-1));
  const endIdx=Math.max(startIdx, Math.ceil(state.end*Math.max(0, allVolumes.length-1)));
  const volumes=allVolumes.slice(startIdx,endIdx+1);
  const visibleLabels=new Set(volumes.map(d=>d.label));
  const visiblePrices=prices.filter(d=>visibleLabels.has(d.label) || sameQuarter(d.date, d.label));
  const priceSource=visiblePrices.length ? visiblePrices : prices;
  const maxVol=Math.max(1,...volumes.flatMap(r=>[Number(r.buy||0),Number(r.sell||0)]));
  const volStep=niceStep(maxVol/4);
  const volMax=Math.max(volStep*4, maxVol);
  const priceValues=priceSource.map(r=>Number(r.price)).filter(Number.isFinite);
  let priceMin=Math.min(...priceValues), priceMax=Math.max(...priceValues);
  if(!Number.isFinite(priceMin)||priceMin===priceMax){priceMin=0; priceMax=1}
  const pricePad=(priceMax-priceMin)*.08 || 1;
  priceMin=Math.max(0, priceMin-pricePad);
  priceMax=priceMax+pricePad;
  const plotW=W-p.l-p.r, plotH=H-p.t-p.b;
  const groupCount=Math.max(volumes.length,1);
  const groupGapRatio=.5;
  const groupWidth=plotW/(groupCount + Math.max(0,groupCount-1)*groupGapRatio);
  const groupGap=groupWidth*groupGapRatio;
  const barGap=1;
  const barWidth=Math.max(1,(groupWidth-barGap)/2);
  const groupStart=i=>p.l+i*(groupWidth+groupGap);
  const x=i=>groupStart(i)+groupWidth/2;
  const yVol=v=>p.t+(volMax-Number(v||0))/volMax*plotH;
  const yPrice=v=>p.t+(priceMax-Number(v||0))/(priceMax-priceMin)*plotH;
  const tickSlots=[0,.25,.5,.75,1];
  const priceTicks=tickSlots.map(t=>priceMax-(priceMax-priceMin)*t);
  const volTicks=tickSlots.map(t=>volMax*(1-t));
  const grid=tickSlots.map((t,i)=>{
    const y=p.t+plotH*t;
    return `<line class="grid" x1="${p.l}" y1="${y}" x2="${W-p.r}" y2="${y}"></line><text class="axis" x="${p.l-8}" y="${y}" text-anchor="end">${compact(priceTicks[i],0)}</text><text class="axis" x="${W-p.r+10}" y="${y}" text-anchor="start">${compact(volTicks[i],2)}</text>`;
  }).join('');
  const compactLayout=window.matchMedia && window.matchMedia('(max-width: 980px)').matches;
  const xLabelY=compactLayout ? H-8 : H-18;
  const xLabelIndexes=sampleXAxisIndexes(volumes, groupWidth+groupGap);
  const bars=volumes.map((d,i)=>{
    const base=yVol(0), bx=groupStart(i), sx=bx+barWidth+barGap;
    const by=yVol(Number(d.buy||0)), sy=yVol(Number(d.sell||0));
    const label=xLabelIndexes.has(i) ? `<text class="axis" x="${x(i)}" y="${xLabelY}" text-anchor="middle">${esc(d.label)}</text>` : '';
    return `<rect class="buy" x="${bx}" y="${by}" width="${barWidth}" height="${Math.max(1,base-by)}"></rect><rect class="sell" x="${sx}" y="${sy}" width="${barWidth}" height="${Math.max(1,base-sy)}"></rect>${label}`;
  }).join('');
  const pricePts=priceSource.map((d,idx)=>[idx/Math.max(priceSource.length-1,1)*plotW+p.l,yPrice(Number(d.price)),d]);
  const line=pricePts.map((pt,i)=>`${i?'L':'M'}${pt[0].toFixed(2)},${pt[1].toFixed(2)}`).join(' ');
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMin meet">${grid}${bars}${line ? `<path class="price-line" d="${line}"></path>` : ''}<rect id="hit" x="${p.l}" y="${p.t}" width="${plotW}" height="${plotH}" fill="transparent"></rect></svg><div class="tooltip" id="tooltip"></div>`;
  const svg=el.querySelector('svg'), tip=document.getElementById('tooltip');
  el.querySelector('#hit').addEventListener('mousemove',ev=>{
    const rect=svg.getBoundingClientRect();
    const px=(ev.clientX-rect.left)/rect.width*W;
    let idx=0,best=Infinity;
    volumes.forEach((d,i)=>{const dist=Math.abs(x(i)-px); if(dist<best){best=dist; idx=i;}});
    const d=volumes[idx] || {};
    const price=priceSource.find(p=>p.label===d.label || sameQuarter(p.date,d.label)) || priceSource[Math.min(priceSource.length-1, Math.round(idx/Math.max(volumes.length-1,1)*(priceSource.length-1)))] || {};
    const anchorX=x(idx);
    tip.innerHTML=`<strong class="tip-title">${esc(d.label)}</strong>
      <div class="tip-row"><span class="tip-label"><span class="tip-dot" style="background:#2f64f6"></span>${esc(payload.code||'Price')}</span><span class="tip-value">${compact(price.price,2)}</span></div>
      <div class="tip-row"><span class="tip-label"><span class="tip-dot" style="background:#079b67"></span>买入</span><span class="tip-value">${compact(d.buy,2)}</span></div>
      <div class="tip-row"><span class="tip-label"><span class="tip-dot" style="background:#ff3b25"></span>卖出</span><span class="tip-value">${compact(d.sell,2)}</span></div>`;
    tip.classList.add('show');
    const tipRect=tip.getBoundingClientRect();
    const chartRect=el.getBoundingClientRect();
    const left=Math.max(8,Math.min(chartRect.width-tipRect.width-8,anchorX-tipRect.width/2));
    const top=p.t-tipRect.height-8;
    tip.style.left=`${left}px`;
    tip.style.top=`${top}px`;
    tip.style.setProperty('--arrow-left',`${Math.max(16,Math.min(tipRect.width-16,anchorX-left))}px`);
  });
  el.querySelector('#hit').addEventListener('mouseleave',()=>tip.classList.remove('show'));
}
function render(){
  document.getElementById('app').innerHTML = `<section class="layout">
    <div class="chart-panel">
      <div class="legend"><span class="legend-item"><i class="dot" style="background:#356cff"></i>${esc(payload.code || 'Stock')}</span><span class="legend-item"><i class="dot" style="background:#079b67"></i>买入</span><span class="legend-item"><i class="dot" style="background:#ff3b25"></i>卖出</span></div>
      <div class="chart" id="chart"></div>
      <div class="brush" id="brush"><div class="rail"></div><div class="selected-rail"></div><div class="handle left" data-side="left"></div><div class="handle right" data-side="right"></div></div>
    </div>
    <div class="table-wrap">${renderTrades(payload.trades || [])}</div>
  </section>`;
  document.getElementById('chart').insertAdjacentHTML('beforeend','<div class="tooltip" id="tooltip"></div>');
  setupBrush();
  drawChart();
  setupResizeObserver();
}
function niceStep(value){
  const raw=Math.max(1, Number(value)||1);
  const pow=Math.pow(10, Math.floor(Math.log10(raw)));
  const n=raw/pow;
  const base=n<=1?1:n<=2?2:n<=5?5:10;
  return base*pow;
}
function sampleXAxisIndexes(rows, xBand){
  const count=rows.length;
  if(count<=2) return new Set(rows.map((_,i)=>i));
  const maxLabelWidth=Math.max(...rows.map(d=>String(d.label||'').length*7.2));
  if(xBand >= maxLabelWidth + 8) return new Set(rows.map((_,i)=>i));
  return new Set([0, Math.floor((count-1)/2), count-1]);
}
let resizeTimer=0;
function queueResizeDraw(){
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{updateBrush(); drawChart();},80);
}
window.addEventListener('resize',queueResizeDraw,{passive:true});
function setupResizeObserver(){
  if(!window.ResizeObserver) return;
  const chart=document.getElementById('chart');
  const brush=document.getElementById('brush');
  const ro=new ResizeObserver(entries=>{
    const chartEntry=entries.find(entry=>entry.target===chart);
    if(chartEntry){
      const nextWidth=Math.round(chartEntry.contentRect.width || 0);
      if(Math.abs(nextWidth-state.lastChartWidth) > 2) queueResizeDraw();
      return;
    }
    queueResizeDraw();
  });
  if(chart) ro.observe(chart);
  if(brush) ro.observe(brush);
  requestAnimationFrame(()=>requestAnimationFrame(queueResizeDraw));
}
render();

</script>
