  <style>
:root{color-scheme:light;--business-text-777b7d:#777b7d;--business-border-e6e6e6:#e6e6e6;--business-border-5f6673:#5f6673;--business-text-666:#666;--business-text-151515:#151515;--business-text-fff:#fff;--business-text-f5f5f5:#f5f5f5;--business-text-ededed:#ededed;--business-bg-fff:#fff;}
:root[data-theme="dark"]{color-scheme:dark;--business-text-777b7d:#a8b3c4;--business-border-e6e6e6:#293646;--business-border-5f6673:#566477;--business-text-666:#a8b3c4;--business-text-151515:#e8edf5;--business-text-fff:#f5f7fb;--business-text-f5f5f5:#f5f7fb;--business-text-ededed:#a8b3c4;--business-bg-fff:#202b3a;}

    :root {
      color-scheme: light;
      --green:#009b72;
      --cyan:#20c9b5;
      --red:#ff596d;
      --ring:var(--business-text-777b7d);
      --grid:var(--business-border-e6e6e6);
      --axis:var(--business-border-5f6673);
      --text:var(--business-text-666);
      --ink:var(--business-text-151515);
      --tip: rgba(48, 48, 48, .96);
      --content-inset: 22px;
      --tooltip-arrow-left: 50%;
      --tooltip-arrow-size: 10px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: transparent;
      color: var(--ink);
      overflow: visible;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .frame {
      width: 100%;
      height: clamp(400px, 45vw, 560px);
      min-height: 400px;
      background: transparent;
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: visible;
    }

    .chart {
      position: relative;
      width: 100%;
      flex: 1 1 auto;
      min-height: 280px;
      overflow: visible;
    }

    .header {
      padding: 20px var(--content-inset) 0;
      flex: 0 0 auto;
    }

    .title {
      margin: 0;
      font-size: 16px;

    .next-date {
      margin: 8px 0 0;

    .next-date:empty {

    svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .grid {
      stroke: var(--grid);
      stroke-width: 1.2;
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 1.6;
    }

    .ylabel {
      fill: var(--text);

    .xlabel {
      fill: var(--text);

      font-weight: 420;

      font-size: 14px;
      font-weight: 420;
    }

    .beat,
    .met {
      fill: var(--green);
    }

    .missed {
      fill: var(--red);
    }

    .upcoming {
      fill: var(--text);
    }

    .actual {
      fill: var(--green);
      pointer-events: none;
    }

    .actual-negative {
      fill: var(--red);
    }

    .estimate {
      fill:var(--business-text-fff);

    }

    .hit {

      cursor: default;
    }

    .hover-band {
      fill:var(--business-text-f5f5f5);
      opacity: .9;
      pointer-events: none;
    }

    .tooltip {
      position: absolute;
      top: -96px;
      left: var(--content-inset);
      max-width: min(390px, calc(100vw - 44px));
      padding: 10px 13px 11px;
      border-radius: 5px;
      background: var(--tip);
      color:var(--business-text-ededed);
      font-size: 16px;
      line-height: 1.35;
      pointer-events: none;
      visibility: hidden;
      box-shadow: none;
      z-index: 999;
      white-space: nowrap;
    }

    .tooltip::after {
      content: "";
      position: absolute;
      left: var(--tooltip-arrow-left);
      top: 100%;
      width: var(--tooltip-arrow-size);
      height: var(--tooltip-arrow-size);
      background: var(--tip);
      transform: translate(-50%, -5px) rotate(45deg);
    }

    .positive {
      color: var(--cyan);
    }

    .negative {
      color:#ff596d;
    }

    .legend {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 2px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      height: 24px;
      color: var(--text);
      font-size: 16px;
      line-height: 1;
      padding: 0 var(--content-inset);
      pointer-events: none;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--green);
      display: inline-block;
    }

    .legend-ring {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 3px solid var(--ring);
      background:var(--business-bg-fff);
      display: inline-block;
    }

    @media (max-width: 700px) {
      :root {
        --content-inset: 18px;
        --tooltip-arrow-size: 9px;
      }

      .frame {
        min-height: 360px;
      }

      .chart {
        min-height: 245px;
      }

      .header {
        padding-top: 16px;
      }

      .title {
        font-size: 16px;
      }

      .next-date {
        font-size: 13px;
        margin-top: 6px;
      }

      .ylabel {
        font-size: 13px;
      }

      .xlabel,
      .status,
      .estimate-label {
        font-size: 13px;
      }

      .tooltip {
        top: -82px;
        font-size: 13px;
        max-width: calc(100vw - 36px);
        padding: 9px 11px 10px;
        box-shadow: none;
      }

      .legend {
        bottom: 2px;
        font-size: 13px;
        gap: 20px;
        height: 22px;
      }
    }
  </style>

<body>
  <main class="frame">
    <header class="header">
      <h1 class="title" id="title"></h1>
      <p class="next-date" id="next-date"></p>
    </header>

    <div class="chart" id="wrap">
      <svg id="svg" role="img" aria-label="Revenue estimate chart"></svg>
      <div class="tooltip" id="tooltip"></div>

      <div class="legend" aria-label="Legend">
        <span class="legend-item">
          <span class="legend-dot"></span>
          <span id="actual-legend">实际值</span>
        </span>
        <span class="legend-item">
          <span class="legend-ring"></span>
          <span id="estimate-legend">预估值</span>
        </span>
      </div>
    </div>
  </main>

  <script>
    const payload = {"type": "revenue-estimate", "name": "收入", "nextDate": "Nov 3, 2026", "code": "AMD", "companyName": "Advanced Micro Devices", "defaultView": "quarterly", "actualLabel": "实际值", "estimateLabel": "预估值", "views": {"quarterly": {"label": "季度", "unit": "B", "axisUnit": "B", "decimals": 2, "data": [{"label": "Q3'25", "period": "Q3'25", "status": "超预期", "actual": 9.246, "estimate": 8.756463065, "date": "Nov 4, 2025", "surprise": 0.48953694, "surprisePercent": 0.055905785, "statusKey": "超预期"}, {"label": "Q4'25", "period": "Q4'25", "status": "超预期", "actual": 10.27, "estimate": 9.6683569, "date": "Feb 3, 2026", "surprise": 0.6016431, "surprisePercent": 0.062228061, "statusKey": "超预期"}, {"label": "Q1'26", "period": "Q1'26", "status": "超预期", "actual": 10.253, "estimate": 9.900007986, "date": "May 5, 2026", "surprise": 0.35299201, "surprisePercent": 0.03565573, "statusKey": "超预期"}, {"label": "Q2'26", "period": "Q2'26", "status": "超预期", "actual": 11.536, "estimate": 11.309653407, "date": "Aug 4, 2026", "surprise": 0.22634659, "surprisePercent": 0.020013575, "statusKey": "超预期"}, {"label": "Q3'26", "period": "Q3'26", "status": "待披露", "actual": null, "estimate": 13.06238999, "date": "Nov 3, 2026", "surprise": null, "surprisePercent": null, "statusKey": "待披露"}]}}, "source": "AInvest financial_reports_visual/finance/v1/forecast", "title": "AMD 营收：实际值与分析师预期对比", "language": "zh-CN", "labels": {"nextReport": "下次披露", "noData": "暂无数据", "date": "日期", "upcoming": "待披露", "above": "高于预期", "below": "低于预期"}, "componentUi": {"Business": "主营业务", "Type": "类型", "Stock": "股票", "No data": "暂无数据", "No Data": "暂无数据", "Value": "价值", "Quarterly": "季度", "Actual": "实际值", "Estimate": "预估值"}, "theme": "light"};
    const i18n = payload.labels || {};

    const svg = document.getElementById("svg");
    const wrap = document.getElementById("wrap");
    const tooltip = document.getElementById("tooltip");
    const titleEl = document.getElementById("title");
    const nextDateEl = document.getElementById("next-date");
    const actualLegendEl = document.getElementById("actual-legend");
    const estimateLegendEl = document.getElementById("estimate-legend");
    const ns = "http://www.w3.org/2000/svg";

    let contentInset = 22;
    let tooltipTop = -96;

    titleEl.textContent = payload.title || payload.name || "Revenue";
    actualLegendEl.textContent = payload.actualLabel || "Actual";
    estimateLegendEl.textContent = payload.estimateLabel || "Estimate";

    function getView() {
      if (Array.isArray(payload.data)) {
        return {
          unit: payload.unit || "USD",
          axisUnit: payload.axisUnit || "",
          decimals: typeof payload.decimals === "number" ? payload.decimals : 2,
          data: payload.data
        };
      }

      const views = payload.views || {};
      const key = payload.defaultView && views[payload.defaultView]
        ? payload.defaultView
        : Object.keys(views)[0];

      return views[key] || { data: [] };
    }

    function rows() {
      return getView().data || [];
    }

    function currentNextDate() {
      if (payload.nextDate) {
        return payload.nextDate;
      }

      const future = rows().find(d =>
        (d.actual === null || d.actual === undefined) &&
        d.estimate !== null &&
        d.estimate !== undefined
      );

      return future && future.date ? future.date : "";
    }

    function unit() {
      return getView().unit || "USD";
    }

    function axisUnit() {
      return getView().axisUnit || "";
    }

    function decimals() {
      const view = getView();
      return typeof view.decimals === "number" ? view.decimals : 2;
    }

    const nextDate = currentNextDate();
    nextDateEl.textContent = nextDate ? `${i18n.nextReport || "Next report"}: ${nextDate}` : "";

    function el(tag, attrs = {}) {
      const node = document.createElementNS(ns, tag);
      Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
      svg.appendChild(node);
      return node;
    }

    function fmt(value, digits = 2) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) {
        return "-";
      }

      return Number(value).toLocaleString("en-US", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      });
    }

    function cssClassFromStatus(status) {
      if (String(status).includes('超预期')) return 'beat';
      if (String(status).includes('低于')) return 'missed';
      if (String(status).includes('待披露')) return 'upcoming';
      return String(status || "")
        .toLowerCase()
        .replace(/\s+/g, "-");
    }

    function niceTop(maxValue) {
      if (maxValue <= 3) return 3;
      if (maxValue <= 6) return 6;
      if (maxValue <= 10) return 10;
      if (maxValue <= 20) return 20;

      const rough = maxValue / 4;
      const power = Math.pow(10, Math.floor(Math.log10(rough)));
      const normalized = rough / power;

      let step;

      if (normalized <= 1) step = 1;
      else if (normalized <= 2) step = 2;
      else if (normalized <= 2.5) step = 2.5;
      else if (normalized <= 5) step = 5;
      else step = 10;

      return step * power * 4;
    }

    function buildTicks(maxValue) {
      const top = niceTop(maxValue);
      return [0, top / 4, top / 2, top * 0.75, top];
    }

    function resetTooltip() {
      tooltip.classList.remove("active");
      tooltip.style.visibility = "hidden";
      tooltip.style.left = `${contentInset}px`;
      tooltip.style.top = `${tooltipTop}px`;
      tooltip.style.setProperty("--tooltip-arrow-left", "50%");
    }

    function formatAxisLabel(value) {
      if (axisUnit()) {
        return `${fmt(value, decimals())} ${axisUnit()}`;
      }

      return fmt(value, value % 1 === 0 ? 0 : decimals());
    }

    function formatDelta(diff, pct) {
      const absDiff = Math.abs(diff);
      const absPct = Math.abs(pct);

      return `${fmt(absDiff, decimals())} ${unit()} (${fmt(absPct, 2)}%)`;
    }

    function isActualBelowEstimate(d) {
      const actual = Number(d.actual);
      const estimate = Number(d.estimate);

      return Number.isFinite(actual) && Number.isFinite(estimate) && actual < estimate;
    }

    function renderEmpty(width, height) {
      const text = el("text", {
        x: width / 2,
        y: height / 2,
        fill: "var(--business-text-666)",
        "font-size": 16,
        "text-anchor": "middle"
      });

      text.textContent = i18n.noData || "No data";
    }

    function render() {
      const data = rows();

      svg.innerHTML = "";
      resetTooltip();

      const rect = wrap.getBoundingClientRect();
      const width = Math.max(320, rect.width);
      const height = Math.max(300, rect.height);

      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

      contentInset = width < 700 ? 18 : 22;
      tooltipTop = width < 700 ? -82 : -96;

      document.documentElement.style.setProperty("--content-inset", `${contentInset}px`);

      if (!data.length) {
        renderEmpty(width, height);
        return;
      }

      const yLabelReserve = width < 700 ? 36 : 46;

      const margin = {
        top: width < 700 ? 20 : 20,
        right: contentInset,
        bottom: width < 700 ? 84 : 96,
        left: contentInset,
      };

      const chartLeft = margin.left;
      const chartRight = width - margin.right;
      const gridRight = chartRight - yLabelReserve;
      const plotW = Math.max(120, gridRight - chartLeft);
      const plotH = Math.max(140, height - margin.top - margin.bottom);

      const values = data
        .flatMap(d => [d.actual, d.estimate])
        .filter(v => v !== null && v !== undefined && Number.isFinite(Number(v)));

      const maxValue = Math.max(...values, 1);
      const ticks = buildTicks(maxValue * 1.08);
      const yMax = ticks[ticks.length - 1];

      const y = value => margin.top + plotH - (Number(value) / yMax) * plotH;

      const xPad = data.length > 1 ? Math.min(plotW * 0.1, 90) : 0;

      const x = index => {
        if (data.length === 1) {
          return chartLeft + plotW / 2;
        }

        return chartLeft + xPad + index * ((plotW - xPad * 2) / (data.length - 1));
      };

      const hover = el("rect", {
        class: "hover-band",
        x: -9999,
        y: margin.top,
        width: 0,
        height: plotH,
      });

      ticks.forEach((tickValue, index) => {
        const yy = y(tickValue);

        el("line", {
          class: index === 0 ? "axis" : "grid",
          x1: chartLeft,
          x2: gridRight,
          y1: yy,
          y2: yy,
        });

        const label = el("text", {
          class: "ylabel",
          x: chartRight,
          y: yy + 5,
          "text-anchor": "end",
        });

        label.textContent = formatAxisLabel(tickValue);
      });

      data.forEach((d, index) => {
        const xx = x(index);

        const q = el("text", {
          class: "xlabel",
          x: xx,
          y: margin.top + plotH + 26,
          "text-anchor": "middle",
        });

        q.textContent = d.label || d.period || "";

        const status = d.status || "";

        if (status) {
          const s = el("text", {
            class: `status ${cssClassFromStatus(d.statusKey || status)}`,
            x: xx,
            y: margin.top + plotH + 48,
            "text-anchor": "middle",
          });

          s.textContent = status;
        }
      });

      data.forEach((d, index) => {
        const xx = x(index);
        const bandW = Math.max(62, plotW / Math.max(7, data.length + 2));

        if (d.estimate !== null && d.estimate !== undefined) {
          el("circle", {
            class: "estimate",
            cx: xx,
            cy: y(d.estimate),
            r: width < 700 ? 10 : 12,
          });
        }

        if (d.actual !== null && d.actual !== undefined) {
          el("circle", {
            class: isActualBelowEstimate(d) ? "actual actual-negative" : "actual",
            cx: xx,
            cy: y(d.actual),
            r: width < 700 ? 10 : 12,
          });
        } else if (d.estimate !== null && d.estimate !== undefined) {
          const label = el("text", {
            class: "estimate-label",
            x: xx,
            y: y(d.estimate) - 20,
            "text-anchor": "middle",
          });

          label.textContent = fmt(d.estimate, decimals());
        }

        const hit = el("rect", {
          class: "hit",
          x: xx - bandW / 2,
          y: margin.top,
          width: bandW,
          height: plotH,
        });

        hit.addEventListener("mouseenter", () => showTip(d, hit, hover, xx));
        hit.addEventListener("mousemove", () => showTip(d, hit, hover, xx));
        hit.addEventListener("mouseleave", () => hideTip(hover));
      });
    }

    function showTip(d, hit, hover, anchorX) {
      hover.setAttribute("x", hit.getAttribute("x"));
      hover.setAttribute("width", hit.getAttribute("width"));

      const actual = d.actual;
      const estimate = d.estimate;

      const hasBoth =
        actual !== null &&
        actual !== undefined &&
        estimate !== null &&
        estimate !== undefined;

      const diff = hasBoth ? actual - estimate : null;
      const pct = hasBoth && estimate ? diff / estimate * 100 : null;

      let surpriseLine = i18n.upcoming || "Upcoming";

      if (hasBoth) {
        const isNegative = diff < 0;
        const cls = isNegative ? "negative" : "positive";
        const label = isNegative ? (i18n.below || "Below estimate") : (i18n.above || "Above estimate");

        surpriseLine = `<span class="${cls}">${label} ${formatDelta(diff, pct)}</span>`;
      }

      tooltip.innerHTML = [
        `${i18n.date || "Date"} ${d.date || ""}`,
        actual == null ? `${payload.actualLabel || "实际值"} ${i18n.upcoming || "待披露"}` : `${payload.actualLabel || "Actual"} ${fmt(actual, decimals())} ${unit()}`,
        `${payload.estimateLabel || "Estimate"} ${fmt(estimate, decimals())} ${unit()}`,
        surpriseLine,
      ].join("<br>");

      tooltip.style.visibility = "hidden";
      tooltip.style.left = `${contentInset}px`;
      tooltip.style.top = `${tooltipTop}px`;
      tooltip.style.setProperty("--tooltip-arrow-left", "50%");

      const wrapRect = wrap.getBoundingClientRect();
      const tipRect = tooltip.getBoundingClientRect();

      let left = anchorX - tipRect.width / 2;

      const minLeft = contentInset;
      const maxLeft = Math.max(minLeft, wrapRect.width - contentInset - tipRect.width);

      if (left < minLeft) {
        left = minLeft;
      }

      if (left > maxLeft) {
        left = maxLeft;
      }

      const arrowLeft = Math.max(
        12,
        Math.min(tipRect.width - 12, anchorX - left)
      );

      tooltip.style.left = `${left}px`;
      const gridLines = Array.from(svg.querySelectorAll('line.grid,line.axis'));
      const firstGridTop = Math.min(...gridLines.map(line => line.getBoundingClientRect().top - wrapRect.top));
      const gridTop = Number.isFinite(firstGridTop) ? firstGridTop : 20;
      const above = gridTop - tipRect.height - 6;
      const fitsAbove = !!window.frameElement || wrapRect.top + above >= 8;
      tooltip.style.top = `${fitsAbove ? above : gridTop + 10}px`;
      tooltip.style.setProperty('--tooltip-arrow-top', fitsAbove ? '100%' : '-5px');
      tooltip.classList.add('active');
      tooltip.style.setProperty("--tooltip-arrow-left", `${arrowLeft}px`);
      tooltip.style.visibility = "visible";
    }

    function hideTip(hover) {
      resetTooltip();
      hover.setAttribute("x", -9999);
      hover.setAttribute("width", 0);
    }

    if (window.ResizeObserver) {
      const resizeObserver = new ResizeObserver(render);
      resizeObserver.observe(wrap);
    } else {
      window.addEventListener("resize", render);
    }

    render();
  </script>
