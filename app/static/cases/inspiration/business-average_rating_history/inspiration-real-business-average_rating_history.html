<!doctype html>
<html lang="zh-CN" data-theme="light">
<head><script src="/static/cases/theme.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Average Rating History</title>
<style>
:root{color-scheme:light;--business-text-1a1d26:#1a1d26;--business-text-697181:#697181;--business-text-171717:#171717;--business-text-404040:#404040;--business-bg-f1f1f1:#f1f1f1;--business-border-ececec:#ececec;--business-text-303236:#303236;--business-text-35373b:#35373b;--business-text-8a8a8a:#8a8a8a;--business-bg-303030:#303030;--business-text-f2f2f2:#f2f2f2;--business-text-d8d8d8:#d8d8d8;--business-text-fff:#fff;--business-border-303030:#303030;}
:root[data-theme="dark"]{color-scheme:dark;--business-text-1a1d26:#e8edf5;--business-text-697181:#a8b3c4;--business-text-171717:#e8edf5;--business-text-404040:#e8edf5;--business-bg-f1f1f1:#202b3a;--business-border-ececec:#293646;--business-text-303236:#e8edf5;--business-text-35373b:#e8edf5;--business-text-8a8a8a:#a8b3c4;--business-bg-303030:#263242;--business-text-f2f2f2:#f5f7fb;--business-text-d8d8d8:#a8b3c4;--business-text-fff:#f5f7fb;--business-border-303030:#566477;}

*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--business-text-1a1d26);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{padding:0}
.card{width:100%;margin:0;background:transparent;border:0;border-radius:0;padding:0;box-shadow:none}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}
.title{margin:0 0 8px;font-size:16px;line-height:1.2;font-weight:800;color:var(--business-text-1a1d26);letter-spacing:0}
.subtitle{margin:0;color:var(--business-text-697181);font-size:12px;line-height:1.25;font-weight:500}
.tabs{display:inline-flex;align-items:center;gap:8px;padding:0;color:var(--business-text-171717);flex:none}
.tab{
  appearance:none;
  border:0;
  background:transparent;
  color:var(--business-text-404040);
  font:inherit;
  font-size:14px;
  font-weight:400;
  line-height:1;
  cursor:pointer;
  white-space:nowrap;
  border-radius:10px;
  transition:background-color .14s ease,color .14s ease;
  min-width:58px;
  height:36px;
  padding:0 13px;
}
.tab.active{background:var(--business-bg-f1f1f1);color:var(--business-text-171717);font-weight:700;box-shadow:none}
.tab:focus-visible{outline:2px solid #4387f5;outline-offset:2px}
.chart-wrap{position:relative;height:260px;margin-top:6px;overflow:visible}
svg{display:block;width:100%;height:100%;overflow:visible}
.grid line{stroke:var(--business-border-ececec);stroke-width:1}
.axis-label{fill:var(--business-text-303236);font-size:10px;font-weight:400}
.x-label{fill:var(--business-text-35373b);font-size:10px;font-weight:400}
.line{fill:none;stroke:#f5b400;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.dot{fill:#f5b400;stroke:#f5b400;stroke-width:1.5}
.hover-band{fill:var(--business-text-8a8a8a);fill-opacity:.08;opacity:0;transition:opacity .12s ease;pointer-events:none}
.hover-band.active{opacity:1}
.hover-zone{fill:rgba(0,0,0,.001);pointer-events:all;cursor:pointer}
.tooltip{
  --arrow-x:50%;
  position:fixed;
  pointer-events:none;
  z-index:50;
  min-width:150px;
  border-radius:6px;
  background:var(--business-bg-303030);
  color:var(--business-text-f2f2f2);
  padding:9px 11px;
  font-size:12px;
  line-height:1.45;
  opacity:0;
  transform:translate(-50%,-100%);
  transition:opacity .08s ease;
  white-space:nowrap;
}
.tooltip::after{
  content:"";
  position:absolute;
  left:var(--arrow-x);
  bottom:-6px;
  width:0;
  height:0;
  transform:translateX(-50%);
  border-left:6px solid transparent;
  border-right:6px solid transparent;
  border-top:6px solid var(--business-bg-303030);
}
.tooltip.show{opacity:1}
.tip-row{display:flex;align-items:center;gap:8px;margin-top:4px;min-width:132px}
.tip-dot{width:8px;height:8px;border-radius:50%;background:#f5b400;flex:0 0 auto}
.tip-label{color:var(--business-text-d8d8d8);font-size:12px;line-height:1.2}
.tip-value{margin-left:auto;color:var(--business-text-fff);font-size:14px;font-weight:700;line-height:1.2}
.tooltip b{display:block;color:var(--business-text-fff);font-size:14px;margin-top:3px}
.empty{height:220px;display:flex;align-items:center;justify-content:center;color:var(--business-text-697181);font-size:14px}
@media(max-width:760px){
  .card{padding:0}
  .head{flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:10px}
  .title{font-size:16px}
  .subtitle{font-size:12px;margin-bottom:0}
  .tabs{width:max-content;max-width:100%;overflow:auto}
  .tab{min-width:58px;height:36px;font-size:14px}
  .chart-wrap{height:228px}
  .axis-label,.x-label{font-size:10px}
}
</style>
<script data-business-theme-runtime>
    (() => {
      const requested = new URLSearchParams(location.search).get('theme');
      if (requested === 'dark' || requested === 'light') document.documentElement.dataset.theme = requested;
    })();
    </script></head>
<body>
<main id="app"></main>
<script>
const payload = {"type": "average-rating-history", "name": "Average Rating History", "title": "Average Rating History", "code": "AMD", "market": "185", "defaultPeriod": "6M", "views": {"1M": [{"date": "2026-09-25", "averageRating": 3.95652174, "timestamp": "2026-09-25T00:00:00.000Z"}, {"date": "2026-09-29", "averageRating": 3.95652174, "timestamp": "2026-09-29T00:00:00.000Z"}, {"date": "2026-10-04", "averageRating": 3.95652174, "timestamp": "2026-10-04T00:00:00.000Z"}, {"date": "2026-10-09", "averageRating": 3.95652174, "timestamp": "2026-10-09T00:00:00.000Z"}, {"date": "2026-10-14", "averageRating": 3.95652174, "timestamp": "2026-10-14T00:00:00.000Z"}], "3M": [{"date": "2026-07-14", "averageRating": 3.8, "timestamp": "2026-07-14T00:00:00.000Z"}, {"date": "2026-08-06", "averageRating": 3.88888889, "timestamp": "2026-08-06T00:00:00.000Z"}, {"date": "2026-08-29", "averageRating": 3.95833333, "timestamp": "2026-08-29T00:00:00.000Z"}, {"date": "2026-09-21", "averageRating": 3.95652174, "timestamp": "2026-09-21T00:00:00.000Z"}, {"date": "2026-10-14", "averageRating": 3.95652174, "timestamp": "2026-10-14T00:00:00.000Z"}], "6M": [{"date": "2026-04-14", "averageRating": 3.6, "timestamp": "2026-04-14T00:00:00.000Z"}, {"date": "2026-05-14", "averageRating": 3.70833333, "timestamp": "2026-05-14T00:00:00.000Z"}, {"date": "2026-06-14", "averageRating": 3.76, "timestamp": "2026-06-14T00:00:00.000Z"}, {"date": "2026-07-14", "averageRating": 3.8, "timestamp": "2026-07-14T00:00:00.000Z"}, {"date": "2026-08-14", "averageRating": 3.91304348, "timestamp": "2026-08-14T00:00:00.000Z"}, {"date": "2026-09-13", "averageRating": 3.95652174, "timestamp": "2026-09-13T00:00:00.000Z"}, {"date": "2026-10-14", "averageRating": 3.95652174, "timestamp": "2026-10-14T00:00:00.000Z"}], "1Y": [{"date": "2025-10-14", "averageRating": 3.77272727, "timestamp": "2025-10-14T00:00:00.000Z"}, {"date": "2025-11-13", "averageRating": 3.80952381, "timestamp": "2025-11-13T00:00:00.000Z"}, {"date": "2025-12-13", "averageRating": 3.80952381, "timestamp": "2025-12-13T00:00:00.000Z"}, {"date": "2026-01-13", "averageRating": 3.84210526, "timestamp": "2026-01-13T00:00:00.000Z"}, {"date": "2026-02-12", "averageRating": 3.8, "timestamp": "2026-02-12T00:00:00.000Z"}, {"date": "2026-03-15", "averageRating": 3.66666667, "timestamp": "2026-03-15T00:00:00.000Z"}, {"date": "2026-04-14", "averageRating": 3.6, "timestamp": "2026-04-14T00:00:00.000Z"}, {"date": "2026-05-14", "averageRating": 3.70833333, "timestamp": "2026-05-14T00:00:00.000Z"}, {"date": "2026-06-14", "averageRating": 3.76, "timestamp": "2026-06-14T00:00:00.000Z"}, {"date": "2026-07-14", "averageRating": 3.8, "timestamp": "2026-07-14T00:00:00.000Z"}, {"date": "2026-08-14", "averageRating": 3.91304348, "timestamp": "2026-08-14T00:00:00.000Z"}, {"date": "2026-09-13", "averageRating": 3.95652174, "timestamp": "2026-09-13T00:00:00.000Z"}, {"date": "2026-10-14", "averageRating": 3.95652174, "timestamp": "2026-10-14T00:00:00.000Z"}]}, "source": {"ratingHistory": "https://fundamental.ainvest.com/bff/analyst-rating/rating-history"}, "language": "zh-CN", "labels": {"title": "平均评级历史", "subtitle": "一致预期评分 | 1 = 强烈卖出，5 = 强烈买入", "period": "周期", "empty": "暂无平均评级历史数据。", "averageRating": "平均评级", "locale": "zh-CN"}, "componentUi": {"Business": "主营业务", "Type": "类型", "Buy": "买入", "Sell": "卖出", "Stock": "股票", "Rating": "评级", "Value": "价值", "Strong Buy": "强烈买入", "Strong Sell": "强烈卖出", "Age": "年龄"}, "theme": "light"};

const periods = ['1M', '3M', '6M', '1Y'];
const bundle = payload.labels || {};
const locale = bundle.locale || 'en-US';
let active = payload.defaultPeriod || '6M';
function t(key, fallback) {
  return bundle[key] || fallback;
}
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtDate(value) {
  const d = new Date(`${value}T00:00:00Z`);
  if (Number.isNaN(d.getTime())) return String(value || '');
  return d.toLocaleDateString(locale, { month: 'short', day: 'numeric', timeZone: 'UTC' });
}
function draw() {
  const rows = (payload.views?.[active] || []).filter((x) => Number.isFinite(Number(x.averageRating)));
  const tabs = periods.map((p) => `<button class="tab ${p === active ? 'active' : ''}" type="button" role="tab" aria-selected="${p === active ? 'true' : 'false'}" data-period="${p}">${p}</button>`).join('');
  document.getElementById('app').innerHTML = `
    <section class="card">
      <header class="head">
        <div>
          <h1 class="title">${esc(t('title', 'Average Rating History'))}</h1>
          <p class="subtitle">${esc(t('subtitle', 'Consensus score | 1 = Strong Sell, 5 = Strong Buy'))}</p>
        </div>
        <nav class="tabs" role="tablist" aria-label="${esc(t('period', 'Period'))}">${tabs}</nav>
      </header>
      ${rows.length ? `<div class="chart-wrap"><svg id="chart" role="img"></svg><aside class="tooltip" id="tip"></aside></div>` : `<div class="empty">${esc(t('empty', 'No average rating history data.'))}</div>`}
    </section>`;
  document.querySelectorAll('.tab').forEach((btn) => btn.addEventListener('click', () => {
    active = btn.dataset.period;
    draw();
  }));
  if (rows.length) drawChart(rows);
}
function setTooltipPosition(clientX) {
  const margin = 10;
  const arrowGap = 6;
  const firstGridLine = document.querySelector('#chart .grid line');
  const firstGridY = firstGridLine ? firstGridLine.getBoundingClientRect().top : margin;
  const box = tip.getBoundingClientRect();
  const width = box.width || 170;
  const x = Math.max(margin + width / 2, Math.min(window.innerWidth - margin - width / 2, clientX));
  const y = firstGridY - arrowGap;
  const arrowX = Math.max(12, Math.min(width - 12, clientX - (x - width / 2)));
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
  tip.style.setProperty('--arrow-x', arrowX + 'px');
}
function drawChart(rows) {
  const svg = document.getElementById('chart');
  const tip = document.getElementById('tip');
  const wrap = svg.closest('.chart-wrap');
  const W = Math.max(360, Math.round(wrap.clientWidth || 900));
  const H = Math.max(220, Math.round(wrap.clientHeight || 280));
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = '';

  const values = rows.map((x) => Number(x.averageRating)).filter(Number.isFinite);
  let min = Math.min(...values, 3.2);
  let max = Math.max(...values, 3.8);
  min = Math.floor((min - 0.05) * 10) / 10;
  max = Math.ceil((max + 0.05) * 10) / 10;
  if (max - min < 0.4) {
    const mid = (max + min) / 2;
    min = mid - 0.25;
    max = mid + 0.25;
  }

  const ticks = Array.from({ length: 5 }, (_, i) => max - (max - min) * i / 4);
  const axisLabels = ticks.map((t) => t.toFixed(1));
  const estimateTextWidth = (label) => String(label || '').length * 7.2;
  const axisGap = 8;
  const edgePad = 2;
  const rightAxisWidth = Math.max(34, ...axisLabels.map(estimateTextWidth));
  const pad = {
    top: 2,
    right: Math.ceil(rightAxisWidth + axisGap + edgePad),
    bottom: 32,
    left: 0
  };

  const chartW = Math.max(1, W - pad.left - pad.right);
  const chartH = Math.max(1, H - pad.top - pad.bottom);
  const x = (i) => rows.length === 1 ? pad.left + chartW / 2 : pad.left + i / (rows.length - 1) * chartW;
  const y = (v) => pad.top + (max - Number(v || 0)) / Math.max(0.000001, max - min) * chartH;
  const points = rows.map((r, i) => ({ x: x(i), y: y(Number(r.averageRating)), row: r }));

  const ns = 'http://www.w3.org/2000/svg';
  const el = (name, attrs = {}, parent = svg) => {
    const node = document.createElementNS(ns, name);
    Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
    parent.appendChild(node);
    return node;
  };

  const gridLayer = el('g', { class: 'grid' });
  const hoverLayer = el('g');
  const lineLayer = el('g');
  const labelLayer = el('g');
  const zoneLayer = el('g');

  ticks.forEach((t, i) => {
    const yy = pad.top + chartH * i / 4;
    el('line', { x1: pad.left, y1: yy, x2: W - pad.right, y2: yy, class: i === ticks.length - 1 ? 'axis' : 'grid' }, gridLayer);
    el('text', { x: W - pad.right + axisGap, y: yy + 4, class: 'axis-label' }, gridLayer).textContent = axisLabels[i];
  });

  const d = points.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' ');
  el('path', { class: 'line', d }, lineLayer);

  const labelIndexes = [0, Math.floor((points.length - 1) / 2), points.length - 1];
  labelIndexes.forEach((idx) => {
    const p = points[idx];
    if (!p) return;
    el('text', {
      x: p.x,
      y: H - 6,
      'text-anchor': idx === 0 ? 'start' : idx === points.length - 1 ? 'end' : 'middle',
      class: 'x-label'
    }, labelLayer).textContent = fmtDate(p.row.date);
  });

  function clearBands() {
    hoverLayer.querySelectorAll('.hover-band').forEach((node) => node.classList.remove('active'));
  }
  function showTooltip(clientX, row) {
    tip.innerHTML = `
      <div>${esc(fmtDate(row.date))}</div>
      <div class="tip-row">
        <span class="tip-dot"></span>
        <span class="tip-label">${esc(t('averageRating', 'Average Rating'))}</span>
        <span class="tip-value">${Number(row.averageRating).toFixed(2)}</span>
      </div>`;
    tip.classList.add('show');
    setTooltipPosition(clientX);
  }
  function hideTooltip() {
    tip.classList.remove('show');
  }

  points.forEach((point, index) => {
    const left = index === 0 ? pad.left : (points[index - 1].x + point.x) / 2;
    const right = index === points.length - 1 ? W - pad.right : (point.x + points[index + 1].x) / 2;
    const band = el('rect', { x: left, y: pad.top, width: Math.max(1, right - left), height: chartH, class: 'hover-band' }, hoverLayer);
    const zone = el('rect', { x: left, y: pad.top, width: Math.max(1, right - left), height: chartH, class: 'hover-zone' }, zoneLayer);
    const activate = () => {
      clearBands();
      band.classList.add('active');
      svg.querySelectorAll('.hover-dot').forEach((n) => n.remove());
      el('circle', { class: 'dot hover-dot', cx: point.x, cy: point.y, r: 4.6 }, lineLayer);
      const rect = svg.getBoundingClientRect();
      showTooltip(rect.left + (point.x / W) * rect.width, point.row);
    };
    zone.addEventListener('pointerenter', activate);
    zone.addEventListener('pointermove', activate);
    zone.addEventListener('pointerleave', () => {
      band.classList.remove('active');
      svg.querySelectorAll('.hover-dot').forEach((n) => n.remove());
      hideTooltip();
    });
  });
}
window.addEventListener('resize', () => window.requestAnimationFrame(() => {
  const rows = (payload.views?.[active] || []).filter((x) => Number.isFinite(Number(x.averageRating)));
  if (rows.length) drawChart(rows);
}));
draw();

</script>
<style data-business-heading-style>.kline-title strong[data-business-title],[data-business-title]{font-size:18px!important;font-weight:700!important;line-height:1.4!important;letter-spacing:0!important;margin:0 0 8px!important;white-space:normal!important;overflow-wrap:anywhere;color:inherit}@media(max-width:720px){.kline-title strong[data-business-title],[data-business-title]{font-size:16px!important}}</style><script data-business-heading-runtime>(()=>{const modelTitle="AMD近一年分析师评级V型修复与高位横盘";const apply=()=>{let heading=document.querySelector('h1:not(.company-name),h2:not(.panel-title):not(.section-title):not(.actions-title),.page-title,.component-title,.chart-title,.multi-title,#title,.pie-title,.waterfall-title,.title,.kline-title strong');if(!heading && modelTitle){heading=document.createElement('h1');const host=document.querySelector('main,.wrap,.component')||document.body;host.prepend(heading);}if(heading){heading.dataset.businessTitle='true';if(modelTitle){heading.textContent=modelTitle;document.title=modelTitle;}}};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply,{once:true});else apply();})();</script></body>
