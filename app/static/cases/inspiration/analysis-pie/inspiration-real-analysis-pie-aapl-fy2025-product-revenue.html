<html lang="zh-CN" data-theme="light">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pie</title>
<style>:root{--sv-chart-series-1:#4d63f6;--sv-chart-series-2:#00b899;--sv-chart-series-3:#ff2f57;--sv-chart-series-4:#d97706;--sv-chart-series-5:#8e4ec6;--sv-chart-series-6:#0090ff;--sv-chart-series-7:#ab4aba;--sv-chart-series-8:#46a758;}:root[data-theme="dark"]{--sv-chart-series-1:#8294ff;--sv-chart-series-2:#34d3ad;--sv-chart-series-3:#ff7188;--sv-chart-series-4:#f6ad55;--sv-chart-series-5:#d19dff;--sv-chart-series-6:#70b8ff;--sv-chart-series-7:#e796f3;--sv-chart-series-8:#7ce2bd;}
:root{color-scheme:light;--business-text-151922:#151922;--business-text-687386:#687386;--business-text-fff:#fff;--business-text-4b5563:#4b5563;}
:root[data-theme="dark"]{color-scheme:dark;--business-text-151922:#f1f5f9;--business-text-687386:#c1cad7;--business-text-fff:#f1f5f9;--business-text-4b5563:#c1cad7;}

*{box-sizing:border-box}
html,body{width:100%;min-height:0;margin:0;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:0;color:var(--business-text-151922);overflow:hidden}
.pie-component{position:relative;width:100%;min-height:360px;padding:0 1px 0 0;background:transparent;overflow:hidden;container-type:inline-size}
.pie-header{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;column-gap:12px;width:100%;margin:0 0 10px}
.pie-heading{min-width:0}
.pie-title{margin:0;padding:0;color:var(--business-text-151922);font-size:20px;font-weight:700;line-height:1.35;letter-spacing:-.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pie-title:empty{display:none}
.pie-subtitle{margin:4px 0 0;padding:0;color:var(--business-text-687386);font-size:13px;font-weight:400;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pie-subtitle:empty{display:none}
.pie-badge{align-self:start;margin:3px 0 0;padding:0;color:var(--business-text-687386);font-size:12px;font-weight:500;line-height:1.2;white-space:nowrap}
.pie-badge:empty{display:none}
.pie-layout{display:grid;grid-template-columns:minmax(160px,220px) fit-content(360px);align-items:center;justify-content:start;gap:clamp(12px,4cqw,48px);width:100%;min-width:0}
.pie-stage{position:relative;width:100%;height:210px;min-width:0;margin:0;overflow:visible}
svg{display:block;width:100%;height:100%;overflow:visible}
.pie-center{font-size:16px;font-weight:600;fill:var(--business-text-151922);text-anchor:middle;dominant-baseline:middle}
.pie-slice{cursor:pointer;transition:opacity .12s ease}
.pie-highlight{pointer-events:none;transition:opacity .12s ease}
.pie-tooltip{position:absolute;z-index:5;min-width:150px;max-width:calc(100% - 2px);padding:11px 14px;background:rgba(21,25,34,.94);color:var(--business-text-fff);border-radius:6px;font-size:14px;line-height:1.55;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .12s ease}
.pie-tooltip::after{content:"";position:absolute;top:50%;width:10px;height:10px;background:rgba(21,25,34,.94);transform:translateY(-50%) rotate(45deg)}
.pie-tooltip[data-side="right"]::after{left:-5px}
.pie-tooltip[data-side="left"]::after{right:-5px}
.tooltip-title{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap}
.tooltip-title span{overflow:hidden;text-overflow:ellipsis}
.tooltip-dot,.legend-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.tooltip-value{padding-left:16px;white-space:nowrap}
.pie-tooltip.active{opacity:1;visibility:visible}
.pie-legend{display:flex;flex-wrap:wrap;align-items:center;justify-self:start;gap:10px 18px;width:max-content;max-width:100%;min-width:0;margin:0;padding:0 1px 0 0;font-size:13px;line-height:1.25}
.legend-entry{display:inline-flex;align-items:center;gap:8px;min-width:0}
.legend-label{display:flex;align-items:center;gap:8px;min-width:0;color:var(--business-text-4b5563)}
.legend-label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend-value{color:var(--business-text-151922);font-weight:700;text-align:left;white-space:nowrap}
.pie-component.legend-bottom .pie-layout{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px}
.pie-component.legend-bottom .pie-stage{width:min(100%,320px);height:190px;margin:0 auto}
.pie-component.legend-bottom .pie-legend{display:flex;justify-content:center;align-content:center;justify-self:center;gap:10px 18px;width:min(100%,720px);max-width:100%;padding-right:1px;font-size:13px}
.pie-component.legend-bottom .legend-entry{display:inline-flex;align-items:center;gap:8px;max-width:100%}
.pie-component.legend-bottom .legend-label{gap:7px}
.pie-component.legend-bottom .legend-value{font-weight:600}
@media(max-width:759px){
 .pie-component{min-height:0}
 .pie-header{margin-bottom:8px;column-gap:8px}
 .pie-title{font-size:17px}
 .pie-subtitle{margin-top:3px;font-size:12px}
 .pie-badge{margin-top:2px;font-size:11px}
 .pie-layout{grid-template-columns:1fr;justify-items:center;gap:8px}
 .pie-stage{width:min(100%,260px);height:190px;margin:0 auto}
 .pie-legend{justify-content:center;justify-self:center;gap:8px 14px;width:min(100%,360px);font-size:13px}
 .legend-entry{gap:8px}
 .pie-center{font-size:14px}
 .pie-tooltip{min-width:140px;font-size:14px}
 .pie-component.legend-bottom .pie-stage{width:min(100%,260px);height:178px}
 .pie-component.legend-bottom .pie-legend{gap:8px;font-size:13px}
}

ot;type&quot;: &quot;string&quot;, &quot;channel&quot;: &quot;legend.value&quot;}, {&quot;field&quot;: &quot;items[].color&quot;, &quot;type&quot;: &quot;string&quot;, &quot;channel&quot;: &quot;pie.arc.color&quot;}, {&quot;field&quot;: &quot;badgeLabel&quot;, &quot;type&quot;: &quot;string&quot;, &quot;channel&quot;: &quot;badge.topRight&quot;}, {&quot;field&quot;: &quot;title&quot;, &quot;type&quot;: &quot;string&quot;, &quot;channel&quot;: &quot;text.title&quot;}, {&quot;field&quot;: &quot;subtitle&quot;, &quot;type&quot;: &quot;string&quot;, &quot;channel&quot;: &quot;text.subtitle&quot;}, {&quot;field&quot;: &quot;showLegendValues&quot;, &quot;type&quot;: &quot;boolean&quot;, &quot;channel&quot;: &quot;legend.valueVisibility&quot;}, {&quot;field&quot;: &quot;showCenterLabel&quot;, &quot;type&quot;: &quot;boolean&quot;, &quot;channel&quot;: &quot;pie.center.visibility&quot;}], &quot;builtInDataSources&quot;: []}">
  <div class="pie-header">
    <div class="pie-heading">
      <h2 class="pie-title">苹果 AAPL · FY2025 各产品营收构成</h2>
      <div class="pie-subtitle">AAPL · 按产品类别净销售额 · FY2025（截至 2025-09-27）</div>

<script>
const config = {"items": [{"label": "iPhone", "value": 209586.0, "displayValue": "209.59 B (50.4%)", "color": "var(--sv-chart-series-1)", "percent": 50.361759030759735}, {"label": "服务", "value": 109158.0, "displayValue": "109.16 B (26.2%)", "color": "var(--sv-chart-series-2)", "percent": 26.22975242754607}, {"label": "可穿戴、家居与配件", "value": 35686.0, "displayValue": "35.69 B (8.6%)", "color": "var(--sv-chart-series-4)", "percent": 8.575046676646778}, {"label": "Mac", "value": 33708.0, "displayValue": "33.71 B (8.1%)", "color": "var(--sv-chart-series-5)", "percent": 8.099749856425758}, {"label": "iPad", "value": 28023.0, "displayValue": "28.02 B (6.7%)", "color": "var(--sv-chart-series-6)", "percent": 6.733692008621663}], "title": "苹果 AAPL · FY2025 各产品营收构成", "centerLabel": "总净销售额", "centerValue": "416.16 B 美元", "subtitle": "AAPL · 按产品类别净销售额 · FY2025（截至 2025-09-27）", "badgeLabel": "期间: FY2025", "legendPosition": "bottom", "showLegendValues": false, "showCenterLabel": true, "ringWidth": 28, "height": 360, "_chartMarkup": {"version": 1, "chartScript": "pie.py", "selectionMode": "user-specified", "effectiveMaxMarks": 1, "applied": [{"index": 0, "type": "item-style", "reason": "item color applied"}], "skipped": []}};

const node = (name, attrs = {}, text = '') => {
  const el = document.createElementNS(NS, name);

const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

function render() {
  svg.innerHTML = '';

  const height = svg.clientHeight || 250;
  const safe = 8;
  const cx = width / 2;
  const cy = height / 2;
  const outerR = Math.max(24, Math.min(88, Math.min(width, height) / 2 - safe));
  const ringWidth = clamp(Number(config.ringWidth) || 28, 12, Math.max(12, outerR * 0.32));
  const innerR = Math.max(20, outerR - ringWidth);
  let angle = 0;

  config.items.forEach((item, index) => {
    const start = angle;

  const tooltipH = tooltip.offsetHeight;

  const safe = 1;
  tooltip.style.left = `${clamp(proposedLeft, safe, Math.max(safe, stage.clientWidth - tooltipW - safe))}px`;
  tooltip.style.top = `${clamp(y - tooltipH / 2, safe, Math.max(safe, stage.clientHeight - tooltipH - safe))}px`;
}
function hideTooltip() {
  tooltip.classList.remove('active');
  svg.querySelectorAll('.pie-highlight').forEach(item => item.style.opacity = '0');
}

  const height = Math.ceil(Math.max(180, root.getBoundingClientRect().bottom || document.body.scrollHeight || 0)) + 2;
  try { parent.postMessage({type:'analysis-planner-chart-height',height}, '*'); } catch (e) {}

window.addEventListener('resize', render);
render();
setTimeout(postChartHeight,80);
setTimeout(postChartHeight,300);
</script>

      const y=event.clientY-placement.top;
      if(active.matches('.treemap-cell')){
        left=anchor+14;tip.style.top=Math.max(8,Math.min(placement.parentHeight-placement.height-8,y+14))+'px';
      }else{
        const side=anchor<viewport/2?'right':'left';tip.dataset.side=side;
        left=side==='right'?anchor+14:anchor-width-14;
        tip.style.top=Math.max(1,Math.min(placement.parentHeight-placement.height-1,y-placement.height/2))+'px';
      }
    }
    left=Math.max(8,Math.min(Math.max(8,viewport-width-8),left));
    tip.style.left=left+'px';tip.style.setProperty('--arrow-left',Math.max(14,Math.min(width-14,anchor-left))+'px');
    if(placement.outer){
      const {portal,host,left:originX,top:originY,width:w,height:h}=placement.outer;
      // Pointer coordinates belong to the chart frame; the portal belongs to the host viewport.
      const pointerY=originY+event.clientY-placement.top;
      let px=originX+anchor-w/2,py=originY+parseFloat(tip.style.top||'0');
      if(!active.matches('.hit-area')){
        if(active.matches('.treemap-cell')){px=originX+anchor+14;py=pointerY+14;}
        else{const side=anchor<viewport/2?'right':'left';portal.dataset.side=side;px=side==='right'?originX+anchor+14:originX+anchor-w-14;py=pointerY-h/2;}
      }
      px=Math.max(8,Math.min(host.innerWidth-w-8,px));py=Math.max(8,Math.min(host.innerHeight-h-8,py));
      portal.style.left=px+'px';portal.style.top=py+'px';portal.style.setProperty('--local-tip-arrow-x',Math.max(14,Math.min(w-14,originX+anchor-px))+'px');
    }
  };
  const direction = (state,x,y) => {
    if(state.direction==='pending'){
      const dx=Math.abs(x-state.x),dy=Math.abs(y-state.y);
      if(Math.max(dx,dy)>6)state.direction=dx>=dy?'horizontal':'vertical';
    }
    return state.direction;
  };
  const selectCanvas = event => {
    const dom=event.target?.closest?.('#chart')||event.target?.closest?.('canvas')?.parentElement?.closest('#chart');
    const instance=dom&&window.echarts?.getInstanceByDom(dom);
    if(!instance)return false;
    const now=performance.now();
    if(!canvasState||canvasState.instance!==instance){
      clear(event);
      canvasState={instance,dom,updated:-Infinity,selected:null};
    }
    const state=canvasState;
    if(now-state.updated>160){state.option=instance.getOption();state.rect=dom.getBoundingClientRect();state.updated=now;}
    const option=state.option,tooltipOption=option.tooltip?.[0];
    // Respect components which intentionally have no tooltip (dynamic line).
    if(tooltipOption?.show===false){canvasState=null;return false;}
    const x=(event.clientX-state.rect.left)*instance.getWidth()/state.rect.width;
    const y=(event.clientY-state.rect.top)*instance.getHeight()/state.rect.height;
    if(!instance.containPixel({gridIndex:0},[x,y]))return false;
    let nearest=null,distance=Infinity;
    (option.series||[]).forEach((series,seriesIndex)=>{
      if(!Array.isArray(series.data))return;
      if(series.type==='bar'){
        const category=instance.convertFromPixel({seriesIndex},[x,y]);
        const categoryAxis=option.yAxis?.[0]?.type==='category'?1:0;
        const index=Math.round(Array.isArray(category)?category[categoryAxis]:category);
        if(index>=0&&index<series.data.length)nearest={seriesIndex,dataIndex:index};
      }else if(series.type==='scatter'||series.type==='line'){
        series.data.forEach((item,dataIndex)=>{
          const value=item?.value??item,point=instance.convertToPixel({seriesIndex},Array.isArray(value)?value.slice(0,2):[dataIndex,value]);
          if(!Array.isArray(point)||!point.every(Number.isFinite))return;
          const d=(point[0]-x)**2+(point[1]-y)**2;
          if(d<distance){distance=d;nearest={seriesIndex,dataIndex};}
        });
      }
    });
    if(!nearest)return false;
    const key=nearest.seriesIndex+':'+nearest.dataIndex;
    if(state.selected!==key){instance.dispatchAction({type:'downplay'});instance.dispatchAction({type:'highlight',...nearest});state.selected=key;}
    if(state.contentKey!==key||state.contentAt!==state.updated){
      instance.dispatchAction({type:'showTip',...nearest,position:[x,y]});state.contentKey=key;state.contentAt=state.updated;
    }
    const tip=dom.querySelector('.generic-canvas-tooltip');
    if(tip){
      if(!state.outer||state.content!==tip.innerHTML){state.outer=showLocalPortal(tip,state.rect);state.content=tip.innerHTML;}
      tip.style.setProperty('visibility','hidden','important');
      if(state.outer){
        const {portal,host,left:originX,top:originY,width:w,height:h}=state.outer;
        portal.style.left=Math.max(8,Math.min(host.innerWidth-w-8,originX+x-w/2))+'px';
        portal.style.top=Math.max(8,Math.min(host.innerHeight-h-8,originY+y-h-14))+'px';
      }
    }
    return true;
  };

  const select = event => {
    if(selectCanvas(event))return;
    const target=document.elementFromPoint(event.clientX,event.clientY)?.closest(hits)||event.target?.closest(hits)||null;
    if(target!==active){clear(event);active=target;emit(active,'mouseenter',event);}
    // Keep the data DOM stable within one datum; only move the floating layer.
    followTooltip(event);
  };
  document.addEventListener('pointerdown',event=>{
    if(event.pointerType==='touch')clear(event);
    if(event.pointerType!=='touch'||event.target.closest?.('.markmap,.range-shell,button,input'))return;
    if(!event.target.closest?.('svg,canvas,.treemap-cell,#chart'))return;
    gesture={id:event.pointerId,x:event.clientX,y:event.clientY,direction:'pending'};
    select(event);
  },{capture:true,passive:true});
  document.addEventListener('pointermove',event=>{
    if(!gesture||event.pointerId!==gesture.id)return;
    const mode=direction(gesture,event.clientX,event.clientY);
    if(mode==='vertical'){clear(event);event.stopImmediatePropagation();return;
    }
    if(mode==='horizontal'){select(event);if(canvasState)event.stopImmediatePropagation();}
  },{capture:true,passive:true});
  document.addEventListener('pointerup',event=>{
    if(!gesture||event.pointerId!==gesture.id)return;
    if(gesture.direction!=='vertical')select(event);
    gesture=null;
    dismissTimer=setTimeout(dismiss,1200);
  },{passive:true});
  document.addEventListener('pointercancel',event=>{gesture=null;clear(event);},{passive:true});
  // Track the touch stream independently: pointercancel happens when the
  // browser starts scrolling, before legacy touchmove listeners finish.
  document.addEventListener('touchstart',event=>{
    if(event.touches.length!==1||event.target.closest?.('.markmap,.range-shell,input,textarea,select')){touchOrigin=null;return;}
    const t=event.touches[0];touchOrigin={x:t.clientX,y:t.clientY,direction:'pending'};
  },{capture:true,passive:true});
  document.addEventListener('touchmove',event=>{
    if(!touchOrigin||event.touches.length!==1)return;
    const t=event.touches[0],mode=direction(touchOrigin,t.clientX,t.clientY);
    if(mode==='vertical')event.stopImmediatePropagation();
    else if(mode==='horizontal'){select({clientX:t.clientX,clientY:t.clientY,target:event.target});if(canvasState)event.stopImmediatePropagation();}
  },{capture:true,passive:true});
  for(const type of ['touchend','touchcancel'])document.addEventListener(type,()=>{touchOrigin=null;},{passive:true});
  for(const type of ['mouseover','mouseenter','mousemove'])document.addEventListener(type,event=>{
    if(event.sourceCapabilities?.firesTouchEvents){event.stopImmediatePropagation();return;}
    if(event.target.closest?.(hits))nativeHovered=true;
  },{capture:true,passive:true});
  document.addEventListener('click',event=>{
    if(canvasState&&event.sourceCapabilities?.firesTouchEvents&&event.target.closest?.('#chart'))event.stopImmediatePropagation();
  },{capture:true,passive:true});
  let host=window;
  try {
    while(host){
      for(const type of ['scroll','resize','pagehide','veya:chat-navigate'])host.addEventListener(type,dismiss,{capture:true,passive:true});
      if(host!==window)host.document.addEventListener('pointerdown',dismiss,{capture:true,passive:true});
      const doc=host.document;doc.addEventListener('visibilitychange',()=>{if(doc.hidden)dismiss();},{passive:true});
      if(host===host.parent)break;host=host.parent;
    }
  } catch (_) {}
})();
</script>


</body>
</html>
