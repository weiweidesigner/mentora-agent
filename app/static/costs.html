<!doctype html>
<html lang="zh-CN" data-theme="dark" class="costStandaloneRoot">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mentora 推理用量</title>
    <script>try{document.documentElement.dataset.theme=localStorage.getItem('aime-chart-theme-v1')==='light'?'light':'dark'}catch{document.documentElement.dataset.theme='dark'}</script>
    <link rel="icon" type="image/svg+xml" href="/static/assets/mentora-logo.svg?v=20261017-costs" />
    <link rel="stylesheet" href="/static/styles.css?v=20261016-task-rerun-compact" />
    <link rel="stylesheet" href="/static/costs.css?v=20261022-conversation-tokens" />
  </head>
  <body class="costStandalone">
    <main id="costWorkspace" class="costWorkspace" aria-label="推理 Token 用量">
      <div class="costPage">
        <header class="costHeader">
          <div><h1>推理用量</h1><p>查看 DeepSeek 与 Kimi 的 Token 消耗和每次对话明细</p></div>
          <div class="costRange" role="group" aria-label="统计周期">
            <button data-cost-days="7">7 天</button>
            <button class="is-active" data-cost-days="30">30 天</button>
            <button data-cost-days="90">90 天</button>
          </div>
        </header>
        <div id="costPanel" aria-live="polite"></div>
      </div>
    </main>
    <script src="/static/costs.js?v=20261022-conversation-tokens"></script>
  </body>
</html>
