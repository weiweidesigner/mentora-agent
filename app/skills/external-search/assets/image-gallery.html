<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片搜索</title>
<style>
[hidden]{display:none!important}
:root{color-scheme:light;--ink:#242424;--muted:#858585;--line:#e8e8e8;--soft:#f6f6f6;--dialog:#fff;--photo-height:300px}
html[data-theme=dark]{color-scheme:dark;--ink:#f5f5f5;--muted:#aaa;--line:#343434;--soft:#181818;--dialog:#181818}
*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--ink);font:14px/1.5 system-ui,sans-serif}main{width:100%;max-width:none;margin:0;padding:0}header{margin:0 0 16px}h1{margin:0;font-size:20px;line-height:1.4}p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 16px;align-items:start}.image-card{min-width:0;margin:0;padding:0;border:0;background:transparent;overflow:hidden}.preview{position:relative;display:block;width:100%;height:var(--photo-height);overflow:hidden;border:0;border-radius:14px;padding:0;background:var(--soft);cursor:zoom-in;color:var(--muted)}.preview img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0}.preview img.ready{opacity:1}.placeholder{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;padding:12px}.details{min-width:0;padding:8px 0 0}h2{margin:0;font-size:14px;line-height:1.5;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.source{margin-top:3px;font-size:12px;overflow-wrap:anywhere}.source a{text-decoration:none;color:var(--muted)}a{color:inherit}.source a:hover{text-decoration:underline;text-decoration-style:dotted}.list{display:grid;gap:20px;margin-top:24px}.image-result-row{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;align-items:start}.image-result-row+.image-result-row{border-top:1px solid var(--line);padding-top:20px}.image-result-row .preview{height:112px;border-radius:12px}.image-result-row .details{padding:0}.description{margin-top:6px;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.image-result-row .source{margin-top:8px}button:focus-visible,a:focus-visible{outline:2px solid #a580ef;outline-offset:3px}.refine{margin-top:24px}.refine>p{color:var(--ink);font-size:14px}.suggestions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.suggestions button{padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}.suggestions button:hover{background:var(--soft)}#refine-status{margin-top:8px;font-size:12px}#refine-query{width:100%;margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:inherit;resize:vertical}footer{margin-top:16px;color:var(--muted);font-size:11px}dialog{width:min(94vw,1000px);max-height:92vh;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--dialog);color:var(--ink)}dialog::backdrop{background:#000b}dialog img{display:block;max-width:100%;max-height:70vh;margin:auto;object-fit:contain}.close{float:right;padding:6px 12px}#resource-status{padding:16px}.modal-links{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:13px}.copy{border:0;background:none;color:inherit;font:inherit;padding:0;cursor:pointer}@media(max-width:600px){:root{--photo-height:176px}.grid{gap:16px 12px}.preview{border-radius:12px}.image-result-row{grid-template-columns:88px minmax(0,1fr);gap:12px}.image-result-row .preview{height:88px}h1{font-size:18px}}
</style></head><body><main data-image-search-gallery="2" data-query="@@QUERY@@" data-displayed-count="@@COUNT@@"><header><h1>@@TITLE@@</h1></header><section class="grid" aria-label="图片">@@CARDS@@</section>@@LIST@@<section class="refine"><p>想找哪一类？可以补充场景、年代、横竖构图或清晰度，我再继续找。</p><div class="suggestions"><button data-refinement="，只找高清大图">高清大图</button><button data-refinement="，我想找特定场景：">指定场景</button><button data-refinement="，换一组不同的照片">换一组</button></div><p id="refine-status" role="status" hidden></p><textarea id="refine-query" aria-label="继续搜图的描述" rows="2" readonly hidden></textarea></section><footer>图片来自外部网站，不代表商用授权。</footer></main><dialog><button class="close" aria-label="关闭预览">关闭</button><p id="resource-status" role="status"></p><img alt="图片预览" hidden referrerpolicy="no-referrer"><nav class="modal-links"><a class="source-link" target="_blank" rel="noopener noreferrer">查看来源</a><a class="original-link" target="_blank" rel="noopener noreferrer">打开原图</a><button class="copy">复制链接</button></nav></dialog>
<script>
const theme=new URLSearchParams(location.search).get('theme');if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme;
document.querySelectorAll('.preview img').forEach(img=>{
 const fail=()=>{if(img.dataset.fallback){const fallback=img.dataset.fallback;delete img.dataset.fallback;img.src=fallback;return}img.hidden=true;img.previousElementSibling.hidden=false;img.previousElementSibling.textContent='图片暂不可用，可查看来源'};
 const show=async()=>{try{await img.decode();if(!img.naturalWidth)throw Error();img.classList.add('ready');img.previousElementSibling.hidden=true;}catch{fail()}};
 img.addEventListener('load',show);img.addEventListener('error',fail);if(img.complete){if(img.naturalWidth)show();else fail()}
});
const dialog=document.querySelector('dialog'),large=dialog.querySelector('img'),status=document.querySelector('#resource-status'),original=dialog.querySelector('.original-link'),source=dialog.querySelector('.source-link'),copy=dialog.querySelector('.copy');let version=0;
document.querySelectorAll('.preview').forEach(button=>button.addEventListener('click',()=>{
 const token=++version;large.hidden=true;status.hidden=false;status.textContent='正在载入原图';original.href=button.dataset.original;copy.dataset.url=button.dataset.original;copy.textContent='复制链接';source.hidden=!button.dataset.source;if(button.dataset.source)source.href=button.dataset.source;else source.removeAttribute('href');dialog.showModal();
 const image=new Image();image.referrerPolicy='no-referrer';image.onload=async()=>{try{await image.decode();if(token!==version)return;large.src=image.src;large.hidden=false;status.hidden=true;}catch{if(token===version)status.textContent='原图载入失败，可使用下方来源链接'}};
 image.onerror=()=>{if(token===version)status.textContent='原图载入失败，可使用下方来源链接'};image.src=button.dataset.original;
}));
dialog.querySelector('.close').addEventListener('click',()=>dialog.close());dialog.addEventListener('close',()=>{version++;large.hidden=true;large.removeAttribute('src')});
copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(copy.dataset.url);copy.textContent='已复制'}catch{copy.textContent='复制失败，请使用原图链接'}});
const hint=document.querySelector('#refine-status'),draft=document.querySelector('#refine-query');
document.querySelectorAll('[data-refinement]').forEach(button=>button.addEventListener('click',()=>{
 const prompt=(document.querySelector('main').dataset.query+button.dataset.refinement).slice(0,1000);hint.hidden=false;
 if(parent!==window){hint.textContent='已请求填入输入框，请补充后发送';parent.postMessage({type:'mentora:image-search-refine',prompt},'*')}
 else{draft.value=prompt;draft.hidden=false;draft.focus();draft.select();hint.textContent='复制这段描述，在对话中继续搜索'}
}));
window.addEventListener('message',event=>{if(event.source!==parent||event.data?.type!=='mentora:image-search-refine-ack')return;hint.hidden=false;hint.textContent=event.data.ok?'已填入输入框，可补充后发送':'已保留当前输入，请先发送或清空后再选择'});
</script></body></html>
