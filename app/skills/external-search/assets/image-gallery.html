<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片搜索</title>
<style>
[hidden]{display:none!important}
:root{color-scheme:light dark;--bg:#fff;--ink:#202124;--muted:#737373;--line:#e7e7e7;--soft:#f5f5f5}html[data-theme=dark]{--bg:#111;--ink:#eee;--muted:#aaa;--line:#303030;--soft:#1b1b1b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}main{padding:24px}header{margin-bottom:24px}h1{margin:0 0 8px;font-size:22px}p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:24px}.image-card{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--bg)}.preview{position:relative;display:block;width:100%;aspect-ratio:4/3;border:0;padding:0;background:var(--soft);cursor:zoom-in;color:var(--muted)}.preview img{width:100%;height:100%;object-fit:contain;opacity:0}.preview img.ready{opacity:1}.placeholder{position:absolute;inset:0;display:grid;place-items:center}.details{padding:20px}h2{margin:0 0 8px;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.details p{font-size:12px;overflow-wrap:anywhere}nav{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}a,.copy{color:inherit;font:inherit;font-size:12px;text-decoration:none}.copy{padding:0;border:0;background:none;cursor:pointer}a:hover,.copy:hover{text-decoration:underline}button:focus-visible,a:focus-visible{outline:2px solid #a580ef;outline-offset:3px}dialog{width:min(94vw,1000px);max-height:92vh;padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}dialog::backdrop{background:#000b}dialog img{display:block;max-width:100%;max-height:75vh;margin:auto}dialog img[hidden]{display:none}.close{float:right;padding:6px 12px}#resource-status{padding:16px}footer{margin-top:24px;color:var(--muted);font-size:12px}@media(max-width:600px){main{padding:16px}.grid{gap:20px}}
</style></head><body><main><header><h1>@@TITLE@@</h1><p>@@COUNT@@ 张图片 · 搜索结果不代表商用授权</p></header><section class="grid">@@CARDS@@</section><footer>图片由外部网站提供；无法载入时可查看来源页面。来源与许可缺失时不作推断。</footer></main><dialog><button class="close" aria-label="关闭预览">关闭</button><p id="resource-status" role="status"></p><img alt="图片预览" hidden referrerpolicy="no-referrer"></dialog>
<script>
const theme=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=theme==='dark'?'dark':'light';
document.querySelectorAll('.preview img').forEach(img=>{
 const fail=()=>{img.hidden=true;img.previousElementSibling.textContent='图片暂不可用，仍可查看来源'};
 const show=async()=>{try{await img.decode();if(!img.naturalWidth)throw Error();img.classList.add('ready');img.previousElementSibling.hidden=true;}catch{fail()}};
 img.addEventListener('load',show);img.addEventListener('error',fail);if(img.complete){if(img.naturalWidth)show();else fail()}
});
const dialog=document.querySelector('dialog'),large=dialog.querySelector('img'),status=document.querySelector('#resource-status');let version=0;
document.querySelectorAll('.preview').forEach(button=>button.addEventListener('click',()=>{
 const token=++version;large.hidden=true;status.hidden=false;status.textContent='正在载入原图';dialog.showModal();
 const image=new Image();image.referrerPolicy='no-referrer';image.onload=async()=>{try{await image.decode();if(token!==version)return;large.src=image.src;large.hidden=false;status.hidden=true;}catch{if(token===version)status.textContent='原图载入失败，可使用下方来源链接'}};
 image.onerror=()=>{if(token===version)status.textContent='原图载入失败，请关闭后查看来源'};image.src=button.dataset.original;
}));
dialog.querySelector('.close').addEventListener('click',()=>dialog.close());dialog.addEventListener('close',()=>{version++;large.hidden=true;large.removeAttribute('src')});
document.querySelectorAll('.copy').forEach(button=>button.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(button.dataset.url);button.textContent='已复制'}catch{button.textContent='复制失败，请使用原图链接'}}));
</script></body></html>
