<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片搜索</title>
<style>
[hidden]{display:none!important}
:root{color-scheme:light;--ink:#242424;--muted:#858585;--line:#e8e8e8;--soft:#f6f6f6;--dialog:#fff;--photo-height:300px}
html[data-theme=dark]{color-scheme:dark;--ink:#f5f5f5;--muted:#aaa;--line:#343434;--soft:#181818;--dialog:#181818}
*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--ink);font:14px/1.5 system-ui,sans-serif}main{width:100%;max-width:none;margin:0;padding:0}header{margin:0 0 16px}h1{margin:0;font-size:20px;line-height:1.4}p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 16px;align-items:start}.image-card{min-width:0;margin:0;padding:0;border:0;background:transparent;overflow:hidden}.preview{position:relative;display:block;width:100%;height:var(--photo-height);overflow:hidden;border:0;border-radius:14px;padding:0;background:var(--soft);cursor:pointer;color:var(--muted)}.preview img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0}.preview img.ready{opacity:1}.placeholder{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;padding:12px}.details{min-width:0;padding:8px 0 0}h2{margin:0;font-size:14px;line-height:1.5;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.source{margin-top:3px;font-size:12px;overflow-wrap:anywhere}.source a{text-decoration:none;color:var(--muted)}a{color:inherit}.source a:hover{text-decoration:underline;text-decoration-style:dotted}.list{display:grid;gap:20px;margin-top:24px}.image-result-row{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;align-items:start}.image-result-row+.image-result-row{border-top:1px solid var(--line);padding-top:20px}.image-result-row .preview{height:112px;border-radius:12px}.image-result-row .details{padding:0}.description{margin-top:6px;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.image-result-row .source{margin-top:8px}button:focus-visible,a:focus-visible{outline:2px solid #a580ef;outline-offset:3px}@media(max-width:600px){:root{--photo-height:176px}.grid{gap:16px 12px}.preview{border-radius:12px}.image-result-row{grid-template-columns:88px minmax(0,1fr);gap:12px}.image-result-row .preview{height:88px}h1{font-size:18px}}

@@VIEWER_CSS@@
</style></head><body><main data-image-search-gallery="5" data-query="@@QUERY@@" data-displayed-count="@@COUNT@@"><header><h1>@@TITLE@@</h1></header><section class="grid" aria-label="图片">@@CARDS@@</section>@@LIST@@</main>
<script>
@@VIEWER_JS@@
</script>
<script>
const theme=new URLSearchParams(location.search).get('theme');if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme;
document.querySelectorAll('.preview img').forEach(img=>{
 let timer,ready=false;
 const fail=()=>{clearTimeout(timer);if(ready)return;if(img.dataset.fallback){const fallback=img.dataset.fallback;delete img.dataset.fallback;img.src=fallback;timer=setTimeout(fail,8000);return}img.hidden=true;img.previousElementSibling.hidden=false;img.previousElementSibling.textContent='图片暂不可用，可查看来源'};
 const show=()=>{if(!img.naturalWidth)return fail();ready=true;clearTimeout(timer);img.classList.add('ready');img.previousElementSibling.hidden=true;};
 img.addEventListener('load',show);img.addEventListener('error',fail);
 // Start the deadline only when the lazy image enters the viewport.
 const observer=new IntersectionObserver(entries=>{if(entries.some(entry=>entry.isIntersecting)){observer.disconnect();if(!ready)timer=setTimeout(fail,8000);}});observer.observe(img);
 if(img.complete&&img.naturalWidth)show();
});
let nextRequest=0,pending=new Map();
window.addEventListener('message',event=>{if(event.source!==parent||event.data?.type!=='mentora:image-viewer-ack')return;const request=pending.get(event.data.requestId);if(request){clearTimeout(request.timer);pending.delete(event.data.requestId)}});
document.querySelectorAll('.preview').forEach(button=>{
 button.addEventListener('click',()=>{
  const image=button.querySelector('img');const data={original:button.dataset.original,preview:image.classList.contains('ready')?image.currentSrc:button.dataset.thumbnail,source:button.dataset.source,sourceName:button.dataset.sourceName,title:image.alt};
  if(parent===window){MentoraImageViewer.open(data,button);return;}
  const requestId=String(++nextRequest);const timer=setTimeout(()=>{pending.delete(requestId);MentoraImageViewer.open(data,button)},500);pending.set(requestId,{timer});
  parent.postMessage({type:'mentora:image-viewer-open',requestId,image:data},'*');
 });
});
</script></body></html>
